      html += `<div class="backfill-cell core${isSelected?' selected':''}"
        style="background:var(--core-bg);border-color:${isSelected?'var(--core)':'var(--border)'}"
        onclick="selectBackfillVariation('${key}')">
        <div class="backfill-cell-tag" style="color:var(--core-text)">${v.label}</div>
        <div class="backfill-cell-name" style="color:var(--core-text)">${v.name}</div>
      </div>`;
    });
    html += `</div>`;

    // Log sets toggle
    html += `<div class="backfill-log-toggle" onclick="toggleBackfillLog()">
      <div>
        <div class="backfill-log-toggle-left">Log sets & weights</div>
        <div class="backfill-log-toggle-sub">Optional — add your numbers for this session</div>
      </div>
      <div class="toggle-switch${backfillLogSets?' on':''}" id="backfill-toggle-sw"></div>
    </div>`;

    // Set logging area — for core sessions use v.exercises directly
    if (backfillLogSets && backfillSelectedKey) {
      const v = VARIATIONS[backfillSelectedKey];
      const isCore = CORE_ORDER.includes(backfillSelectedKey);
      const allEx = isCore ? v.exercises : [...v.exercises, ...v.core];
      html += `<div style="margin-top:4px">`;
      allEx.forEach((ex, i) => {
        const bfEx = backfillExercises.find(e => e.idx === i) || null;
        const sets = bfEx ? bfEx.sets : [{reps:'',weight:''}];
        html += `<div class="ex-card" id="bf-ex-${i}" style="margin:10px 18px 0">
          <div class="ex-card-header" onclick="toggleEx('bf-ex-${i}')">
            <div class="ex-card-left">
              <div class="ex-name">${ex.name}</div>
              <div class="ex-sets-badge">${ex.sets}</div>
            </div>
            <div class="ex-chevron">⌄</div>
          </div>
          <div class="ex-desc">${ex.desc}</div>
          <div class="set-logger">
            <div class="set-logger-head">
              <div class="set-logger-title">Sets</div>
              <button class="add-set-btn" onclick="bfAddSet(${i})">+ Set</button>
            </div>
            ${sets.map((s, si) => `
              <div class="set-row">
                <div class="set-num">${si+1}</div>
                <input class="set-input" type="number" inputmode="decimal" placeholder="reps"
                  value="${s.reps}" onchange="bfUpdateSet(${i},${si},'reps',this.value)" style="max-width:70px">
                <div class="set-unit">×</div>
                <input class="set-input" type="number" inputmode="decimal" placeholder="lbs"
                  value="${s.weight}" onchange="bfUpdateSet(${i},${si},'weight',this.value)">
                <div class="set-unit">lbs</div>
                <button class="del-set-btn" onclick="bfDelSet(${i},${si})">×</button>
              </div>`).join('')}
          </div>
        </div>`;
      });
      html += `</div>`;
    }

    // Notes field — shown once a variation is selected
    if (backfillSelectedKey) {
      html += `<div class="session-meta-block" style="margin:14px 18px 0">
        <div class="session-meta-row">
          <div class="session-meta-label">Notes</div>
          <textarea class="session-meta-input" rows="3"
            placeholder="How did it go? Anything worth noting…"
            oninput="backfillNotes=this.value">${backfillNotes}</textarea>
        </div>
      </div>`;
    }
  }

  // ── Specific exercises mode ─────────────────────────────────────────────────
  if (backfillMode === 'specific') {
    backfillSelectedKey = backfillSelectedKey || CUSTOM_KEY;

    // Show the exercise + activity picker inline always
    html += `<div class="ex-picker-panel" style="display:block;margin:8px 18px 0;border:1px solid var(--border);border-radius:var(--radius)">
      <div class="ex-picker-search-wrap">
        <input class="ex-picker-search" id="ex-picker-search-bf" type="text"
          placeholder="Search exercises and activities…"
          oninput="filterBfExPicker(this.value)"
          autocomplete="off" autocorrect="off">
      </div>
      <div class="ex-picker-list" id="ex-picker-list-bf"></div>
    </div>`;

    // Show selected exercises/activities with set logging
    if (backfillExercises.length) {
      html += `<div class="edit-section-head" style="margin-top:10px">Added</div>`;
      backfillExercises.forEach((bfEx, bi) => {
        const isActivity = bfEx.isActivity;
        html += `<div class="edit-ex-card" style="margin:0 18px 8px">
          <div class="edit-ex-name" style="display:flex;align-items:center;justify-content:space-between">
            <div>
              <span>${bfEx.name}</span>
              ${isActivity ? `<div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);margin-top:2px">${bfEx.category || 'general'}</div>` : ''}
            </div>
            <button onclick="bfRemoveSpecificEx(${bi})"
              style="background:none;border:none;color:var(--text-dim);font-size:11px;cursor:pointer;padding:2px 4px">
              Remove
            </button>
          </div>`;

        if (isActivity) {
          // Activities show duration and/or distance instead of sets
          html += `<div class="session-meta-row" style="padding:8px 14px;border-top:1px solid var(--border)">
            <div class="session-meta-label">Duration</div>
            <input class="session-meta-input" type="number" inputmode="decimal"
              placeholder="optional" style="max-width:80px;text-align:right"
              value="${bfEx.duration||''}"
              oninput="backfillExercises[${bi}].duration=this.value">
            <div class="duration-unit">min</div>
          </div>`;
          if (bfEx.supportsDistance) {
            html += `<div class="session-meta-row" style="padding:8px 14px;border-top:1px solid var(--border)">
              <div class="session-meta-label">Distance</div>
              <input class="session-meta-input" type="number" inputmode="decimal"
                placeholder="optional" style="max-width:80px;text-align:right"
                value="${bfEx.distance||''}"
                oninput="backfillExercises[${bi}].distance=this.value">
              <div class="duration-unit">mi</div>
            </div>`;
          }
          if (bfEx.supportsNotes) {
            html += `<div class="session-meta-row" style="padding:8px 14px;border-top:1px solid var(--border)">
              <div class="session-meta-label">Notes</div>
              <textarea class="session-meta-input" rows="2"
                placeholder="Source, exercises, anything worth noting…"
                oninput="backfillExercises[${bi}].activityNotes=this.value">${bfEx.activityNotes||''}</textarea>
            </div>`;
          }
        } else {
          bfEx.sets.forEach((st, si) => {
            html += `<div class="set-row" style="padding:8px 14px;border-top:1px solid var(--border)">
              <div class="set-num">${si+1}</div>
              <input class="set-input" type="number" inputmode="decimal" placeholder="reps"
                value="${st.reps}" style="max-width:70px"
                oninput="bfSpecificSetField(${bi},${si},'reps',this.value)">
              <div class="set-unit">×</div>
              <input class="set-input" type="number" inputmode="decimal" placeholder="lbs"
                value="${st.weight||''}"
                oninput="bfSpecificSetField(${bi},${si},'weight',this.value)">
              <div class="set-unit">lbs</div>
              <button class="del-set-btn" onclick="bfSpecificDelSet(${bi},${si})">×</button>
            </div>`;
          });
          html += `<button class="add-set-btn" style="margin:8px 14px;display:block"
            onclick="bfSpecificAddSet(${bi})">+ Set</button>`;
        }
        html += `</div>`;
      });
    }

    // Notes field — hide if every added item already has its own per-activity notes field
    const allHaveNotes = backfillExercises.length > 0 &&
      backfillExercises.every(e => e.isActivity && e.supportsNotes);
    if (!allHaveNotes) {
      html += `<div class="session-meta-block" style="margin:14px 18px 0">
        <div class="session-meta-row">
          <div class="session-meta-label">Notes</div>
          <textarea class="session-meta-input" rows="3"
            placeholder="How did it go? Anything worth noting…"
            oninput="backfillNotes=this.value">${backfillNotes}</textarea>
        </div>
      </div>`;
    }
  }

  // ── Custom workout mode — free text only ────────────────────────────────────
  if (backfillMode === 'custom') {
    backfillSelectedKey = CUSTOM_KEY;
    html += `<div class="session-meta-block" style="margin:8px 18px 0">
      <div class="session-meta-row">
        <div class="session-meta-label">Activity</div>
        <input class="session-meta-input" type="text" placeholder="e.g. Yoga, Swim, Hike…"
          value="${backfillCustomName}"
          oninput="updateBackfillCustomName(this.value)"
          style="text-align:left">
      </div>
      <div class="session-meta-row">
        <div class="session-meta-label">Category</div>
        <select class="session-meta-input" style="text-align:right;background:transparent"
          onchange="backfillCategory=this.value">
          <option value="" ${!backfillCategory?'selected':''}>General (default)</option>
          <option value="push"    ${backfillCategory==='push'?'selected':''}>Push</option>
          <option value="pull"    ${backfillCategory==='pull'?'selected':''}>Pull</option>
          <option value="legs"    ${backfillCategory==='legs'?'selected':''}>Legs</option>
          <option value="core"    ${backfillCategory==='core'?'selected':''}>Core</option>
          <option value="cardio"  ${backfillCategory==='cardio'?'selected':''}>Cardio</option>
          <option value="general" ${backfillCategory==='general'?'selected':''}>General</option>
        </select>
      </div>
      <div class="session-meta-row">
        <div class="session-meta-label">Duration</div>
        <input class="session-meta-input" type="number" inputmode="decimal"
          placeholder="optional" style="max-width:80px;text-align:right"
          value="${backfillDuration}"
          oninput="backfillDuration=this.value">
        <div class="duration-unit">min</div>
      </div>
      <div class="session-meta-row">
        <div class="session-meta-label">Notes</div>
        <textarea class="session-meta-input" rows="3"
          placeholder="How did it go? Anything worth noting…"
          oninput="backfillNotes=this.value">${backfillNotes}</textarea>
      </div>
    </div>`;
  }

  // ── Confirm button ──────────────────────────────────────────────────────────
  const isReady = backfillMode === 'custom'
    ? !!backfillCustomName.trim()
    : (backfillMode === 'specific' ? backfillExercises.length > 0 : !!backfillSelectedKey);

  html += `<div style="padding:0 18px;margin-top:14px">
    <button class="backfill-confirm-btn${isReady?' ready':''}" onclick="saveBackfillSession()">
      Save Session
    </button>
  </div>`;

  const body = document.getElementById('backfill-body');
  body.innerHTML = html;

  // Init pickers after render
  if (backfillMode === 'specific') renderBfExPickerList('');
}

function setBackfillMode(mode) {
  backfillMode = mode;
  if (mode !== 'variation') { backfillSelectedKey = mode === 'custom' ? CUSTOM_KEY : null; }
  if (mode === 'variation' && !ORDER.includes(backfillSelectedKey)) backfillSelectedKey = null;
  backfillExercises = [];
  renderBackfillScreen();
}

function selectBackfillVariation(key) {
  backfillSelectedKey = key;
  backfillExercises = [];
  renderBackfillScreen();
}

function bfSelectPredefined(actKey) {
  const act = PREDEFINED_ACTIVITIES.find(a => a.key === actKey);
  if (!act) return;
  backfillCustomName = act.name;
  backfillCategory = act.category || 'general';
  backfillSelectedKey = CUSTOM_KEY;
  renderBackfillScreen();
}

function updateBackfillCustomName(val) {
  backfillCustomName = val;
  backfillSelectedKey = val.trim() ? CUSTOM_KEY : null;
  // Auto-set category from predefined activity if it matches
  const act = getActivity(val.trim());
  if (act) backfillCategory = act.category || 'general';
  // Re-render just the save button state without wiping the input
  const btn = document.querySelector('.backfill-confirm-btn');
  if (btn) {
    const ready = !!val.trim();
    btn.classList.toggle('ready', ready);
    btn.style.pointerEvents = ready ? 'auto' : 'none';
  }
}

// ── Specific exercise picker helpers ──────────────────────────────────────────
let bfCustomPickerOpen = false;

function renderBfExPickerList(q, listId = 'ex-picker-list-bf') {
  const list = document.getElementById(listId);
  if (!list) return;
  const seen = new Set();
  const groups = { push:[], pull:[], legs:[], core:[], activity:[] };
  const gc = { push: TYPE_COLOR.push, pull: TYPE_COLOR.pull, legs: TYPE_COLOR.legs, core: 'var(--core)', activity: 'var(--cardio)' };
  const gl = { push:'Push', pull:'Pull', legs:'Legs', core:'Core', activity:'Activities' };

  ORDER.forEach(key => {
    const v = VARIATIONS[key];
    [...v.exercises, ...v.core].forEach((ex, i) => {
      if (seen.has(ex.name)) return; seen.add(ex.name);
      const type = i < v.exercises.length ? v.type : 'core';
      groups[type].push({ name: ex.name, isActivity: false });
    });
  });

  // Add predefined activities
  PREDEFINED_ACTIVITIES.forEach(act => {
    if (seen.has(act.name)) return; seen.add(act.name);
    groups.activity.push({
      name: act.name, isActivity: true,
      category: act.category || 'general',
      supportsDistance: !!act.supportsDistance,
      supportsNotes: !!act.supportsNotes
    });
  });

  // Sort alphabetically within each group
  Object.keys(groups).forEach(k => groups[k].sort((a,b) => a.name.localeCompare(b.name)));

  const lq = q.toLowerCase().trim();
  let html = ''; let total = 0;
  ['push','pull','legs','core','activity'].forEach(type => {
    const items = lq ? groups[type].filter(n => n.name.toLowerCase().includes(lq)) : groups[type];
    if (!items.length) return;
    html += `<div class="ex-picker-group" style="color:${gc[type]}">${gl[type]}</div>`;
    items.forEach(item => {
      const safeName = item.name.replace(/'/g, "\\'");
      const isAct = item.isActivity ? 'true' : 'false';
      const cat = (item.category || '').replace(/'/g, "\\'");
      const dist = item.supportsDistance ? 'true' : 'false';
      const hasNotes = item.supportsNotes ? 'true' : 'false';
      html += `<button class="ex-picker-item"
        onclick="bfAddSpecificExercise('${safeName}',${isAct},'${cat}',${dist},${hasNotes})">
        ${item.name}
      </button>`;
    });
    total += items.length;
  });
  if (!total) html = `<div class="ex-picker-empty">No results for "${q}"</div>`;
  list.innerHTML = html;
}

function filterBfExPicker(q) { renderBfExPickerList(q, 'ex-picker-list-bf'); }
function filterBfCustomPicker(q) { renderBfExPickerList(q, 'ex-picker-list-custom'); }

function toggleBfCustomPicker() {
  bfCustomPickerOpen = !bfCustomPickerOpen;
  const panel = document.getElementById('bf-custom-picker');
  const btn   = document.getElementById('bf-custom-add-btn');
  if (panel) panel.style.display = bfCustomPickerOpen ? 'block' : 'none';
  if (btn) btn.classList.toggle('open', bfCustomPickerOpen);
  if (bfCustomPickerOpen) renderBfExPickerList('', 'ex-picker-list-custom');
}

function bfAddSpecificExercise(name, isActivity, category, supportsDistance, supportsNotes) {
  if (!name) return;
  if (!backfillExercises.find(e => e.name === name)) {
    if (isActivity) {
      backfillExercises.push({
        name, isActivity: true,
        category: category || 'general',
        supportsDistance: !!supportsDistance,
        supportsNotes: !!supportsNotes,
        duration: '', distance: '', activityNotes: ''
      });
      // Auto-set session category from first activity added if not already set
      if (!backfillCategory && category) backfillCategory = category;
    } else {
      backfillExercises.push({ name, isActivity: false, sets: [{ reps:'', weight:'' }] });
    }
  }
  bfCustomPickerOpen = false;
  if (backfillMode === 'specific' && !backfillSelectedKey) backfillSelectedKey = CUSTOM_KEY;
  renderBackfillScreen();
}

function bfRemoveSpecificEx(idx) {
  backfillExercises.splice(idx, 1);
  renderBackfillScreen();
}

function bfSpecificSetField(exIdx, setIdx, field, value) {
  if (backfillExercises[exIdx]) backfillExercises[exIdx].sets[setIdx][field] = value;
}

function bfSpecificAddSet(exIdx) {
  if (backfillExercises[exIdx]) {
    backfillExercises[exIdx].sets.push({ reps:'', weight:'' });
    renderBackfillScreen();
  }
}

function bfSpecificDelSet(exIdx, setIdx) {
  const ex = backfillExercises[exIdx];
  if (!ex) return;
  if (ex.sets.length <= 1) { backfillExercises.splice(exIdx, 1); }
  else ex.sets.splice(setIdx, 1);
  renderBackfillScreen();
}

function toggleBackfillLog() {
  backfillLogSets = !backfillLogSets;
  backfillExercises = [];
  renderBackfillScreen();
}

function bfGetOrCreateEx(idx) {
  let ex = backfillExercises.find(e => e.idx === idx);
  if (!ex) { ex = {idx, sets:[{reps:'',weight:''}]}; backfillExercises.push(ex); }
  return ex;
}

function bfUpdateSet(exIdx, setIdx, field, value) {
  const ex = bfGetOrCreateEx(exIdx);
  if (!ex.sets[setIdx]) ex.sets[setIdx] = {reps:'',weight:''};
  ex.sets[setIdx][field] = value;
}

function bfAddSet(exIdx) {
  const ex = bfGetOrCreateEx(exIdx);
  ex.sets.push({reps:'',weight:''});
  renderBackfillScreen();
  setTimeout(() => {
    const card = document.getElementById('bf-ex-' + exIdx);
    if (card) card.classList.add('open');
  }, 10);
}

function bfDelSet(exIdx, setIdx) {
  const ex = bfGetOrCreateEx(exIdx);
  if (ex.sets.length > 1) {
    ex.sets.splice(setIdx, 1);
    renderBackfillScreen();
    setTimeout(() => {
      const card = document.getElementById('bf-ex-' + exIdx);
      if (card) card.classList.add('open');
    }, 10);
  }
}

function deleteBackfillSession(sessionId) {
  const idx = sessions.findIndex(s => String(s.id) === String(sessionId));
  if (idx !== -1) {
    sessions.splice(idx, 1);
    saveSessions();
    showToast('Session removed');
    renderBackfillScreen();
  }
}

function saveBackfillSession() {
  const { d, y, m } = backfillDate;
  let exercises = [];
  let variationKey = backfillSelectedKey;
  let customName = '';

  if (backfillMode === 'custom') {
    if (!backfillCustomName.trim()) return;
    variationKey = CUSTOM_KEY;
    customName = backfillCustomName.trim();
    exercises = backfillExercises.map(e => ({
      key: 'custom_' + e.name.replace(/\s/g,'_'),
      name: e.name, sets: e.sets
    }));
  } else if (backfillMode === 'specific') {
    if (!backfillExercises.length) return;
    variationKey = CUSTOM_KEY;

    // If only one activity was added (and no exercises), use its name as the session name
    const activityItems = backfillExercises.filter(e => e.isActivity);
    const exerciseItems = backfillExercises.filter(e => !e.isActivity);

    if (activityItems.length === 1 && exerciseItems.length === 0) {
      customName = activityItems[0].name;
      // Use per-activity duration/distance/notes as session-level values if not already set
      if (!backfillDuration && activityItems[0].duration) backfillDuration = activityItems[0].duration;
      if (!backfillDistance && activityItems[0].distance) backfillDistance = activityItems[0].distance;
      if (!backfillNotes && activityItems[0].activityNotes) backfillNotes = activityItems[0].activityNotes;
      if (!backfillCategory) backfillCategory = activityItems[0].category || 'general';
    } else {
      customName = activityItems.length ? activityItems.map(a => a.name.split('(')[0].trim()).join(' + ') : 'Specific exercises';
    }

    exercises = exerciseItems.map(e => ({
      key: 'custom_' + e.name.replace(/\s/g,'_'),
      name: e.name, sets: e.sets || []
    }));
  } else {
    // Full variation mode
    if (!backfillSelectedKey) return;
    if (backfillLogSets && backfillExercises.length) {
      const v = VARIATIONS[backfillSelectedKey];
      const allEx = [...v.exercises, ...v.core];
      exercises = backfillExercises.map(e => ({
        key: 'main_' + e.idx,
        name: allEx[e.idx] ? allEx[e.idx].name : '',
        sets: e.sets
      }));
    }
  }

  const sessionDate = new Date(y, m, d, 12, 0, 0);
  const session = {
    id: Date.now(),
    date: sessionDate.toISOString(),
    loggedAt: new Date().toISOString(),
    variationKey,
    customName,
    tab: 'main',
    missed: true,
    exercises,
    notes: backfillNotes.trim(),
    duration: backfillDuration.trim(),
    distance: backfillDistance.trim(),
    category: backfillCategory
  };

  sessions.push(session);
  sessions.sort((a, b) => new Date(a.date) - new Date(b.date));
  saveSessions(session.id);
  showToast('Workout saved ✓');
  setTimeout(() => { closeBackfill(); }, 1000);
}

document.getElementById('cal-prev').onclick = () => {
  calViewDate = new Date(calViewDate.getFullYear(), calViewDate.getMonth() - 1, 1);
  renderCalendar();
};
document.getElementById('cal-next').onclick = () => {
  calViewDate = new Date(calViewDate.getFullYear(), calViewDate.getMonth() + 1, 1);
  renderCalendar();
};

// ════════════════════════════════════════════════════════════════════════════
// WORKOUT SCREEN
// ════════════════════════════════════════════════════════════════════════════
function openVariation(key) {
  currentVariation = VARIATIONS[key];
  currentTab = 'main';
  activeSession = null;
  renderWorkoutScreen();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-workout').classList.add('active');
  document.getElementById('workout-body').scrollTop = 0;
  setActiveNav(null);
  document.getElementById('timer-bar').classList.remove('visible');
  stopTimer();
}

function renderWorkoutScreen() {
  const v = currentVariation;
  const isCore = CORE_ORDER.includes(v.key);
  const tc = isCore ? 'var(--core)' : (TYPE_COLOR[v.type] || 'var(--text)');
  const bg = isCore ? 'var(--core-bg)' : (TYPE_BG[v.type] || 'var(--surface)');
  const tt = isCore ? 'var(--core-text)' : (TYPE_TEXT[v.type] || 'var(--text)');

  document.getElementById('workout-topbar-title').textContent = v.label;

  document.getElementById('workout-header').innerHTML = `
    <div class="workout-badge" style="background:${bg};color:${tt}">${v.label} — ${isCore ? 'CORE' : v.type.toUpperCase()}</div>
    <div class="workout-title">${v.name}</div>
    <div class="workout-focus">${v.focus}</div>`;

  // Hide tab bar for core sessions — they have no Main Lifts / Core Finisher split
  if (isCore) {
    document.getElementById('workout-tabs').innerHTML = '';
  } else {
    document.getElementById('workout-tabs').innerHTML = `
      <button class="workout-tab ${currentTab==='main'?'active':''}" 
        style="${currentTab==='main'?`color:${tc};border-color:${tc}`:'color:var(--text-muted)'}"
        onclick="switchTab('main')">Main Lifts</button>
      <button class="workout-tab ${currentTab==='core'?'active':''}"
        style="${currentTab==='core'?'color:var(--core-text);border-color:var(--core)':''}"
        onclick="switchTab('core')">Core Finisher</button>`;
  }

  renderExercises();
}

function switchTab(tab) {
  currentTab = tab;
  renderWorkoutScreen();
  document.getElementById('workout-body').scrollTop = 0;
}

// Returns { pb, lastSession } for a named exercise
// pb: { weight, reps, weightDate, repsDate } | null
// lastSession: { date, sets: [{reps,weight}] } | null
function getExerciseHistory(exName) {
  const pbs = computePBs();
  const pb = pbs[exName] || null;

  // Find most recent session where this exercise was logged —
  // checks both the exercises array AND session-level customName for predefined activities
  let lastSession = null;
  for (let i = sessions.length - 1; i >= 0; i--) {
    const s = sessions[i];
    if (activeSession && String(s.id) === String(activeSession.id)) continue;

    // Check exercises array first
    const ex = s.exercises.find(e => e.name === exName && e.sets.some(st => st.reps));
    if (ex) {
      lastSession = { date: s.date, sets: ex.sets.filter(st => st.reps), isActivity: false };
      break;
    }

    // Check if this session IS the activity (stored at session level, not in exercises)
    if (s.customName === exName) {
      lastSession = {
        date: s.date,
        sets: [],
        isActivity: true,
        duration: s.duration || null,
        distance: s.distance || null,
        notes: s.notes || null
      };
      break;
    }
  }
  return { pb, lastSession };
}

function renderExercises() {
  const v = currentVariation;
  const body = document.getElementById('workout-body');
  const isCore = CORE_ORDER.includes(v.key);
  // Core sessions use their exercises array directly; PPL uses main or core tab
  const exercises = isCore ? v.exercises : (currentTab === 'main' ? v.exercises : v.core);
  const isLogging = !!activeSession;
  const tc = isCore ? 'var(--core)' : (TYPE_COLOR[v.type] || 'var(--core)');

  let html = '';

  if (!isCore && currentTab === 'core') {
    html += `<div class="core-section-head">
      <div class="core-badge">Core Finisher</div>
      <div class="core-focus-txt">${v.coreFocus}</div>
    </div>`;
  }

  if (!isLogging) {
    html += `<div class="start-session-wrap">
      <button class="start-session-btn" 
        style="background:${tc};color:#fff"
        onclick="startSession()">
        Start ${isCore ? 'Core Session' : currentTab==='main' ? 'Workout' : 'Core Finisher'}
      </button>
    </div>`;
  } else {
    document.getElementById('finish-session-top').style.display = 'block';
    document.getElementById('timer-bar').classList.add('visible');
  }

  exercises.forEach((ex, i) => {
    const exKey = (isCore ? 'core_session_' : currentTab === 'main' ? 'main_' : 'core_') + i;
    const sessionEx = isLogging
      ? (activeSession.exercises.find(e => e.key === exKey) || null)
      : null;

    html += `<div class="ex-card" id="ex-card-${exKey}">
      <div class="ex-card-header" onclick="toggleEx('${exKey}')">
        <div class="ex-card-left">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-sets-badge">${ex.sets}</div>
        </div>
        <div class="ex-chevron">⌄</div>
      </div>
      <div class="ex-desc">${ex.desc}</div>`;

    // ── Exercise history reference ──────────────────────────────────────────
    const { pb, lastSession } = getExerciseHistory(ex.name);

    if (!pb && !lastSession) {
      // Never been logged before
      html += `<div class="ex-ref">
        <div class="ex-ref-first">★ First time — start light, focus on form</div>
      </div>`;
    } else {
      let refHtml = '';

      // Last session summary
      if (lastSession) {
        const lastDate = new Date(lastSession.date).toLocaleDateString('en-US', {month:'short', day:'numeric'});
        let setPreview;
        if (lastSession.isActivity) {
          const parts = [];
          if (lastSession.duration) parts.push(`${lastSession.duration} min`);
          if (lastSession.distance) parts.push(`${parseFloat(lastSession.distance).toFixed(2)} mi`);
          setPreview = parts.join(', ') || 'logged';
        } else {
          setPreview = lastSession.sets.slice(0, 3).map(st => {
            const w = st.weight && parseFloat(st.weight) > 0 ? `${st.weight}lbs` : '';
            return w ? `${st.reps} × ${w}` : `${st.reps} reps`;
          }).join(', ');
        }
        refHtml += `<div class="ex-ref-row">
          <div class="ex-ref-label">Last (${lastDate})</div>
          <div class="ex-ref-value">${setPreview}${!lastSession.isActivity && lastSession.sets.length > 3 ? '…' : ''}</div>
        </div>`;
      }

      // PB weight
      if (pb && pb.weight > 0) {
        const pbDate = pb.weightDate
          ? new Date(pb.weightDate).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'2-digit'})
          : '';
        refHtml += `<div class="ex-ref-row">
          <div class="ex-ref-label">Best weight</div>
          <div class="ex-ref-value"><strong>${pb.weight} lbs</strong>${pbDate ? ` · ${pbDate}` : ''}</div>
        </div>`;
      }

      // PB reps
      if (pb && pb.reps > 0) {
        const pbDate = pb.repsDate
          ? new Date(pb.repsDate).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'2-digit'})
          : '';
        const atWeight = pb.repsWeight > 0 ? ` @ ${pb.repsWeight} lbs` : '';
        refHtml += `<div class="ex-ref-row">
          <div class="ex-ref-label">Best reps</div>
          <div class="ex-ref-value"><strong>${pb.reps} reps${atWeight}</strong>${pbDate ? ` · ${pbDate}` : ''}</div>
        </div>`;
      }

      if (refHtml) html += `<div class="ex-ref">${refHtml}</div>`;
    }

    if (isLogging) {
      const sets = sessionEx ? sessionEx.sets : [{reps:'',weight:''}];
      html += `<div class="set-logger">
        <div class="set-logger-head">
          <div class="set-logger-title">Sets logged</div>
          <button class="add-set-btn" onclick="addSet('${exKey}')">+ Set</button>
        </div>
        ${sets.map((s, si) => `
          <div class="set-row" id="set-row-${exKey}-${si}">
            <div class="set-num">${si+1}</div>
            <input class="set-input" type="number" inputmode="decimal" placeholder="reps"
              value="${s.reps}" onchange="updateSet('${exKey}',${si},'reps',this.value)" style="max-width:70px">
            <div class="set-unit">×</div>
            <input class="set-input" type="number" inputmode="decimal" placeholder="lbs"
              value="${s.weight}" onchange="updateSet('${exKey}',${si},'weight',this.value)">
            <div class="set-unit">lbs</div>
            <button class="del-set-btn" onclick="deleteSet('${exKey}',${si})">×</button>
          </div>`).join('')}
        <button onclick="removeExerciseFromSession('${exKey}','${ex.name.replace(/'/g,"\\'")}')"
          style="display:block;width:100%;margin-top:8px;padding:8px;
            background:none;border:1px solid var(--border);border-radius:var(--radius-sm);
            color:var(--text-dim);font-family:'DM Sans',sans-serif;font-size:12px;
            cursor:pointer;text-align:center">
          Remove exercise from session
        </button>
      </div>`;
    }

    html += `</div>`; // end ex-card
  });

  if (isLogging) {
    const notes = activeSession.notes || '';
    const duration = activeSession.duration || '';
    const distance = activeSession.distance || '';
    const isCardio = isCardioSession(currentVariation.key, activeSession.category, activeSession.customName);
    html += `
    <div class="session-meta-block">
      <div class="session-timer-row">
        <div>
          <div class="session-elapsed" id="session-elapsed-display">0:00</div>
          <div class="session-elapsed-label">Elapsed</div>
        </div>
        <div class="session-meta-label" style="padding:0">Override duration</div>
        <input class="session-meta-input" type="number" inputmode="decimal"
          placeholder="mins" style="max-width:60px;text-align:right"
          value="${duration}"
          onchange="activeSession.duration=this.value">
        <div class="duration-unit">min</div>
      </div>
      ${isCardio ? `<div class="session-meta-row">
        <div class="session-meta-label">Distance</div>
        <input class="session-meta-input" type="number" inputmode="decimal"
          placeholder="optional" style="max-width:60px;text-align:right"
          value="${distance}"
          oninput="activeSession.distance=this.value">
        <div class="duration-unit">mi</div>
      </div>` : ''}
      <div class="session-meta-row">
        <div class="session-meta-label">Notes</div>
        <textarea class="session-meta-input" rows="3"
          placeholder="How did it go? Anything worth noting…"
          onchange="activeSession.notes=this.value"
          oninput="activeSession.notes=this.value">${notes}</textarea>
      </div>
    </div>
    <div class="finish-btn-wrap">
      <button class="finish-btn"
        style="background:${currentTab==='main'?tc:'var(--core)'}"
        onclick="finishSession()">
        Finish & Save
      </button>
    </div>`;
    // Start / refresh the elapsed timer display after render
    setTimeout(updateElapsedDisplay, 50);
  }

  body.innerHTML = html;
}

function toggleEx(key) {
  const card = document.getElementById('ex-card-' + key);
  card.classList.toggle('open');
}

// ════════════════════════════════════════════════════════════════════════════
// SESSION LOGGING
// ════════════════════════════════════════════════════════════════════════════
function startSession() {
  const isCore = CORE_ORDER.includes(currentVariation.key);
  const exerciseList = isCore
    ? currentVariation.exercises
    : (currentTab === 'main' ? currentVariation.exercises : currentVariation.core);
  const keyPrefix = isCore ? 'core_session_' : (currentTab === 'main' ? 'main_' : 'core_');
  const exercises = exerciseList.map((ex, i) => ({
    key: keyPrefix + i,
    name: ex.name,
    sets: [{reps:'', weight:''}]
  }));
  sessionStartTime = Date.now();
  activeSession = {
    id: sessionStartTime,
    date: new Date().toISOString(),
    loggedAt: null,
    variationKey: currentVariation.key,
    tab: isCore ? 'core' : currentTab,
    exercises,
    notes: '',
    duration: '',
    distance: '',
    category: isCore ? 'core' : ''
  };
  clearInterval(elapsedInterval);
  elapsedInterval = setInterval(updateElapsedDisplay, 10000);
  renderExercises();
}

function updateElapsedDisplay() {
  if (!sessionStartTime) return;
  const el = document.getElementById('session-elapsed-display');
  if (!el) return;
  const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
  const m = Math.floor(elapsed / 60);
  const s = elapsed % 60;
  el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
}

function updateSet(exKey, setIdx, field, value) {
  if (!activeSession) return;
  let ex = activeSession.exercises.find(e => e.key === exKey);
  if (!ex) { ex = {key:exKey, name:'', sets:[]}; activeSession.exercises.push(ex); }
  if (!ex.sets[setIdx]) ex.sets[setIdx] = {reps:'',weight:''};
  ex.sets[setIdx][field] = value;
}

function removeExerciseFromSession(exKey, exName) {
  if (!activeSession) return;
  const confirmed = confirm(`Remove "${exName}" from this session?`);
  if (!confirmed) return;
  activeSession.exercises = activeSession.exercises.filter(e => e.key !== exKey);
  // Remove the card from DOM directly for instant feedback, then re-render
  const card = document.getElementById('ex-card-' + exKey);
  if (card) card.remove();
}

function addSet(exKey) {
  if (!activeSession) return;
  let ex = activeSession.exercises.find(e => e.key === exKey);
  if (!ex) { ex = {key:exKey, name:'', sets:[]}; activeSession.exercises.push(ex); }
  ex.sets.push({reps:'', weight:''});
  renderExercises();
  // Re-open the card
  setTimeout(() => {
    const card = document.getElementById('ex-card-' + exKey);
    if (card) card.classList.add('open');
  }, 10);
}

function deleteSet(exKey, setIdx) {
  if (!activeSession) return;
  const ex = activeSession.exercises.find(e => e.key === exKey);
  if (ex && ex.sets.length > 1) {
    ex.sets.splice(setIdx, 1);
    renderExercises();
    setTimeout(() => {
      const card = document.getElementById('ex-card-' + exKey);
      if (card) card.classList.add('open');
    }, 10);
  }
}

function finishSession() {
  if (!activeSession) return;
  // Auto-calculate duration from elapsed time if user didn't override
  if (!activeSession.duration && sessionStartTime) {
    const mins = Math.round((Date.now() - sessionStartTime) / 60000);
    if (mins > 0) activeSession.duration = String(mins);
  }
  activeSession.loggedAt = new Date().toISOString();
  clearInterval(elapsedInterval);
  elapsedInterval = null;
  sessionStartTime = null;
  sessions.push(activeSession);
  saveSessions(activeSession.id);
  activeSession = null;
  document.getElementById('finish-session-top').style.display = 'none';
  document.getElementById('timer-bar').classList.remove('visible');
  stopTimer();
  showToast('Session saved ✓');
  setTimeout(() => showHome(), 1200);
}

// ════════════════════════════════════════════════════════════════════════════
// TIMER
// ════════════════════════════════════════════════════════════════════════════
function updateTimerDisplay() {
  const m = Math.floor(timerSeconds / 60);
  const s = timerSeconds % 60;
  const el = document.getElementById('timer-display');
  el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  el.classList.toggle('warning', timerSeconds <= 10 && timerSeconds > 0);
  el.classList.toggle('running', timerRunning);
}

function toggleTimer() {
  if (timerRunning) {
    stopTimer();
  } else {
    timerRunning = true;
    document.getElementById('timer-play-btn').textContent = '⏸';
    timerInterval = setInterval(() => {
      if (timerSeconds > 0) {
        timerSeconds--;
        updateTimerDisplay();
      } else {
        stopTimer();
        timerSeconds = timerMax; // reset to last used duration ready for next set
        updateTimerDisplay();
        if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
        showToast('Rest time up!');
      }
    }, 1000);
  }
}

function stopTimer() {
  timerRunning = false;
  clearInterval(timerInterval);
  const btn = document.getElementById('timer-play-btn');
  if (btn) btn.textContent = '▶';
  updateTimerDisplay();
}

function resetTimer() {
  stopTimer();
  timerSeconds = timerMax;
  updateTimerDisplay();
}

function setTimerPreset(secs) {
  stopTimer();
  timerMax = secs;
  timerSeconds = secs;
  document.querySelectorAll('.timer-preset').forEach(b => {
    b.classList.toggle('active', parseInt(b.textContent) === secs/60 || b.textContent === '90s');
  });
  updateTimerDisplay();
}

// HISTORY SCREEN
// ════════════════════════════════════════════════════════════════════════════
function showHistory() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-history').classList.add('active');
  setActiveNav('bnav-history');
  renderHistory();
}

let sessionDetailReferrer = 'history'; // 'history' | 'backfill'

function showSessionDetail(sessionId, referrer) {
  const s = sessions.find(s => String(s.id) === String(sessionId));
  if (!s) return;
  sessionDetailReferrer = referrer || 'history';
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById('screen-session-detail').classList.add('active');
  setActiveNav('bnav-history');
  // Update back button label and target based on where we came from
  const backBtn = document.querySelector('#screen-session-detail .back-btn');
  if (backBtn) {
    if (sessionDetailReferrer === 'backfill') {
      backBtn.setAttribute('onclick', 'showBackfillFromDetail()');
      backBtn.childNodes[backBtn.childNodes.length - 1].textContent = ' Calendar';
    } else {
      backBtn.setAttribute('onclick', 'showHistory()');
      backBtn.childNodes[backBtn.childNodes.length - 1].textContent = ' History';
    }
  }
  renderSessionDetail(s);
  document.getElementById('detail-body').scrollTop = 0;
  // Always show edit button when opening a fresh session detail
  const editBtn = document.getElementById('detail-edit-btn');
  if (editBtn) editBtn.style.display = 'block';
}

function showBackfillFromDetail() {
  // Return to backfill screen for the same date
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById('screen-backfill').classList.add('active');
  setActiveNav(null);
}

// Returns a human-readable note if the session was logged on a different day than it occurred
function loggedLaterNote(s) {
  if (!s.loggedAt) return null;
  const workoutDay = new Date(s.date).toDateString();
  const logDay = new Date(s.loggedAt).toDateString();
  if (workoutDay === logDay) return null;
  return 'Added to log on ' + new Date(s.loggedAt).toLocaleDateString('en-US', {
    weekday: 'short', month: 'short', day: 'numeric', year: 'numeric',
    hour: 'numeric', minute: '2-digit'
  });
}

function renderSessionDetail(s) {
  const vm = getVariationMeta(s.variationKey, s.customName, s.category);
  const tc = vm.color;
  const bg = vm.bg;
  const tt = vm.text;
  const dateStr = new Date(s.date).toLocaleDateString('en-US', {
    weekday:'long', month:'long', day:'numeric', year:'numeric'
  });
  const totalSets = s.exercises.reduce((acc, e) => acc + e.sets.filter(st => st.reps).length, 0);

  // Calculate XP for this session
  const sessionIdx = sessions.indexOf(s);
  const priorSessions = sessionIdx > 0 ? sessions.slice(0, sessionIdx) : [];
  const priorPBs = {};
  priorSessions.forEach(ps => ps.exercises.forEach(ex => {
    if (!priorPBs[ex.name]) priorPBs[ex.name] = {weight:0, reps:0};
    ex.sets.forEach(st => {
      const w = parseFloat(st.weight)||0, r = parseFloat(st.reps)||0;
      if (w > priorPBs[ex.name].weight) priorPBs[ex.name].weight = w;
      if (r > priorPBs[ex.name].reps) priorPBs[ex.name].reps = r;
    });
  }));
  const { breakdown, attrGains } = calcSessionXP(s, priorSessions, priorPBs);
  const totalXP = Object.values(attrGains).reduce((a, b) => a + b, 0);

  document.getElementById('detail-topbar-title').textContent = vm.label;

  let html = `<div class="detail-header">
    <div class="detail-badge" style="background:${bg};color:${tt}">${vm.label} — ${vm.type.toUpperCase()}</div>
    <div class="detail-title">${vm.name}</div>
    <div class="detail-date">${dateStr}</div>
    ${loggedLaterNote(s) ? `<div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--text-dim);margin-top:5px;opacity:0.8">${loggedLaterNote(s)}</div>` : ''}
  </div>`;

  if (s.missed) {
    html += `<div class="detail-missed-pill">Retroactive / Missed workout</div>`;
  }

  // Duration / distance / notes meta block
  const hasMeta = (s.duration && String(s.duration).trim()) || (s.notes && s.notes.trim()) || (s.distance && parseFloat(s.distance) > 0);
  if (hasMeta) {
    html += `<div class="data-section-card" style="margin:14px 18px 0">`;
    if (s.duration && String(s.duration).trim()) {
      html += `<div class="detail-meta-row">
        <div class="detail-meta-label">Duration</div>
        <div class="detail-meta-value">${s.duration} min</div>
      </div>`;
    }
    if (s.distance && String(s.distance).trim() && parseFloat(s.distance) > 0) {
      const dist = parseFloat(s.distance);
      const pace = (s.duration && parseFloat(s.duration) > 0)
        ? (() => { const p = parseFloat(s.duration)/dist; const m=Math.floor(p); const sec=Math.round((p-m)*60); return `${m}:${String(sec).padStart(2,'0')} /mi`; })()
        : null;
      html += `<div class="detail-meta-row">
        <div class="detail-meta-label">Distance</div>
        <div class="detail-meta-value">${dist.toFixed(2)} mi${pace ? ` · ${pace}` : ''}</div>
      </div>`;
    }
    if (s.notes && s.notes.trim()) {
      html += `<div class="detail-meta-row">
        <div class="detail-meta-label">Notes</div>
        <div class="detail-meta-value">${s.notes.replace(/\n/g, '<br>')}</div>
      </div>`;
    }
    html += `</div>`;
  }

  // ── Workout stats block ────────────────────────────────────────────────────
  const vol = s.exercises.reduce((acc, e) =>
    acc + e.sets.reduce((a, st) => a + ((parseFloat(st.reps)||0) * (parseFloat(st.weight)||0)), 0), 0);
  const exCount = s.exercises.filter(e => e.sets.some(st => st.reps)).length;
  const wpr = sessionWeightPerRep(s);

  // PR count for this session
  const priorPBsForStats = {};
  priorSessions.forEach(ps => ps.exercises.forEach(ex => {
    if (!priorPBsForStats[ex.name]) priorPBsForStats[ex.name] = {weight:0, reps:0};
    ex.sets.forEach(st => {
      const w = parseFloat(st.weight)||0, r = parseFloat(st.reps)||0;
      if (w > priorPBsForStats[ex.name].weight) priorPBsForStats[ex.name].weight = w;
      if (r > priorPBsForStats[ex.name].reps) priorPBsForStats[ex.name].reps = r;
    });
  }));
  // Top exercise by volume
  let topEx = null, topVol = 0;
  s.exercises.forEach(ex => {
    const v = ex.sets.reduce((a, st) => a + ((parseFloat(st.reps)||0)*(parseFloat(st.weight)||0)), 0);
    if (v > topVol) { topVol = v; topEx = ex.name; }
  });

  // Heaviest lift with exercise name
  let heaviest = 0, heaviestEx = null;
  s.exercises.forEach(ex => {
    ex.sets.forEach(st => {
      const w = parseFloat(st.weight)||0;
      if (st.reps && w > heaviest) { heaviest = w; heaviestEx = ex.name; }
    });
  });

  // Most reps in a single set with exercise name
  let mostReps = 0, mostRepsEx = null;
  s.exercises.forEach(ex => {
    ex.sets.forEach(st => {
      const r = parseFloat(st.reps)||0;
      if (r > mostReps) { mostReps = r; mostRepsEx = ex.name; }
    });
  });

  // PRs with exercise names
  const prList = [];
  s.exercises.forEach(ex => {
    const prev = priorPBsForStats[ex.name] || {weight:0, reps:0};
    ex.sets.forEach(st => {
      const w = parseFloat(st.weight)||0, r = parseFloat(st.reps)||0;
      if (w > prev.weight || r > prev.reps) {
        if (!prList.find(p => p.name === ex.name)) prList.push({ name: ex.name });
      }
    });
  });
  const prCount = prList.length;
  const priorWithDur = priorSessions.filter(ps => parseFloat(ps.duration) > 0);
  const avgDurStat = priorWithDur.length >= 3 ? priorWithDur.reduce((a, ps) => a + parseFloat(ps.duration), 0) / priorWithDur.length : null;
  const vm2 = getVariationMeta(s.variationKey, s.customName, s.category);
  const priorSameType = priorSessions.filter(ps => getVariationMeta(ps.variationKey, ps.customName, ps.category).type === vm2.type);
  const priorVols = priorSameType.map(ps => ps.exercises.reduce((acc, e) => acc + e.sets.reduce((a, st) => a + ((parseFloat(st.reps)||0)*(parseFloat(st.weight)||0)), 0), 0)).filter(v => v > 0);
  const avgVolStat = priorVols.length >= 3 ? priorVols.reduce((a,b)=>a+b,0)/priorVols.length : null;

  const aboveAvgVol = avgVolStat !== null && vol > avgVolStat;
  const aboveAvgDur = avgDurStat !== null && (parseFloat(s.duration)||0) > avgDurStat;

  // ── Activity stats block (running, taekwondo, etc.) ───────────────────────
  const isActivitySession = s.variationKey === CUSTOM_KEY && s.customName &&
    PREDEFINED_ACTIVITIES.find(a => a.name === s.customName);

  if (isActivitySession && exCount === 0) {
    const actSessions = sessions.filter(ps =>
      ps.variationKey === CUSTOM_KEY && ps.customName === s.customName
    );
    const hasDistance = parseFloat(s.distance) > 0;
    const hasDuration = parseFloat(s.duration) > 0;

    // Best duration for this activity
    const bestDur = Math.max(0, ...actSessions.map(ps => parseFloat(ps.duration)||0));
    const bestDist = Math.max(0, ...actSessions.map(ps => parseFloat(ps.distance)||0));

    // Best pace
    let bestPaceStr = null;
    actSessions.forEach(ps => {
      const d = parseFloat(ps.distance)||0, t = parseFloat(ps.duration)||0;
      if (d > 0 && t > 0) {
        const pace = t / d;
        if (!bestPaceStr || pace < (bestPaceStr._val)) {
          const m = Math.floor(pace), sec = Math.round((pace-m)*60);
          bestPaceStr = { str: `${m}:${String(sec).padStart(2,'0')}`, _val: pace };
        }
      }
    });

    // Current session pace
    const curDist = parseFloat(s.distance)||0, curDur = parseFloat(s.duration)||0;
    const curPace = (curDist > 0 && curDur > 0) ? (() => {
      const p = curDur/curDist, m = Math.floor(p), sec = Math.round((p-m)*60);
      return { str: `${m}:${String(sec).padStart(2,'0')}`, _val: p };
    })() : null;

    const isBestDur  = hasDuration && curDur >= bestDur;
    const isBestDist = hasDistance && curDist >= bestDist;
    const isBestPace = curPace && bestPaceStr && curPace._val <= bestPaceStr._val;

    html += `<div class="detail-section-label" style="margin-top:16px">Session stats</div>`;
    html += `<div class="stats-grid" style="padding:0 18px;margin-bottom:0">`;

    if (hasDuration) html += `<div class="stat-tile${isBestDur?' ':' '}">
      <div class="stat-tile-label">Duration${isBestDur?' ⭐':''}</div>
      <div class="stat-tile-value">${s.duration}</div>
      <div class="stat-tile-unit">min${isBestDur?' · personal best':''}</div>
    </div>`;

    if (hasDistance) html += `<div class="stat-tile${isBestDist?' ':' '}">
      <div class="stat-tile-label">Distance${isBestDist?' ⭐':''}</div>
      <div class="stat-tile-value">${curDist.toFixed(2)}</div>
      <div class="stat-tile-unit">mi${isBestDist?' · personal best':''}</div>
    </div>`;

    if (curPace) html += `<div class="stat-tile${isBestPace?' ':' '}">
      <div class="stat-tile-label">Pace${isBestPace?' ⭐':''}</div>
      <div class="stat-tile-value" style="font-size:20px">${curPace.str}</div>
      <div class="stat-tile-unit">min/mi${isBestPace?' · personal best':''}</div>
    </div>`;

    html += `</div>`;
  }

  if (exCount > 0 || vol > 0) {
    html += `<div class="detail-section-label" style="margin-top:16px">Workout stats</div>`;
    html += `<div class="stats-grid" style="padding:0 18px;margin-bottom:0">`;

    if (vol > 0) html += `<div class="stat-tile${aboveAvgVol?' ':' '}">
      <div class="stat-tile-label">Total volume${aboveAvgVol?' 📈':''}</div>
      <div class="stat-tile-value">${fmt(vol)}</div>
      <div class="stat-tile-unit">lbs moved</div>
    </div>`;

    if (totalSets > 0) html += `<div class="stat-tile">
      <div class="stat-tile-label">Sets</div>
      <div class="stat-tile-value">${totalSets}</div>
      <div class="stat-tile-unit">across ${exCount} exercise${exCount!==1?'s':''}</div>
    </div>`;

    if (heaviest > 0) html += `<div class="stat-tile">
      <div class="stat-tile-label">Heaviest lift</div>
      <div class="stat-tile-value">${heaviest}</div>
      <div class="stat-tile-unit">lbs · ${heaviestEx}</div>
    </div>`;

    if (mostReps > 0) html += `<div class="stat-tile">
      <div class="stat-tile-label">Most reps (set)</div>
      <div class="stat-tile-value">${mostReps}</div>
      <div class="stat-tile-unit">reps · ${mostRepsEx}</div>
    </div>`;

    if (prCount > 0) {
      const pbId = `pb-tile-${s.id}`;
      const showAll = prCount <= 3;
      const previewNames = prList.slice(0, 3).map(p => p.name).join(', ');
      const allNames = prList.map(p => p.name).join(', ');
      html += `<div class="stat-tile wide" style="background:var(--str-bg);border-color:var(--str);margin-top:0">
        <div class="stat-tile-label" style="color:var(--str-text);opacity:0.7">Personal best${prCount!==1?'s':''} ⭐</div>
        <div id="${pbId}-names" style="font-family:'Syne',sans-serif;font-size:${prCount > 2?'13px':'16px'};font-weight:800;color:var(--str-text);line-height:1.4;margin:4px 0 2px">
          ${showAll ? allNames : previewNames + `<span id="${pbId}-extra"> +${prCount - 3} more</span>`}
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div class="stat-tile-unit">${prCount} new PB${prCount!==1?'s':''}</div>
          ${prCount > 3 ? `<button onclick="togglePBTile('${pbId}',${JSON.stringify(allNames)},${JSON.stringify(previewNames)},${prCount})"
            id="${pbId}-btn"
            style="background:none;border:none;font-family:'DM Mono',monospace;font-size:9px;
              color:var(--str);cursor:pointer;padding:0;text-transform:uppercase;letter-spacing:0.5px">
            Show all
          </button>` : ''}
        </div>
      </div>`;
    }

    if (topEx && exCount > 1) html += `<div class="stat-tile wide">
      <div class="stat-tile-label">Top exercise</div>
      <div class="stat-tile-value" style="font-size:14px;line-height:1.2">${topEx}</div>
      <div class="stat-tile-unit">${fmt(topVol)} lbs</div>
    </div>`;

    if (s.duration && aboveAvgDur) html += `<div class="stat-tile wide" style="background:var(--agi-bg);border-color:var(--agi)">
      <div class="stat-tile-label" style="color:var(--agi-text);opacity:0.7">Duration</div>
      <div class="stat-tile-value" style="color:var(--agi-text)">${s.duration} min</div>
      <div class="stat-tile-unit">📈 above your average</div>
    </div>`;

    html += `</div>`;
  }
  if (totalXP > 0) {
    html += `<div class="detail-section-label" style="margin-top:16px">
      Experience earned
      <span style="font-family:'Syne',sans-serif;font-size:14px;font-weight:800;
        color:var(--str);margin-left:8px;text-shadow:0 0 10px var(--str-glow)">
        +${totalXP} XP
      </span>
    </div>`;

    html += `<div class="data-section-card" style="margin:0 18px">`;

    // Breakdown rows
    if (breakdown.base > 0) html += `<div class="detail-meta-row">
      <div class="detail-meta-label">Showed up</div>
      <div class="detail-meta-value" style="color:var(--text-muted)">+${breakdown.base}</div>
    </div>`;
    if (breakdown.duration > 0) html += `<div class="detail-meta-row">
      <div class="detail-meta-label">Duration</div>
      <div class="detail-meta-value" style="color:var(--text-muted)">+${breakdown.duration}</div>
    </div>`;
    if (breakdown.reps > 0) html += `<div class="detail-meta-row">
      <div class="detail-meta-label">Reps</div>
      <div class="detail-meta-value" style="color:var(--text-muted)">+${breakdown.reps}</div>
    </div>`;
    if (breakdown.volume > 0) html += `<div class="detail-meta-row">
      <div class="detail-meta-label">Volume</div>
      <div class="detail-meta-value" style="color:var(--text-muted)">+${breakdown.volume}</div>
    </div>`;
    if (breakdown.pr > 0) html += `<div class="detail-meta-row">
      <div class="detail-meta-label">PB bonus</div>
      <div class="detail-meta-value" style="color:var(--str-text)">+${breakdown.pr} ⭐</div>
    </div>`;
    if (breakdown.aboveAvg > 0) html += `<div class="detail-meta-row">
      <div class="detail-meta-label">Above avg</div>
      <div class="detail-meta-value" style="color:var(--agi-text)">+${breakdown.aboveAvg} 📈</div>
    </div>`;
    if (s.achievementXP > 0) html += `<div class="detail-meta-row">
      <div class="detail-meta-label">Achievement</div>
      <div class="detail-meta-value" style="color:var(--str-text)">+${s.achievementXP} 🏆</div>
    </div>`;

    html += `</div>`;

    // Per-attribute gains
    const attrRows = Object.entries(attrGains).filter(([,xp]) => xp > 0);
    if (attrRows.length) {
      html += `<div style="display:flex;gap:8px;padding:0 18px;margin-top:8px">`;
      attrRows.forEach(([key, xp]) => {
        const a = ATTRS[key];
        const lvl = levelFromXP((computeAllXP(priorSessions).totalAttrXP[key]||0) + xp);
        html += `<div style="flex:1;background:${a.bg};border:1px solid ${a.color}20;
          border-radius:10px;padding:10px 10px 8px;text-align:center">
          <div style="font-size:16px">${a.icon}</div>
          <div style="font-family:'Syne',sans-serif;font-size:13px;font-weight:800;
            color:${a.color};margin-top:2px">+${xp}</div>
          <div style="font-family:'DM Mono',monospace;font-size:8px;
            color:${a.text};opacity:0.6;margin-top:1px;text-transform:uppercase">
            ${a.name.slice(0,3)} Lv${lvl.level}
          </div>
        </div>`;
      });
      html += `</div>`;
    }
  }

  // ── Sets ──────────────────────────────────────────────────────────────────
  const loggedExercises = s.exercises.filter(e => e.sets && e.sets.some(st => st.reps));

  if (!loggedExercises.length) {
    html += `<div style="padding:24px 18px;color:var(--text-dim);font-size:13px">No sets were logged for this session.</div>`;
  } else {
    html += `<div class="detail-section-label" style="margin-top:16px">${totalSets} sets logged</div>`;
    loggedExercises.forEach(ex => {
      const validSets = ex.sets.filter(st => st.reps);
      html += `<div class="detail-ex-card">
        <div class="detail-ex-name">${ex.name}</div>
        ${validSets.map((st, i) => {
          const reps = st.reps;
          const hasWeight = st.weight && parseFloat(st.weight) > 0;
          return `<div class="detail-set-row">
            <div class="detail-set-num">${i + 1}</div>
            <div class="detail-set-reps">${reps}</div>
            <div class="detail-set-x">${hasWeight ? '×' : 'reps'}</div>
            ${hasWeight ? `<div class="detail-set-weight">${st.weight}</div>
            <div class="detail-set-weight-unit">lbs</div>` : ''}
          </div>`;
        }).join('')}
      </div>`;
    });
  }

  html += `<button class="detail-delete-btn" data-session-id="${s.id}" onclick="deleteSessionFromDetail('${s.id}')">
    Delete this session
  </button>`;

  document.getElementById('detail-body').innerHTML = html;
}

function togglePBTile(id, allNames, previewNames, total) {
  const namesEl = document.getElementById(id + '-names');
  const btn = document.getElementById(id + '-btn');
  if (!namesEl || !btn) return;
  const expanded = btn.textContent.trim() === 'Show less';
  if (expanded) {
    namesEl.innerHTML = previewNames + `<span id="${id}-extra"> +${total - 3} more</span>`;
    btn.textContent = 'Show all';
  } else {
    namesEl.textContent = allNames;
    btn.textContent = 'Show less';
  }
}

function deleteSessionFromDetail(sessionId) {
  if (!confirm('Delete this session? This cannot be undone.')) return;
  const idx = sessions.findIndex(s => String(s.id) === String(sessionId));
  if (idx !== -1) {
    sessions.splice(idx, 1);
    saveSessions();
    showToast('Session deleted');
    showHistory();
  }
}

function renderHistorySessionCard(s) {
  const vm = getVariationMeta(s.variationKey, s.customName, s.category);
  const totalSets = s.exercises.reduce((acc, e) => acc + e.sets.filter(st => st.reps).length, 0);

  // Calculate XP earned this session
  const sessionIdx = sessions.indexOf(s);
  const priorSessions = sessionIdx > 0 ? sessions.slice(0, sessionIdx) : [];
  const priorPBs = {};
  priorSessions.forEach(ps => ps.exercises.forEach(ex => {
    if (!priorPBs[ex.name]) priorPBs[ex.name] = {weight:0, reps:0};
    ex.sets.forEach(st => {
      const w = parseFloat(st.weight)||0, r = parseFloat(st.reps)||0;
      if (w > priorPBs[ex.name].weight) priorPBs[ex.name].weight = w;
      if (r > priorPBs[ex.name].reps) priorPBs[ex.name].reps = r;
    });
  }));
  const { attrGains } = calcSessionXP(s, priorSessions, priorPBs);
  const totalXP = Object.values(attrGains).reduce((a, b) => a + b, 0);

  const metaParts = [];
  if (totalSets) metaParts.push(`${totalSets} set${totalSets !== 1 ? 's' : ''} logged`);
  if (s.duration && String(s.duration).trim()) metaParts.push(`${s.duration} min`);
  if (totalXP > 0) metaParts.push(`+${totalXP} XP`);
  if (s.missed) metaParts.push('retroactive');
  const logNote = loggedLaterNote(s);
  if (logNote) metaParts.push(logNote);
  const meta = metaParts.join(' · ') || 'No sets logged';

  return `<button class="history-item" onclick="showSessionDetail('${s.id}')">
    <div class="history-item-header">
      <div class="history-item-left">
        <div class="history-item-name" style="color:${vm.color}">${vm.label} — ${vm.name}</div>
        <div class="history-item-meta">${meta}</div>
      </div>
      <div class="history-item-arrow">›</div>
    </div>
  </button>`;
}

function renderHistory() {
  const list = document.getElementById('history-list');
  if (!sessions.length) {
    list.innerHTML = '<div class="history-empty">No sessions logged yet.</div>';
    return;
  }

  // Group sessions by calendar date (most recent first)
  const grouped = {};
  [...sessions].reverse().forEach(s => {
    const d = new Date(s.date);
    const key = d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
    if (!grouped[key]) grouped[key] = { label: key, sessions: [], dateObj: d };
    grouped[key].sessions.push(s);
  });

  list.innerHTML = Object.values(grouped).map(group => {
    const today = new Date();
    const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
    const gd = group.dateObj;
    let label = group.label;
    if (gd.toDateString() === today.toDateString()) label = 'Today';
    else if (gd.toDateString() === yesterday.toDateString()) label = 'Yesterday';

    const cards = group.sessions.map(s => renderHistorySessionCard(s)).join('');
    return `<div class="history-date-group">
      <div class="history-day-header">
        <div class="history-day-label">${label}</div>
        <div class="history-day-line"></div>
      </div>
      ${cards}
    </div>`;
  }).join('');
}

// Compute PBs from all sessions. Returns map: exName -> { weight, reps, weightDate, repsDate, repsWeight }
function computePBs(sessionList) {
  const sl = sessionList || sessions;
  const pbs = {};
  sl.forEach(s => {
    s.exercises.forEach(ex => {
      if (!ex.name) return;
      ex.sets.forEach(set => {
        const reps = parseFloat(set.reps);
        const weight = parseFloat(set.weight);
        if (!pbs[ex.name]) pbs[ex.name] = { weight: 0, reps: 0, weightDate: null, repsDate: null, repsWeight: 0, variationKey: s.variationKey };
        if (!isNaN(weight) && weight > pbs[ex.name].weight) {
          pbs[ex.name].weight = weight;
          pbs[ex.name].weightDate = s.date;
          pbs[ex.name].variationKey = s.variationKey;
        }
        if (!isNaN(reps) && reps > pbs[ex.name].reps) {
          pbs[ex.name].reps = reps;
          pbs[ex.name].repsDate = s.date;
          pbs[ex.name].repsWeight = !isNaN(weight) && weight > 0 ? weight : 0;
        }
      });
    });
  });
  return pbs;
}

// Check the most recently saved session for new PBs and fire notifications
function checkAndAutoSyncPBs() {
  if (!sessions.length) return;
  const latest = sessions[sessions.length - 1];
  const allPrevious = sessions.slice(0, -1);

  // Build PBs from all sessions EXCEPT the latest
  const prevPBs = {};
  allPrevious.forEach(s => {
    s.exercises.forEach(ex => {
      if (!ex.name) return;
      ex.sets.forEach(set => {
        const reps = parseFloat(set.reps);
        const weight = parseFloat(set.weight);
        if (!prevPBs[ex.name]) prevPBs[ex.name] = { weight: 0, reps: 0 };
        if (!isNaN(weight) && weight > prevPBs[ex.name].weight) prevPBs[ex.name].weight = weight;
        if (!isNaN(reps) && reps > prevPBs[ex.name].reps) prevPBs[ex.name].reps = reps;
      });
    });
  });

  // Check latest session for beats
  const newPBs = [];
  latest.exercises.forEach(ex => {
    if (!ex.name) return;
    ex.sets.forEach(set => {
      const reps = parseFloat(set.reps);
      const weight = parseFloat(set.weight);
      const prev = prevPBs[ex.name] || { weight: 0, reps: 0 };
      if (!isNaN(weight) && weight > 0 && weight > prev.weight) {
        const shortName = ex.name.split(' ').slice(0, 3).join(' ');
        if (!newPBs.find(p => p.name === shortName && p.type === 'weight')) {
          newPBs.push({ name: shortName, type: 'weight', value: weight });
        }
      }
      if (!isNaN(reps) && reps > 0 && reps > prev.reps) {
        const shortName = ex.name.split(' ').slice(0, 3).join(' ');
        if (!newPBs.find(p => p.name === shortName && p.type === 'reps')) {
          newPBs.push({ name: shortName, type: 'reps', value: reps });
        }
      }
    });
  });

  // Fire PB notifications with staggered timing
  newPBs.slice(0, 3).forEach((pb, i) => {
    setTimeout(() => {
      const unit = pb.type === 'weight' ? 'lbs' : 'reps';
      showPBToast(`New ${pb.type} record — ${pb.name}: ${pb.value} ${unit}`);
    }, i * 2600);
  });
}

  msgEl.textContent = msg;
  el.classList.add('show');
  clearTimeout(pbToastTimeout);
  pbToastTimeout = setTimeout(() => el.classList.remove('show'), 3000);
}

// ── helpers ──────────────────────────────────────────────────────────────────
function totalLbs(sessionList) {
  return sessionList.reduce((acc, s) =>
    acc + s.exercises.reduce((a2, e) =>
      a2 + e.sets.reduce((a3, st) => {
        const r = parseFloat(st.reps) || 0;
        const w = parseFloat(st.weight) || 0;
        return a3 + (r * w);
      }, 0), 0), 0);
}

function totalMiles(sessionList) {
  return sessionList.reduce((acc, s) => acc + (parseFloat(s.distance) || 0), 0);
}

function cardioSessions(sessionList) {
  return sessionList.filter(s => {
    if (ORDER.includes(s.variationKey)) return false;
    const vm = getVariationMeta(s.variationKey, s.customName, s.category);
    return vm.type === 'cardio';
  });
}

// Returns avg pace as "M:SS /mi" string, or null if no data
function avgPace(sessionList) {
  const withBoth = sessionList.filter(s => parseFloat(s.distance) > 0 && parseFloat(s.duration) > 0);
  if (!withBoth.length) return null;
  const totalMins = withBoth.reduce((a, s) => a + parseFloat(s.duration), 0);
  const totalDist = withBoth.reduce((a, s) => a + parseFloat(s.distance), 0);
  if (!totalDist) return null;
  const paceDecimal = totalMins / totalDist;
  const m = Math.floor(paceDecimal);
  const s = Math.round((paceDecimal - m) * 60);
  return `${m}:${String(s).padStart(2,'0')}`;
}

// Best distance in a single session
function bestDistance(sessionList) {
  let best = { dist: 0, date: null };
  sessionList.forEach(s => {
    const d = parseFloat(s.distance);
    if (d > best.dist) { best = { dist: d, date: s.date }; }
  });
  return best.dist > 0 ? best : null;
}

// Best pace (fastest min/mi) in a single session
function bestPace(sessionList) {
  let best = { pace: Infinity, paceStr: null, date: null };
  sessionList.forEach(s => {
    const d = parseFloat(s.distance);
    const t = parseFloat(s.duration);
    if (d > 0 && t > 0) {
      const pace = t / d;
      if (pace < best.pace) {
        const m = Math.floor(pace);
        const sec = Math.round((pace - m) * 60);
        best = { pace, paceStr: `${m}:${String(sec).padStart(2,'0')}`, date: s.date };
      }
    }
  });
  return best.paceStr ? best : null;
}

function totalSetsCount(sessionList) {
  return sessionList.reduce((acc, s) =>
    acc + s.exercises.reduce((a, e) => a + e.sets.filter(st => st.reps).length, 0), 0);
}

function totalMinutes(sessionList) {
  return sessionList.reduce((acc, s) => acc + (parseFloat(s.duration) || 0), 0);
}

function fmt(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return Math.round(n).toString();
}

function fmtTime(mins) {
  if (!mins) return '—';
  if (mins >= 60) return `${Math.floor(mins/60)}h ${Math.round(mins%60)}m`;
  return `${Math.round(mins)}m`;
}

function avg(val, count) {
  if (!count) return 0;
  return val / count;
}

// ── longest streak (consecutive calendar days with at least one session) ────
function longestStreak(sessionList) {
  const sl = sessionList || sessions;
  if (!sl.length) return { streak: 0, last: null, current: 0 };
  const days = [...new Set(sl.map(s => {
    const d = new Date(s.date);
    return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  }))].sort();
  let best = 1, cur = 1;
  for (let i = 1; i < days.length; i++) {
    const prev = new Date(days[i-1].replace(/-/g, '/')), next = new Date(days[i].replace(/-/g, '/'));
    const diff = (next - prev) / 86400000;
    if (diff === 1) { cur++; if (cur > best) best = cur; }
    else cur = 1;
  }
  // current streak
  let cur2 = 1;
  for (let i = days.length - 1; i > 0; i--) {
    const prev = new Date(days[i-1].replace(/-/g, '/')), next = new Date(days[i].replace(/-/g, '/'));
    if ((next - prev) / 86400000 === 1) cur2++;
    else break;
  }
  return { streak: best, current: cur2 };
}

// Returns { current, best } weekly streaks (weeks with >= 3 sessions)
// A "week" is Mon–Sun ISO week. Current streak counts backwards from the
// most recently completed qualifying week (or the current in-progress week
// if it already has 3+ sessions).
function weeklyStreak() {
  if (!sessions.length) return { current: 0, best: 0 };

  // Get the ISO week key (YYYY-Www) for a date
  function isoWeekKey(date) {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    // Thursday in current week determines the year
    d.setDate(d.getDate() + 4 - (d.getDay() || 7));
    const yearStart = new Date(d.getFullYear(), 0, 1);
    const weekNum = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    return `${d.getFullYear()}-W${String(weekNum).padStart(2, '0')}`;
  }

  // Count sessions per week
  const weekCounts = {};
  sessions.forEach(s => {
    const k = isoWeekKey(new Date(s.date));
    weekCounts[k] = (weekCounts[k] || 0) + 1;
  });

  // Get sorted list of all weeks that qualify (>= 3 sessions)
  const qualifyingWeeks = Object.keys(weekCounts)
    .filter(k => weekCounts[k] >= 3)
    .sort();

  if (!qualifyingWeeks.length) return { current: 0, best: 0 };

  // Helper: get the Monday of an ISO week key
  function mondayOfWeek(key) {
    const [year, w] = key.split('-W');
    const jan4 = new Date(parseInt(year), 0, 4); // Jan 4 is always in week 1
    const jan4Day = jan4.getDay() || 7; // make Sunday = 7
    const monday = new Date(jan4.getTime() - (jan4Day - 1) * 86400000);
    monday.setDate(monday.getDate() + (parseInt(w) - 1) * 7);
    return monday;
  }

  // Calculate longest all-time streak
  let best = 1, cur = 1;
  for (let i = 1; i < qualifyingWeeks.length; i++) {
    const prevMon = mondayOfWeek(qualifyingWeeks[i - 1]);
    const curMon  = mondayOfWeek(qualifyingWeeks[i]);
    const weekDiff = Math.round((curMon - prevMon) / (7 * 86400000));
    if (weekDiff === 1) { cur++; if (cur > best) best = cur; }
    else cur = 1;
  }

  // Calculate current streak — count backwards from most recent qualifying week
  const currentWeekKey = isoWeekKey(new Date());
  const currentWeekQualifies = (weekCounts[currentWeekKey] || 0) >= 3;

  // Find the most recent anchor (last qualifying week that is either this week or last week)
  const lastQualifying = qualifyingWeeks[qualifyingWeeks.length - 1];
  const lastMon = mondayOfWeek(lastQualifying);
  const thisMon = mondayOfWeek(currentWeekKey);
  const weeksAgo = Math.round((thisMon - lastMon) / (7 * 86400000));

  // If most recent qualifying week is more than 1 week ago, streak is broken
  if (weeksAgo > 1) return { current: 0, best };

  // Count backwards from the end of the qualifying list
  let currentStreak = 1;
  for (let i = qualifyingWeeks.length - 1; i > 0; i--) {
    const prevMon = mondayOfWeek(qualifyingWeeks[i - 1]);
    const curMon  = mondayOfWeek(qualifyingWeeks[i]);
    const diff = Math.round((curMon - prevMon) / (7 * 86400000));
    if (diff === 1) currentStreak++;
    else break;
  }

  return { current: currentStreak, best };
}

// ── build period lists ────────────────────────────────────────────────────────
function buildPeriods(mode) {
  // mode: 'monthly' | 'yearly'
  const map = {};
  sessions.forEach(s => {
    const d = new Date(s.date);
    const key = mode === 'monthly'
      ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`
      : `${d.getFullYear()}`;
    if (!map[key]) map[key] = [];
    map[key].push(s);
  });
  return Object.keys(map).sort().reverse().map(k => ({ key: k, sessions: map[k] }));
}

// ── render tab bar ────────────────────────────────────────────────────────────
function renderStatsTabs() {
  const tabs = [
    { id: 'overview', label: 'Overview' },
    { id: 'monthly',  label: 'Monthly' },
    { id: 'yearly',   label: 'Yearly' },
    { id: 'bests',    label: 'Bests' },
    { id: 'profile',  label: 'Profile' },
  ];
  document.getElementById('stats-tabs').innerHTML = tabs.map(t =>
    `<button class="stats-tab${statsTab===t.id?' active':''}" onclick="switchStatsTab('${t.id}')">${t.label}</button>`
  ).join('');
}

function switchStatsTab(tab) {
  statsTab = tab;
  statsPeriodIdx = 0;
  renderStatsTabs();
  renderStatsBody();
}

// ── main render dispatcher ────────────────────────────────────────────────────
function renderBestsScreen() { renderStatsScreen(); }

function renderStatsScreen() {
  renderStatsTabs();
  renderStatsBody();
}

function renderStatsBody() {
  const body = document.getElementById('bests-body');
  if (statsTab === 'overview') body.innerHTML = buildOverviewHTML();
  else if (statsTab === 'monthly') body.innerHTML = buildPeriodHTML('monthly');
  else if (statsTab === 'yearly')  body.innerHTML = buildPeriodHTML('yearly');
  else if (statsTab === 'profile') body.innerHTML = buildProfileHTML();
  else body.innerHTML = buildBestsHTML();
}
