// ── PERSONAL BESTS ───────────────────────────────────────────────────────────
function buildBestsHTML() {
  const pbs = computePBs();
  const exNames = Object.keys(pbs);

  if (!exNames.length) return `<div class="pb-empty">No personal bests yet.<br>Start logging sets and weights and they'll appear here.</div>`;

  const byType = { push: [], pull: [], legs: [] };
  exNames.forEach(name => {
    const pb = pbs[name];
    const v = VARIATIONS[pb.variationKey];
    if (v && byType[v.type]) byType[v.type].push({ name, pb, type: v.type });
  });
  const ungrouped = exNames.filter(name => {
    const v = VARIATIONS[pbs[name].variationKey];
    return !v || !byType[v.type];
  }).map(name => ({ name, pb: pbs[name], type: 'core' }));

  let html = '<div style="height:14px"></div>';

  const groups = [
    { key:'push', label:'Push', color: TYPE_COLOR.push, bg: TYPE_BG.push, text:'var(--push-text)' },
    { key:'pull', label:'Pull', color: TYPE_COLOR.pull, bg: TYPE_BG.pull, text:'var(--pull-text)' },
    { key:'legs', label:'Legs', color: TYPE_COLOR.legs, bg: TYPE_BG.legs, text:'var(--legs-text)' },
  ];
  if (ungrouped.length) groups.push({ key:'core', label:'Core', color:'var(--core)', bg:'var(--core-bg)', text:'var(--core-text)' });

  groups.forEach(g => {
    const items = g.key === 'core' ? ungrouped : byType[g.key];
    if (!items || !items.length) return;
    html += `<div class="section-label" style="color:${g.color}">${g.label} Exercises</div>`;
    items.forEach(({ name, pb }) => {
      const hasWeight = pb.weight > 0;
      const hasReps = pb.reps > 0;
      if (!hasWeight && !hasReps) return;
      html += `<div class="pb-exercise-card">
        <div class="pb-ex-header">
          <div class="pb-ex-name">${name}</div>
          <div class="pb-ex-tag" style="color:${g.color}">${g.label}</div>
        </div>
        <div class="pb-records">`;
      if (hasWeight) {
        const d = pb.weightDate ? new Date(pb.weightDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
        html += `<div class="pb-record"><div class="pb-record-label">Max weight</div><div class="pb-record-value" style="color:${g.color}">${pb.weight}</div><div class="pb-record-unit">lbs</div><div class="pb-record-date">${d}</div></div>`;
      }
      if (hasReps) {
        const d = pb.repsDate ? new Date(pb.repsDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
        const atW = pb.repsWeight > 0 ? ` @ ${pb.repsWeight}` : '';
        html += `<div class="pb-record"><div class="pb-record-label">Max reps</div><div class="pb-record-value" style="color:${g.color}">${pb.reps}</div><div class="pb-record-unit">reps${atW ? ` ${atW} lbs` : ''}</div><div class="pb-record-date">${d}</div></div>`;
      }
      if (!hasWeight && hasReps) html += `<div class="pb-record" style="opacity:0.2"><div class="pb-record-label">Max weight</div><div class="pb-record-value">—</div></div>`;
      if (hasWeight && !hasReps)  html += `<div class="pb-record" style="opacity:0.2"><div class="pb-record-label">Max reps</div><div class="pb-record-value">—</div></div>`;
      html += `</div></div>`;
    });
  });

  // ── Activity bests — auto-generated from PREDEFINED_ACTIVITIES ──────────
  // Any activity with supportsDuration or supportsDistance appears here
  // automatically. No manual additions needed — just set the flags on the
  // activity in PREDEFINED_ACTIVITIES and it will show up.

  // Group activities by name prefix (e.g. all "Taekwondo (...)" together)
  const activityGroups = {};
  PREDEFINED_ACTIVITIES.forEach(act => {
    if (!act.supportsDuration && !act.supportsDistance) return;
    const records = computeActivityBests(act.name);
    if (!records) return; // no sessions logged yet
    // Derive group label from prefix before first '(' or use the full name
    const groupLabel = act.name.includes('(')
      ? act.name.split('(')[0].trim()
      : act.name;
    if (!activityGroups[groupLabel]) activityGroups[groupLabel] = [];
    activityGroups[groupLabel].push({ act, records });
  });

  Object.entries(activityGroups).forEach(([groupLabel, items]) => {
    // Pick a color for the group header based on the first activity's category
    const firstCat = items[0].act.category;
    const groupColor = firstCat === 'cardio' ? 'var(--end)'
      : firstCat === 'core' ? 'var(--core)'
      : 'var(--agi)';

    html += `<div class="section-label" style="color:${groupColor}">${groupLabel}</div>`;

    items.forEach(({ act, records }) => {
      // Card color based on attribute mapping
      const attrMap = ACTIVITY_ATTR_MAP[act.name];
      const primaryAttr = attrMap ? attrMap.primary[0] : 'end';
      const cardColor = ATTRS[primaryAttr] ? ATTRS[primaryAttr].color : groupColor;
      const cardBg    = ATTRS[primaryAttr] ? ATTRS[primaryAttr].bg    : 'var(--surface)';
      const cardText  = ATTRS[primaryAttr] ? ATTRS[primaryAttr].text  : 'var(--text)';

      // Display name — strip the group prefix for cleaner sub-cards
      const displayName = items.length > 1 && act.name.includes('(')
        ? act.name.match(/\(([^)]+)\)/)?.[1] || act.name
        : act.name;

      html += buildActivityPBCard(displayName, cardColor, cardBg, cardText, records);
    });
  });

  html += `<div style="height:20px"></div>`;
  return html;
}

// ── Helpers for activity PB records ───────────────────────────────────────
function computeActivityBests(activityName) {
  const actSessions = sessions.filter(s =>
    s.variationKey === CUSTOM_KEY && s.customName === activityName
  );
  if (!actSessions.length) return null;

  let bestDuration = 0, bestDurationDate = null;
  let bestDist = 0, bestDistDate = null;
  let bestPaceVal = Infinity, bestPaceStr = null, bestPaceDate = null;

  actSessions.forEach(s => {
    const dur = parseFloat(s.duration) || 0;
    const dist = parseFloat(s.distance) || 0;
    if (dur > bestDuration) { bestDuration = dur; bestDurationDate = s.date; }
    if (dist > bestDist) { bestDist = dist; bestDistDate = s.date; }
    if (dist > 0 && dur > 0) {
      const pace = dur / dist;
      if (pace < bestPaceVal) {
        bestPaceVal = pace;
        const m = Math.floor(pace), sec = Math.round((pace - m) * 60);
        bestPaceStr = `${m}:${String(sec).padStart(2,'0')}`;
        bestPaceDate = s.date;
      }
    }
  });

  return {
    totalSessions: actSessions.length,
    lastSession: actSessions[actSessions.length - 1],
    bestDuration: bestDuration > 0 ? { value: bestDuration, date: bestDurationDate } : null,
    bestDistance: bestDist > 0 ? { value: bestDist, date: bestDistDate } : null,
    bestPace: bestPaceStr ? { str: bestPaceStr, date: bestPaceDate } : null,
  };
}

function buildActivityPBCard(name, color, bg, text, records) {
  const fmtDate = d => d ? new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
  let html = `<div class="pb-exercise-card">
    <div class="pb-ex-header">
      <div class="pb-ex-name">${name}</div>
      <div class="pb-ex-tag" style="color:${color}">${records.totalSessions} session${records.totalSessions!==1?'s':''}</div>
    </div>
    <div class="pb-records">`;

  if (records.bestDuration) {
    html += `<div class="pb-record">
      <div class="pb-record-label">Best duration</div>
      <div class="pb-record-value" style="color:${color}">${records.bestDuration.value}</div>
      <div class="pb-record-unit">min</div>
      <div class="pb-record-date">${fmtDate(records.bestDuration.date)}</div>
    </div>`;
  }
  if (records.bestDistance) {
    html += `<div class="pb-record">
      <div class="pb-record-label">Best distance</div>
      <div class="pb-record-value" style="color:${color}">${records.bestDistance.value.toFixed(2)}</div>
      <div class="pb-record-unit">miles</div>
      <div class="pb-record-date">${fmtDate(records.bestDistance.date)}</div>
    </div>`;
  }
  if (records.bestPace) {
    html += `<div class="pb-record">
      <div class="pb-record-label">Best pace</div>
      <div class="pb-record-value" style="color:${color};font-size:16px">${records.bestPace.str}</div>
      <div class="pb-record-unit">min / mile</div>
      <div class="pb-record-date">${fmtDate(records.bestPace.date)}</div>
    </div>`;
  }

  html += `</div></div>`;
  return html;
}

function exportData() {
  const payload = {
    version: 3,
    exportDate: new Date().toISOString(),
    sessions,
    pbs: computePBs(),
    profile: loadProfile()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `ppl_workout_backup_${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup saved to Downloads ✓');
  renderDataScreen();
}

function triggerImport() {
  document.getElementById('import-file-input').click();
}

function handleImportFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      const imported = data.sessions || (Array.isArray(data) ? data : []);
      if (!imported.length) { showToast('No sessions found in file'); return; }

      // Merge sessions by ID — keep both, deduplicate
      const existingIds = new Set(sessions.map(s => String(s.id)));
      let added = 0;
      imported.forEach(s => {
        if (!existingIds.has(String(s.id))) {
          sessions.push(s);
          added++;
        }
      });
      sessions.sort((a, b) => new Date(a.date) - new Date(b.date));
      localStorage.setItem('ppl_sessions', JSON.stringify(sessions));

      // Restore profile if present in backup (only if current profile is default/empty)
      if (data.profile && typeof data.profile === 'object') {
        const current = loadProfile();
        // Only overwrite if no custom name has been set on this device yet
        const isDefault = !current.name || current.name === 'Athlete';
        if (isDefault) {
          saveProfile(data.profile);
          showToast(`Imported ${added} session${added !== 1 ? 's' : ''} + profile ✓`);
        } else {
          showToast(`Imported ${added} new session${added !== 1 ? 's' : ''} ✓ (profile kept)`);
        }
      } else {
        showToast(`Imported ${added} new session${added !== 1 ? 's' : ''} ✓`);
      }

      renderDataScreen();
      renderHome();
    } catch(err) {
      showToast('Could not read file — is it a valid backup?');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function confirmClearData() {
  if (confirm('Delete ALL workout data? This cannot be undone.\n\nTap OK to confirm.')) {
    sessions = [];
    localStorage.removeItem('ppl_sessions');
    showToast('All data cleared');
    renderDataScreen();
    renderHome();
  }
}

function editSetField(exIdx, setIdx, field, value) {
  if (!editingSession) return;
  editingSession.exercises[exIdx].sets[setIdx][field] = value;
}

function editAddSet(exIdx) {
  if (!editingSession) return;
  editingSession.exercises[exIdx].sets.push({ reps: '', weight: '' });
  renderEditSession();
}

function editDeleteSet(exIdx, setIdx) {
  if (!editingSession) return;
  const ex = editingSession.exercises[exIdx];
  if (ex.sets.length <= 1) {
    // Remove whole exercise if last set deleted
    editingSession.exercises.splice(exIdx, 1);
  } else {
    ex.sets.splice(setIdx, 1);
  }
  renderEditSession();
}

function editRemoveExercise(exIdx) {
  if (!editingSession) return;
  editingSession.exercises.splice(exIdx, 1);
  renderEditSession();
}

function editImportWorkout(key) {
  if (!editingSession) return;
  const v = VARIATIONS[key];
  const allEx = [...v.exercises, ...v.core];
  const existingNames = new Set(editingSession.exercises.map(e => e.name));
  let added = 0;
  allEx.forEach((ex, i) => {
    if (!existingNames.has(ex.name)) {
      editingSession.exercises.push({
        key: key + '_' + i,
        name: ex.name,
        sets: [{ reps: '', weight: '' }]
      });
      added++;
    }
  });
  editWorkoutPickerOpen = false;
  renderEditSession();
  showToast(`Added ${added} exercise${added !== 1 ? 's' : ''} from ${v.label}`);
}

function editImportCore(key) {
  if (!editingSession) return;
  const v = VARIATIONS[key];
  const existingNames = new Set(editingSession.exercises.map(e => e.name));
  let added = 0;
  v.core.forEach((ex, i) => {
    if (!existingNames.has(ex.name)) {
      editingSession.exercises.push({
        key: key + '_core_' + i,
        name: ex.name,
        sets: [{ reps: '', weight: '' }]
      });
      added++;
    }
  });
  editWorkoutPickerOpen = false;
  renderEditSession();
  const typeLabel = v.type.charAt(0).toUpperCase() + v.type.slice(1);
  showToast(`Added ${added} core exercise${added !== 1 ? 's' : ''} (${typeLabel})`);
}

function filterExPicker(q) {
  renderExPickerList(q || '');
}

function renderExPickerList(q) {
  const list = document.getElementById('ex-picker-list');
  if (!list) return;

  // Build sorted grouped list from all variations
  const seen = new Set();
  const groups = { push: [], pull: [], legs: [], core: [] };
  const groupLabels = { push: 'Push', pull: 'Pull', legs: 'Legs', core: 'Core' };
  const groupColors = {
    push: TYPE_COLOR.push, pull: TYPE_COLOR.pull,
    legs: TYPE_COLOR.legs, core: 'var(--core)'
  };

  ORDER.forEach(key => {
    const v = VARIATIONS[key];
    [...v.exercises, ...v.core].forEach((ex, i) => {
      if (seen.has(ex.name)) return;
      seen.add(ex.name);
      const type = i < v.exercises.length ? v.type : 'core';
      groups[type].push(ex.name);
    });
  });

  // Sort each group alphabetically
  Object.keys(groups).forEach(k => groups[k].sort());

  const lq = q.toLowerCase().trim();
  let html = '';
  let totalVisible = 0;

  ['push', 'pull', 'legs', 'core'].forEach(type => {
    const items = lq
      ? groups[type].filter(n => n.toLowerCase().includes(lq))
      : groups[type];
    if (!items.length) return;
    html += `<div class="ex-picker-group" style="color:${groupColors[type]}">${groupLabels[type]}</div>`;
    items.forEach(name => {
      html += `<button class="ex-picker-item" onclick="editAddExercise('${name.replace(/'/g,"\\'")}')">
        ${name}
      </button>`;
    });
    totalVisible += items.length;
  });

  if (!totalVisible) {
    html = `<div class="ex-picker-empty">No exercises match "${q}"</div>`;
  }

  list.innerHTML = html;
}

function editAddExercise(name) {
  if (!name || !editingSession) return;
  editingSession.exercises.push({
    key: 'edit_' + Date.now(),
    name: name.trim(),
    sets: [{ reps: '', weight: '' }]
  });
  exPickerOpen = false;
  renderEditSession();
}

function saveEditSession() {
  if (!editingSession) return;
  const idx = sessions.findIndex(s => String(s.id) === String(editingSession.id));
  if (idx === -1) { showToast('Session not found'); return; }
  sessions[idx] = editingSession;
  saveSessions();
  showToast('Session updated ✓');
  const saved = editingSession;
  editingSession = null;
  exPickerOpen = false;
  editWorkoutPickerOpen = false;
  const editBtn = document.getElementById('detail-edit-btn');
  if (editBtn) editBtn.style.display = '';
  renderSessionDetail(sessions[idx]);
}

function cancelEditSession() {
  if (!editingSession) return;
  const id = editingSession.id;
  editingSession = null;
  exPickerOpen = false;
  editWorkoutPickerOpen = false;
  const editBtn = document.getElementById('detail-edit-btn');
  if (editBtn) editBtn.style.display = '';
  const s = sessions.find(s => String(s.id) === String(id));
  if (s) renderSessionDetail(s);
}

// Build a flat array of every unique exercise across all variations
function buildGlossary() {
  const seen = new Set();
  const items = [];

  const groups = [
    { type: 'push', color: TYPE_COLOR.push, textColor: 'var(--push-text)', label: 'Push' },
    { type: 'pull', color: TYPE_COLOR.pull, textColor: 'var(--pull-text)', label: 'Pull' },
    { type: 'legs', color: TYPE_COLOR.legs, textColor: 'var(--legs-text)', label: 'Legs' },
    { type: 'core', color: 'var(--core)', textColor: 'var(--core-text)', label: 'Core' },
  ];

  // Gather main exercises per type, deduplicated by name
  groups.forEach(g => {
    ORDER.forEach(key => {
      const v = VARIATIONS[key];
      if (v.type !== g.type && g.type !== 'core') return;
      const exList = g.type === 'core' ? v.core : v.exercises;
      exList.forEach(ex => {
        if (seen.has(ex.name)) return;
        seen.add(ex.name);
        const appearsIn = [];
        ORDER.forEach(k => {
          const vv = VARIATIONS[k];
          const combined = [...vv.exercises, ...vv.core];
          if (combined.find(e => e.name === ex.name)) appearsIn.push(vv.label);
        });
        items.push({ name: ex.name, desc: ex.desc, type: g.type, typeLabel: g.label, color: g.color, textColor: g.textColor, appearsIn });
      });
    });
    // Also include any exercises unique to standalone core sessions
    if (g.type === 'core') {
      CORE_ORDER.forEach(key => {
        const v = VARIATIONS[key];
        v.exercises.forEach(ex => {
          if (seen.has(ex.name)) return;
          seen.add(ex.name);
          items.push({ name: ex.name, desc: ex.desc, type: 'core', typeLabel: 'Core', color: g.color, textColor: g.textColor, appearsIn: [v.label] });
        });
      });
    }
  });

  // Add predefined activities as a group
  const activityGroup = { type: 'activity', label: 'Activities', items: [] };
  PREDEFINED_ACTIVITIES.forEach(act => {
    if (seen.has(act.name)) return;
    seen.add(act.name);
    items.push({
      name: act.name,
      desc: act.desc,
      type: act.category === 'cardio' ? 'cardio' : 'general',
      typeLabel: act.category === 'cardio' ? 'Cardio' : 'General',
      color: act.category === 'cardio' ? 'var(--cardio)' : 'var(--general)',
      textColor: act.category === 'cardio' ? 'var(--cardio-text)' : 'var(--general-text)',
      appearsIn: [],
      isActivity: true,
      supportsDistance: !!act.supportsDistance,
    });
  });

  return items.sort((a, b) => a.name.localeCompare(b.name));
}

  document.getElementById('screen-glossary').classList.add('active');

function renderGlossary(query) {
  const body = document.getElementById('glossary-body');
  const pbs = computePBs();
  const allItems = buildGlossary();
  const q = (query || '').trim().toLowerCase();

  const filtered = q
    ? allItems.filter(item => item.name.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q))
    : allItems;

  if (!filtered.length) {
    body.innerHTML = `<div class="glossary-empty">No exercises match "${query}".</div>`;
    return;
  }

  // Group by type when not searching; flat list when searching
  const renderCard = (item, idx) => {
    const pb = pbs[item.name] || null;
    const { lastSession } = getExerciseHistory(item.name);
    const cardId = item.name.replace(/[^a-z0-9]/gi, '_');

    let statsHtml = '';
    const hasHistory = pb || lastSession;

    if (item.isActivity && item.supportsDistance) {
      // Running-specific stats based on custom sessions with this activity name
      const runningSessions = sessions.filter(s =>
        s.variationKey === CUSTOM_KEY && s.customName === item.name
      );
      if (!runningSessions.length) {
        statsHtml = `<div class="glossary-first-pill">★ Never logged yet — lace up!</div>`;
      } else {
        const lastRun = runningSessions[runningSessions.length - 1];
        const bDist = bestDistance(runningSessions);
        const bPace = bestPace(runningSessions);
        let rows = '';
        const lastDate = new Date(lastRun.date).toLocaleDateString('en-US', {month:'short', day:'numeric'});
        const d = lastRun.distance ? `${parseFloat(lastRun.distance).toFixed(2)} mi` : '';
        const t = lastRun.duration ? `${lastRun.duration} min` : '';
        rows += `<div class="glossary-stat-row">
          <div class="glossary-stat-label">Last (${lastDate})</div>
          <div class="glossary-stat-value">${[d,t].filter(Boolean).join(' · ') || '—'}</div>
        </div>`;
        if (bDist) {
          rows += `<div class="glossary-stat-row">
            <div class="glossary-stat-label">Best dist</div>
            <div class="glossary-stat-value"><strong>${bDist.dist.toFixed(2)} mi</strong> · ${new Date(bDist.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'})}</div>
          </div>`;
        }
        if (bPace) {
          rows += `<div class="glossary-stat-row">
            <div class="glossary-stat-label">Best pace</div>
            <div class="glossary-stat-value"><strong>${bPace.paceStr} /mi</strong> · ${new Date(bPace.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'})}</div>
          </div>`;
        }
        if (rows) statsHtml = `<div class="glossary-stats">${rows}</div>`;
      }
    } else if (!hasHistory) {
      statsHtml = `<div class="glossary-first-pill">★ Never logged — start light, focus on form</div>`;
    } else {
      let rows = '';
      if (lastSession) {
        const lastDate = new Date(lastSession.date).toLocaleDateString('en-US', {month:'short', day:'numeric'});
        let setPreview;
        if (lastSession.isActivity) {
          const parts = [];
          if (lastSession.duration) parts.push(`${lastSession.duration} min`);
          if (lastSession.distance) parts.push(`${parseFloat(lastSession.distance).toFixed(2)} mi`);
          setPreview = parts.join(', ') || 'logged';
        } else {
          setPreview = lastSession.sets.slice(0, 3).map(st => {
            const w = st.weight && parseFloat(st.weight) > 0 ? ` × ${st.weight}lbs` : '';
            return `${st.reps}${w}`;
          }).join(', ');
        }
        rows += `<div class="glossary-stat-row">
          <div class="glossary-stat-label">Last (${lastDate})</div>
          <div class="glossary-stat-value">${setPreview}${!lastSession.isActivity && lastSession.sets.length > 3 ? '…' : ''}</div>
        </div>`;
      }
      if (pb && pb.weight > 0) {
        const d = pb.weightDate ? new Date(pb.weightDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'}) : '';
        rows += `<div class="glossary-stat-row">
          <div class="glossary-stat-label">Best weight</div>
          <div class="glossary-stat-value"><strong>${pb.weight} lbs</strong>${d ? ` · ${d}` : ''}</div>
        </div>`;
      }
      if (pb && pb.reps > 0) {
        const d = pb.repsDate ? new Date(pb.repsDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'}) : '';
        const atW = pb.repsWeight > 0 ? ` @ ${pb.repsWeight} lbs` : '';
        rows += `<div class="glossary-stat-row">
          <div class="glossary-stat-label">Best reps</div>
          <div class="glossary-stat-value"><strong>${pb.reps} reps${atW}</strong>${d ? ` · ${d}` : ''}</div>
        </div>`;
      }
      if (rows) statsHtml = `<div class="glossary-stats">${rows}</div>`;
    }

    const tagLine = item.appearsIn.length
      ? item.appearsIn.slice(0, 4).join(', ') + (item.appearsIn.length > 4 ? '…' : '')
      : item.typeLabel;

    return `<div class="glossary-card" id="gcard-${cardId}">
      <button class="glossary-card-header" onclick="toggleGlossaryCard('${cardId}')">
        <div class="glossary-card-left">
          <div class="glossary-ex-name">${item.name}</div>
          <div class="glossary-ex-tag" style="color:${item.color}">${tagLine}</div>
        </div>
        <span class="glossary-chevron">⌄</span>
      </button>
      <div class="glossary-detail">
        <div class="glossary-desc">${item.desc}</div>
        ${statsHtml}
      </div>
    </div>`;
  };

  let html = '';

  if (q) {
    // Flat list when searching
    html += `<div style="padding:6px 18px 2px;font-size:11px;color:var(--text-dim)">${filtered.length} result${filtered.length !== 1 ? 's' : ''}</div>`;
    html += filtered.map((item, i) => renderCard(item, i)).join('');
  } else {
    // Grouped by type
    const typeOrder = ['push', 'pull', 'legs', 'core'];
    const typeLabels = { push: 'Push', pull: 'Pull', legs: 'Legs', core: 'Core' };
    const typeColors = { push: TYPE_COLOR.push, pull: TYPE_COLOR.pull, legs: TYPE_COLOR.legs, core: 'var(--core)' };
    typeOrder.forEach(type => {
      const group = filtered.filter(item => item.type === type && !item.isActivity);
      if (!group.length) return;
      html += `<div class="glossary-group-label" style="color:${typeColors[type]}">${typeLabels[type]} exercises</div>`;
      html += group.map((item, i) => renderCard(item, i)).join('');
    });
    const actItems = filtered.filter(item => item.isActivity);
    if (actItems.length) {
      html += `<div class="glossary-group-label" style="color:var(--cardio)">Activities</div>`;
      html += actItems.map((item, i) => renderCard(item, i)).join('');
    }
  }

  html += '<div style="height:16px"></div>';
  body.innerHTML = html;
}

// ── Profile persistence ────────────────────────────────────────────────────
const PROFILE_KEY = 'ppl_profile';
function loadProfile() {
  try { return JSON.parse(localStorage.getItem(PROFILE_KEY) || '{}'); } catch { return {}; }
}
function saveProfile(p) { localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); }
function getProfile() {
  const p = loadProfile();
  return {
    name: p.name || 'Athlete',
    photo: p.photo || null,
    equippedTitle: p.equippedTitle || 'Newcomer',
    ...p
  };
}

// ── Leveling curve: XP needed to reach level N from level N-1 ─────────────
function xpForLevel(level) { return Math.round(1000 * Math.pow(level, 1.4)); }
function totalXpForLevel(level) {
  let t = 0; for (let i = 1; i < level; i++) t += xpForLevel(i); return t;
}
function levelFromXP(xp) {
  let lvl = 1;
  while (xp >= xpForLevel(lvl)) { xp -= xpForLevel(lvl); lvl++; }
  return { level: lvl, xpIntoLevel: xp, xpNeeded: xpForLevel(lvl) };
}

  'Taekwondo (Sparring)':            { primary:['agi'], minor:['end','dex'] },
  'Taekwondo (Small Target Training)': { primary:['dex'], minor:['agi'] },
  'Taekwondo (Partner Drills)':      { primary:['dex'], minor:['agi'] },
  'Taekwondo (Fitness)':             { primary:['end'], minor:['agi'] },
  'Taekwondo (General)':             { primary:['agi'], minor:['end','dex'] },
  'Running':                         { primary:['end'], minor:['agi'] },
  'General Core Workout':            { primary:['str'], minor:['end'] },
};

function getSessionAttrMap(s) {
  if (s.variationKey === CUSTOM_KEY && s.customName && ACTIVITY_ATTR_MAP[s.customName]) {
    return ACTIVITY_ATTR_MAP[s.customName];
  }
  const vm = getVariationMeta(s.variationKey, s.customName, s.category);
  return SESSION_ATTR_MAP[vm.type] || SESSION_ATTR_MAP.general;
}

// ── XP calculation for a single session ───────────────────────────────────
function calcSessionXP(s, priorSessions, priorPBs) {
  const map = getSessionAttrMap(s);
  const breakdown = { base: 0, duration: 0, volume: 0, reps: 0, pr: 0, aboveAvg: 0, total: 0 };
  const attrGains = { str: 0, end: 0, agi: 0, dex: 0 };

  const distribute = (xp, primary, minor) => {
    primary.forEach(a => { attrGains[a] = (attrGains[a]||0) + xp; });
    minor.forEach(a => { attrGains[a] = (attrGains[a]||0) + Math.round(xp * 0.5); });
  };

  // ── Daily base XP cap — showing up only earns 100 XP once per calendar day ─
  const BASE = 100;
  const sessionDay = new Date(s.date).toDateString();
  const alreadyEarnedBase = priorSessions.some(ps =>
    new Date(ps.date).toDateString() === sessionDay
  );
  if (!alreadyEarnedBase) {
    breakdown.base = BASE;
    distribute(BASE, map.primary, map.minor || []);
  }

  // ── Duration bonus — tiered by activity type ─────────────────────────────
  // Taekwondo: +10/min | Running & General Core: +8/min | Other cardio/general: +6/min | Strength/core: +5/min
  const dur = parseFloat(s.duration) || 0;
  if (dur > 0) {
    const name = s.customName || '';
    let rate = 5; // default for Push/Pull/Legs/Core sessions
    if (name.startsWith('Taekwondo')) {
      rate = 10;
    } else if (name === 'Running' || name === 'General Core Workout') {
      rate = 8;
    } else if (s.variationKey === CUSTOM_KEY) {
      // Other custom activities (cardio or general)
      const vm = getVariationMeta(s.variationKey, s.customName, s.category);
      if (vm.type === 'cardio' || vm.type === 'general') rate = 6;
    }
    const dBonus = Math.round(dur * rate);
    breakdown.duration = dBonus;
    distribute(dBonus, map.primary, map.minor || []);
  }

  // ── Reps bonus: +1 XP per rep logged ─────────────────────────────────────
  const totalReps = s.exercises.reduce((acc, e) =>
    acc + e.sets.reduce((a, st) => a + (parseFloat(st.reps)||0), 0), 0);
  if (totalReps > 0) {
    breakdown.reps = totalReps;
    distribute(totalReps, map.primary, map.minor || []);
  }

  // ── Volume bonus: +1 XP per 100 lbs ──────────────────────────────────────
  const vol = s.exercises.reduce((acc, e) =>
    acc + e.sets.reduce((a, st) => a + ((parseFloat(st.reps)||0) * (parseFloat(st.weight)||0)), 0), 0);
  if (vol > 0) {
    const vBonus = Math.round(vol / 100);
    breakdown.volume = vBonus;
    distribute(vBonus, map.primary, map.minor || []);
  }

  // ── Distance bonus: +5 XP per mile ───────────────────────────────────────
  const dist = parseFloat(s.distance) || 0;
  if (dist > 0) {
    const distBonus = Math.round(dist * 5);
    breakdown.volume += distBonus;
    distribute(distBonus, map.primary, map.minor || []);
  }

  // ── Above-average bonuses (require ≥3 prior sessions to activate) ─────────
  const ABOVE_AVG_MIN = 3;

  const priorWithDur = priorSessions.filter(ps => parseFloat(ps.duration) > 0);
  const avgDur = priorWithDur.length >= ABOVE_AVG_MIN
    ? priorWithDur.reduce((a, ps) => a + parseFloat(ps.duration), 0) / priorWithDur.length : null;

  const vm = getVariationMeta(s.variationKey, s.customName, s.category);
  const priorSameType = priorSessions.filter(ps =>
    getVariationMeta(ps.variationKey, ps.customName, ps.category).type === vm.type);
  const priorVols = priorSameType.map(ps =>
    ps.exercises.reduce((acc, e) =>
      acc + e.sets.reduce((a, st) => a + ((parseFloat(st.reps)||0)*(parseFloat(st.weight)||0)), 0), 0)
  ).filter(v => v > 0);
  const avgVol = priorVols.length >= ABOVE_AVG_MIN
    ? priorVols.reduce((a,b)=>a+b,0)/priorVols.length : null;

  const priorWithDist = priorSessions.filter(ps => parseFloat(ps.distance) > 0);
  const avgDist = priorWithDist.length >= ABOVE_AVG_MIN
    ? priorWithDist.reduce((a, ps) => a + parseFloat(ps.distance), 0) / priorWithDist.length : null;

  const priorWPRs = priorSameType.map(ps => sessionWeightPerRep(ps)).filter(v => v > 0);
  const avgWPR = priorWPRs.length >= ABOVE_AVG_MIN
    ? priorWPRs.reduce((a,b)=>a+b,0)/priorWPRs.length : null;
  const thisWPR = sessionWeightPerRep(s);

  if (avgDur !== null && dur > avgDur)         breakdown.aboveAvg += 50;
  if (avgVol !== null && vol > avgVol)         breakdown.aboveAvg += 50;
  if (avgDist !== null && dist > avgDist)      breakdown.aboveAvg += 50;
  if (avgWPR !== null && thisWPR > avgWPR)     breakdown.aboveAvg += 50;

  if (breakdown.aboveAvg > 0) {
    distribute(breakdown.aboveAvg, map.primary, map.minor || []);
  }

  // ── PR bonus: +150 XP per new PB ─────────────────────────────────────────
  const currentPBs = priorPBs || {};
  let prCount = 0;
  s.exercises.forEach(ex => {
    const prev = currentPBs[ex.name] || { weight: 0, reps: 0 };
    ex.sets.forEach(st => {
      const w = parseFloat(st.weight)||0, r = parseFloat(st.reps)||0;
      if (w > prev.weight || r > prev.reps) prCount++;
    });
  });
  if (prCount > 0) {
    const prBonus = prCount * 150;
    breakdown.pr = prBonus;
    distribute(prBonus, map.primary, map.minor || []);
  }

  breakdown.total = Object.values(attrGains).reduce((a,b)=>a+b,0);
  return { breakdown, attrGains };
}

// ── Exercise mastery ───────────────────────────────────────────────────────
const MASTERY_VOLUME_PER_FILL = 500; // lbs

function computeMastery(sessionList) {
  // Per exercise: { totalVolume, fills, currentBar (0-1), xpBonus }
  const mastery = {};
  sessionList.forEach(s => {
    s.exercises.forEach(ex => {
      if (!ex.name) return;
      if (!mastery[ex.name]) mastery[ex.name] = { totalVolume: 0, fills: 0, barProgress: 0 };
      const vol = ex.sets.reduce((acc, st) => acc + ((parseFloat(st.reps)||0) * (parseFloat(st.weight)||0)), 0);
      mastery[ex.name].totalVolume += vol;
    });
  });
  // Compute fills and bar progress
  Object.keys(mastery).forEach(name => {
    const m = mastery[name];
    m.fills = Math.floor(m.totalVolume / MASTERY_VOLUME_PER_FILL);
    m.barProgress = (m.totalVolume % MASTERY_VOLUME_PER_FILL) / MASTERY_VOLUME_PER_FILL;
  });
  return mastery;
}

// ── Aggregate XP across all sessions ──────────────────────────────────────
function computeAllXP(sessionList) {
  const totalAttrXP = { str: 0, end: 0, agi: 0, dex: 0 };
  let runningPBs = {};
  sessionList.forEach((s, idx) => {
    const priorSessions = sessionList.slice(0, idx);
    const { attrGains } = calcSessionXP(s, priorSessions, runningPBs);
    Object.keys(attrGains).forEach(a => { totalAttrXP[a] = (totalAttrXP[a]||0) + attrGains[a]; });
    // Update running PBs
    s.exercises.forEach(ex => {
      if (!runningPBs[ex.name]) runningPBs[ex.name] = { weight:0, reps:0 };
      ex.sets.forEach(st => {
        const w = parseFloat(st.weight)||0, r = parseFloat(st.reps)||0;
        if (w > runningPBs[ex.name].weight) runningPBs[ex.name].weight = w;
        if (r > runningPBs[ex.name].reps) runningPBs[ex.name].reps = r;
      });
    });
  });
  // Mastery XP bonus: +50 per fill per exercise
  const mastery = computeMastery(sessionList);
  Object.values(mastery).forEach(m => { totalAttrXP.str = (totalAttrXP.str||0) + m.fills * 50; });
  return { totalAttrXP, mastery };
}

// ── Character level from sum of all attr XP ────────────────────────────────
function computeCharLevel(totalAttrXP) {
  const total = Object.values(totalAttrXP).reduce((a,b)=>a+b, 0);
  return { charXP: total, ...levelFromXP(total) };
}

// ── Achievement helper functions ───────────────────────────────────────────
function weeksWith3Plus(sessionList) {
  const wc = {};
  sessionList.forEach(s => {
    const d = new Date(s.date); const day = d.getDay()||7;
    const mon = new Date(d); mon.setDate(d.getDate()-(day-1));
    const k = mon.toISOString().slice(0,10);
    wc[k] = (wc[k]||0) + 1;
  });
  return Object.values(wc).filter(v => v >= 3).length;
}
function maxRunDist(sessionList) {
  return Math.max(0, ...sessionList.map(s => parseFloat(s.distance)||0));
}
function runSessionsOver(sessionList, dist) {
  return sessionList.filter(s => (parseFloat(s.distance)||0) >= dist).length;
}
function tkdCount(sessionList) {
  return sessionList.filter(s => s.customName && s.customName.startsWith('Taekwondo')).length;
}
function tkdTypeCount(sessionList, type) {
  return sessionList.filter(s => s.customName && s.customName.includes(type)).length;
}
function hasManyPBsInOneSession(sessionList, n) {
  const pbs = {}; let found = false;
  sessionList.forEach(s => {
    if (found) return;
    let count = 0;
    s.exercises.forEach(ex => {
      const prev = pbs[ex.name] || {weight:0, reps:0};
      ex.sets.forEach(st => {
        if ((parseFloat(st.weight)||0) > prev.weight || (parseFloat(st.reps)||0) > prev.reps) count++;
      });
    });
    if (count >= n) found = true;
    s.exercises.forEach(ex => {
      if (!pbs[ex.name]) pbs[ex.name] = {weight:0, reps:0};
      ex.sets.forEach(st => {
        const w = parseFloat(st.weight)||0, r = parseFloat(st.reps)||0;
        if (w > pbs[ex.name].weight) pbs[ex.name].weight = w;
        if (r > pbs[ex.name].reps) pbs[ex.name].reps = r;
      });
    });
  });
  return found;
}
// Returns average weight per rep across all weighted sets in a session
function sessionWeightPerRep(s) {
  let totalWeight = 0, totalReps = 0;
  s.exercises.forEach(ex => {
    ex.sets.forEach(st => {
      const w = parseFloat(st.weight) || 0;
      const r = parseFloat(st.reps) || 0;
      if (w > 0 && r > 0) { totalWeight += w * r; totalReps += r; }
    });
  });
  return totalReps > 0 ? totalWeight / totalReps : 0;
}

function countAboveAvgSessions(sessionList) {
  // Count sessions where the above-average bonus fired (duration, volume, distance, or weight/rep)
  const MIN = 3;
  let count = 0;
  sessionList.forEach((s, idx) => {
    const prior = sessionList.slice(0, idx);

    // Duration above average
    const priorWithDur = prior.filter(ps => parseFloat(ps.duration) > 0);
    if (priorWithDur.length >= MIN) {
      const avg = priorWithDur.reduce((a, ps) => a + parseFloat(ps.duration), 0) / priorWithDur.length;
      if ((parseFloat(s.duration) || 0) > avg) { count++; return; }
    }

    // Volume above average (same type)
    const vm = getVariationMeta(s.variationKey, s.customName, s.category);
    const priorSameType = prior.filter(ps => getVariationMeta(ps.variationKey, ps.customName, ps.category).type === vm.type);
    const priorVols = priorSameType.map(ps =>
      ps.exercises.reduce((acc, e) => acc + e.sets.reduce((a, st) => a + ((parseFloat(st.reps)||0)*(parseFloat(st.weight)||0)), 0), 0)
    ).filter(v => v > 0);
    if (priorVols.length >= MIN) {
      const avgVol = priorVols.reduce((a, b) => a + b, 0) / priorVols.length;
      const vol = s.exercises.reduce((acc, e) => acc + e.sets.reduce((a, st) => a + ((parseFloat(st.reps)||0)*(parseFloat(st.weight)||0)), 0), 0);
      if (vol > avgVol) { count++; return; }
    }

    // Distance above average
    const priorWithDist = prior.filter(ps => parseFloat(ps.distance) > 0);
    if (priorWithDist.length >= MIN) {
      const avgDist = priorWithDist.reduce((a, ps) => a + parseFloat(ps.distance), 0) / priorWithDist.length;
      if ((parseFloat(s.distance) || 0) > avgDist) { count++; return; }
    }

    // Weight-per-rep above average (same type)
    const priorWPRs = priorSameType.map(ps => sessionWeightPerRep(ps)).filter(v => v > 0);
    if (priorWPRs.length >= MIN) {
      const avgWPR = priorWPRs.reduce((a, b) => a + b, 0) / priorWPRs.length;
      if (sessionWeightPerRep(s) > avgWPR) { count++; return; }
    }
  });
  return count;
}

function countBreakthroughSessions(sessionList, n) {
  const pbs = {}; let count = 0;
  sessionList.forEach(s => {
    let pbsThisSession = 0;
    s.exercises.forEach(ex => {
      const prev = pbs[ex.name] || {weight:0, reps:0};
      ex.sets.forEach(st => {
        if ((parseFloat(st.weight)||0) > prev.weight || (parseFloat(st.reps)||0) > prev.reps) pbsThisSession++;
      });
    });
    if (pbsThisSession >= n) count++;
    s.exercises.forEach(ex => {
      if (!pbs[ex.name]) pbs[ex.name] = {weight:0, reps:0};
      ex.sets.forEach(st => {
        const w = parseFloat(st.weight)||0, r = parseFloat(st.reps)||0;
        if (w > pbs[ex.name].weight) pbs[ex.name].weight = w;
        if (r > pbs[ex.name].reps) pbs[ex.name].reps = r;
      });
    });
  });
  return count;
}
function countAllTimePBEvents(sessionList) {
  const pbs = {}; let total = 0;
  sessionList.forEach(s => {
    s.exercises.forEach(ex => {
      if (!pbs[ex.name]) pbs[ex.name] = {weight:0, reps:0};
      ex.sets.forEach(st => {
        const w = parseFloat(st.weight)||0, r = parseFloat(st.reps)||0;
        if (w > pbs[ex.name].weight) { pbs[ex.name].weight = w; total++; }
        if (r > pbs[ex.name].reps)   { pbs[ex.name].reps = r; total++; }
      });
    });
  });
  return total;
}

// Compute which achievements are earned, including repeat count for repeatable ones
function computeAchievements(sessionList, mastery) {
  return ACHIEVEMENTS.map(a => {
    const earned = a.check(sessionList, null, mastery);
    const count = (a.repeatable && a.countFn) ? a.countFn(sessionList, null, mastery) : (earned ? 1 : 0);
    // Progress toward next threshold (0–1). Earned non-repeatables show 1.
    const progress = a.progressFn ? Math.min(1, Math.max(0, a.progressFn(sessionList, null, mastery))) : (earned ? 1 : 0);
    return { ...a, earned, count, progress };
  });
}

  achievements.filter(a => a.earned && a.title).forEach(a => earned.add(a.title));

function generateTagline(sessionList) {
  const pushC  = sessionList.filter(s => VARIATIONS[s.variationKey] && VARIATIONS[s.variationKey].type === 'push').length;
  const pullC  = sessionList.filter(s => VARIATIONS[s.variationKey] && VARIATIONS[s.variationKey].type === 'pull').length;
  const legsC  = sessionList.filter(s => VARIATIONS[s.variationKey] && VARIATIONS[s.variationKey].type === 'legs').length;
  const cardioC= cardioSessions(sessionList).length;
  const tkdC   = tkdCount(sessionList);
  const runDist= totalMiles(cardioSessions(sessionList));
  const lbs    = totalLbs(sessionList);

  if (!sessionList.length) return 'Just getting started.';
  if (tkdC > 20 && lbs > 10000) return `Warrior of iron and spirit — ${tkdC} mat sessions, ${fmt(lbs)} lbs moved.`;
  if (tkdC > 10) return `Martial artist in training — ${tkdC} sessions on the mat and counting.`;
  if (runDist > 50) return `${runDist.toFixed(1)} miles logged and still going.`;
  if (lbs > 100000) return `${fmt(lbs)} lbs moved. The iron doesn't lie.`;
  if (sessionList.length >= 50) return `${sessionList.length} sessions in. Consistency is the craft.`;
  if (legsC > pushC && legsC > pullC) return 'Legs day enthusiast. The gains are real.';
  if (cardioC > sessionList.length * 0.4) return 'Built on sweat and miles.';
  return `${sessionList.length} sessions logged. The work continues.`;
}

// ── Hook into saveSessions ─────────────────────────────────────────────────
function saveSessions(savedSessionId) {
  localStorage.setItem('ppl_sessions', JSON.stringify(sessions));
  if (savedSessionId != null) {
    computeAndShowXP(savedSessionId);
  } else {
    checkAndAutoSyncPBs();
  }
}

function computeAndShowXP(savedSessionId) {
  if (!sessions.length) return;

  // Find the session that was just saved by its ID — it may not be last if retroactively logged
  const latestIdx = sessions.findIndex(s => String(s.id) === String(savedSessionId));
  if (latestIdx < 0) return; // session not found — bail out safely
  const latest = sessions[latestIdx];

  // XP state before this session — all sessions that precede it chronologically
  const priorSessions = sessions.slice(0, latestIdx);
  const { totalAttrXP: priorAttrXP, mastery: priorMastery } = computeAllXP(priorSessions);
  const priorAchievements_unused = computeAchievements(priorSessions, priorMastery).filter(a => a.earned).map(a => a.id);

  // Build prior PBs for PR detection
  const priorPBs = {};
  priorSessions.forEach(s => s.exercises.forEach(ex => {
    if (!priorPBs[ex.name]) priorPBs[ex.name] = {weight:0, reps:0};
    ex.sets.forEach(st => {
      const w = parseFloat(st.weight)||0, r = parseFloat(st.reps)||0;
      if (w > priorPBs[ex.name].weight) priorPBs[ex.name].weight = w;
      if (r > priorPBs[ex.name].reps) priorPBs[ex.name].reps = r;
    });
  }));

  const { breakdown, attrGains } = calcSessionXP(latest, priorSessions, priorPBs);

  // Sessions up to and including this one — used for achievement/mastery comparison
  const sessionsUpToNow = sessions.slice(0, latestIdx + 1);

  // Mastery fills this session — distribute through session attr map not all 4
  const nowMastery = computeMastery(sessionsUpToNow);
  const aMap = getSessionAttrMap(latest);
  let masteryFills = 0;
  Object.keys(nowMastery).forEach(name => {
    const before = priorMastery[name] ? priorMastery[name].fills : 0;
    masteryFills += Math.max(0, nowMastery[name].fills - before);
  });
  if (masteryFills > 0) {
    const masteryXP = masteryFills * 50;
    const allAttrs = [...(aMap.primary||[]), ...(aMap.minor||[])];
    const perAttr = Math.round(masteryXP / Math.max(1, allAttrs.length));
    allAttrs.forEach(k => { attrGains[k] = (attrGains[k]||0) + perAttr; });
  }

  // New achievements — compare prior vs up-to-and-including this session only
  const priorAchievementCounts = {};
  computeAchievements(priorSessions, priorMastery).forEach(a => {
    priorAchievementCounts[a.id] = a.count;
  });
  const nowAchievements = computeAchievements(sessionsUpToNow, nowMastery);
  const newAchievements = nowAchievements.filter(a => {
    const prev = priorAchievementCounts[a.id] || 0;
    return a.count > prev;
  });

  // Achievement XP bonus — distribute through session attr map not all 4
  const ACHIEVEMENT_XP = 200;
  const achievementXP = newAchievements.length * ACHIEVEMENT_XP;
  if (achievementXP > 0) {
    const allAttrs = [...(aMap.primary||[]), ...(aMap.minor||[])];
    const perAttr = Math.round(achievementXP / Math.max(1, allAttrs.length));
    allAttrs.forEach(k => { attrGains[k] = (attrGains[k]||0) + perAttr; });
    latest.achievementXP = achievementXP;
    localStorage.setItem('ppl_sessions', JSON.stringify(sessions));
  }

  checkAndAutoSyncPBs();

  setTimeout(() => {
    showXPOverlay({
      session: latest,
      breakdown,
      attrGains,
      attrXPBefore: priorAttrXP,
      masteryFills,
      newAchievements,
      achievementXP,
    });
  }, 1400); // show after the "Session saved" toast fades
}

function editProfileName() {

function editTagline() {
  const p = getProfile();

  const val = prompt('Edit your bio (leave blank to use the auto-generated one):', current);

  p.customTagline = val.trim() === '' || val.trim() === auto ? null : val.trim();

function resetTagline() {
  const p = getProfile();
  p.customTagline = null;
  saveProfile(p);
  renderStatsScreen();
}

function equipTitle(title) {
  const p = getProfile();
  p.equippedTitle = title;
  saveProfile(p);
  renderStatsScreen();
}

function handleProfilePhoto(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    // Compress to max 200px wide
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const size = Math.min(200, img.width, img.height);
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = size / Math.min(img.width, img.height);
      const sx = (img.width - size/scale)/2, sy = (img.height - size/scale)/2;
      ctx.drawImage(img, sx, sy, size/scale, size/scale, 0, 0, size, size);
      const p = getProfile();
      p.photo = canvas.toDataURL('image/jpeg', 0.8);
      saveProfile(p);
      renderStatsScreen();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

    const pct = Math.round((lvl.xpIntoLevel / lvl.xpNeeded) * 100);
    html += `<div class="home-attr-mini">
      <div class="home-attr-mini-label" style="color:${a.color}">${a.name.slice(0,3)}</div>
      <div class="home-attr-mini-level" style="color:${a.text}">${lvl.level}</div>
      <div class="home-attr-mini-bar">
        <div class="home-attr-mini-fill" style="width:${pct}%;background:${a.color}"></div>
      </div>
    </div>`;
  });

  html += `</div>`;
  el.innerHTML = html;
}

// ════════════════════════════════════════════════════════════════════════════
// QUICK LOG
// ════════════════════════════════════════════════════════════════════════════

let qlSelectedExercise = null;  // { name, isActivity, category, supportsDistance }
let qlSets = [{ reps:'', weight:'' }];
let qlDuration = '';
let qlDistance = '';

function openQuickLog() {
  qlSelectedExercise = null;
  qlSets = [{ reps:'', weight:'' }];
  qlDuration = '';
  qlDistance = '';
  const overlay = document.getElementById('quick-log-overlay');
  overlay.style.display = 'flex';
  renderQuickLogSheet();
  // Focus search after short delay for sheet animation
  setTimeout(() => {
    const input = document.getElementById('ql-search');
    if (input) input.focus();
  }, 100);
}

function closeQuickLog(e) {
  if (e && e.target !== document.getElementById('quick-log-overlay')) return;
  document.getElementById('quick-log-overlay').style.display = 'none';
}

function closeQuickLogSheet() {
  document.getElementById('quick-log-overlay').style.display = 'none';
}

function renderQuickLogSheet() {
  const body = document.getElementById('quick-log-body');
  let html = '';

  if (!qlSelectedExercise) {
    // ── Search phase ──────────────────────────────────────────────────────
    html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:var(--text)">Quick Log</div>
      <button onclick="closeQuickLogSheet()" style="background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;padding:0">×</button>
    </div>`;
    html += `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
      display:flex;align-items:center;gap:8px;padding:10px 12px;margin-bottom:12px">
      <span style="color:var(--text-dim);font-size:14px">⌕</span>
      <input id="ql-search" type="text" placeholder="Search exercises and activities…"
        autocomplete="off" autocorrect="off" spellcheck="false"
        oninput="renderQLSearchResults(this.value)"
        style="flex:1;background:none;border:none;outline:none;font-size:14px;
          color:var(--text);font-family:'DM Sans',sans-serif">
    </div>`;
    html += `<div id="ql-results"></div>`;
    body.innerHTML = html;
    renderQLSearchResults('');
  } else {
    // ── Log phase ─────────────────────────────────────────────────────────
    const ex = qlSelectedExercise;
    const isCardio = ex.supportsDistance;
    const isDuration = ex.isActivity;

    html += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <button onclick="qlBack()" style="background:none;border:none;color:var(--text-muted);
        font-size:20px;cursor:pointer;padding:0;line-height:1">‹</button>
      <div>
        <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:var(--text)">${ex.name}</div>
        <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px">
          ${ex.isActivity ? (ex.category||'activity') : 'exercise'} · today
        </div>
      </div>
      <button onclick="closeQuickLogSheet()" style="background:none;border:none;color:var(--text-dim);
        font-size:20px;cursor:pointer;padding:0;margin-left:auto">×</button>
    </div>`;

    if (isDuration) {
      // Activity — show duration (+ distance for running)
      html += `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:10px">
        <div style="padding:12px 14px;border-bottom:${isCardio?'1px solid var(--border)':'none'}">
          <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Duration</div>
          <div style="display:flex;align-items:center;gap:10px">
            <input type="number" inputmode="decimal" placeholder="0"
              value="${qlDuration}"
              oninput="qlDuration=this.value"
              style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;
                padding:10px 12px;font-size:24px;font-weight:800;color:var(--text);
                font-family:'Syne',sans-serif;text-align:center">
            <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text-dim)">min</span>
          </div>
        </div>
        ${isCardio ? `<div style="padding:12px 14px">
          <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Distance</div>
          <div style="display:flex;align-items:center;gap:10px">
            <input type="number" inputmode="decimal" placeholder="0.0"
              value="${qlDistance}"
              oninput="qlDistance=this.value"
              style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;
                padding:10px 12px;font-size:24px;font-weight:800;color:var(--text);
                font-family:'Syne',sans-serif;text-align:center">
            <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text-dim)">mi</span>
          </div>
        </div>` : ''}
      </div>`;
    } else {
      // Exercise — show set rows
      qlSets.forEach((s, si) => {
        html += `<div style="background:var(--surface);border:1px solid var(--border);
          border-radius:var(--radius);padding:12px 14px;margin-bottom:8px">
          <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);
            text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px">
            Set ${si+1}${qlSets.length > 1 ? ` <button onclick="qlRemoveSet(${si})" style="background:none;border:none;color:var(--text-dim);font-size:11px;cursor:pointer;float:right">Remove</button>` : ''}
          </div>
          <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px">
            <div>
              <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);text-transform:uppercase;margin-bottom:6px">Reps</div>
              <input type="number" inputmode="decimal" placeholder="0"
                value="${s.reps}"
                oninput="qlSets[${si}].reps=this.value"
                style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;
                  padding:10px 8px;font-size:22px;font-weight:800;color:var(--text);
                  font-family:'Syne',sans-serif;text-align:center;box-sizing:border-box">
            </div>
            <div style="font-size:16px;color:var(--text-dim);margin-top:16px">×</div>
            <div>
              <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);text-transform:uppercase;margin-bottom:6px">Weight (lbs)</div>
              <input type="number" inputmode="decimal" placeholder="0"
                value="${s.weight}"
                oninput="qlSets[${si}].weight=this.value"
                style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;
                  padding:10px 8px;font-size:22px;font-weight:800;color:var(--text);
                  font-family:'Syne',sans-serif;text-align:center;box-sizing:border-box">
            </div>
          </div>
        </div>`;
      });
      html += `<button onclick="qlAddSet()"
        style="width:100%;padding:10px;background:none;border:1px dashed var(--border);
          border-radius:var(--radius);color:var(--text-dim);font-family:'DM Sans',sans-serif;
          font-size:13px;cursor:pointer;margin-bottom:10px">
        + Add another set
      </button>`;
    }

    // Save button
    html += `<button onclick="saveQuickLog()"
      style="width:100%;padding:14px;background:var(--str);border:none;border-radius:30px;
        color:#fff;font-family:'Syne',sans-serif;font-size:16px;font-weight:700;
        cursor:pointer;box-shadow:0 4px 16px var(--str-glow);margin-top:4px">
      Log it
    </button>`;

    body.innerHTML = html;
  }
}

function renderQLSearchResults(q) {
  const container = document.getElementById('ql-results');
  if (!container) return;
  const seen = new Set();
  const groups = { push:[], pull:[], legs:[], core:[], activity:[] };
  const gc = { push: TYPE_COLOR.push, pull: TYPE_COLOR.pull, legs: TYPE_COLOR.legs, core: 'var(--core)', activity: 'var(--cardio)' };
  const gl = { push:'Push', pull:'Pull', legs:'Legs', core:'Core', activity:'Activities' };

  ORDER.forEach(key => {
    const v = VARIATIONS[key];
    [...v.exercises, ...v.core].forEach((ex, i) => {
      if (seen.has(ex.name)) return; seen.add(ex.name);
      const type = i < v.exercises.length ? v.type : 'core';
      groups[type].push({ name: ex.name, isActivity: false, category: type });
    });
  });
  PREDEFINED_ACTIVITIES.forEach(act => {
    if (seen.has(act.name)) return; seen.add(act.name);
    groups.activity.push({ name: act.name, isActivity: true, category: act.category||'general', supportsDistance: !!act.supportsDistance });
  });

  const lq = q.toLowerCase().trim();
  let html = ''; let total = 0;
  ['push','pull','legs','core','activity'].forEach(type => {
    const items = lq ? groups[type].filter(n => n.name.toLowerCase().includes(lq)) : groups[type];
    if (!items.length) return;
    html += `<div style="font-family:'DM Mono',monospace;font-size:9px;font-weight:500;
      text-transform:uppercase;letter-spacing:0.8px;color:${gc[type]};
      padding:6px 0 4px">${gl[type]}</div>`;
    items.forEach(item => {
      const safe = item.name.replace(/'/g,"\\'");
      html += `<button onclick="qlSelectExercise('${safe}',${item.isActivity},'${item.category}',${!!item.supportsDistance})"
        style="width:100%;text-align:left;padding:10px 12px;background:var(--surface);
          border:1px solid var(--border);border-radius:var(--radius-sm);
          color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;
          cursor:pointer;margin-bottom:4px;display:block">
        ${item.name}
      </button>`;
    });
    total += items.length;
  });
  if (!total) html = `<div style="padding:20px;text-align:center;color:var(--text-dim);font-size:13px">No results for "${q}"</div>`;
  container.innerHTML = html;
}

function qlSelectExercise(name, isActivity, category, supportsDistance) {
  qlSelectedExercise = { name, isActivity, category, supportsDistance };
  qlSets = [{ reps:'', weight:'' }];
  qlDuration = '';
  qlDistance = '';
  renderQuickLogSheet();
}

function qlBack() {
  qlSelectedExercise = null;
  renderQuickLogSheet();
  setTimeout(() => { const i = document.getElementById('ql-search'); if(i) i.focus(); }, 50);
}

function qlAddSet() {
  qlSets.push({ reps:'', weight:'' });
  renderQuickLogSheet();
}

function qlRemoveSet(idx) {
  qlSets.splice(idx, 1);
  renderQuickLogSheet();
}

function saveQuickLog() {
  if (!qlSelectedExercise) return;
  const ex = qlSelectedExercise;
  const today = new Date().toISOString();

  let exercises = [];
  if (!ex.isActivity) {
    const validSets = qlSets.filter(s => s.reps);
    if (!validSets.length) { showToast('Enter at least one rep to log'); return; }
    exercises = [{ key: 'ql_0', name: ex.name, sets: validSets }];
  }

  const session = {
    id: Date.now(),
    date: today,
    loggedAt: today,
    variationKey: CUSTOM_KEY,
    customName: ex.name,
    category: ex.category || 'general',
    tab: 'main',
    exercises,
    notes: '',
    duration: qlDuration.trim(),
    distance: qlDistance.trim(),
    isQuickLog: true,
  };

  sessions.push(session);
  closeQuickLogSheet();
  saveSessions(session.id);
  showToast(`${ex.name} logged ✓`);
}
updateTimerDisplay();
showHome();
</script>
