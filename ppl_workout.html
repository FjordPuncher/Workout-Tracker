    // Save button
    html += `<button onclick="saveQuickLog()"
      style="width:100%;padding:14px;background:var(--str);border:none;border-radius:30px;
        color:#fff;font-family:'Syne',sans-serif;font-size:16px;font-weight:700;
        cursor:pointer;box-shadow:0 4px 16px var(--str-glow);margin-top:4px">
      Log it
    </button>`;

    body.innerHTML = html;
  }
}

function renderQLSearchResults(q) {
  const container = document.getElementById('ql-results');
  if (!container) return;
  const groups = { push:[], pull:[], legs:[], core:[], cardio:[], general:[], activity:[] };
  const gc = { push:TYPE_COLOR.push, pull:TYPE_COLOR.pull, legs:TYPE_COLOR.legs, core:'var(--core)', cardio:'var(--cardio)', general:'var(--general)', activity:'var(--cardio)' };
  const gl = { push:'Push', pull:'Pull', legs:'Legs', core:'Core', cardio:'Cardio', general:'General', activity:'Activities' };

  EXERCISE_LIBRARY.forEach(ex => {
    const bucket = ex.isActivity ? groups.activity : (groups[ex.type] || groups.general);
    if (!bucket) return;
    bucket.push({ name: ex.name, isActivity: !!ex.isActivity, category: ex.type || 'general', supportsDistance: !!ex.supportsDistance });
  });

  const lq = q.toLowerCase().trim();
  let html = ''; let total = 0;
  ['push','pull','legs','core','cardio','general','activity'].forEach(type => {
    const items = lq ? groups[type].filter(n => n.name.toLowerCase().includes(lq)) : groups[type];
    if (!items.length) return;
    html += `<div style="font-family:'DM Mono',monospace;font-size:9px;font-weight:500;
      text-transform:uppercase;letter-spacing:0.8px;color:${gc[type]};
      padding:6px 0 4px">${gl[type]}</div>`;
    items.forEach(item => {
      const safe = item.name.replace(/'/g,"\\'");
      html += `<button onclick="qlSelectExercise('${safe}',${item.isActivity},'${item.category}',${!!item.supportsDistance})"
        style="width:100%;text-align:left;padding:10px 12px;background:var(--surface);
          border:1px solid var(--border);border-radius:var(--radius-sm);
          color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;
          cursor:pointer;margin-bottom:4px;display:block">
        ${item.name}
      </button>`;
    });
    total += items.length;
  });
  if (!total) html = `<div style="padding:20px;text-align:center;color:var(--text-dim);font-size:13px">No results for "${q}"</div>`;
  container.innerHTML = html;
}

function qlSelectExercise(name, isActivity, category, supportsDistance) {
  qlSelectedExercise = { name, isActivity, category, supportsDistance };
  const timed = isTimedExercise(name);
  qlSets = [timed ? { duration:'' } : { reps:'', weight:'' }];
  qlDuration = '';
  qlDurationMin = '';
  qlDurationSec = '';
  qlDistance = '';
  renderQuickLogSheet();
}

function qlBack() {
  qlSelectedExercise = null;
  renderQuickLogSheet();
  setTimeout(() => { const i = document.getElementById('ql-search'); if(i) i.focus(); }, 50);
}

function qlAddSet() {
  const timed = qlSelectedExercise && isTimedExercise(qlSelectedExercise.name);
  qlSets.push(timed ? { duration:'' } : { reps:'', weight:'' });
  renderQuickLogSheet();
}

function qlRemoveSet(idx) {
  qlSets.splice(idx, 1);
  renderQuickLogSheet();
}

function saveQuickLog() {
  if (!qlSelectedExercise) return;
  const ex = qlSelectedExercise;
  const today = new Date().toISOString();

  let exercises = [];
  if (!ex.isActivity) {
    const timed = isTimedExercise(ex.name);
    const validSets = timed
      ? qlSets.filter(s => parseFloat(s.duration) > 0)
      : qlSets.filter(s => s.reps);
    if (!validSets.length) {
      showToast(timed ? 'Enter at least one hold duration to log' : 'Enter at least one rep to log');
      return;
    }
    exercises = [{ key: 'ql_0', name: ex.name, sets: validSets }];
  }

  const session = {
    id: Date.now(),
    date: today,
    loggedAt: today,
    variationKey: CUSTOM_KEY,
    customName: ex.name,
    category: ex.category || 'general',
    tab: 'main',
    exercises,
    notes: '',
    duration: qlDuration.trim(),
    distance: qlDistance.trim(),
    isQuickLog: true,
  };

  sessions.push(session);
  closeQuickLogSheet();
  saveSessions(session.id);
  showToast(`${ex.name} logged ✓`);
}
// ── Duration helpers: split decimal minutes into min/sec, combine back ──────
function durToMinSec(decimalMins) {
  if (!decimalMins && decimalMins !== 0) return { min: '', sec: '' };
  const val = parseFloat(decimalMins);
  if (isNaN(val)) return { min: '', sec: '' };
  const m = Math.floor(val);
  const s = Math.round((val - m) * 60);
  return { min: m > 0 ? String(m) : '', sec: s > 0 ? String(s) : '' };
}
function fmtDuration(decimalMins) {
  if (decimalMins == null || isNaN(decimalMins)) return '';
  const val = parseFloat(decimalMins);
  if (val < 0) return '';
  if (val === 0) return '0m';
  const m = Math.floor(val);
  const s = Math.round((val - m) * 60);
  if (s === 0) return `${m} min`;
  return `${m}m ${s}s`;
}
function minSecToDecimal(min, sec) {
  const m = parseFloat(min) || 0;
  const s = parseFloat(sec) || 0;
  const total = m + (s / 60);
  return total > 0 ? String(Math.round(total * 100) / 100) : '';
}

// ════════════════════════════════════════════════════════════════════════════
// EXERCISE PROGRESSION SCREEN
// ════════════════════════════════════════════════════════════════════════════

let progressionReferrer = 'glossary';
let progressionExName = null;
let progressionMetricIdx = 0;

function showProgressionScreen(exName, referrer) {
  progressionExName = exName;
  progressionReferrer = referrer || 'glossary';
  progressionMetricIdx = 0;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-progression').classList.add('active');
  setActiveNav(null);
  document.getElementById('progression-topbar-title').textContent = exName;
  const labels = { glossary:'Glossary', detail:'Session', bests:'Bests' };
  document.getElementById('progression-back-label').textContent = labels[progressionReferrer] || 'Back';
  renderProgressionScreen();
}

function closeProgressionScreen() {
  if (progressionReferrer === 'detail') {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-session-detail').classList.add('active');
  } else if (progressionReferrer === 'bests') {
    showBests('bests');
  } else {
    showGlossary();
  }
}

function setProgressionMetric(idx) {
  progressionMetricIdx = idx;
  renderProgressionScreen();
}

function renderProgressionScreen() {
  const exName = progressionExName;
  const body = document.getElementById('progression-body');
  if (!exName) { body.innerHTML = ''; return; }

  const actDef = PREDEFINED_ACTIVITIES.find(a => a.name === exName);
  const isActivity = !!actDef;
  const isRunning = actDef && actDef.supportsDistance;

  // Build data points
  const dataPoints = [];
  if (isActivity) {
    sessions.forEach(s => {
      if (s.customName !== exName) return;
      const dur = parseFloat(s.duration)||0;
      const dist = parseFloat(s.distance)||0;
      if (!dur && !dist) return;
      const pace = (dist > 0 && dur > 0) ? dur/dist : null;
      dataPoints.push({ date: s.date, id: s.id, dur, dist, pace });
    });
  } else {
    const isTimed = isTimedExercise(exName);
    sessions.forEach(s => {
      const ex = s.exercises.find(e => e.name.toLowerCase() === exName.toLowerCase());
      if (!ex) return;
      if (isTimed) {
        // Support both new {duration} format and old workaround {reps} format
        const durSets = ex.sets.filter(st => parseFloat(st.duration) > 0);
        const repsSets = ex.sets.filter(st => parseFloat(st.reps) > 0 && !st.duration);
        const validSets = durSets.length ? durSets : repsSets;
        if (!validSets.length) return;
        const maxDuration = durSets.length
          ? Math.max(...durSets.map(st => parseFloat(st.duration)||0))
          : Math.max(...repsSets.map(st => parseFloat(st.reps)||0));
        const totalSecs = durSets.length
          ? durSets.reduce((a, st) => a + (parseFloat(st.duration)||0), 0)
          : repsSets.reduce((a, st) => a + (parseFloat(st.reps)||0), 0);
        dataPoints.push({ date: s.date, id: s.id, maxDuration, totalSecs });
      } else {
        const validSets = ex.sets.filter(st => parseFloat(st.reps) > 0);
        if (!validSets.length) return;
        const maxWeight = Math.max(...validSets.map(st => parseFloat(st.weight)||0));
        const maxReps = Math.max(...validSets.map(st => parseFloat(st.reps)||0));
        const totalVol = validSets.reduce((a, st) => a + (parseFloat(st.reps)||0)*(parseFloat(st.weight)||0), 0);
        dataPoints.push({ date: s.date, id: s.id, maxWeight, maxReps, totalVol });
      }
    });
  }

  // Define metrics
  let metrics = [];
  if (isRunning) {
    metrics = [
      { key:'dist',  label:'Distance', unit:'mi',     values: dataPoints.map(d=>d.dist),  fmtVal: v=>v.toFixed(2) },
      { key:'dur',   label:'Duration', unit:'',       values: dataPoints.map(d=>d.dur),   fmtVal: v=>fmtDuration(v) },
      { key:'pace',  label:'Pace',     unit:'min/mi', values: dataPoints.map(d=>d.pace),  fmtVal: v=>{ if(!v) return '—'; const m=Math.floor(v),s=Math.round((v-m)*60); return `${m}:${String(s).padStart(2,'0')}`; }, lowerIsBetter:true },
    ];
  } else if (isActivity) {
    metrics = [
      { key:'dur', label:'Duration', unit:'', values: dataPoints.map(d=>d.dur), fmtVal: v=>fmtDuration(v) },
    ];
  } else if (isTimedExercise(exName)) {
    const fmtSecs = v => v >= 60 ? `${Math.floor(v/60)}m ${v%60>0?v%60+'s':''}`.trim() : `${v}s`;
    metrics = [
      { key:'best',  label:'Best hold', unit:'sec', values: dataPoints.map(d=>d.maxDuration), fmtVal: fmtSecs },
      { key:'total', label:'Total',     unit:'sec', values: dataPoints.map(d=>d.totalSecs),   fmtVal: fmtSecs },
    ];
  } else {
    metrics = [
      { key:'weight', label:'Weight',  unit:'lbs', values: dataPoints.map(d=>d.maxWeight), fmtVal: v=>fmt(v) },
      { key:'reps',   label:'Reps',    unit:'',    values: dataPoints.map(d=>d.maxReps),   fmtVal: v=>String(v) },
      { key:'volume', label:'Volume',  unit:'lbs', values: dataPoints.map(d=>d.totalVol),  fmtVal: v=>fmt(v) },
    ];
  }

  const metric = metrics[Math.min(progressionMetricIdx, metrics.length-1)];
  const values = metric.values;
  const lowerIsBetter = !!metric.lowerIsBetter;

  let html = '';

  // Metric tabs
  if (metrics.length > 1) {
    html += `<div style="display:flex;gap:6px;padding:14px 18px 0;flex-wrap:wrap">`;
    metrics.forEach((m, i) => {
      const active = i === progressionMetricIdx;
      html += `<button onclick="setProgressionMetric(${i})"
        style="padding:6px 14px;border-radius:20px;font-family:'DM Mono',monospace;font-size:10px;
          text-transform:uppercase;letter-spacing:0.5px;cursor:pointer;
          background:${active?'var(--surface2)':'none'};
          border:1px solid ${active?'var(--accent)':'var(--border)'};
          color:${active?'var(--accent)':'var(--text-dim)'}">${m.label}</button>`;
    });
    html += `</div>`;
  }

  // Summary stats
  if (dataPoints.length > 0) {
    const validVals = values.filter(v=>v!=null&&v>0);
    const best = lowerIsBetter ? Math.min(...validVals) : Math.max(...validVals);
    const latest = values[values.length-1];
    const avg = validVals.length ? validVals.reduce((a,b)=>a+b,0)/validVals.length : 0;
    html += `<div class="stats-grid" style="padding:14px 18px 0">
      <div class="stat-tile">
        <div class="stat-tile-label">${lowerIsBetter?'Best (fastest)':'Best'}</div>
        <div class="stat-tile-value" style="font-size:18px;color:var(--str)">${metric.fmtVal(best)}</div>
        <div class="stat-tile-unit">${metric.unit}</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">Latest</div>
        <div class="stat-tile-value" style="font-size:18px">${metric.fmtVal(latest||0)}</div>
        <div class="stat-tile-unit">${metric.unit}</div>
      </div>
      <div class="stat-tile wide">
        <div class="stat-tile-label">Sessions logged</div>
        <div class="stat-tile-value" style="font-size:18px">${dataPoints.length}</div>
        <div class="stat-tile-unit">avg ${metric.fmtVal(avg)} ${metric.unit}</div>
      </div>
    </div>`;
  }

  // SVG line chart
  if (dataPoints.length >= 2) {
    const W=340, H=160, PAD={top:16,right:16,bottom:28,left:44};
    const cW=W-PAD.left-PAD.right, cH=H-PAD.top-PAD.bottom;
    const validVals = values.filter(v=>v!=null&&v>0);
    const rawMin=Math.min(...validVals), rawMax=Math.max(...validVals);
    const range = rawMax-rawMin||1;
    const vMin=rawMin-range*0.1, vMax=rawMax+range*0.1;
    const n = dataPoints.length;
    const xS = i => PAD.left+(i/(n-1))*cW;
    const yS = v => PAD.top+cH-((v-vMin)/(vMax-vMin))*cH;

    let path='', gridlines='', yLabels='', xLabels='', dots='';
    values.forEach((v,i)=>{ if(v==null||v<=0) return; path+=(path?'L':'M')+`${xS(i).toFixed(1)},${yS(v).toFixed(1)} `; });
    for(let g=0;g<=4;g++){
      const v=vMin+(vMax-vMin)*(g/4), y=yS(v).toFixed(1);
      gridlines+=`<line x1="${PAD.left}" y1="${y}" x2="${W-PAD.right}" y2="${y}" stroke="#2A2820" stroke-width="1"/>`;
      const lv = metric.key==='pace' ? (()=>{const m=Math.floor(v),s=Math.round((v-m)*60);return `${m}:${String(s).padStart(2,'0')}`;})()
               : metric.key==='dur' ? `${Math.round(v)}m`
               : (metric.key==='best'||metric.key==='total') ? (Math.round(v)>=60?`${Math.floor(Math.round(v)/60)}m`:`${Math.round(v)}s`)
               : Math.round(v)>=1000?`${(Math.round(v)/1000).toFixed(1)}k`:String(Math.round(v));
      yLabels+=`<text x="${PAD.left-4}" y="${y}" text-anchor="end" dominant-baseline="middle" font-size="8" fill="#888780" font-family="monospace">${lv}</text>`;
    }
    [0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i).forEach(i=>{
      const d=new Date(dataPoints[i].date);
      xLabels+=`<text x="${xS(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="8" fill="#888780" font-family="monospace">${d.getMonth()+1}/${d.getDate()}</text>`;
    });
    let runningBest = lowerIsBetter?Infinity:-Infinity;
    values.forEach((v,i)=>{
      if(v==null||v<=0) return;
      const isPR = lowerIsBetter?v<runningBest:v>runningBest;
      if(isPR) runningBest=v;
      const cx=xS(i).toFixed(1), cy=yS(v).toFixed(1);
      dots += isPR
        ? `<text x="${cx}" y="${parseFloat(cy)-1}" text-anchor="middle" font-size="10" dominant-baseline="auto">⭐</text>`
        : `<circle cx="${cx}" cy="${cy}" r="3" fill="var(--accent)" opacity="0.7"/>`;
    });

    html+=`<div style="padding:14px 18px 0;overflow-x:auto">
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-width:${W}px">
        ${gridlines}${yLabels}${xLabels}
        <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
        ${dots}
      </svg>
    </div>`;
  } else if (dataPoints.length===1) {
    html+=`<div style="padding:20px 18px;text-align:center;color:var(--text-dim);font-size:13px">Log at least 2 sessions to see a chart.</div>`;
  } else {
    html+=`<div style="padding:40px 18px;text-align:center;color:var(--text-dim);font-size:13px">No sessions logged for ${exName} yet.</div>`;
  }

  // Session history
  if (dataPoints.length > 0) {
    html+=`<div class="section-label" style="margin-top:16px">Session history</div><div style="padding:0 18px">`;
    [...dataPoints].reverse().forEach(dp=>{
      const d=new Date(dp.date);
      const ds=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
      let detail='';
      if(isRunning){
        const p=[]; if(dp.dist)p.push(`${dp.dist.toFixed(2)} mi`); if(dp.dur)p.push(fmtDuration(dp.dur));
        if(dp.pace){const m=Math.floor(dp.pace),s=Math.round((dp.pace-m)*60);p.push(`${m}:${String(s).padStart(2,'0')} /mi`);}
        detail=p.join(' · ');
      } else if(isActivity){
        detail=dp.dur?fmtDuration(dp.dur):'';
      } else if(isTimedExercise(exName)){
        const fmtSecs = v => v >= 60 ? `${Math.floor(v/60)}m ${v%60>0?v%60+'s':''}`.trim() : `${v}s`;
        const p=[];
        if(dp.maxDuration>0)p.push(`best ${fmtSecs(dp.maxDuration)}`);
        if(dp.totalSecs>0)p.push(`total ${fmtSecs(dp.totalSecs)}`);
        detail=p.join(' · ');
      } else {
        const p=[];
        if(dp.maxWeight>0)p.push(`${fmt(dp.maxWeight)} lbs`);
        if(dp.maxReps>0)p.push(`${dp.maxReps} reps`);
        if(dp.totalVol>0)p.push(`${fmt(dp.totalVol)} lbs vol`);
        detail=p.join(' · ');
      }
      html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1A1814">
        <div style="font-size:12px;color:var(--text-muted)">${ds}</div>
        <div style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text)">${detail}</div>
      </div>`;
    });
    html+=`</div>`;
  }

  html+=`<div style="height:32px"></div>`;
  body.innerHTML=html;
  body.scrollTop=0;
}

// ── Practical comparison helpers ─────────────────────────────────────────────
// Each threshold has a pool of comparisons. Rotation is keyed off session.id
// so a given session always shows the same comparison regardless of history length.

function pickComp(pool, sessionId) {
  return pool[Math.abs(sessionId) % pool.length];
}

// Volume pools — each threshold maps to a pool of equivalent comparisons

// Line 1: find the pool entry closest to lbs for a clean "1× X" comparison
function getSingleUnitVolumeComp(lbs, sessionId) {
  if (lbs <= 0) return null;
  let best = VOLUME_POOLS[0];
  let bestDiff = Infinity;
  for (const entry of VOLUME_POOLS) {
    const diff = Math.abs(lbs - entry.lbs);
    if (diff < bestDiff) { bestDiff = diff; best = entry; }
  }
  const item = best.items[Math.abs(parseInt(sessionId)||0) % best.items.length];
  return `1× ${item}`;
}

// Line 2: find the best-fit entry where count lands between 1.5 and 3,
// rounded to nearest 0.5, never equal to 1 (which would duplicate line 1)
function getMultiUnitVolumeComp(lbs, sessionId) {
  if (lbs <= 0) return null;
  let best = null;
  let bestScore = Infinity;
  for (const entry of VOLUME_POOLS) {
    const rawCount = lbs / entry.lbs;
    const rounded = Math.round(rawCount * 2) / 2; // round to nearest 0.5
    if (rounded >= 1.5 && rounded <= 3) {
      const score = Math.abs(rounded - 2); // prefer count near 2
      if (score < bestScore) { bestScore = score; best = { entry, count: rounded }; }
    }
  }
  if (!best) {
    // Fallback: use heaviest entry with rounded count
    const entry = VOLUME_POOLS[VOLUME_POOLS.length - 1];
    const rounded = Math.round((lbs / entry.lbs) * 2) / 2;
    best = { entry, count: Math.max(1.5, rounded) };
  }
  const { entry, count } = best;
  // Use a different rotation than line 1 by offsetting sessionId
  const item = entry.items[(Math.abs(parseInt(sessionId)||0) + 1) % entry.items.length];
  const display = count === Math.round(count) ? count : count.toFixed(1);
  return `${display}× ${item}`;
}

function getBestFitVolumeComp(lbs, sessionId) {
  return getSingleUnitVolumeComp(lbs, sessionId);
}

function pickComp(pool, sessionId) {
  return pool[Math.abs(parseInt(sessionId) || 0) % pool.length];
}

function getNearestPool(value, pools, key) {
  let best = pools[0];
  for (const p of pools) {
    const v = p[key] !== undefined ? p[key] : p.mi;
    if (v <= value) best = p;
    else break;
  }
  return best;
}

function volumeComparisons(lbs, sessionId) {
  return getSingleUnitVolumeComp(lbs, sessionId);
}

function volumeComparisonScaled(lbs, sessionId) {
  return getMultiUnitVolumeComp(lbs, sessionId);
}

function distanceComparisonPair(mi, sessionId) {
  if (mi <= 0) return null;
  const pool = getNearestPool(mi, DISTANCE_POOLS, 'mi');
  const id = parseInt(sessionId) || 0;
  return {
    local: pickComp(pool.local, id),
    national: pickComp(pool.national, id + 1),
  };
}

function getCustomWorkouts() {
  try { return JSON.parse(localStorage.getItem(CUSTOM_WORKOUT_KEY) || '[]'); }
  catch { return []; }
}

function saveCustomWorkouts(list) {
  localStorage.setItem(CUSTOM_WORKOUT_KEY, JSON.stringify(list));
}

function inferWorkoutType(exerciseNames) {
  const typeCounts = {};
  const typeThresholds = {};
  exerciseNames.forEach(name => {
    const ex = getExercise(name);
    if (!ex || ex.isActivity) return;
    typeCounts[ex.type] = (typeCounts[ex.type] || 0) + 1;
    typeThresholds[ex.type] = (typeThresholds[ex.type] || 0) + (ex.masteryThreshold || 0);
  });
  const sorted = Object.entries(typeCounts).sort((a, b) => {
    if (b[1] !== a[1]) return b[1] - a[1];
    return (typeThresholds[b[0]] || 0) - (typeThresholds[a[0]] || 0);
  });
  return sorted.length > 0 ? sorted[0][0] : 'custom';
}

function estimateSessionLength(exerciseNames) {
  const total = exerciseNames.reduce((acc, name) => {
    const ex = getExercise(name);
    if (!ex) return acc;
    const sets = parseInt((ex.sets || '3 × 10').split('×')[0]) || 3;
    return acc + sets;
  }, 0);
  if (total < 20) return `~${total} min`;
  return `~${Math.round(total / 5) * 5} min`;
}

function renderBuilderExercises() {
  const search = (document.getElementById('builder-search').value || '').toLowerCase();
  const list = document.getElementById('builder-exercise-list');
  const countEl = document.getElementById('builder-selection-count');
  countEl.textContent = `${builderSelectedExercises.length} selected`;

  const exercises = EXERCISE_LIBRARY.filter(ex => {
    if (ex.isActivity) return false;
    if (builderFilter !== 'all' && ex.type !== builderFilter) return false;
    if (search && !ex.name.toLowerCase().includes(search)) return false;
    return true;
  });

  let html = '';
  if (builderFilter === 'all') {
    const byType = {};
    exercises.forEach(ex => { (byType[ex.type] = byType[ex.type] || []).push(ex); });
    ['push','pull','legs','core'].forEach(type => {
      if (!byType[type]?.length) return;
      html += `<div style="font-family:'DM Mono',monospace;font-size:10px;font-weight:500;
        text-transform:uppercase;letter-spacing:0.8px;
        color:${TYPE_COLOR[type]||'var(--text-dim)'};padding:14px 0 6px">${type}</div>`;
      byType[type].forEach(ex => { html += builderExCard(ex); });
    });
  } else {
    exercises.forEach(ex => { html += builderExCard(ex); });
  }

  if (!html) html = `<div style="text-align:center;padding:40px 0;
    font-family:'DM Mono',monospace;font-size:11px;color:var(--text-dim)">
    No exercises found</div>`;
  list.innerHTML = html;
}

  const selected = builderSelectedExercises.includes(ex.name);
  const setsLabel = ex.isTimed ? (ex.sets || '3 × 30 sec') : (ex.sets || '3 × 10');
  const pill = muscleGroupPill(ex.muscleGroup);
  const safeName = ex.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  return `<div class="builder-ex-card${selected ? ' selected' : ''}"
    onclick="toggleBuilderExercise('${safeName}')">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div class="builder-ex-name">${ex.name}</div>
      ${selected ? `<div style="width:18px;height:18px;border-radius:50%;background:var(--str);

}

    <div style="margin-bottom:20px">
      <div style="font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;
        letter-spacing:0.8px;color:var(--text-dim);margin-bottom:8px">Description <span style="opacity:0.5">(optional)</span></div>
      <textarea id="workout-desc-input" placeholder="e.g. Heavy back focus with grip work"
        rows="2"
        style="width:100%;background:var(--surface);border:1.5px solid var(--border);
          border-radius:var(--radius);padding:12px 14px;font-family:'DM Sans',sans-serif;
          font-size:13px;color:var(--text);box-sizing:border-box;resize:none;
          line-height:1.5"
        autocomplete="off">${existing?.desc ? existing.desc.replace(/</g,'&lt;') : ''}</textarea>
    </div>
    <div style="display:flex;gap:12px;margin-bottom:20px">
      <div style="flex:1;background:var(--surface);border:1px solid var(--border);
        border-radius:var(--radius);padding:12px 14px">
        <div style="font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;
          letter-spacing:0.6px;color:var(--text-dim);margin-bottom:4px">Category</div>
        <div style="background:${tb};color:${tt};display:inline-block;
          font-family:'DM Mono',monospace;font-size:10px;font-weight:500;
          text-transform:uppercase;letter-spacing:0.6px;
          padding:3px 10px;border-radius:10px">${inferredType}</div>
      </div>
      <div style="flex:1;background:var(--surface);border:1px solid var(--border);
        border-radius:var(--radius);padding:12px 14px">
        <div style="font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;
          letter-spacing:0.6px;color:var(--text-dim);margin-bottom:4px">Est. Length</div>
        <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;
          color:var(--text)">${estLength}</div>
      </div>
    </div>
    <div style="margin-bottom:24px">
      <div style="font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;
        letter-spacing:0.8px;color:var(--text-dim);margin-bottom:10px">
        ${builderSelectedExercises.length} Exercises</div>
      ${builderSelectedExercises.map(name => {
        const ex = getExercise(name);
        return `<div style="display:flex;align-items:center;justify-content:space-between;
          padding:8px 0;border-bottom:1px solid var(--border)">
          <div style="font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text)">${name}</div>
          ${ex ? muscleGroupPill(ex.muscleGroup) : ''}
        </div>`;
      }).join('')}
    </div>
    <button onclick="saveCustomWorkout()"
      style="width:100%;background:var(--str);color:var(--str-text);border:none;
        border-radius:var(--radius);padding:14px;font-family:'Syne',sans-serif;
        font-size:16px;font-weight:700;cursor:pointer">
      ${builderEditingId ? 'Save Changes' : 'Save Workout'}
    </button>`;

  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-workout-naming').classList.add('active');
  setTimeout(() => document.getElementById('workout-name-input')?.focus(), 100);
}

function closeWorkoutNaming() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-workout-builder').classList.add('active');
}

function saveCustomWorkout() {
  const nameInput = document.getElementById('workout-name-input');
  const name = (nameInput?.value || '').trim();
  if (!name) { showToast('Please enter a name'); return; }
  const desc = (document.getElementById('workout-desc-input')?.value || '').trim();

  const workouts = getCustomWorkouts();
  const inferredType = inferWorkoutType(builderSelectedExercises);

  if (builderEditingId) {
    const idx = workouts.findIndex(x => x.id === builderEditingId);
    if (idx !== -1) {
      workouts[idx] = {
        ...workouts[idx], name, desc,
        exercises: [...builderSelectedExercises], inferredType,
      };
    }
    saveCustomWorkouts(workouts);
    showToast('Workout updated');
    showCustomWorkouts();
  } else {
    const newWorkout = {
      id: Date.now(), name, desc,
      createdAt: new Date().toISOString(),
      exercises: [...builderSelectedExercises],
      inferredType, category: 'custom',
    };
    workouts.push(newWorkout);
    saveCustomWorkouts(workouts);
    showCustomWorkouts();
    setTimeout(() => {
      if (confirm(`"${name}" saved!\n\nStart this workout now?`)) {
        startCustomWorkout(newWorkout.id);
      }
    }, 100);
  }
}

function editCustomWorkout(id) {
  openWorkoutBuilder(id);
}

function deleteCustomWorkout(id) {
  const workouts = getCustomWorkouts();
  const w = workouts.find(x => x.id === id);
  if (!w) return;
  if (!confirm(`Delete "${w.name}"?\n\nPast sessions will still appear in your history.`)) return;
  saveCustomWorkouts(workouts.filter(x => x.id !== id));
  renderCustomWorkoutsScreen();
}

function startCustomWorkout(id) {
  const w = getCustomWorkouts().find(x => x.id === id);
  if (!w) return;
  currentVariation = {
    key: CUSTOM_KEY, type: w.inferredType,
    label: w.name, name: w.name,
    focus: `${w.exercises.length} exercises`,
    exercises: w.exercises,
    customWorkoutId: w.id,
    customWorkoutName: w.name,
    isCustom: true,
  };
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-workout').classList.add('active');
  document.getElementById('workout-body').scrollTop = 0;
  renderWorkoutScreen();
}

// ── Glossary Workouts tab ─────────────────────────────────────────────────

let glossaryTab = 'exercises';

function switchGlossaryTab(tab) {
  glossaryTab = tab;
  const exTab = document.getElementById('gtab-exercises');
  const wkTab = document.getElementById('gtab-workouts');
  const body = document.getElementById('glossary-body');
  const wBody = document.getElementById('glossary-workouts-body');
  const searchWrap = document.getElementById('glossary-search-wrap');
  if (tab === 'exercises') {
    exTab.style.borderBottomColor = 'var(--str)'; exTab.style.color = 'var(--str)';
    wkTab.style.borderBottomColor = 'transparent'; wkTab.style.color = 'var(--text-dim)';
    body.style.display = ''; wBody.style.display = 'none'; searchWrap.style.display = '';
  } else {
    wkTab.style.borderBottomColor = 'var(--str)'; wkTab.style.color = 'var(--str)';
    exTab.style.borderBottomColor = 'transparent'; exTab.style.color = 'var(--text-dim)';
    body.style.display = 'none'; wBody.style.display = ''; searchWrap.style.display = 'none';
    renderGlossaryWorkouts();
  }
}

function renderGlossaryWorkouts() {
  const body = document.getElementById('glossary-workouts-body');
  let html = '';

  html += `<div style="font-family:'DM Mono',monospace;font-size:10px;font-weight:500;
    text-transform:uppercase;letter-spacing:0.8px;color:var(--text-dim);
    padding:8px 0 10px">Preconfigured Workouts</div>`;

  [...ORDER, ...CORE_ORDER].forEach(key => {
    const v = VARIATIONS[key];
    const wSessions = sessions.filter(s => s.variationKey === key);
    const lastDone = wSessions.slice(-1)[0];
    const lastText = lastDone
      ? `Last: ${new Date(lastDone.date).toLocaleDateString('en-US',{month:'short',day:'numeric'})}`
      : 'Never logged';
    const tb = TYPE_BG[v.type] || 'var(--surface)';
    const tt = TYPE_TEXT[v.type] || 'var(--text-dim)';
    html += `<div style="background:var(--surface);border:1px solid var(--border);
      border-radius:var(--radius);padding:14px 16px;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">
        <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;
          color:var(--text)">${v.label} — ${v.name}</div>
        <div style="background:${tb};color:${tt};font-family:'DM Mono',monospace;
          font-size:8px;font-weight:500;text-transform:uppercase;letter-spacing:0.6px;
          padding:2px 7px;border-radius:10px">${v.type}</div>
      </div>
      <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);margin-bottom:8px">
        ${v.exercises.length} exercises · ${lastText} · ${wSessions.length} sessions
      </div>
      <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);line-height:1.7">
        ${v.exercises.join(' · ')}
      </div>
    </div>`;
  });

  const customWorkouts = getCustomWorkouts();
  html += `<div style="display:flex;align-items:center;justify-content:space-between;
    padding:16px 0 10px">
    <div style="font-family:'DM Mono',monospace;font-size:10px;font-weight:500;
      text-transform:uppercase;letter-spacing:0.8px;color:var(--text-dim)">My Workouts</div>
  </div>`;

  if (customWorkouts.length === 0) {
    html += `<div style="text-align:center;padding:24px;background:var(--surface);
      border:1.5px dashed var(--border);border-radius:var(--radius);
      font-family:'DM Mono',monospace;font-size:10px;color:var(--text-dim)">
      No custom workouts yet — build one from the home screen</div>`;
  } else {
    customWorkouts.forEach(w => {
      const wSessions = sessions.filter(s => s.customWorkoutId === w.id);
      const lastDone = wSessions.slice(-1)[0];
      const lastText = lastDone
        ? `Last: ${new Date(lastDone.date).toLocaleDateString('en-US',{month:'short',day:'numeric'})}`
        : 'Never logged';
      const tb = TYPE_BG[w.inferredType] || 'var(--surface)';
      const tt = TYPE_TEXT[w.inferredType] || 'var(--text-dim)';
      html += `<div style="background:var(--surface);border:1px solid var(--border);
        border-radius:var(--radius);padding:14px 16px;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">
          <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;
            color:var(--text)">${w.name}</div>
          <div style="background:${tb};color:${tt};font-family:'DM Mono',monospace;
            font-size:8px;font-weight:500;text-transform:uppercase;letter-spacing:0.6px;
            padding:2px 7px;border-radius:10px">${w.inferredType}</div>
        </div>
        <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);margin-bottom:8px">
          ${w.exercises.length} exercises · ${lastText} · ${wSessions.length} sessions
        </div>
        <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);line-height:1.7">
          ${w.exercises.join(' · ')}
        </div>
      </div>`;
    });
  }
  body.innerHTML = html;
}

updateTimerDisplay();
showHome();
</script>
