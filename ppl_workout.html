<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0F0F0E">
<title>PPL Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --push: #C4732A;
  --push-bg: #2A1A08;
  --push-mid: #3D2210;
  --push-text: #F5C989;
  --pull: #1B9E76;
  --pull-bg: #071A14;
  --pull-mid: #0D2B20;
  --pull-text: #7FD9BB;
  --legs: #6B5FD4;
  --legs-bg: #100D2A;
  --legs-mid: #1A1640;
  --legs-text: #B5AFFE;
  --core: #888780;
  --core-bg: #161614;
  --core-text: #D4D2CC;
  --bg: #0A0A09;
  --surface: #141412;
  --surface2: #1C1C1A;
  --border: #2A2A27;
  --text: #F0EDE6;
  --text-muted: #888780;
  --text-dim: #504E4A;
  --accent: #C4732A;
  --radius: 14px;
  --radius-sm: 8px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  line-height: 1.5;
  margin: 0; padding: 0;
}

/* ── SCREENS ── */
/* Each screen is a full-page block. Only the active one is shown.
   The bottom nav is position:fixed so it never moves.
   The scroll-body has padding-bottom to clear the fixed nav. */
.screen { display: none; }
.screen.active { display: block; }

/* ── TOP BAR ── */
.topbar {
  position: sticky; top: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(var(--safe-top) + 14px) 18px 14px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  z-index: 100;
}
.topbar-title { font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
.back-btn {
  display: flex; align-items: center; gap: 6px;
  background: none; border: none; color: var(--text-muted);
  font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer; padding: 4px 0;
}
.back-btn svg { width: 18px; height: 18px; }

/* ── SCROLLABLE CONTENT ── */
.scroll-body {
  display: block;
  padding-bottom: 100px;
}

/* ── HOME SCREEN ── */
.home-header {
  padding: calc(var(--safe-top) + 20px) 18px 0;
}
.home-logo { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -1px; color: var(--text); }
.home-logo span { color: var(--accent); }
.home-date { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-dim); margin-top: 2px; letter-spacing: 0.5px; text-transform: uppercase; }

.suggestion-bar {
  margin: 18px 18px 0;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex; align-items: center; justify-content: space-between;
}
.suggestion-label { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-dim); margin-bottom: 4px; }
.suggestion-name { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; }
.suggestion-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.suggestion-go {
  background: var(--accent); color: #fff;
  border: none; border-radius: var(--radius-sm);
  font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
  padding: 10px 16px; cursor: pointer; white-space: nowrap; flex-shrink: 0; margin-left: 12px;
}

.section-label {
  font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px;
  color: var(--text-dim); margin: 22px 18px 10px;
}

/* ── NAV GRID ── */
.nav-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 8px; padding: 0 18px;
}
.nav-cell {
  border-radius: var(--radius); padding: 14px 10px 12px;
  cursor: pointer; border: 1.5px solid transparent;
  transition: transform 0.12s, border-color 0.12s;
  position: relative; overflow: hidden;
  -webkit-user-select: none; user-select: none;
}
.nav-cell:active { transform: scale(0.95); }
.nav-cell.suggested { border-color: #fff3; }
.nav-cell.suggested::after {
  content: ''; position: absolute; top: 6px; right: 6px;
  width: 6px; height: 6px; border-radius: 50%; background: #fff;
  box-shadow: 0 0 6px 2px #fff8;
}
.nav-cell.push { background: var(--push-bg); }
.nav-cell.pull { background: var(--pull-bg); }
.nav-cell.legs { background: var(--legs-bg); }

.nav-cell-tag {
  font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; opacity: 0.7;
}
.nav-cell.push .nav-cell-tag { color: var(--push-text); }
.nav-cell.pull .nav-cell-tag { color: var(--pull-text); }
.nav-cell.legs .nav-cell-tag { color: var(--legs-text); }

.nav-cell-name {
  font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; line-height: 1.2;
}
.nav-cell.push .nav-cell-name { color: var(--push-text); }
.nav-cell.pull .nav-cell-name { color: var(--pull-text); }
.nav-cell.legs .nav-cell-name { color: var(--legs-text); }

.nav-cell-sub { font-size: 10px; margin-top: 4px; opacity: 0.6; line-height: 1.3; }
.nav-cell.push .nav-cell-sub { color: var(--push-text); }
.nav-cell.pull .nav-cell-sub { color: var(--pull-text); }
.nav-cell.legs .nav-cell-sub { color: var(--legs-text); }

.nav-cell-done {
  font-family: 'DM Mono', monospace; font-size: 9px; margin-top: 8px; opacity: 0.5;
}
.nav-cell.push .nav-cell-done { color: var(--push-text); }
.nav-cell.pull .nav-cell-done { color: var(--pull-text); }
.nav-cell.legs .nav-cell-done { color: var(--legs-text); }

/* ── CALENDAR ── */
.calendar-wrap { padding: 0 18px; margin-top: 4px; }
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-month { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; }
.cal-nav { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; padding: 4px 8px; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
.cal-dow {
  font-size: 9px; font-weight: 500; text-align: center; color: var(--text-dim);
  padding: 4px 0 5px; font-family: 'DM Mono', monospace; text-transform: uppercase;
}
.cal-day {
  border-radius: 6px;
  min-height: 44px;
  display: flex; flex-direction: column; align-items: center;
  padding: 5px 2px 4px;
  font-size: 11px; color: var(--text-muted);
  position: relative; cursor: pointer;
  gap: 3px;
}
.cal-day-num {
  font-size: 11px; line-height: 1; flex-shrink: 0;
}
.cal-day.today .cal-day-num {
  background: var(--accent);
  color: #fff;
  width: 20px; height: 20px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 10px;
}
.cal-day.empty { pointer-events: none; }
.cal-day.future { color: var(--text-dim); opacity: 0.35; pointer-events: none; }
.cal-day.past-empty { cursor: pointer; }
.cal-day.past-empty:active { background: var(--surface2); }

/* ── workout bars ── */
.cal-bars { display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 0 1px; }
.cal-bar {
  width: 100%; border-radius: 3px;
  font-family: 'DM Mono', monospace; font-size: 7px; font-weight: 500;
  text-align: center; line-height: 12px; height: 12px;
  letter-spacing: 0.3px; text-transform: uppercase;
  overflow: hidden; white-space: nowrap;
}
.cal-bar.push { background: var(--push-bg); color: var(--push-text); border: 1px solid var(--push); }
.cal-bar.pull { background: var(--pull-bg); color: var(--pull-text); border: 1px solid var(--pull); }
.cal-bar.legs { background: var(--legs-bg); color: var(--legs-text); border: 1px solid var(--legs); }

/* ── add hint on tappable empty days ── */
.cal-add-hint {
  font-size: 14px; color: var(--text-dim); opacity: 0.4; line-height: 1; margin-top: 1px;
}

.cal-day-tooltip {
  font-size: 10px; color: var(--text-muted); text-align: center;
  margin-top: 6px; min-height: 16px; font-family: 'DM Mono', monospace;
}

/* ── BACKFILL SCREEN ── */
.backfill-date-banner {
  margin: 0 18px 0;
  padding: 14px 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex; align-items: center; gap: 12px;
}
.backfill-missed-badge {
  font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 1px;
  padding: 4px 10px; border-radius: 20px;
  background: #2a1a08; color: #e09a40; border: 1px solid #5a3010;
  white-space: nowrap; flex-shrink: 0;
}
.backfill-date-text {
  font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; color: var(--text);
}
.backfill-date-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

.backfill-pick-label {
  font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px;
  color: var(--text-dim); margin: 18px 18px 10px;
}
.backfill-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 8px; padding: 0 18px;
}
.backfill-cell {
  border-radius: var(--radius); padding: 12px 10px 10px;
  cursor: pointer; border: 1.5px solid transparent;
  transition: transform 0.12s, border-color 0.12s;
  -webkit-user-select: none; user-select: none;
}
.backfill-cell:active { transform: scale(0.95); }
.backfill-cell.selected { border-color: #fff5 !important; }
.backfill-cell.push { background: var(--push-bg); }
.backfill-cell.pull { background: var(--pull-bg); }
.backfill-cell.legs { background: var(--legs-bg); }
.backfill-cell-tag {
  font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; opacity: 0.7;
}
.backfill-cell.push .backfill-cell-tag { color: var(--push-text); }
.backfill-cell.pull .backfill-cell-tag { color: var(--pull-text); }
.backfill-cell.legs .backfill-cell-tag { color: var(--legs-text); }
.backfill-cell-name {
  font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; line-height: 1.2;
}
.backfill-cell.push .backfill-cell-name { color: var(--push-text); }
.backfill-cell.pull .backfill-cell-name { color: var(--pull-text); }
.backfill-cell.legs .backfill-cell-name { color: var(--legs-text); }

.backfill-log-toggle {
  margin: 16px 18px 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  cursor: pointer;
}
.backfill-log-toggle-left { font-size: 13px; font-weight: 500; color: var(--text); }
.backfill-log-toggle-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.toggle-switch {
  width: 42px; height: 24px; border-radius: 12px;
  background: var(--border); position: relative; transition: background 0.2s; flex-shrink: 0;
}
.toggle-switch.on { background: var(--accent); }
.toggle-switch::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left 0.2s;
}
.toggle-switch.on::after { left: 21px; }

.backfill-confirm-btn {
  width: 100%; padding: 15px; border-radius: var(--radius);
  font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700;
  border: none; cursor: pointer; color: #fff; letter-spacing: 0.3px;
  background: var(--accent); margin-top: 14px;
  opacity: 0.4; pointer-events: none; transition: opacity 0.2s;
}
.backfill-confirm-btn.ready { opacity: 1; pointer-events: auto; }

.backfill-existing-item {
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.backfill-del-btn {
  background: none; border: 1px solid var(--border); color: var(--text-dim);
  font-size: 11px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
}

/* ── WORKOUT SCREEN ── */
.workout-header {
  padding: 18px 18px 14px;
  border-bottom: 1px solid var(--border);
}
.workout-badge {
  display: inline-block;
  font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 1px;
  padding: 4px 10px; border-radius: 20px; margin-bottom: 8px;
}
.workout-title { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1; }
.workout-focus { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

.workout-tabs {
  position: sticky; top: calc(var(--safe-top) + 51px);
  display: flex; gap: 6px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  z-index: 90;
}
.workout-tab {
  flex: 1; padding: 8px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border); background: none;
  font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
  color: var(--text-muted); cursor: pointer; transition: all 0.15s;
}
.workout-tab.active { border-color: currentColor; }

/* ── EXERCISE CARD ── */
.ex-card {
  margin: 12px 18px 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.ex-card-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 14px 14px 10px; cursor: pointer; gap: 10px;
}
.ex-card-left { flex: 1; }
.ex-name { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; }
.ex-sets-badge {
  display: inline-block; margin-top: 4px;
  font-family: 'DM Mono', monospace; font-size: 10px;
  color: var(--text-dim); background: var(--surface2);
  padding: 2px 7px; border-radius: 4px;
}
.ex-chevron { color: var(--text-dim); font-size: 18px; flex-shrink: 0; margin-top: 2px; transition: transform 0.2s; }
.ex-card.open .ex-chevron { transform: rotate(180deg); }

.ex-desc {
  padding: 0 14px 14px;
  font-size: 13px; color: var(--text-muted); line-height: 1.6;
  border-top: 1px solid var(--border); padding-top: 12px;
  display: none;
}
.ex-card.open .ex-desc { display: block; }

/* ── SET LOGGER ── */
.set-logger { padding: 0 14px 14px; border-top: 1px solid var(--border); }
.set-logger-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0 8px;
}
.set-logger-title { font-size: 11px; font-weight: 500; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
.add-set-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text-muted); font-size: 11px; font-weight: 500;
  padding: 4px 10px; border-radius: 6px; cursor: pointer;
}
.set-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.set-num { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-dim); width: 20px; flex-shrink: 0; text-align: right; }
.set-input {
  flex: 1; background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); font-family: 'DM Mono', monospace; font-size: 13px;
  padding: 6px 10px; border-radius: 6px; outline: none; text-align: center;
  -webkit-appearance: none;
}
.set-input:focus { border-color: var(--text-dim); }
.set-input::placeholder { color: var(--text-dim); }
.set-unit { font-size: 11px; color: var(--text-dim); width: 28px; text-align: center; }
.del-set-btn { background: none; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; padding: 2px 4px; flex-shrink: 0; }

/* ── TIMER ── */
.timer-bar {
  position: fixed; bottom: 64px; left: 0; right: 0;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 10px 18px calc(var(--safe-bot) + 10px);
  display: none; align-items: center; justify-content: space-between;
  z-index: 100;
}
.timer-bar.visible { display: flex; }
.timer-display {
  font-family: 'DM Mono', monospace; font-size: 28px; font-weight: 500;
  color: var(--text); letter-spacing: 2px; min-width: 90px;
}
.timer-display.warning { color: #e05b5b; }
.timer-presets { display: flex; gap: 6px; }
.timer-preset {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text-muted); font-family: 'DM Mono', monospace; font-size: 12px;
  padding: 6px 10px; border-radius: var(--radius-sm); cursor: pointer;
}
.timer-preset.active { border-color: var(--accent); color: var(--accent); }
.timer-controls { display: flex; gap: 8px; }
.timer-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); font-size: 20px;
  width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.timer-btn.primary { background: var(--accent); border-color: var(--accent); }

.start-session-wrap { padding: 18px 18px 0; }
.start-session-btn {
  width: 100%; padding: 15px; border-radius: var(--radius);
  font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700;
  border: none; cursor: pointer; letter-spacing: 0.3px;
}

.finish-btn-wrap { padding: 14px 18px 0; }
.finish-btn {
  width: 100%; padding: 15px; border-radius: var(--radius);
  font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700;
  border: none; cursor: pointer; color: #fff; letter-spacing: 0.3px;
}

/* ── HISTORY SCREEN ── */
.history-list { padding: 0 18px; }
.history-empty { text-align: center; color: var(--text-dim); font-size: 14px; padding: 60px 0; }

/* ── date group header ── */
.history-date-group { margin-top: 20px; }
.history-date-group:first-child { margin-top: 0; }
.history-day-header {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0 6px;
}
.history-day-label {
  font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-dim);
  white-space: nowrap;
}
.history-day-line { flex: 1; height: 1px; background: var(--border); }

/* ── session card ── */
.history-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 8px;
  overflow: hidden;
}
.history-item-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 14px;
  gap: 10px;
  cursor: pointer;
  width: 100%;
  background: none;
  border: none;
  text-align: left;
  -webkit-tap-highlight-color: rgba(255,255,255,0.05);
}
.history-item-header:active { background: var(--surface2); }
.history-item-left { flex: 1; min-width: 0; }
.history-item-name {
  font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: inherit;
}
.history-item-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
.history-item-chevron {
  color: var(--text-dim); font-size: 20px; flex-shrink: 0;
  transition: transform 0.2s; line-height: 1; display: block;
}
.history-item.open .history-item-chevron { transform: rotate(180deg); }

/* ── session detail panel ── */
.history-detail {
  display: none;
  border-top: 1px solid var(--border);
  padding: 10px 14px 14px;
}
.history-item.open .history-detail { display: block; }

.history-ex-block { margin-bottom: 12px; }
.history-ex-block:last-child { margin-bottom: 0; }
.history-ex-name {
  font-size: 12px; font-weight: 500; color: var(--text);
  margin-bottom: 6px; padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.history-set-row {
  display: flex; align-items: center; gap: 8px;
  padding: 3px 0; font-family: 'DM Mono', monospace; font-size: 12px;
}
.history-set-num { color: var(--text-dim); width: 18px; text-align: right; flex-shrink: 0; }
.history-set-val { color: var(--text); }
.history-set-sep { color: var(--text-dim); }
.history-no-sets { font-size: 12px; color: var(--text-dim); font-style: italic; }
.history-missed-badge {
  display: inline-block; font-family: 'DM Mono', monospace; font-size: 9px;
  font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px;
  padding: 3px 8px; border-radius: 20px;
  background: #2a1a08; color: #e09a40; border: 1px solid #5a3010;
  margin-bottom: 8px;
}

.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  display: flex;
  border-top: 1px solid var(--border);
  background: var(--bg);
  padding-bottom: var(--safe-bot);
  z-index: 200;
}
.bnav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 10px 8px; background: none; border: none; cursor: pointer;
  color: var(--text-dim); gap: 3px;
}
.bnav-btn.active { color: var(--accent); }
.bnav-btn svg { width: 22px; height: 22px; }
.bnav-btn span { font-size: 10px; font-weight: 500; }

.core-section-head {
  margin: 20px 18px 10px;
  display: flex; align-items: center; gap: 10px;
}
.core-badge {
  font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 1px;
  padding: 4px 10px; border-radius: 20px;
  background: var(--core-bg); color: var(--core-text);
  border: 1px solid var(--border);
}
.core-focus-txt { font-size: 12px; color: var(--text-muted); flex: 1; line-height: 1.4; }

.session-toast {
  position: fixed; top: calc(var(--safe-top) + 20px); left: 50%; transform: translateX(-50%) translateY(-20px);
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 500;
  opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 200; white-space: nowrap;
}
.session-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
.timer-display.running { animation: pulse 1s infinite; }

/* ── DATA SCREEN ── */
.data-section-card {
  margin: 12px 18px 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.data-section-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
}
.data-section-row:last-child { border-bottom: none; }
.data-row-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; font-family: 'DM Mono', monospace; margin-bottom: 3px; }
.data-row-value { font-size: 14px; font-weight: 500; color: var(--text); }
.data-action-btn {
  width: 100%; padding: 15px; border-radius: var(--radius);
  font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700;
  border: none; cursor: pointer; letter-spacing: 0.3px; margin-top: 12px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.data-action-btn.export { background: var(--pull-bg); color: var(--pull-text); border: 1px solid var(--pull); }
.data-action-btn.import { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.data-action-btn.danger { background: #1a0808; color: #e05b5b; border: 1px solid #5a1010; }
.data-info-box {
  margin: 12px 18px 0; padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 12px; color: var(--text-muted); line-height: 1.6;
}
.data-info-box strong { color: var(--text); }
#import-file-input { display: none; }

/* ── PERSONAL BESTS SCREEN ── */
.pb-exercise-card {
  margin: 0 18px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.pb-ex-header {
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--border);
}
.pb-ex-name { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: var(--text); }
.pb-ex-tag { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px; margin-top: 2px; }

.pb-record {

.pb-toast {

.pb-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

const ORDER = ['push_a','pull_a','legs_a','push_b','pull_b','legs_b','push_c','pull_c','legs_c'];

const TYPE_TEXT  = { push:'var(--push-text)', pull:'var(--pull-text)', legs:'var(--legs-text)' };

// ════════════════════════════════════════════════════════════════════════════
// SUGGESTION LOGIC
// ════════════════════════════════════════════════════════════════════════════
function getSuggested() {
  if (!sessions.length) return 'push_a';
  const last = sessions[sessions.length - 1].variationKey;
  const idx = ORDER.indexOf(last);
  return ORDER[(idx + 1) % ORDER.length];
}

// ════════════════════════════════════════════════════════════════════════════
// HOME SCREEN
// ════════════════════════════════════════════════════════════════════════════
function showHome() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-home').classList.add('active');
  renderHome();
}

function renderHome() {
  const now = new Date();
  document.getElementById('home-date').textContent =
    now.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'}).toUpperCase();

  const suggested = getSuggested();
  const sv = VARIATIONS[suggested];
  const container = document.getElementById('suggestion-container');
  container.innerHTML = `
    <div class="suggestion-bar">
      <div>
        <div class="suggestion-label">Up next</div>
        <div class="suggestion-name" style="color:${TYPE_COLOR[sv.type]}">${sv.label} — ${sv.name}</div>
        <div class="suggestion-sub">${sv.focus.substring(0,60)}…</div>
      </div>
      <button class="suggestion-go" style="background:${TYPE_COLOR[sv.type]}" onclick="openVariation('${suggested}')">Start</button>
    </div>`;

  const grid = document.getElementById('nav-grid');
  grid.innerHTML = '';
  ORDER.forEach(key => {
    const v = VARIATIONS[key];
    const isSuggested = key === suggested;
    const lastDone = sessions.filter(s => s.variationKey === key).slice(-1)[0];
    const doneText = lastDone
      ? `Last: ${new Date(lastDone.date).toLocaleDateString('en-US',{month:'short',day:'numeric'})}`
      : '';
    grid.innerHTML += `
      <div class="nav-cell ${v.type}${isSuggested?' suggested':''}" onclick="openVariation('${key}')">
        <div class="nav-cell-tag">${v.label}</div>
        <div class="nav-cell-name">${v.name}</div>
        <div class="nav-cell-sub">${v.focus.split(',')[0]}</div>
        ${doneText ? `<div class="nav-cell-done">${doneText}</div>` : ''}
      </div>`;
  });

  renderCalendar();
  renderRecent();
}

function renderRecent() {
  const container = document.getElementById('recent-sessions');
  const recent = [...sessions].reverse().slice(0, 3);
  if (!recent.length) {
    container.innerHTML = '<div style="color:var(--text-dim);font-size:13px;padding:4px 0 16px">No sessions yet — start your first workout above.</div>';
    return;
  }
  container.innerHTML = recent.map(s => renderHistorySessionCard(s)).join('');
}

// ════════════════════════════════════════════════════════════════════════════
// CALENDAR
// ════════════════════════════════════════════════════════════════════════════
function renderCalendar() {
  const y = calViewDate.getFullYear(), m = calViewDate.getMonth();
  document.getElementById('cal-month-label').textContent =
    new Date(y, m, 1).toLocaleDateString('en-US', {month:'long', year:'numeric'});

  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const today = new Date();
  const todayY = today.getFullYear(), todayM = today.getMonth(), todayD = today.getDate();

  // Build a richer map: date -> array of {type, label} in session order
  const sessionsByDate = {};
  sessions.forEach(s => {
    const sd = new Date(s.date);
    if (sd.getFullYear() === y && sd.getMonth() === m) {
      const key = sd.getDate();
      if (!sessionsByDate[key]) sessionsByDate[key] = [];
      const v = VARIATIONS[s.variationKey];
      sessionsByDate[key].push({ type: v.type, label: v.label, key: s.variationKey });
    }
  });

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = ['S','M','T','W','T','F','S'].map(d =>
    `<div class="cal-dow">${d}</div>`).join('');

  for (let i = 0; i < firstDay; i++)
    grid.innerHTML += `<div class="cal-day empty"></div>`;

  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = todayY===y && todayM===m && todayD===d;
    const cellDate = new Date(y, m, d);
    const todayDate = new Date(todayY, todayM, todayD);
    const isFuture = cellDate > todayDate;
    const daySessions = sessionsByDate[d] || [];
    const isPastEmpty = !daySessions.length && !isToday && !isFuture;
    const extraClass = isFuture ? 'future' : (isPastEmpty ? 'past-empty' : '');

    // Build bars — one per session on that day, showing variation letter (e.g. "Push A")
    let barsHtml = '';
    if (daySessions.length) {
      barsHtml = `<div class="cal-bars">` +
        daySessions.map(s =>
          `<div class="cal-bar ${s.type}">${s.label}</div>`
        ).join('') +
        `</div>`;
    } else if (isPastEmpty) {
      barsHtml = `<div class="cal-add-hint">+</div>`;
    }

    grid.innerHTML += `<div class="cal-day ${isToday ? 'today' : ''} ${extraClass}"
      onclick="calDayClick(${d},${y},${m},${isFuture},${daySessions.length > 0})">
      <div class="cal-day-num">${d}</div>
      ${barsHtml}
    </div>`;
  }
}

function calDayClick(d, y, m, isFuture, hasSessions) {
  const tooltip = document.getElementById('cal-tooltip');
  if (isFuture) return;

  const daySessions = sessions.filter(s => {
    const sd = new Date(s.date);
    return sd.getFullYear()===y && sd.getMonth()===m && sd.getDate()===d;
  });

  if (daySessions.length) {
    tooltip.textContent = daySessions.map(s =>
      VARIATIONS[s.variationKey].label + ' — ' + VARIATIONS[s.variationKey].name
    ).join(' · ');
    // Open backfill screen showing existing sessions for that day with option to add more
    openBackfill(d, y, m, daySessions);
  } else {
    tooltip.textContent = '';
    openBackfill(d, y, m, []);
  }
}

// BACKFILL SCREEN

let backfillDate = null;   // { d, y, m }
let backfillSelectedKey = null;
let backfillLogSets = false;
let backfillExercises = [];  // set log data if logging

function openBackfill(d, y, m, existingSessions) {
  backfillDate = { d, y, m };
  backfillSelectedKey = null;
  backfillLogSets = false;
  backfillExercises = [];
  renderBackfillScreen(existingSessions);
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-backfill').classList.add('active');
}

function closeBackfill() {
  backfillDate = null;
  backfillSelectedKey = null;
  backfillLogSets = false;
  backfillExercises = [];
  showHome();
}

function renderBackfillScreen(existingSessions) {
  const { d, y, m } = backfillDate;
  const dateObj = new Date(y, m, d);
  const dateStr = dateObj.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'});
  const existing = existingSessions || sessions.filter(s => {
    const sd = new Date(s.date);
    return sd.getFullYear()===y && sd.getMonth()===m && sd.getDate()===d;
  });

  let html = `
    <div style="height:16px"></div>
    <div class="backfill-date-banner">
      <div>
        <div class="backfill-missed-badge">Missed Workout</div>
        <div class="backfill-date-text" style="margin-top:6px">${dateStr}</div>
        <div class="backfill-date-sub">Log a workout for this day</div>
      </div>
    </div>`;

  // Show existing sessions for this day if any
  if (existing.length) {
    html += `<div class="backfill-pick-label">Already logged this day</div>`;
    existing.forEach(s => {
      const v = VARIATIONS[s.variationKey];
      const sets = s.exercises.reduce((a, e) => a + e.sets.filter(st => st.reps).length, 0);
      html += `<div style="padding:0 18px">
        <div class="backfill-existing-item" style="background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:6px">
          <div>
            <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:${TYPE_COLOR[v.type]}">${v.label} — ${v.name}</div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${sets} sets logged</div>
          </div>
          <button class="backfill-del-btn" onclick="deleteBackfillSession('${s.id}')">Remove</button>
        </div>
      </div>`;
    });
    html += `<div class="backfill-pick-label">Add another workout</div>`;
  } else {
    html += `<div class="backfill-pick-label">Which workout did you do?</div>`;
  }

  // Variation picker grid
  html += `<div class="backfill-grid">`;
  ORDER.forEach(key => {
    const v = VARIATIONS[key];
    const isSelected = backfillSelectedKey === key;
    html += `<div class="backfill-cell ${v.type}${isSelected?' selected':''}"
      onclick="selectBackfillVariation('${key}')">
      <div class="backfill-cell-tag">${v.label}</div>
      <div class="backfill-cell-name">${v.name}</div>
    </div>`;
  });
  html += `</div>`;

  // Log sets toggle
  html += `<div class="backfill-log-toggle" onclick="toggleBackfillLog()">
    <div>
      <div class="backfill-log-toggle-left">Log sets & weights</div>
      <div class="backfill-log-toggle-sub">Optional — add your numbers for this session</div>
    </div>
    <div class="toggle-switch${backfillLogSets?' on':''}" id="backfill-toggle-sw"></div>
  </div>`;

  // Set logging area (if toggled on and variation selected)
  if (backfillLogSets && backfillSelectedKey) {
    const v = VARIATIONS[backfillSelectedKey];
    const allEx = [...v.exercises, ...v.core];
    html += `<div style="margin-top:4px">`;
    allEx.forEach((ex, i) => {
      const bfEx = backfillExercises.find(e => e.idx === i) || null;
      const sets = bfEx ? bfEx.sets : [{reps:'',weight:''}];
      html += `<div class="ex-card" id="bf-ex-${i}" style="margin:10px 18px 0">
        <div class="ex-card-header" onclick="toggleEx('bf-ex-${i}')">
          <div class="ex-card-left">
            <div class="ex-name">${ex.name}</div>
            <div class="ex-sets-badge">${ex.sets}</div>
          </div>
          <div class="ex-chevron">⌄</div>
        </div>
        <div class="ex-desc">${ex.desc}</div>
        <div class="set-logger">
          <div class="set-logger-head">
            <div class="set-logger-title">Sets</div>
            <button class="add-set-btn" onclick="bfAddSet(${i})">+ Set</button>
          </div>
          ${sets.map((s, si) => `
            <div class="set-row">
              <div class="set-num">${si+1}</div>
              <input class="set-input" type="number" inputmode="decimal" placeholder="reps"
                value="${s.reps}" onchange="bfUpdateSet(${i},${si},'reps',this.value)" style="max-width:70px">
              <div class="set-unit">×</div>
              <input class="set-input" type="number" inputmode="decimal" placeholder="lbs"
                value="${s.weight}" onchange="bfUpdateSet(${i},${si},'weight',this.value)">
              <div class="set-unit">lbs</div>
              <button class="del-set-btn" onclick="bfDelSet(${i},${si})">×</button>
            </div>`).join('')}
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  // Confirm button
  const isReady = !!backfillSelectedKey;
  html += `<div style="padding:0 18px">
    <button class="backfill-confirm-btn${isReady?' ready':''}" onclick="saveBackfillSession()">
      ${backfillLogSets ? 'Save Session with Sets' : 'Save Session'}
    </button>
  </div>`;

  document.getElementById('backfill-body').innerHTML = html;
}

function selectBackfillVariation(key) {
  backfillSelectedKey = key;
  backfillExercises = [];
  renderBackfillScreen();
}

function toggleBackfillLog() {
  backfillLogSets = !backfillLogSets;
  backfillExercises = [];
  renderBackfillScreen();
}

function bfGetOrCreateEx(idx) {
  let ex = backfillExercises.find(e => e.idx === idx);
  if (!ex) { ex = {idx, sets:[{reps:'',weight:''}]}; backfillExercises.push(ex); }
  return ex;
}

function bfUpdateSet(exIdx, setIdx, field, value) {
  const ex = bfGetOrCreateEx(exIdx);
  if (!ex.sets[setIdx]) ex.sets[setIdx] = {reps:'',weight:''};
  ex.sets[setIdx][field] = value;
}

function bfAddSet(exIdx) {
  const ex = bfGetOrCreateEx(exIdx);
  ex.sets.push({reps:'',weight:''});
  renderBackfillScreen();
  setTimeout(() => {
    const card = document.getElementById('bf-ex-' + exIdx);
    if (card) card.classList.add('open');
  }, 10);
}

function bfDelSet(exIdx, setIdx) {
  const ex = bfGetOrCreateEx(exIdx);
  if (ex.sets.length > 1) {
    ex.sets.splice(setIdx, 1);
    renderBackfillScreen();
    setTimeout(() => {
      const card = document.getElementById('bf-ex-' + exIdx);
      if (card) card.classList.add('open');
    }, 10);
  }
}

function deleteBackfillSession(sessionId) {
  const idx = sessions.findIndex(s => String(s.id) === String(sessionId));
  if (idx !== -1) {
    sessions.splice(idx, 1);
    saveSessions();
    showToast('Session removed');
    renderBackfillScreen();
  }
}

function saveBackfillSession() {
  if (!backfillSelectedKey) return;
  const { d, y, m } = backfillDate;
  const v = VARIATIONS[backfillSelectedKey];

  // Build exercises array
  let exercises;
  if (backfillLogSets && backfillExercises.length) {
    exercises = backfillExercises.map(e => {
      const allEx = [...v.exercises, ...v.core];
      return {
        key: 'main_' + e.idx,
        name: allEx[e.idx] ? allEx[e.idx].name : '',
        sets: e.sets
      };
    });
  } else {
    exercises = [];
  }

  // Set time to noon on that date to avoid timezone edge cases
  const sessionDate = new Date(y, m, d, 12, 0, 0);

  const session = {
    id: Date.now(),
    date: sessionDate.toISOString(),
    variationKey: backfillSelectedKey,
    tab: 'main',
    missed: true,
    exercises
  };

  sessions.push(session);
  // Sort sessions by date so history renders correctly
  sessions.sort((a, b) => new Date(a.date) - new Date(b.date));
  saveSessions();
  showToast('Missed workout saved ✓');
  setTimeout(() => { closeBackfill(); }, 1000);
}

function openVariation(key) {
  currentVariation = VARIATIONS[key];
  currentTab = 'main';
  activeSession = null;
  renderWorkoutScreen();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-workout').classList.add('active');
  document.getElementById('workout-body').scrollTop = 0;
  document.getElementById('timer-bar').classList.remove('visible');

function renderWorkoutScreen() {
  const v = currentVariation;
  const tc = TYPE_COLOR[v.type], bg = TYPE_BG[v.type], tt = TYPE_TEXT[v.type];

  document.getElementById('workout-topbar-title').textContent = v.label;

  document.getElementById('workout-header').innerHTML = `
    <div class="workout-badge" style="background:${bg};color:${tt}">${v.label} — ${v.type.toUpperCase()}</div>

function switchTab(tab) {

  renderWorkoutScreen();

}

function renderExercises() {
  const v = currentVariation;
  const body = document.getElementById('workout-body');
  const exercises = currentTab === 'main' ? v.exercises : v.core;
  const isLogging = !!activeSession;
  const tc = TYPE_COLOR[v.type];

  let html = '';

  if (currentTab === 'core') {
    html += `<div class="core-section-head">
      <div class="core-badge">Core Finisher</div>
      <div class="core-focus-txt">${v.coreFocus}</div>
    </div>`;
  }

  if (!isLogging) {
    html += `<div class="start-session-wrap">
      <button class="start-session-btn" 
        style="background:${currentTab==='main'?tc:'var(--core)'};color:#fff"
        onclick="startSession()">
        Start ${currentTab==='main'?'Workout':'Core Finisher'}
      </button>
    </div>`;
  } else {
    document.getElementById('finish-session-top').style.display = 'block';
    document.getElementById('timer-bar').classList.add('visible');
  }

  exercises.forEach((ex, i) => {
    const exKey = (currentTab === 'main' ? 'main_' : 'core_') + i;
    const sessionEx = isLogging

      : null;

    html += `<div class="ex-card" id="ex-card-${exKey}">
      <div class="ex-card-header" onclick="toggleEx('${exKey}')">

          <div class="ex-name">${ex.name}</div>
          <div class="ex-sets-badge">${ex.sets}</div>
        </div>
        <div class="ex-chevron">⌄</div>
      </div>
      <div class="ex-desc">${ex.desc}</div>`;

    if (isLogging) {
      const sets = sessionEx ? sessionEx.sets : [{reps:'',weight:''}];
      html += `<div class="set-logger">
        <div class="set-logger-head">
          <div class="set-logger-title">Sets logged</div>
          <button class="add-set-btn" onclick="addSet('${exKey}')">+ Set</button>
        </div>
        ${sets.map((s, si) => `
          <div class="set-row" id="set-row-${exKey}-${si}">
            <div class="set-num">${si+1}</div>
            <input class="set-input" type="number" inputmode="decimal" placeholder="reps"
              value="${s.reps}" onchange="updateSet('${exKey}',${si},'reps',this.value)" style="max-width:70px">
            <div class="set-unit">×</div>
            <input class="set-input" type="number" inputmode="decimal" placeholder="lbs"
              value="${s.weight}" onchange="updateSet('${exKey}',${si},'weight',this.value)">
            <div class="set-unit">lbs</div>
            <button class="del-set-btn" onclick="deleteSet('${exKey}',${si})">×</button>

    html += `</div>`; // end ex-card
  });

  if (isLogging) {
    html += `<div class="finish-btn-wrap">
      <button class="finish-btn"
        style="background:${currentTab==='main'?tc:'var(--core)'}"
        onclick="finishSession()">
        Finish & Save
      </button>

  body.innerHTML = html;

function toggleEx(key) {
  const card = document.getElementById('ex-card-' + key);
  card.classList.toggle('open');
}

// SESSION LOGGING
// ════════════════════════════════════════════════════════════════════════════
function startSession() {
  const exercises = (currentTab === 'main' ? currentVariation.exercises : currentVariation.core)
    .map((ex, i) => ({
      key: (currentTab==='main'?'main_':'core_') + i,
      name: ex.name,
      sets: [{reps:'', weight:''}]
    }));
  activeSession = {
    id: Date.now(),
    date: new Date().toISOString(),
    variationKey: currentVariation.key,
    tab: currentTab,
    exercises
  };
  renderExercises();
}

function updateSet(exKey, setIdx, field, value) {
  if (!activeSession) return;
  let ex = activeSession.exercises.find(e => e.key === exKey);
  if (!ex) { ex = {key:exKey, name:'', sets:[]}; activeSession.exercises.push(ex); }
  if (!ex.sets[setIdx]) ex.sets[setIdx] = {reps:'',weight:''};
  ex.sets[setIdx][field] = value;
}

function addSet(exKey) {
  if (!activeSession) return;
  let ex = activeSession.exercises.find(e => e.key === exKey);
  if (!ex) { ex = {key:exKey, name:'', sets:[]}; activeSession.exercises.push(ex); }
  ex.sets.push({reps:'', weight:''});
  renderExercises();
  // Re-open the card
  setTimeout(() => {
    const card = document.getElementById('ex-card-' + exKey);
    if (card) card.classList.add('open');
  }, 10);
}

function deleteSet(exKey, setIdx) {
  if (!activeSession) return;
  const ex = activeSession.exercises.find(e => e.key === exKey);
  if (ex && ex.sets.length > 1) {
    ex.sets.splice(setIdx, 1);
    renderExercises();
    setTimeout(() => {
      const card = document.getElementById('ex-card-' + exKey);
      if (card) card.classList.add('open');
    }, 10);
  }
}

function finishSession() {
  if (!activeSession) return;
  sessions.push(activeSession);
  saveSessions();
  activeSession = null;
  document.getElementById('finish-session-top').style.display = 'none';
  document.getElementById('timer-bar').classList.remove('visible');
  stopTimer();
  showToast('Session saved ✓');
  setTimeout(() => showHome(), 1200);
}

// TIMER
// ════════════════════════════════════════════════════════════════════════════
function updateTimerDisplay() {
  const m = Math.floor(timerSeconds / 60);
  const s = timerSeconds % 60;
  const el = document.getElementById('timer-display');
  el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  el.classList.toggle('warning', timerSeconds <= 10 && timerSeconds > 0);
  el.classList.toggle('running', timerRunning);
}

function toggleTimer() {
  if (timerRunning) {
    stopTimer();
  } else {
    timerRunning = true;
    document.getElementById('timer-play-btn').textContent = '⏸';
    timerInterval = setInterval(() => {
      if (timerSeconds > 0) {
        timerSeconds--;
        updateTimerDisplay();
      } else {
        stopTimer();
        if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
        showToast('Rest time up!');
      }
    }, 1000);
  }
}

function stopTimer() {
  timerRunning = false;
  clearInterval(timerInterval);
  const btn = document.getElementById('timer-play-btn');
  if (btn) btn.textContent = '▶';
  updateTimerDisplay();
}

function resetTimer() {
  stopTimer();
  timerSeconds = timerMax;
  updateTimerDisplay();
}

function setTimerPreset(secs) {
  stopTimer();
  timerMax = secs;
  timerSeconds = secs;
  document.querySelectorAll('.timer-preset').forEach(b => {
    b.classList.toggle('active', parseInt(b.textContent) === secs/60 || b.textContent === '90s');
  });
  updateTimerDisplay();
}

function renderHistorySessionCard(s, showDate) {
  const v = VARIATIONS[s.variationKey];
  const totalSets = s.exercises.reduce((acc, e) => acc + e.sets.filter(st => st.reps).length, 0);
  const hasAnyData = totalSets > 0;

  // Build exercise detail blocks
  let detailHtml = '';
  if (s.missed && !hasAnyData) {
    detailHtml += `<div class="history-missed-badge">Missed / No sets logged</div>`;
  }

  const loggedExercises = s.exercises.filter(e => e.sets && e.sets.some(st => st.reps));
  if (loggedExercises.length) {
    loggedExercises.forEach(ex => {
      const validSets = ex.sets.filter(st => st.reps);
      detailHtml += `<div class="history-ex-block">
        <div class="history-ex-name">${ex.name}</div>
        ${validSets.map((st, i) => {
          const reps = st.reps || '—';
          const weight = st.weight ? `${st.weight} lbs` : '';
          const val = weight ? `${reps} reps × ${weight}` : `${reps} reps`;
          return `<div class="history-set-row">
            <div class="history-set-num">${i + 1}</div>
            <div class="history-set-val">${val}</div>
          </div>`;
        }).join('')}
      </div>`;
    });
  } else if (!s.missed) {
    detailHtml += `<div class="history-no-sets">No sets recorded for this session.</div>`;
  }

  const metaParts = [];
  if (totalSets) metaParts.push(`${totalSets} set${totalSets !== 1 ? 's' : ''}`);
  if (s.missed) metaParts.push('retroactive');
  const meta = metaParts.join(' · ') || 'No sets logged';

  return `<div class="history-item" id="hist-${s.id}">
    <button class="history-item-header" onclick="toggleHistoryItem('${s.id}')">
      <div class="history-item-left">
        <div class="history-item-name" style="color:${TYPE_COLOR[v.type]}">${v.label} — ${v.name}</div>
        <div class="history-item-meta">${meta}</div>
      </div>
      <span class="history-item-chevron">⌄</span>
    </button>
    <div class="history-detail">${detailHtml}</div>
  </div>`;
}

function renderHistory() {
  const list = document.getElementById('history-list');
  if (!sessions.length) {
    list.innerHTML = '<div class="history-empty">No sessions logged yet.</div>';
    return;
  }

  // Group sessions by calendar date (most recent first)
  const grouped = {};
  [...sessions].reverse().forEach(s => {
    const d = new Date(s.date);
    const key = d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
    if (!grouped[key]) grouped[key] = { label: key, sessions: [], dateObj: d };
    grouped[key].sessions.push(s);
  });

  list.innerHTML = Object.values(grouped).map(group => {
    const today = new Date();
    const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
    const gd = group.dateObj;
    let label = group.label;
    if (gd.toDateString() === today.toDateString()) label = 'Today';
    else if (gd.toDateString() === yesterday.toDateString()) label = 'Yesterday';

    const cards = group.sessions.map(s => renderHistorySessionCard(s)).join('');
    return `<div class="history-date-group">
      <div class="history-day-header">
        <div class="history-day-label">${label}</div>
        <div class="history-day-line"></div>
      </div>
      ${cards}
    </div>`;
  }).join('');
}

// ════════════════════════════════════════════════════════════════════════════
// PERSONAL BESTS ENGINE
// ════════════════════════════════════════════════════════════════════════════

// Compute PBs from all sessions. Returns map: exName -> { weight, reps, weightDate, repsDate }
function computePBs() {
  const pbs = {};
  sessions.forEach(s => {
    s.exercises.forEach(ex => {
      if (!ex.name) return;
      ex.sets.forEach(set => {
        const reps = parseFloat(set.reps);
        const weight = parseFloat(set.weight);
        if (!pbs[ex.name]) pbs[ex.name] = { weight: 0, reps: 0, weightDate: null, repsDate: null, variationKey: s.variationKey };
        if (!isNaN(weight) && weight > pbs[ex.name].weight) {
          pbs[ex.name].weight = weight;
          pbs[ex.name].weightDate = s.date;
          pbs[ex.name].variationKey = s.variationKey;
        }
        if (!isNaN(reps) && reps > pbs[ex.name].reps) {
          pbs[ex.name].reps = reps;
          pbs[ex.name].repsDate = s.date;
        }
      });
    });
  });
  return pbs;
}

// Check the most recently saved session for new PBs and fire notifications
function checkAndAutoSyncPBs() {
  if (!sessions.length) return;
  const latest = sessions[sessions.length - 1];
  const allPrevious = sessions.slice(0, -1);

  // Build PBs from all sessions EXCEPT the latest
  const prevPBs = {};
  allPrevious.forEach(s => {
    s.exercises.forEach(ex => {
      if (!ex.name) return;
      ex.sets.forEach(set => {
        const reps = parseFloat(set.reps);
        const weight = parseFloat(set.weight);
        if (!prevPBs[ex.name]) prevPBs[ex.name] = { weight: 0, reps: 0 };
        if (!isNaN(weight) && weight > prevPBs[ex.name].weight) prevPBs[ex.name].weight = weight;
        if (!isNaN(reps) && reps > prevPBs[ex.name].reps) prevPBs[ex.name].reps = reps;
      });
    });
  });

  // Check latest session for beats
  const newPBs = [];
  latest.exercises.forEach(ex => {
    if (!ex.name) return;
    ex.sets.forEach(set => {
      const reps = parseFloat(set.reps);
      const weight = parseFloat(set.weight);
      const prev = prevPBs[ex.name] || { weight: 0, reps: 0 };
      if (!isNaN(weight) && weight > 0 && weight > prev.weight) {
        const shortName = ex.name.split(' ').slice(0, 3).join(' ');
        if (!newPBs.find(p => p.name === shortName && p.type === 'weight')) {
          newPBs.push({ name: shortName, type: 'weight', value: weight });
        }
      }
      if (!isNaN(reps) && reps > 0 && reps > prev.reps) {
        const shortName = ex.name.split(' ').slice(0, 3).join(' ');
        if (!newPBs.find(p => p.name === shortName && p.type === 'reps')) {
          newPBs.push({ name: shortName, type: 'reps', value: reps });
        }
      }
    });
  });

  // Fire PB notifications with staggered timing
  newPBs.slice(0, 3).forEach((pb, i) => {
    setTimeout(() => {
      const unit = pb.type === 'weight' ? 'lbs' : 'reps';
      showPBToast(`New ${pb.type} record — ${pb.name}: ${pb.value} ${unit}`);
    }, i * 2600);
  });
}

let pbToastTimeout;
function showPBToast(msg) {
  const el = document.getElementById('pb-toast');
  const msgEl = document.getElementById('pb-toast-msg');
  msgEl.textContent = msg;
  el.classList.add('show');
  clearTimeout(pbToastTimeout);
  pbToastTimeout = setTimeout(() => el.classList.remove('show'), 3000);
}

// ════════════════════════════════════════════════════════════════════════════
// PERSONAL BESTS SCREEN
// ════════════════════════════════════════════════════════════════════════════
function showBests() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-bests').classList.add('active');
  renderBestsScreen();
}

function renderBestsScreen() {
  const body = document.getElementById('bests-body');
  const pbs = computePBs();
  const exNames = Object.keys(pbs);

  if (!exNames.length) {
    body.innerHTML = `<div class="pb-empty">No personal bests yet.<br>Start logging sets and they will appear here.</div>`;
    return;
  }

  // Group exercises by variation type
  const byType = { push: [], pull: [], legs: [] };
  exNames.forEach(name => {
    const pb = pbs[name];
    const v = VARIATIONS[pb.variationKey];
    if (v && byType[v.type]) byType[v.type].push({ name, pb, type: v.type });
  });
  // Catch any exercises not tied to a variation (e.g. core)
  const ungrouped = exNames.filter(name => {
    const v = VARIATIONS[pbs[name].variationKey];
    return !v || !byType[v.type];
  }).map(name => ({ name, pb: pbs[name], type: 'core' }));

  let html = '<div style="height:14px"></div>';

  const groups = [
    { key: 'push', label: 'Push', color: TYPE_COLOR.push, bg: TYPE_BG.push, text: 'var(--push-text)' },
    { key: 'pull', label: 'Pull', color: TYPE_COLOR.pull, bg: TYPE_BG.pull, text: 'var(--pull-text)' },
    { key: 'legs', label: 'Legs', color: TYPE_COLOR.legs, bg: TYPE_BG.legs, text: 'var(--legs-text)' },
  ];
  if (ungrouped.length) groups.push({ key: 'core', label: 'Core', color: 'var(--core)', bg: 'var(--core-bg)', text: 'var(--core-text)' });

  groups.forEach(g => {
    const items = g.key === 'core' ? ungrouped : byType[g.key];
    if (!items || !items.length) return;

    html += `<div class="section-label" style="color:${g.color}">${g.label} Exercises</div>`;

    items.forEach(({ name, pb }) => {
      const hasWeight = pb.weight > 0;
      const hasReps = pb.reps > 0;
      if (!hasWeight && !hasReps) return;

      html += `<div class="pb-exercise-card">
        <div class="pb-ex-header">
          <div class="pb-ex-name">${name}</div>
          <div class="pb-ex-tag" style="color:${g.color}">${g.label}</div>
        </div>
        <div class="pb-records">`;

      if (hasWeight) {
        const d = pb.weightDate ? new Date(pb.weightDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
        html += `<div class="pb-record">
          <div class="pb-record-label">Max weight</div>
          <div class="pb-record-value" style="color:${g.color}">${pb.weight}</div>
          <div class="pb-record-unit">lbs</div>
          <div class="pb-record-date">${d}</div>
        </div>`;
      }
      if (hasReps) {
        const d = pb.repsDate ? new Date(pb.repsDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
        html += `<div class="pb-record">
          <div class="pb-record-label">Max reps</div>
          <div class="pb-record-value" style="color:${g.color}">${pb.reps}</div>
          <div class="pb-record-unit">reps</div>
          <div class="pb-record-date">${d}</div>
        </div>`;
      }
      if (!hasWeight && hasReps) {
        html += `<div class="pb-record" style="opacity:0.2"><div class="pb-record-label">Max weight</div><div class="pb-record-value">—</div></div>`;
      }
      if (hasWeight && !hasReps) {
        html += `<div class="pb-record" style="opacity:0.2"><div class="pb-record-label">Max reps</div><div class="pb-record-value">—</div></div>`;
      }

      html += `</div></div>`;
    });
  });

  body.innerHTML = html;
}

// ════════════════════════════════════════════════════════════════════════════
// DATA & BACKUP SCREEN
// ════════════════════════════════════════════════════════════════════════════
function showData() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-data').classList.add('active');
  renderDataScreen();
}

function renderDataScreen() {
  const body = document.getElementById('data-body');
  const totalSets = sessions.reduce((acc, s) =>
    acc + s.exercises.reduce((a, e) => a + e.sets.filter(st => st.reps).length, 0), 0);
  const firstSession = sessions.length ? new Date(sessions[0].date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
  const pbs = computePBs();
  const pbCount = Object.keys(pbs).length;

  const html = `
    <div style="height:16px"></div>
    <div class="section-label">Your data</div>
    <div class="data-section-card">
      <div class="data-section-row">
        <div><div class="data-row-label">Total sessions</div><div class="data-row-value">${sessions.length}</div></div>
      </div>
      <div class="data-section-row">
        <div><div class="data-row-label">Total sets logged</div><div class="data-row-value">${totalSets}</div></div>
      </div>
      <div class="data-section-row">
        <div><div class="data-row-label">Exercises with PBs</div><div class="data-row-value">${pbCount}</div></div>
      </div>
      <div class="data-section-row">
        <div><div class="data-row-label">Tracking since</div><div class="data-row-value">${firstSession}</div></div>
      </div>
    </div>

    <div class="section-label" style="margin-top:20px">Backup & restore</div>
    <div class="data-info-box">
      <strong>Export</strong> saves all your sessions, sets, weights, and personal bests to a <code>.json</code>
      file in your Downloads folder.  <strong>Import</strong> loads a previously exported file and merges
      it with your current data — no sessions are deleted.  Back up every week or two for peace of mind.
    </div>
    <div style="padding:0 18px">
      <button class="data-action-btn export" onclick="exportData()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export to Downloads
      </button>
      <button class="data-action-btn import" onclick="triggerImport()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,14 12,9 17,14"/><line x1="12" y1="9" x2="12" y2="21"/></svg>
        Import from File
      </button>
    </div>

    <div class="section-label" style="margin-top:20px">Danger zone</div>
    <div class="data-info-box" style="border-color:#5a1010;background:#1a0808;color:#c07070">
      Clearing all data is permanent and cannot be undone.  Export a backup first if you want to keep your history.
    </div>
    <div style="padding:0 18px">
      <button class="data-action-btn danger" onclick="confirmClearData()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3,6 5,6 21,6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        Clear All Data
      </button>
    </div>`;

  body.innerHTML = html;
}

function exportData() {
  const payload = {
    version: 2,
    exportDate: new Date().toISOString(),
    sessions,
    pbs: computePBs()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `ppl_workout_backup_${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup saved to Downloads ✓');
  renderDataScreen();
}

function triggerImport() {
  document.getElementById('import-file-input').click();
}

function handleImportFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      const imported = data.sessions || (Array.isArray(data) ? data : []);
      if (!imported.length) { showToast('No sessions found in file'); return; }

      // Merge by ID — keep both, deduplicate
      const existingIds = new Set(sessions.map(s => String(s.id)));
      let added = 0;
      imported.forEach(s => {
        if (!existingIds.has(String(s.id))) {
          sessions.push(s);
          added++;
        }
      });
      sessions.sort((a, b) => new Date(a.date) - new Date(b.date));
      localStorage.setItem('ppl_sessions', JSON.stringify(sessions));
      showToast(`Imported ${added} new session${added !== 1 ? 's' : ''} ✓`);
      renderDataScreen();
      renderHome();
    } catch(err) {
      showToast('Could not read file — is it a valid backup?');
    }
  };
  reader.readAsText(file);
  // Reset input so same file can be re-imported if needed
  event.target.value = '';
}

function confirmClearData() {
  if (confirm('Delete ALL workout data? This cannot be undone.\n\nTap OK to confirm.')) {
    sessions = [];
    localStorage.removeItem('ppl_sessions');
    showToast('All data cleared');
    renderDataScreen();
    renderHome();
  }
}

// ════════════════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════════════════
updateTimerDisplay();
showHome();
</script>
