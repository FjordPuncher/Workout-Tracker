<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0F0F0E">
<title>PPL Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --push: #C4732A;
  --push-bg: #2A1A08;
  --push-mid: #3D2210;
  --push-text: #F5C989;
  --pull: #1B9E76;
  --pull-bg: #071A14;
  --pull-mid: #0D2B20;
  --pull-text: #7FD9BB;
  --legs: #6B5FD4;
  --legs-bg: #100D2A;
  --legs-mid: #1A1640;
  --legs-text: #B5AFFE;
  --core: #888780;
  --core-bg: #161614;
  --core-text: #D4D2CC;
  --cardio: #1A9E9E;
  --cardio-bg: #071A1A;
  --cardio-mid: #0D2828;
  --cardio-text: #7FDBDB;
  --general: #7A7060;
  --general-bg: #161410;
  --general-text: #C8BAA0;
  /* ── RPG Attributes ── */
  --str: #C4732A; --str-bg: #2A1A08; --str-text: #F5C989; --str-glow: rgba(196,115,42,0.4);
  --end: #1A9E9E; --end-bg: #071A1A; --end-text: #7FDBDB; --end-glow: rgba(26,158,158,0.4);
  --agi: #6B5FD4; --agi-bg: #100D2A; --agi-text: #B5AFFE; --agi-glow: rgba(107,95,212,0.4);
  --dex: #888780; --dex-bg: #161614; --dex-text: #D4D2CC; --dex-glow: rgba(136,135,128,0.3);
  --bg: #0A0A09;
  --surface: #141412;
  --surface2: #1C1C1A;
  --border: #2A2A27;
  --text: #F0EDE6;
  --text-muted: #888780;
  --text-dim: #504E4A;
  --accent: #C4732A;
  --radius: 14px;
  --radius-sm: 8px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  line-height: 1.5;
  margin: 0; padding: 0;
}

/* ── SCREENS ── */
/* Each screen is a full-page block. Only the active one is shown.
   The bottom nav is position:fixed so it never moves.
   The scroll-body has padding-bottom to clear the fixed nav. */
.screen { display: none; }
.screen.active { display: block; }

/* ── TOP BAR ── */
.topbar {
  position: sticky; top: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(var(--safe-top) + 14px) 18px 14px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  z-index: 100;
}
.topbar-title { font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
.back-btn {
  display: flex; align-items: center; gap: 6px;
  background: none; border: none; color: var(--text-muted);
  font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer; padding: 4px 0;
}
.back-btn svg { width: 18px; height: 18px; }

/* ── SCROLLABLE CONTENT ── */
.scroll-body {
  display: block;
  padding-bottom: 100px;
}

/* ── HOME SCREEN ── */
.home-header {
  padding: calc(var(--safe-top) + 20px) 18px 0;
}
.home-logo { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -1px; color: var(--text); }
.home-logo span { color: var(--accent); }
.home-date { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-dim); margin-top: 2px; letter-spacing: 0.5px; text-transform: uppercase; }

.suggestion-bar {
  margin: 18px 18px 0;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex; align-items: center; justify-content: space-between;
}
.suggestion-label { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-dim); margin-bottom: 4px; }
.suggestion-name { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; }
.suggestion-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.suggestion-go {
  background: var(--accent); color: #fff;
  border: none; border-radius: var(--radius-sm);
  font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
  padding: 10px 16px; cursor: pointer; white-space: nowrap; flex-shrink: 0; margin-left: 12px;
}

.section-label {
  font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px;
  color: var(--text-dim); margin: 22px 18px 10px;
}

/* ── NAV GRID ── */
.nav-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 8px; padding: 0 18px;
}
.nav-cell {
  border-radius: var(--radius); padding: 14px 10px 12px;
  cursor: pointer; border: 1.5px solid transparent;
  transition: transform 0.12s, border-color 0.12s;
  position: relative; overflow: hidden;
  -webkit-user-select: none; user-select: none;
}
.nav-cell:active { transform: scale(0.95); }
.nav-cell.suggested {
  border-color: #fff6;
  box-shadow: 0 0 0 1px #fff2, 0 0 16px 2px rgba(255,255,255,0.12);
}
.nav-cell.push { background: var(--push-bg); }
.nav-cell.pull { background: var(--pull-bg); }
.nav-cell.legs { background: var(--legs-bg); }
.nav-cell.core { background: var(--core-bg); border-color: var(--core); }

.nav-cell-tag {
  font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; opacity: 0.7;
}
.nav-cell.push .nav-cell-tag { color: var(--push-text); }
.nav-cell.pull .nav-cell-tag { color: var(--pull-text); }
.nav-cell.legs .nav-cell-tag { color: var(--legs-text); }
.nav-cell.core .nav-cell-tag { color: var(--core-text); }

.nav-cell-name {
  font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; line-height: 1.2;
}
.nav-cell.push .nav-cell-name { color: var(--push-text); }
.nav-cell.pull .nav-cell-name { color: var(--pull-text); }
.nav-cell.legs .nav-cell-name { color: var(--legs-text); }
.nav-cell.core .nav-cell-name { color: var(--core-text); }

.nav-cell-sub { font-size: 10px; margin-top: 4px; opacity: 0.6; line-height: 1.3; }
.nav-cell.push .nav-cell-sub { color: var(--push-text); }
.nav-cell.pull .nav-cell-sub { color: var(--pull-text); }
.nav-cell.legs .nav-cell-sub { color: var(--legs-text); }

.nav-cell-done {
  font-family: 'DM Mono', monospace; font-size: 9px; margin-top: 8px; opacity: 0.5;
}
.nav-cell.push .nav-cell-done { color: var(--push-text); }
.nav-cell.pull .nav-cell-done { color: var(--pull-text); }
.nav-cell.legs .nav-cell-done { color: var(--legs-text); }

/* ── CALENDAR ── */
.calendar-wrap { padding: 0 18px; margin-top: 4px; }
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-month { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; }
.cal-nav { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; padding: 4px 8px; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
.cal-dow {
  font-size: 9px; font-weight: 500; text-align: center; color: var(--text-dim);
  padding: 4px 0 5px; font-family: 'DM Mono', monospace; text-transform: uppercase;
}
.cal-day {
  border-radius: 6px;
  height: 64px;
  display: flex; flex-direction: column; align-items: center;
  padding: 5px 2px 4px;
  font-size: 11px; color: var(--text-muted);
  position: relative; cursor: pointer;
  gap: 3px; overflow: hidden;
}
.cal-day-num {
  font-size: 11px; line-height: 1; flex-shrink: 0;
}
.cal-day.today .cal-day-num {
  background: var(--accent);
  color: #fff;
  width: 20px; height: 20px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 10px;
}
.cal-day.empty { pointer-events: none; }
.cal-day.future { color: var(--text-dim); opacity: 0.35; pointer-events: none; }
.cal-day.past-empty { cursor: pointer; }
.cal-day.past-empty:active { background: var(--surface2); }

/* ── workout bars ── */
.cal-bars { display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 0 1px; }
.cal-bar {
  width: 100%; border-radius: 3px;
  font-family: 'DM Mono', monospace; font-size: 7px; font-weight: 500;
  text-align: center; line-height: 12px; height: 12px;
  letter-spacing: 0.3px; text-transform: uppercase;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  flex-shrink: 0;
}
.cal-bar.push    { background: var(--push-bg);    color: var(--push-text);    border: 1px solid var(--push); }
.cal-bar.pull    { background: var(--pull-bg);    color: var(--pull-text);    border: 1px solid var(--pull); }
.cal-bar.legs    { background: var(--legs-bg);    color: var(--legs-text);    border: 1px solid var(--legs); }
.cal-bar.cardio  { background: var(--cardio-bg);  color: var(--cardio-text);  border: 1px solid var(--cardio); }
.cal-bar.general { background: var(--general-bg); color: var(--general-text); border: 1px solid var(--general); }
.cal-bar.custom  { background: var(--surface2);   color: var(--text-muted);   border: 1px solid var(--border); }

/* ── add hint on tappable empty days ── */
.cal-add-hint {
  font-size: 14px; color: var(--text-dim); opacity: 0.4; line-height: 1; margin-top: 1px;
}

.cal-day-tooltip {
  font-size: 10px; color: var(--text-muted); text-align: center;
  margin-top: 6px; min-height: 16px; font-family: 'DM Mono', monospace;
}

/* ── BACKFILL SCREEN ── */
.backfill-date-banner {
  margin: 0 18px 0;
  padding: 14px 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex; align-items: center; gap: 12px;
}
.backfill-missed-badge {
  font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 1px;
  padding: 4px 10px; border-radius: 20px;
  background: #2a1a08; color: #e09a40; border: 1px solid #5a3010;
  white-space: nowrap; flex-shrink: 0;
}
.backfill-date-text {
  font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; color: var(--text);
}
.backfill-date-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

.backfill-pick-label {
  font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px;
  color: var(--text-dim); margin: 18px 18px 10px;
}
.backfill-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 8px; padding: 0 18px;
}
.backfill-cell {
  border-radius: var(--radius); padding: 12px 10px 10px;
  cursor: pointer; border: 1.5px solid transparent;
  transition: transform 0.12s, border-color 0.12s;
  -webkit-user-select: none; user-select: none;
}
.backfill-cell:active { transform: scale(0.95); }
.backfill-cell.selected { border-color: #fff5 !important; }
.backfill-cell.push { background: var(--push-bg); }
.backfill-cell.pull { background: var(--pull-bg); }
.backfill-cell.legs { background: var(--legs-bg); }
.backfill-cell-tag {
  font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; opacity: 0.7;
}
.backfill-cell.push .backfill-cell-tag { color: var(--push-text); }
.backfill-cell.pull .backfill-cell-tag { color: var(--pull-text); }
.backfill-cell.legs .backfill-cell-tag { color: var(--legs-text); }
.backfill-cell-name {
  font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; line-height: 1.2;
}
.backfill-cell.push .backfill-cell-name { color: var(--push-text); }
.backfill-cell.pull .backfill-cell-name { color: var(--pull-text); }
.backfill-cell.legs .backfill-cell-name { color: var(--legs-text); }

.backfill-log-toggle {
  margin: 16px 18px 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  cursor: pointer;
}
.backfill-log-toggle-left { font-size: 13px; font-weight: 500; color: var(--text); }
.backfill-log-toggle-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.toggle-switch {
  width: 42px; height: 24px; border-radius: 12px;
  background: var(--border); position: relative; transition: background 0.2s; flex-shrink: 0;
}
.toggle-switch.on { background: var(--accent); }
.toggle-switch::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left 0.2s;
}
.toggle-switch.on::after { left: 21px; }

.backfill-confirm-btn {
  width: 100%; padding: 15px; border-radius: var(--radius);
  font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700;
  border: none; cursor: pointer; color: #fff; letter-spacing: 0.3px;
  background: var(--accent); margin-top: 14px;
  opacity: 0.4; pointer-events: none; transition: opacity 0.2s;
}
.backfill-confirm-btn.ready { opacity: 1; pointer-events: auto; }

.backfill-existing-item {
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.backfill-del-btn {
  background: none; border: 1px solid var(--border); color: var(--text-dim);
  font-size: 11px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
}

/* ── WORKOUT SCREEN ── */
.workout-header {
  padding: 18px 18px 14px;
  border-bottom: 1px solid var(--border);
}
.workout-badge {
  display: inline-block;
  font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 1px;
  padding: 4px 10px; border-radius: 20px; margin-bottom: 8px;
}
.workout-title { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1; }
.workout-focus { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

.workout-tabs {
  position: sticky; top: calc(var(--safe-top) + 51px);
  display: flex; gap: 6px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  z-index: 90;
}

.timer-bar-sticky-anchor {
  position: sticky;
  top: calc(var(--safe-top) + 51px + 57px); /* topbar + tabs height */
  z-index: 80;
  background: var(--bg);
}
.workout-tab {
  flex: 1; padding: 8px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border); background: none;
  font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
  color: var(--text-muted); cursor: pointer; transition: all 0.15s;
}
.workout-tab.active { border-color: currentColor; }

/* ── EXERCISE CARD ── */
.ex-card {
  margin: 12px 18px 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.ex-card-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 14px 14px 10px; cursor: pointer; gap: 10px;
}
.ex-card-left { flex: 1; }
.ex-name { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; }
.ex-sets-badge {
  display: inline-block; margin-top: 4px;
  font-family: 'DM Mono', monospace; font-size: 10px;
  color: var(--text-dim); background: var(--surface2);
  padding: 2px 7px; border-radius: 4px;
}
.ex-chevron { color: var(--text-dim); font-size: 18px; flex-shrink: 0; margin-top: 2px; transition: transform 0.2s; }
.ex-card.open .ex-chevron { transform: rotate(180deg); }

.ex-desc {
  padding: 0 14px 14px;
  font-size: 13px; color: var(--text-muted); line-height: 1.6;
  border-top: 1px solid var(--border); padding-top: 12px;
  display: none;
}
.ex-card.open .ex-desc { display: block; }

/* ── exercise history reference ── */
.ex-ref {
  display: none;
  border-top: 1px solid var(--border);
  padding: 10px 14px;
  background: var(--surface2);
}
.ex-card.open .ex-ref { display: block; }
.ex-ref-row {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 8px; padding: 3px 0;
}
.ex-ref-label {
  font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim);
  flex-shrink: 0;
}
.ex-ref-value {
  font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text-muted);
  text-align: right;
}
.ex-ref-value strong { color: var(--text); font-weight: 500; }
.ex-ref-first {
  padding: 6px 10px; border-radius: 6px;
  background: #1a1408; border: 1px solid #5a3010;
  font-size: 11px; color: #e09a40;
  font-family: 'DM Mono', monospace; letter-spacing: 0.2px;
}

/* ── SET LOGGER ── */
.set-logger { padding: 0 14px 14px; border-top: 1px solid var(--border); }
.set-logger-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0 8px;
}
.set-logger-title { font-size: 11px; font-weight: 500; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
.add-set-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text-muted); font-size: 11px; font-weight: 500;
  padding: 4px 10px; border-radius: 6px; cursor: pointer;
}
.set-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.set-num { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-dim); width: 20px; flex-shrink: 0; text-align: right; }
.set-input {
  flex: 1; background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); font-family: 'DM Mono', monospace; font-size: 13px;
  padding: 6px 10px; border-radius: 6px; outline: none; text-align: center;
  -webkit-appearance: none;
}
.set-input:focus { border-color: var(--text-dim); }
.set-input::placeholder { color: var(--text-dim); }
.set-unit { font-size: 11px; color: var(--text-dim); width: 28px; text-align: center; }
.del-set-btn { background: none; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; padding: 2px 4px; flex-shrink: 0; }

/* ── TIMER ── */
.timer-bar {
  position: sticky;
  top: calc(var(--safe-top) + 108px); /* topbar ~51px + tabs ~57px */
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 10px 18px;
  display: none; align-items: center; justify-content: space-between;
  z-index: 80;
}
.timer-bar.visible { display: flex; }
.timer-display {
  font-family: 'DM Mono', monospace; font-size: 28px; font-weight: 500;
  color: var(--text); letter-spacing: 2px; min-width: 90px;
}
.timer-display.warning { color: #e05b5b; }
.timer-presets { display: flex; gap: 6px; }
.timer-preset {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text-muted); font-family: 'DM Mono', monospace; font-size: 12px;
  padding: 6px 10px; border-radius: var(--radius-sm); cursor: pointer;
}
.timer-preset.active { border-color: var(--accent); color: var(--accent); }
.timer-controls { display: flex; gap: 8px; }
.timer-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); font-size: 20px;
  width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.timer-btn.primary { background: var(--accent); border-color: var(--accent); }

.start-session-wrap { padding: 18px 18px 0; }
.start-session-btn {
  width: 100%; padding: 15px; border-radius: var(--radius);
  font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700;
  border: none; cursor: pointer; letter-spacing: 0.3px;
}

.finish-btn-wrap { padding: 14px 18px 0; }
.finish-btn {
  width: 100%; padding: 15px; border-radius: var(--radius);
  font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700;
  border: none; cursor: pointer; color: #fff; letter-spacing: 0.3px;
}

/* ── Session notes + duration block ── */
.session-meta-block {
  margin: 14px 18px 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.session-meta-row {
  display: flex; align-items: center;
  padding: 0 14px;
  border-bottom: 1px solid var(--border);
  gap: 10px;
}
.session-meta-row:last-child { border-bottom: none; }
.session-meta-label {
  font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--text-dim); white-space: nowrap; flex-shrink: 0; padding: 14px 0;
}
.session-meta-input {
  flex: 1; background: none; border: none; outline: none;
  color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px;
  padding: 14px 0; resize: none; line-height: 1.5;
}
.session-meta-input::placeholder { color: var(--text-dim); }
.session-meta-input[type="number"] { -webkit-appearance: none; }
.duration-unit {
  font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-dim); flex-shrink: 0;
}
.session-timer-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.session-elapsed {
  font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500; color: var(--text);
  letter-spacing: 1px;
}
.session-elapsed-label {
  font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px;
}

/* ── Detail screen meta display ── */
.detail-meta-row {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--border);
}
.detail-meta-row:last-child { border-bottom: none; }
.detail-meta-label {
  font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim);
  white-space: nowrap; flex-shrink: 0; padding-top: 1px; min-width: 80px;
}
.detail-meta-value { font-size: 14px; color: var(--text); line-height: 1.5; }

/* ── HISTORY SCREEN ── */
.history-list { padding: 0 18px; }
.history-empty { text-align: center; color: var(--text-dim); font-size: 14px; padding: 60px 0; }

/* ── date group header ── */
.history-date-group { margin-top: 20px; }
.history-date-group:first-child { margin-top: 0; }
.history-day-header {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0 6px;
}
.history-day-label {
  font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-dim);
  white-space: nowrap;
}
.history-day-line { flex: 1; height: 1px; background: var(--border); }

/* ── session card (now a nav link, no dropdown) ── */
.history-item {
  display: block;
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 8px;
  overflow: hidden;
  cursor: pointer;
  text-align: left;
  -webkit-tap-highlight-color: rgba(255,255,255,0.05);
}
.history-item:active { background: var(--surface2); }
.history-item-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 14px; gap: 10px;
}
.history-item-left { flex: 1; min-width: 0; }
.history-item-name {
  font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: inherit;
}
.history-item-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
.history-item-arrow { color: var(--text-dim); font-size: 18px; flex-shrink: 0; }

/* ── session detail screen ── */
.detail-header {
  padding: 18px 18px 14px;
  border-bottom: 1px solid var(--border);
}
.detail-badge {
  display: inline-block; font-family: 'DM Mono', monospace; font-size: 9px;
  font-weight: 500; text-transform: uppercase; letter-spacing: 1px;
  padding: 4px 10px; border-radius: 20px; margin-bottom: 8px;
}
.detail-title {
  font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800;
  letter-spacing: -0.5px; line-height: 1.1;
}
.detail-date {
  font-family: 'DM Mono', monospace; font-size: 11px;
  color: var(--text-muted); margin-top: 5px;
}
.detail-section-label {
  font-size: 10px; font-weight: 500; text-transform: uppercase;
  letter-spacing: 0.8px; color: var(--text-dim);
  margin: 18px 18px 10px;
}
.detail-ex-card {
  margin: 0 18px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.detail-ex-name {
  font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--border);
}
.detail-set-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px; border-bottom: 1px solid var(--border);
  font-family: 'DM Mono', monospace; font-size: 13px;
}
.detail-set-row:last-child { border-bottom: none; }
.detail-set-num { color: var(--text-dim); width: 20px; flex-shrink: 0; text-align: right; font-size: 11px; }
.detail-set-reps { color: var(--text); font-weight: 500; }
.detail-set-x { color: var(--text-dim); font-size: 11px; }
.detail-set-weight { color: var(--text); }
.detail-set-weight-unit { color: var(--text-dim); font-size: 11px; margin-left: 2px; }
.detail-no-sets {
  padding: 12px 14px; font-size: 13px; color: var(--text-dim); font-style: italic;
}
.detail-missed-pill {
  display: inline-block; font-family: 'DM Mono', monospace; font-size: 9px;
  font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px;
  padding: 3px 8px; border-radius: 20px;
  background: #2a1a08; color: #e09a40; border: 1px solid #5a3010;
  margin: 12px 18px 0; display: block; width: fit-content;
}
.detail-delete-btn {
  margin: 20px 18px 0; width: calc(100% - 36px);
  padding: 13px; border-radius: var(--radius);
  font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
  border: 1px solid #5a1010; background: #1a0808; color: #e05b5b;
  cursor: pointer;
}

/* ── Edit session mode ── */
.detail-edit-bar {
  display: flex; gap: 8px; padding: 10px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.detail-edit-save {
  flex: 1; padding: 10px; border-radius: var(--radius-sm);
  font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
  border: none; cursor: pointer; color: #fff;
}
.detail-edit-cancel {
  padding: 10px 16px; border-radius: var(--radius-sm);
  font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
  border: 1px solid var(--border); background: none; color: var(--text-muted); cursor: pointer;
}
.edit-ex-card {
  margin: 10px 18px 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
.edit-ex-name {
  font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
  padding: 10px 14px 8px; border-bottom: 1px solid var(--border); color: var(--text);
}
.edit-add-ex-btn {
  margin: 10px 18px 0; width: calc(100% - 36px);
  padding: 11px; border-radius: var(--radius);
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
  border: 1px dashed var(--border); background: none; color: var(--text-dim); cursor: pointer;
}
.edit-add-ex-btn.open {
  border-style: solid; border-color: var(--accent); color: var(--accent);
  border-bottom-left-radius: 0; border-bottom-right-radius: 0;
}
.ex-picker-panel {
  margin: 0 18px; border: 1px solid var(--accent);
  border-top: none; border-bottom-left-radius: var(--radius);
  border-bottom-right-radius: var(--radius);
  background: var(--surface); overflow: hidden;
}
.ex-picker-search-wrap { position: relative; padding: 8px 10px; border-bottom: 1px solid var(--border); }
.ex-picker-search {
  width: 100%; padding: 7px 10px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px;
  outline: none; -webkit-appearance: none;
}
.ex-picker-search::placeholder { color: var(--text-dim); }
.ex-picker-list { max-height: 240px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.ex-picker-group {
  font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.6px;
  padding: 8px 12px 4px; color: var(--text-dim);
  border-top: 1px solid var(--border);
}
.ex-picker-group:first-child { border-top: none; }
.ex-picker-item {
  display: block; width: 100%; padding: 10px 12px;
  font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text);
  background: none; border: none; text-align: left; cursor: pointer;
  border-bottom: 1px solid var(--border);
}
.ex-picker-item:last-child { border-bottom: none; }
.ex-picker-item:active { background: var(--surface2); }
.ex-picker-empty { padding: 14px 12px; font-size: 13px; color: var(--text-dim); text-align: center; }
.edit-section-head {
  font-size: 10px; font-weight: 500; text-transform: uppercase;
  letter-spacing: 0.8px; color: var(--text-dim); margin: 14px 18px 8px;
}

.history-ex-block { margin-bottom: 12px; }
.history-ex-block:last-child { margin-bottom: 0; }
.history-ex-name {
  font-size: 12px; font-weight: 500; color: var(--text);
  margin-bottom: 6px; padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.history-set-row {
  display: flex; align-items: center; gap: 8px;
  padding: 3px 0; font-family: 'DM Mono', monospace; font-size: 12px;
}
.history-set-num { color: var(--text-dim); width: 18px; text-align: right; flex-shrink: 0; }
.history-set-val { color: var(--text); }
.history-set-sep { color: var(--text-dim); }
.history-no-sets { font-size: 12px; color: var(--text-dim); font-style: italic; }
.history-missed-badge {
  display: inline-block; font-family: 'DM Mono', monospace; font-size: 9px;
  font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px;
  padding: 3px 8px; border-radius: 20px;
  background: #2a1a08; color: #e09a40; border: 1px solid #5a3010;
  margin-bottom: 8px;
}

.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  display: flex;
  border-top: 1px solid var(--border);
  background: var(--bg);
  padding-bottom: var(--safe-bot);
  z-index: 200;
}
.bnav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 10px 8px; background: none; border: none; cursor: pointer;
  color: var(--text-dim); gap: 3px;
}
.bnav-btn.active { color: var(--accent); }
.bnav-btn svg { width: 22px; height: 22px; }
.bnav-btn span { font-size: 9px; font-weight: 500; }

.core-section-head {
  margin: 20px 18px 10px;
  display: flex; align-items: center; gap: 10px;
}
.core-badge {
  font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 1px;
  padding: 4px 10px; border-radius: 20px;
  background: var(--core-bg); color: var(--core-text);
  border: 1px solid var(--border);
}
.core-focus-txt { font-size: 12px; color: var(--text-muted); flex: 1; line-height: 1.4; }

.session-toast {
  position: fixed; top: calc(var(--safe-top) + 20px); left: 50%; transform: translateX(-50%) translateY(-20px);
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 500;
  opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 200; white-space: nowrap;
}
.session-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
.timer-display.running { animation: pulse 1s infinite; }

/* ── DATA SCREEN ── */
.data-section-card {
  margin: 12px 18px 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.data-section-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
}
.data-section-row:last-child { border-bottom: none; }
.data-row-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; font-family: 'DM Mono', monospace; margin-bottom: 3px; }
.data-row-value { font-size: 14px; font-weight: 500; color: var(--text); }
.data-action-btn {
  width: 100%; padding: 15px; border-radius: var(--radius);
  font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700;
  border: none; cursor: pointer; letter-spacing: 0.3px; margin-top: 12px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.data-action-btn.export { background: var(--pull-bg); color: var(--pull-text); border: 1px solid var(--pull); }
.data-action-btn.import { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.data-action-btn.danger { background: #1a0808; color: #e05b5b; border: 1px solid #5a1010; }
.data-info-box {
  margin: 12px 18px 0; padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 12px; color: var(--text-muted); line-height: 1.6;
}
.data-info-box strong { color: var(--text); }
#import-file-input { display: none; }

/* ── PERSONAL BESTS SCREEN ── */
.pb-exercise-card {
  margin: 0 18px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.pb-ex-header {
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--border);
}
.pb-ex-name { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: var(--text); }
.pb-ex-tag { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px; margin-top: 2px; }
.pb-records { display: flex; }
.pb-record {
  flex: 1; padding: 12px 14px; border-right: 1px solid var(--border);
}
.pb-record:last-child { border-right: none; }
.pb-record-label { font-size: 10px; color: var(--text-dim); font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.pb-record-value { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; line-height: 1; }
.pb-record-unit { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
.pb-record-date { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text-dim); margin-top: 5px; }
.pb-empty { text-align: center; color: var(--text-dim); font-size: 13px; padding: 40px 18px; }

/* ── STATS SCREEN ── */
.stats-tabs {
  position: sticky;
  top: calc(var(--safe-top) + 51px);
  display: flex; gap: 0;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  flex-shrink: 0;
  z-index: 90;
}
.stats-tabs::-webkit-scrollbar { display: none; }
.stats-tab {
  flex: 1; padding: 10px 4px;
  font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--text-dim); background: none; border: none;
  cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  white-space: nowrap; text-align: center;
}
.stats-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* stat tiles */
.stats-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; padding: 0 18px;
}
.stats-grid.cols3 { grid-template-columns: 1fr 1fr 1fr; }
.stat-tile {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 14px 12px;
}
.stat-tile.wide { grid-column: span 2; }
.stat-tile.push-tint { background: var(--push-bg); border-color: var(--push); }
.stat-tile.pull-tint { background: var(--pull-bg); border-color: var(--pull); }
.stat-tile.legs-tint { background: var(--legs-bg); border-color: var(--legs); }
.stat-tile-label {
  font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim);
  margin-bottom: 6px; line-height: 1.3;
}
.stat-tile.push-tint .stat-tile-label { color: var(--push-text); opacity: 0.7; }
.stat-tile.pull-tint .stat-tile-label { color: var(--pull-text); opacity: 0.7; }
.stat-tile.legs-tint .stat-tile-label { color: var(--legs-text); opacity: 0.7; }
.stat-tile-value {
  font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800;
  line-height: 1; color: var(--text);
}
.stat-tile.push-tint .stat-tile-value { color: var(--push-text); }
.stat-tile.pull-tint .stat-tile-value { color: var(--pull-text); }
.stat-tile.legs-tint .stat-tile-value { color: var(--legs-text); }
.stat-tile-unit {
  font-size: 11px; color: var(--text-muted); margin-top: 3px;
}

/* period navigator (month / year swiper) */
.period-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px 0;
}
.period-nav-btn {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text-muted); font-size: 18px;
  width: 36px; height: 36px; border-radius: 50%;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.period-nav-btn:disabled { opacity: 0.25; cursor: default; }
.period-label {
  font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700;
  color: var(--text); text-align: center; flex: 1;
}
.period-empty {
  text-align: center; color: var(--text-dim); font-size: 13px; padding: 30px 18px;
}

/* workout type breakdown bar */
.type-bar-wrap { padding: 0 18px; }
.type-bar-track {
  height: 10px; border-radius: 5px; overflow: hidden;
  background: var(--surface2); display: flex; margin-bottom: 10px;
}
.type-bar-seg { height: 100%; transition: width 0.3s; }
.type-legend { display: flex; gap: 14px; flex-wrap: wrap; }
.type-legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-muted); }
.type-legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* streak */
.streak-card {
  margin: 0 18px; padding: 16px 14px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex; align-items: center; gap: 14px;
}
.streak-num {
  font-family: 'Syne', sans-serif; font-size: 40px; font-weight: 800;
  color: var(--accent); line-height: 1; flex-shrink: 0;
}
.streak-label { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
.streak-sub { font-size: 11px; color: var(--text-dim); margin-top: 3px; }

/* ── GLOSSARY SCREEN ── */
.builder-filter-btn {
  font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.6px;
  background: none; border: 1px solid var(--border); border-radius: 20px;
  padding: 5px 12px; color: var(--text-dim); cursor: pointer; transition: all 0.15s;
}
.builder-filter-btn.active {
  border-color: var(--str); color: var(--str); background: var(--str-bg);
}
.builder-ex-card {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px;
  cursor: pointer; transition: border-color 0.15s, background 0.15s;
}
.builder-ex-card.selected {
  border-color: var(--str); background: var(--str-bg);
}
.builder-ex-name {
  font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: var(--text);
}

.glossary-search-wrap {
  position: relative; padding: 10px 18px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; background: var(--bg);
}
.glossary-search {
  width: 100%; padding: 11px 40px 11px 16px;
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--radius); color: var(--text);
  font-family: 'DM Sans', sans-serif; font-size: 14px;
  outline: none; -webkit-appearance: none; box-sizing: border-box;
}
.glossary-search:focus { border-color: var(--str); }
.glossary-search::placeholder { color: var(--text-dim); }
.glossary-search-icon {
  position: absolute; right: 30px; top: 50%; transform: translateY(-50%);
  color: var(--text-dim); pointer-events: none;
}
.glossary-group-label {
  font-size: 10px; font-weight: 500; text-transform: uppercase;
  letter-spacing: 0.8px; padding: 14px 18px 6px;
}
.glossary-card {
  margin: 0 18px 8px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
.glossary-card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 14px; cursor: pointer; gap: 10px;
  -webkit-tap-highlight-color: rgba(255,255,255,0.05);
  background: none; border: none; width: 100%; text-align: left;
}
.glossary-card-header:active { background: var(--surface2); }
.glossary-card-left { flex: 1; min-width: 0; }
.glossary-ex-name {
  font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
  color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.glossary-ex-tag {
  font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.6px; margin-top: 3px;
}
.glossary-chevron {
  color: var(--text-dim); font-size: 18px; flex-shrink: 0; transition: transform 0.2s;
}
.glossary-card.open .glossary-chevron { transform: rotate(180deg); }
.glossary-detail { display: none; border-top: 1px solid var(--border); }
.glossary-card.open .glossary-detail { display: block; }
.glossary-desc {
  padding: 12px 14px; font-size: 13px; color: var(--text-muted);
  line-height: 1.6; border-bottom: 1px solid var(--border);
}
.glossary-stats { padding: 8px 14px 10px; background: var(--surface2); }
.glossary-stat-row {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 8px; padding: 3px 0;
}
.glossary-stat-label {
  font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); flex-shrink: 0;
}
.glossary-stat-value {
  font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text-muted); text-align: right;
}
.glossary-stat-value strong { color: var(--text); font-weight: 500; }
.glossary-first-pill {
  display: block; padding: 6px 12px; margin: 8px 14px 10px;
  background: #1a1408; border: 1px solid #5a3010; border-radius: 6px;
  font-size: 11px; color: #e09a40; font-family: 'DM Mono', monospace;
}
.glossary-empty {
  text-align: center; color: var(--text-dim); font-size: 13px; padding: 40px 18px;
}

/* ══════════════════════════════════════════════════════
   PROFILE / RPG SYSTEM CSS
══════════════════════════════════════════════════════ */
/* ── Trading Card ── */
.profile-card {
  margin: 14px 18px;
  background: linear-gradient(160deg, #1A1814 0%, #0F0E0C 100%);
  border: 1px solid #3A3530;
  border-radius: 20px; overflow: hidden;
  position: relative;
}
.profile-card-inner { padding: 20px 20px 18px; }
.profile-top { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
.profile-avatar-wrap { position: relative; flex-shrink: 0; cursor: pointer; }
.profile-avatar {
  width: 72px; height: 72px; border-radius: 50%;
  object-fit: cover; display: block;
  border: 2px solid var(--str);
  box-shadow: 0 0 16px var(--str-glow), 0 0 32px var(--str-glow);
}
.profile-avatar-placeholder {
  width: 72px; height: 72px; border-radius: 50%;
  background: var(--surface2); border: 2px solid var(--str);
  box-shadow: 0 0 16px var(--str-glow);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800;
  color: var(--str-text);
}
.profile-avatar-edit {
  position: absolute; bottom: 0; right: 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 50%; width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: var(--text-muted);
}
.profile-info { flex: 1; min-width: 0; }
.profile-name {
  font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800;
  color: var(--text); letter-spacing: -0.3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.profile-title {
  font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500;
  color: var(--str); text-transform: uppercase; letter-spacing: 1px; margin-top: 3px;
}
.profile-tagline { font-size: 12px; color: var(--text-muted); margin-top: 5px; line-height: 1.4; }
.profile-char-level {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: rgba(255,255,255,0.03);
  border: 1px solid #2A2820; border-radius: 10px; margin-bottom: 16px;
}
.profile-char-num {
  font-family: 'Syne', sans-serif; font-size: 34px; font-weight: 800;
  color: var(--str); line-height: 1; flex-shrink: 0;
  text-shadow: 0 0 20px var(--str-glow);
}
.profile-char-label { font-size: 11px; color: var(--text-muted); line-height: 1.4; }
.profile-char-bar-wrap { flex: 1; }
.profile-char-bar-track {
  height: 5px; background: #2A2820; border-radius: 3px; overflow: hidden; margin-top: 4px;
}
.profile-char-bar-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--str), var(--str-text));
  box-shadow: 0 0 6px var(--str-glow);
  transition: width 0.4s ease;
}

/* ── Attribute rows ── */
.attr-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; border-top: 1px solid #1E1C18;
}
.attr-icon {
  width: 32px; height: 32px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
}
.attr-info { flex: 1; min-width: 0; }
.attr-name { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.6px; font-family: 'DM Mono', monospace; }
.attr-level { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 800; line-height: 1; margin-top: 1px; }
.attr-bar-track {
  height: 4px; background: #2A2820; border-radius: 2px; overflow: hidden; margin-top: 4px;
}
.attr-bar-fill {
  height: 100%; border-radius: 2px; transition: width 0.5s ease;
}
.attr-xp-label { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text-dim); white-space: nowrap; flex-shrink: 0; }

/* ── Achievements ── */
.achievement-card {
  margin: 0 18px 8px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
  display: flex; align-items: center; gap: 14px; padding: 12px 14px;
}
.achievement-card.locked { opacity: 0.45; }
.achievement-icon { font-size: 28px; flex-shrink: 0; }
.achievement-info { flex: 1; min-width: 0; }
.achievement-name {
  font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; color: var(--text);
}
.achievement-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; line-height: 1.4; }
.achievement-progress {
  font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-dim); margin-top: 4px;
}
.achievement-badge {
  font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; text-transform: uppercase;
  letter-spacing: 0.5px; padding: 3px 8px; border-radius: 20px; flex-shrink: 0;
  background: #2A1A08; color: var(--str); border: 1px solid var(--str);
}
.achievement-badge.locked { background: var(--surface2); color: var(--text-dim); border-color: var(--border); }

/* ── Exercise mastery bar in glossary/cards ── */
.mastery-bar-wrap { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
.mastery-bar-track {
  flex: 1; height: 3px; background: #2A2820; border-radius: 2px; overflow: hidden;
}
.mastery-bar-fill { height: 100%; border-radius: 2px; background: var(--str); transition: width 0.3s; }
.mastery-label { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text-dim); white-space: nowrap; flex-shrink: 0; }

/* ── XP Summary overlay ── */
.xp-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.92);
  z-index: 500; display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
  overflow-y: auto;
}
.xp-overlay.show { transform: translateY(0); }
.xp-overlay-body { padding: 40px 24px 20px; }
.xp-header {
  text-align: center; margin-bottom: 28px;
}
.xp-header-label {
  font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 1px; color: var(--str); margin-bottom: 8px;
}
.xp-header-title {
  font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; color: var(--text);
}
.xp-total {
  text-align: center; margin: 20px 0 28px;
  font-family: 'Syne', sans-serif; font-size: 52px; font-weight: 800;
  color: var(--str); line-height: 1;
  text-shadow: 0 0 30px var(--str-glow), 0 0 60px var(--str-glow);
}
.xp-total-label { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
.xp-breakdown-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: 8px;
}
.xp-breakdown-label { font-size: 13px; color: var(--text-muted); }
.xp-breakdown-val { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; color: var(--str); }
.xp-levelup {
  margin-top: 16px; padding: 16px;
  background: linear-gradient(135deg, #2A1A08, #1A1408);
  border: 1px solid var(--str); border-radius: 12px; text-align: center;
  animation: xp-glow-pulse 1.5s ease-in-out infinite;
}
@keyframes xp-glow-pulse {
  0%,100% { box-shadow: 0 0 12px var(--str-glow); }
  50%      { box-shadow: 0 0 28px var(--str-glow), 0 0 50px var(--str-glow); }
}
.xp-levelup-label { font-family: 'DM Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--str); }
.xp-levelup-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; color: var(--str-text); margin-top: 4px; }
.xp-achievement {
  margin-top: 12px; display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; background: var(--surface); border: 1px solid #3A3010;
  border-radius: 10px;
}
.xp-continue-btn {
  display: block;
  width: calc(100% - 48px);
  margin: 24px 24px 48px;
  background: var(--str); color: #fff;
  font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700;
  padding: 15px; border: none; border-radius: 30px; cursor: pointer;
  box-shadow: 0 4px 24px var(--str-glow);
}

/* ── Home screen RPG widget ── */
.home-rpg-widget {
  margin: 12px 18px 0;
  background: linear-gradient(135deg, #1A1814, #0F0E0C);
  border: 1px solid #2A2820; border-radius: 14px;
  padding: 14px 16px; cursor: pointer;
}
.home-rpg-widget:active { background: #1E1C18; }
.home-rpg-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.home-rpg-name { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: var(--text); }
.home-rpg-level { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--str); text-transform: uppercase; letter-spacing: 0.5px; }
.home-rpg-attrs { display: flex; gap: 8px; }
.home-attr-mini { flex: 1; }
.home-attr-mini-label { font-family: 'DM Mono', monospace; font-size: 8px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
.home-attr-mini-level { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 800; line-height: 1; margin-bottom: 2px; }
.home-attr-mini-bar { height: 3px; background: #2A2820; border-radius: 2px; overflow: hidden; }
.home-attr-mini-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }

/* ── STREAK WIDGET ── */
.streak-widget {
  margin: 0 18px 0;
  border-radius: var(--radius);
  border: 1px solid #2A2820;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  background: #0F0E0C;
  transition: box-shadow 0.4s ease, border-color 0.4s ease;
}
.streak-flame { font-size: 24px; flex-shrink: 0; }
.streak-info { flex: 1; min-width: 0; }
.streak-label {
  font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-dim);
  margin-bottom: 2px;
}
.streak-number {
  font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800;
  line-height: 1; color: var(--text);
}
.streak-unit {
  font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-dim);
  margin-top: 2px;
}
.streak-best {
  font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text-dim);
  text-align: right; flex-shrink: 0;
}
.pb-toast {
  position: fixed; bottom: calc(var(--safe-bot) + 80px); left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: linear-gradient(135deg, #2a1a08, #1a1408);
  border: 1px solid var(--accent);
  color: var(--text); padding: 12px 20px; border-radius: 30px;
  font-size: 13px; font-weight: 500; opacity: 0;
  transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none; z-index: 300; white-space: nowrap;
  display: flex; align-items: center; gap: 8px; max-width: 90vw;
  box-shadow: 0 4px 24px rgba(196,115,42,0.3);
}
.pb-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.pb-toast-star { font-size: 16px; }
</style>
</head>

<script>
// ════════════════════════════════════════════════════════════════════════════

// ════════════════════════════════════════════════════════════════════════════

// ════════════════════════════════════════════════════════════════════════════
const EXERCISE_LIBRARY = [
  // ── PUSH ─────────────────────────────────────────────────────────────────
  { name:'Dumbbell bench press',         type:'push', muscleGroup:'chest',     sets:'3 × 8–10',  isTimed:false, masteryThreshold:750, masteryTier:'compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['push_a'], desc:'Lie flat on the bench, dumbbells at chest height with elbows at roughly 45 degrees. Press straight up until arms are extended, then lower under control.' },
  { name:'Dumbbell shoulder press',      type:'push', muscleGroup:'shoulders', sets:'3 × 8–10',  isTimed:false, masteryThreshold:750, masteryTier:'compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['push_a','push_c'], desc:'Seated on the bench, hold dumbbells at shoulder height with palms facing forward. Press overhead until arms are nearly locked, then lower back to the start. Keep your core braced to avoid arching your lower back.' },
  { name:'Dumbbell flyes',               type:'push', muscleGroup:'chest',     sets:'3 × 12',    isTimed:false, masteryThreshold:750, masteryTier:'compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['push_a'], desc:'Lie flat on the bench, dumbbells above your chest, palms facing each other with a slight bend in the elbows. Lower the weights in a wide arc until you feel a chest stretch, then squeeze them back up. Keep the elbows soft throughout.' },
  { name:'Lateral raises',               type:'push', muscleGroup:'shoulders', sets:'3 × 12–15', isTimed:false, masteryThreshold:500, masteryTier:'isolation', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['push_a','push_b','push_c'], desc:'Stand with dumbbells at your sides. Raise both arms out to the sides until parallel to the floor, leading with the elbows. Lower slowly — the eccentric phase does most of the work. Use lighter weight than you think you need.' },
  { name:'Tricep overhead extension',    type:'push', muscleGroup:'triceps',   sets:'3 × 10–12', isTimed:false, masteryThreshold:500, masteryTier:'isolation', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['push_a'], desc:'Seated on the bench, hold one dumbbell with both hands overhead, arms straight. Bend at the elbows to lower it behind your head, keeping upper arms vertical and still. Extend back up.' },
  { name:'Push-ups',          type:'push', muscleGroup:'chest',     sets:'2 × max',   isTimed:false, isBodyweight:true, masteryThreshold:500, masteryTier:'isolation', xpRateType:'reps', attrMap:{ primary:['str'], minor:['end'] }, appearsIn:['push_a'], desc:'Standard push-up, hands shoulder-width apart. Keep a rigid plank from head to heels and lower your chest to the floor. Go to or near failure. Elevate hands on bench to reduce difficulty.' },
  { name:'DB incline press',             type:'push', muscleGroup:'chest',     sets:'3 × 8–10',  isTimed:false, masteryThreshold:750, masteryTier:'compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['push_b'], desc:'Set the bench to 30–45 degree incline. Press dumbbells from chest height shifting emphasis to upper chest and front deltoid. Keep elbows at roughly 45 degrees and lower with full control.' },
  { name:'Arnold press',                 type:'push', muscleGroup:'shoulders', sets:'3 × 10',    isTimed:false, masteryThreshold:750, masteryTier:'compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['push_b'], desc:'Seated on bench, dumbbells at shoulder height palms facing you. As you press overhead, rotate palms outward so they face forward at the top. Reverse on the way down. Recruits more deltoid across its full range.' },
  { name:'DB flyes (incline)',           type:'push', muscleGroup:'chest',     sets:'3 × 12',    isTimed:false, masteryThreshold:750, masteryTier:'compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['push_b'], desc:'Set bench to 30–45 degree incline. Hold dumbbells above chest, palms facing each other with slight elbow bend. Lower in a wide arc until you feel an upper chest stretch, then squeeze back up.' },
  { name:'Tricep kickbacks',             type:'push', muscleGroup:'triceps',   sets:'3 × 12',    isTimed:false, masteryThreshold:500, masteryTier:'isolation', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['push_b'], desc:'Hinge forward until torso is nearly parallel to the floor, upper arm pinned parallel to the floor. Extend forearm back until arm is straight, pause, then lower. Upper arm stays completely still.' },
  { name:'Diamond push-ups',            type:'push', muscleGroup:'triceps',   sets:'2 × max',   isTimed:false, isBodyweight:true, masteryThreshold:500, masteryTier:'isolation', xpRateType:'reps', attrMap:{ primary:['str'], minor:['end'] }, appearsIn:['push_b'], desc:'Hands close together in a diamond shape under your chest. Lower and press back up with narrow elbows. The close grip shifts load heavily onto the triceps. Go to or near failure.' },
  { name:'DB front raise',              type:'push', muscleGroup:'shoulders', sets:'3 × 12',    isTimed:false, masteryThreshold:750, masteryTier:'compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['push_c'], desc:'Stand with dumbbells at thighs, palms facing down. Raise both arms straight forward to shoulder height, then lower under control. Slight elbow bend throughout. Avoid swinging — use lighter weight than expected.' },
  { name:'DB floor press',              type:'push', muscleGroup:'chest',     sets:'3 × 10',    isTimed:false, masteryThreshold:750, masteryTier:'compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['push_c'], desc:'Lie on the floor with dumbbells at chest height. Press up until arms extend, then lower until triceps contact the floor — that is the bottom of the rep. Floor limits range, reducing shoulder stress.' },
  { name:'Tricep dips (bench)',         type:'push', muscleGroup:'triceps',   sets:'3 × 10–12', isTimed:false, isBodyweight:true, masteryThreshold:500, masteryTier:'isolation', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['push_c'], desc:'Hands on bench edge behind you, legs extended or slightly bent. Lower body bending elbows until upper arms are roughly parallel to floor, then press back up. Keep hips close to bench.' },
  { name:'Pike push-ups (feet elevated)',type:'push', muscleGroup:'shoulders', sets:'2 × max',  isTimed:false, isBodyweight:true, masteryThreshold:500, masteryTier:'isolation', xpRateType:'reps', attrMap:{ primary:['str'], minor:['end'] }, appearsIn:['push_c'], desc:'Feet on bench, walk hands out until hips are high forming an inverted V. Bend elbows to lower head toward floor, then press back up. Elevated feet significantly increases shoulder load.' },
  { name:'Incline push-ups',            type:'push', muscleGroup:'chest',     sets:'3 × 10–15', isTimed:false, isBodyweight:true, masteryThreshold:250, masteryTier:'isolation', xpRateType:'reps', attrMap:{ primary:['str'], minor:['end'] }, appearsIn:[], desc:'Place hands on an elevated surface such as a bench or step. Lower your chest toward the surface and push back up. The incline angle reduces the load compared to standard push-ups, making this a good progression exercise or finisher.' },
  // ── PULL ─────────────────────────────────────────────────────────────────
  { name:'Dumbbell rows',               type:'pull', muscleGroup:'back',      sets:'3 × 8–10',  isTimed:false, masteryThreshold:750, masteryTier:'compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['pull_a','pull_c'], desc:'One hand and knee on bench for support, dumbbell in other hand. Pull toward your hip, elbow back and close to body. Lower slowly. Think of pulling your elbow to the ceiling rather than lifting the dumbbell.' },
  { name:'Pull-up',                     type:'pull', muscleGroup:'back',      sets:'3 × max',   isTimed:false, isBodyweight:true, masteryThreshold:250, masteryTier:'compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['pull_a'], desc:'Hang from a bar with an overhand grip slightly wider than shoulder-width. Pull until chin clears the bar, then lower under full control. One of the best upper body pulling movements available. Add weight via belt or vest once you can do 10+ clean reps.' },
  { name:'Chin-up',                     type:'pull', muscleGroup:'biceps',    sets:'3 × max',   isTimed:false, isBodyweight:true, masteryThreshold:250, masteryTier:'compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['pull_a'], desc:'Hang from a bar with an underhand (supinated) grip shoulder-width apart. Pull until chin clears the bar. The underhand grip shifts more load onto the biceps compared to a pull-up. Add weight via belt or vest once you can do 10+ clean reps.' },
  { name:'Dumbbell deadlifts',          type:'pull', muscleGroup:'full body', sets:'3 × 8–10',  isTimed:false, masteryThreshold:1000, masteryTier:'heavy compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['end'] }, appearsIn:['pull_a'], desc:'Dumbbells in front of thighs, feet hip-width. Hinge at hips pushing them back, flat back, soft knee bend. Lower along legs until hamstring stretch, then drive through heels to stand. Full posterior chain.' },
  { name:'Rear delt fly',               type:'pull', muscleGroup:'shoulders', sets:'3 × 12',    isTimed:false, masteryThreshold:750, masteryTier:'compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['pull_a','pull_b','pull_c'], desc:'Hinge forward until torso is near parallel to floor, dumbbells hanging down. Raise both arms in a wide arc squeezing shoulder blades at top. Lower under control. Targets rear delt and mid-trap.' },
  { name:'Dumbbell curl',               type:'pull', muscleGroup:'biceps',    sets:'3 × 10–12', isTimed:false, masteryThreshold:500, masteryTier:'isolation', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['pull_a'], desc:'Dumbbells at sides, palms forward. Curl to shoulder height, elbows pinned to sides. Lower under full control. Can be done alternating or both arms simultaneously.' },
  { name:'Hammer curl',                 type:'pull', muscleGroup:'forearms',  sets:'3 × 10–12', isTimed:false, masteryThreshold:500, masteryTier:'isolation', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['pull_a'], desc:'Dumbbells at sides, palms facing each other — neutral grip maintained throughout. Curl to shoulder height and lower under control. Shifts emphasis to brachialis and brachioradialis.' },
  { name:'Superman holds',              type:'pull', muscleGroup:'back',      sets:'3 × 10',    isTimed:false, masteryThreshold:500, masteryTier:'isolation', xpRateType:'reps', attrMap:{ primary:['str'], minor:['end'] }, appearsIn:['pull_a','pull_c'], desc:'Face down on floor, arms extended overhead. Lift arms, chest, and legs simultaneously squeezing glutes and back. Hold 2–3 seconds at top, then lower. No-equipment posterior chain finisher.' },
  { name:'Dead hang',                   type:'pull', muscleGroup:'forearms',  sets:'3 × 20–30 sec', isTimed:true, timedUnit:'seconds', masteryThreshold:1800, masteryTier:'timed hold', xpRateType:'timed', attrMap:{ primary:['str'], minor:['end'] }, appearsIn:['pull_a'], desc:'Hang from a pull-up bar with straight arms and shoulders engaged — not shrugging. Hold for time to build grip strength and shoulder stability. An excellent finisher for any pull session.' },
  { name:'DB pullover',                 type:'pull', muscleGroup:'back',      sets:'3 × 10–12', isTimed:false, masteryThreshold:750, masteryTier:'compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['pull_b'], desc:'Lie perpendicular across bench, upper back supported, hips low. One dumbbell with both hands above chest. Lower back over head in wide arc until deep lat stretch, then pull back up. Trains lat width without cable or bar.' },
  { name:'Incline DB rows',             type:'pull', muscleGroup:'back',      sets:'3 × 10',    isTimed:false, masteryThreshold:750, masteryTier:'compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['pull_b'], desc:'Bench at low incline (30 degrees), lie chest-down with a dumbbell in each hand. Row both up simultaneously, elbows back, squeeze shoulder blades at top. Chest-supported position removes lower back involvement entirely.' },
  { name:'DB face pull',                type:'pull', muscleGroup:'shoulders', sets:'3 × 15',    isTimed:false, masteryThreshold:750, masteryTier:'compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['pull_b'], desc:'Hinge forward slightly, light dumbbells in front palms down. Pull toward face while externally rotating shoulders so elbows flare high and wide at the top. Key shoulder health movement targeting rear delt and external rotators.' },
  { name:'Incline curl',                type:'pull', muscleGroup:'biceps',    sets:'3 × 10–12', isTimed:false, masteryThreshold:500, masteryTier:'isolation', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['pull_b'], desc:'Bench at 45–60 degree incline, sit back with arms hanging straight down behind body. Curl to shoulder height from fully stretched position. Incline forces longer range and more load on the long head of the bicep.' },
  { name:'Concentration curl',          type:'pull', muscleGroup:'biceps',    sets:'3 × 10/side', isTimed:false, masteryThreshold:500, masteryTier:'isolation', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['pull_b'], desc:'Seated on bench, elbow braced against inner thigh. Curl dumbbell toward shoulder with strict, controlled motion. Upper arm is fixed — pure isolation for the bicep peak. Complete all reps on one side first.' },
  { name:'DB Romanian DL',              type:'pull', muscleGroup:'hamstrings',sets:'4 × 10',    isTimed:false, masteryThreshold:1000, masteryTier:'heavy compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['end'] }, appearsIn:['pull_c','legs_a'], desc:'Dumbbells in front, feet hip-width. Nearly straight legs, soft knee bend. Hinge at hips pushing them back, lower along legs feeling hamstring stretch to mid-shin. Drive hips forward to return.' },
  { name:'DB renegade row',             type:'pull', muscleGroup:'back',      sets:'3 × 8/side', isTimed:false, masteryThreshold:750, masteryTier:'compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['pull_c'], desc:'Push-up position, each hand on a dumbbell, feet slightly wider than hip-width. Row one dumbbell to your hip while the rest of your body holds stable — resist any rotation. Lower it, then row the other side.' },
  { name:'Zottman curl',                type:'pull', muscleGroup:'forearms',  sets:'3 × 10–12', isTimed:false, masteryThreshold:500, masteryTier:'isolation', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['pull_c'], desc:'Curl up with supinated grip (palms up). At top, rotate palms to face down then lower in that pronated position. Rotate back to supinated at bottom. Lowering phase trains brachioradialis — two variations in one rep.' },
  // ── LEGS ─────────────────────────────────────────────────────────────────
  { name:'DB goblet squat',             type:'legs', muscleGroup:'quads',     sets:'3 × 10–12', isTimed:false, masteryThreshold:1000, masteryTier:'heavy compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['end'] }, appearsIn:['legs_a'], desc:'One dumbbell vertically at chest height, both hands cupped around top. Feet shoulder-width, toes slightly out. Squat until thighs parallel, chest tall, knees tracking over toes. Drive through heels. Counterbalance makes it easier to sit deep.' },
  { name:'DB reverse lunge',            type:'legs', muscleGroup:'quads',     sets:'3 × 10/side', isTimed:false, masteryThreshold:1000, masteryTier:'heavy compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['legs_a'], desc:'Dumbbells at sides. Step one foot back and lower rear knee toward floor, front shin vertical. Front knee should not pass toes. Push through front heel to return. Easier on the knee than a forward lunge.' },
  { name:'DB step-up',                  type:'legs', muscleGroup:'quads',     sets:'3 × 10/side', isTimed:false, masteryThreshold:1000, masteryTier:'heavy compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['legs_a'], desc:'Face the bench, dumbbells at sides. Step one foot onto bench and drive through that foot to stand fully on top. Step back down with control. Complete all reps on one side before switching.' },
  { name:'Glute bridge',                type:'legs', muscleGroup:'glutes',    sets:'3 × 15',    isTimed:false, masteryThreshold:750, masteryTier:'compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['end'] }, appearsIn:['legs_a','legs_b'], desc:'On back, knees bent, feet flat, hip-width apart. Drive hips straight up squeezing glutes forming a straight line from knees to shoulders. Hold at top for a full second. Add a dumbbell across hips for extra resistance.' },
  { name:'Calf raises',                 type:'legs', muscleGroup:'calves',    sets:'3 × 15–20', isTimed:false, masteryThreshold:750, masteryTier:'compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['end'] }, appearsIn:['legs_a','legs_b','legs_c'], desc:'Dumbbells at sides, balls of feet on bench or step edge. Rise onto toes as high as possible, hold briefly, then lower all the way down past the step for a full stretch. Calves respond well to higher reps and slow lowering.' },
  { name:'DB sumo squat',               type:'legs', muscleGroup:'quads',     sets:'3 × 10–12', isTimed:false, masteryThreshold:1000, masteryTier:'heavy compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['end'] }, appearsIn:['legs_b'], desc:'One dumbbell vertically between both hands. Feet wider than shoulder-width, toes at 45 degrees. Squat deep, chest tall, knees tracking over toes. Drive through heels. Wide stance hits inner quad (VMO) and adductors.' },
  { name:'DB Bulgarian split squat',    type:'legs', muscleGroup:'quads',     sets:'3 × 8/side', isTimed:false, masteryThreshold:1000, masteryTier:'heavy compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['legs_b'], desc:'Face away from bench, rear foot elevated on it. Walk front foot forward until shin stays vertical at bottom. Dumbbells at sides, lower rear knee toward floor under control. Drive through front heel to return. Demanding single-leg movement — expect to go lighter than you think.' },
  { name:'DB forward lunge',            type:'legs', muscleGroup:'quads',     sets:'3 × 10/side', isTimed:false, masteryThreshold:1000, masteryTier:'heavy compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['legs_b'], desc:'Dumbbells at sides. Step one foot forward, lower rear knee toward floor, push off front foot to return. Forward step creates longer shin angle loading the quad more than a reverse lunge. More knee stress than reverse — substitute if you have knee sensitivity.' },
  { name:'DB sissy squat',              type:'legs', muscleGroup:'quads',     sets:'3 × 10–12', isTimed:false, masteryThreshold:1000, masteryTier:'heavy compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['legs_b'], desc:'Light dumbbell at chest for counterbalance, or hold wall for balance. Rise onto toes and lean torso back as you bend knees forward, lowering in a diagonal line. Isolates quad and VMO directly. Build up slowly — significant patellar tendon stress.' },
  { name:'DB single-leg Romanian DL',   type:'legs', muscleGroup:'hamstrings',sets:'3 × 8/side', isTimed:false, masteryThreshold:1000, masteryTier:'heavy compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['legs_c'], desc:'One dumbbell in opposite hand to working leg. Stand on one leg, soft knee bend. Hinge pushing hips back, lower dumbbell along standing leg while working leg extends behind for balance. Tremendous unilateral hamstring and glute strength builder.' },
  { name:'Nordic curl',                 type:'legs', muscleGroup:'hamstrings',sets:'3 × 5–8',   isTimed:false, masteryThreshold:1000, masteryTier:'heavy compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['end'] }, appearsIn:['legs_c'], desc:'Kneel, feet anchored under a heavy dumbbell or bench base. Lower toward floor as slowly as possible by resisting with hamstrings. Catch yourself with hands, do a small push-up to bottom, then pull back up with hamstrings. One of the most effective hamstring exercises available.' },
  { name:'Lateral lunge',               type:'legs', muscleGroup:'glutes',    sets:'3 × 10/side', isTimed:false, masteryThreshold:1000, masteryTier:'heavy compound', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['legs_c'], desc:'One dumbbell at chest with both hands. Step wide to one side and sit into that hip, opposite leg straight, foot flat. Working leg takes deep knee bend. Push through bent leg to return. Trains adductors and glutes in the frontal plane.' },
  // ── CORE ─────────────────────────────────────────────────────────────────
  { name:'Plank',                        type:'core', muscleGroup:'core',     sets:'3 × 30–45 sec', isTimed:true, timedUnit:'seconds', masteryThreshold:3000, masteryTier:'timed hold', xpRateType:'timed', attrMap:{ primary:['str'], minor:['end'] }, appearsIn:['push_a','legs_a','legs_b','legs_c','core_a'], desc:'Forearms on the floor, body in a straight line from head to heels. Squeeze your glutes and brace your abs hard — don\'t let your hips sag or pike.' },
  { name:'Ab wheel rollout (or bench walkout)', type:'core', muscleGroup:'core', sets:'3 × 8–10', isTimed:false, masteryThreshold:500, masteryTier:'isolation', xpRateType:'reps', attrMap:{ primary:['str'], minor:['dex'] }, appearsIn:['push_a','push_b','core_a'], desc:'Kneel and grip an ab wheel, or place hands on the bench edge and walk them forward. Roll or walk out slowly until nearly parallel to the floor, then pull back in using your abs.' },

};

function muscleGroupPill(muscleGroup) {
  if (!muscleGroup) return '';
  const color = MUSCLE_GROUP_COLORS[muscleGroup] || '#888780';
  const label = muscleGroup.charAt(0).toUpperCase() + muscleGroup.slice(1);
  return `<span style="display:inline-block;background:${color};color:#fff;
    font-family:'DM Mono',monospace;font-size:9px;font-weight:600;
    letter-spacing:0.4px;text-transform:uppercase;
    padding:2px 7px;border-radius:20px;line-height:1.6;white-space:nowrap">${label}</span>`;
}
function getExercise(name) {
  // Aliases for renamed exercises — handles old session data
  const ALIASES = {
    'Push-ups (finisher)': 'Push-ups',
  };
  const resolvedName = ALIASES[name] || name;
  const ex = EXERCISE_LIBRARY.find(e => e.name === resolvedName);
  if (!ex) console.warn('Exercise not in library:', name);
  return ex || { name, type:'general', muscleGroup:null, desc:'', sets:'', isTimed:false, isActivity:false, appearsIn:[] };
}
function isBodyweightExercise(name) {
  return !!(EXERCISE_LIBRARY.find(e => e.name === name)?.isBodyweight);
}

function isTimedExercise(name) {
  return !!(EXERCISE_LIBRARY.find(e => e.name === name)?.isTimed);
}
function getActivity(name) {
  return EXERCISE_LIBRARY.find(e => e.isActivity && e.name === name) || null;
}
function isActivityByName(name) {
  return EXERCISE_LIBRARY.some(e => e.isActivity && e.name === name);
}
function isRunningSession(s) {
  return getActivity(s.customName)?.distanceCategory === 'running';
}
function isBikingSession(s) {
  return getActivity(s.customName)?.distanceCategory === 'biking';
}
function getActivityXPRate(name) {
  return getActivity(name)?.xpPerMin || 6;
}
function getActivityMasteryThreshold(name) {
  return getActivity(name)?.masteryThreshold || 600;
}
function getActivityAttrMap(name) {
  return getActivity(name)?.attrMap || null;
}

    exercises:['Bench-assisted leg raises','Crunches','Reverse crunch','Decline crunches','Seated knee tucks']
  },
  core_c: {
