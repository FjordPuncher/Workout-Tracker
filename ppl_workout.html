  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById('screen-backfill').classList.add('active');
  setActiveNav(null);
}

// Returns a human-readable note if the session was logged on a different day than it occurred
function loggedLaterNote(s) {
  if (!s.loggedAt) return null;
  const workoutDay = new Date(s.date).toDateString();
  const logDay = new Date(s.loggedAt).toDateString();
  if (workoutDay === logDay) return null;
  return 'Added to log on ' + new Date(s.loggedAt).toLocaleDateString('en-US', {
    weekday: 'short', month: 'short', day: 'numeric', year: 'numeric',
    hour: 'numeric', minute: '2-digit'
  });
}

function renderSessionDetail(s) {
  const vm = getVariationMeta(s.variationKey, s.customName, s.category, s.customWorkoutId);
  const tc = vm.color;
  const bg = vm.bg;
  const tt = vm.text;
  const dateStr = new Date(s.date).toLocaleDateString('en-US', {
    weekday:'long', month:'long', day:'numeric', year:'numeric'
  });
  const totalSets = s.exercises.reduce((acc, e) => acc + e.sets.filter(st => st.reps).length, 0);

  // Calculate XP for this session
  const sessionIdx = sessions.indexOf(s);
  const priorSessions = sessionIdx > 0 ? sessions.slice(0, sessionIdx) : [];
  const priorPBs = {};
  priorSessions.forEach(ps => ps.exercises.forEach(ex => {
    if (!priorPBs[ex.name]) priorPBs[ex.name] = {weight:0, reps:0};
    ex.sets.forEach(st => {
      const w = parseFloat(st.weight)||0, r = parseFloat(st.reps)||0;
      if (w > priorPBs[ex.name].weight) priorPBs[ex.name].weight = w;
      if (r > priorPBs[ex.name].reps) priorPBs[ex.name].reps = r;
    });
  }));
  const { breakdown, attrGains } = calcSessionXP(s, priorSessions, priorPBs);
  const totalXP = Object.values(attrGains).reduce((a, b) => a + b, 0);

  document.getElementById('detail-topbar-title').textContent = vm.label;

  let html = `<div class="detail-header">
    <div class="detail-badge" style="background:${bg};color:${tt}">${vm.label} — ${vm.type.toUpperCase()}</div>
    <div class="detail-title">${vm.name}</div>
    <div class="detail-date">${dateStr}</div>
    ${loggedLaterNote(s) ? `<div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--text-dim);margin-top:5px;opacity:0.8">${loggedLaterNote(s)}</div>` : ''}
  </div>`;

  if (s.missed) {
    html += `<div class="detail-missed-pill">Retroactive / Missed workout</div>`;
  }

  // Duration / distance / notes meta block
  const hasMeta = (s.duration && String(s.duration).trim()) || (s.notes && s.notes.trim()) || (s.distance && parseFloat(s.distance) > 0);
  if (hasMeta) {
    html += `<div class="data-section-card" style="margin:14px 18px 0">`;
    if (s.duration && String(s.duration).trim()) {
      html += `<div class="detail-meta-row">
        <div class="detail-meta-label">Duration</div>
        <div class="detail-meta-value">${fmtDuration(s.duration)}</div>
      </div>`;
    }
    if (s.distance && String(s.distance).trim() && parseFloat(s.distance) > 0) {
      const dist = parseFloat(s.distance);
      const pace = (s.duration && parseFloat(s.duration) > 0)
        ? (() => { const p = parseFloat(s.duration)/dist; const m=Math.floor(p); const sec=Math.round((p-m)*60); return `${m}:${String(sec).padStart(2,'0')} /mi`; })()
        : null;
      html += `<div class="detail-meta-row">
        <div class="detail-meta-label">Distance</div>
        <div class="detail-meta-value">${dist.toFixed(2)} mi${pace ? ` · ${pace}` : ''}</div>
      </div>`;
    }
    if (s.notes && s.notes.trim()) {
      html += `<div class="detail-meta-row">
        <div class="detail-meta-label">Notes</div>
        <div class="detail-meta-value">${s.notes.replace(/\n/g, '<br>')}</div>
      </div>`;
    }
    html += `</div>`;
  }

  // ── Workout stats block ────────────────────────────────────────────────────
  const vol = s.exercises.reduce((acc, e) =>
    acc + e.sets.reduce((a, st) => a + ((parseFloat(st.reps)||0) * (parseFloat(st.weight)||0)), 0), 0);
  const exCount = s.exercises.filter(e => e.sets.some(st => st.reps)).length;
  const wpr = sessionWeightPerRep(s);

  // PR count for this session
  const priorPBsForStats = {};
  priorSessions.forEach(ps => ps.exercises.forEach(ex => {
    if (!priorPBsForStats[ex.name]) priorPBsForStats[ex.name] = {weight:0, reps:0};
    ex.sets.forEach(st => {
      const w = parseFloat(st.weight)||0, r = parseFloat(st.reps)||0;
      if (w > priorPBsForStats[ex.name].weight) priorPBsForStats[ex.name].weight = w;
      if (r > priorPBsForStats[ex.name].reps) priorPBsForStats[ex.name].reps = r;
    });
  }));
  // Top exercise by volume
  let topEx = null, topVol = 0;
  s.exercises.forEach(ex => {
    const v = ex.sets.reduce((a, st) => a + ((parseFloat(st.reps)||0)*(parseFloat(st.weight)||0)), 0);
    if (v > topVol) { topVol = v; topEx = ex.name; }
  });

  // Heaviest lift with exercise name
  let heaviest = 0, heaviestEx = null;
  s.exercises.forEach(ex => {
    ex.sets.forEach(st => {
      const w = parseFloat(st.weight)||0;
      if (st.reps && w > heaviest) { heaviest = w; heaviestEx = ex.name; }
    });
  });

  // Most reps in a single set with exercise name
  let mostReps = 0, mostRepsEx = null;
  s.exercises.forEach(ex => {
    ex.sets.forEach(st => {
      const r = parseFloat(st.reps)||0;
      if (r > mostReps) { mostReps = r; mostRepsEx = ex.name; }
    });
  });

  // PRs with exercise names
  const prList = [];
  s.exercises.forEach(ex => {
    const prev = priorPBsForStats[ex.name] || {weight:0, reps:0};
    ex.sets.forEach(st => {
      const w = parseFloat(st.weight)||0, r = parseFloat(st.reps)||0;
      if (w > prev.weight || r > prev.reps) {
        if (!prList.find(p => p.name === ex.name)) prList.push({ name: ex.name });
      }
    });
  });
  const prCount = prList.length;
  const priorWithDur = priorSessions.filter(ps => parseFloat(ps.duration) > 0);
  const avgDurStat = priorWithDur.length >= 3 ? priorWithDur.reduce((a, ps) => a + parseFloat(ps.duration), 0) / priorWithDur.length : null;
  const vm2 = getVariationMeta(s.variationKey, s.customName, s.category, s.customWorkoutId);
  const priorSameType = priorSessions.filter(ps => getVariationMeta(ps.variationKey, ps.customName, ps.category).type === vm2.type);
  const priorVols = priorSameType.map(ps => ps.exercises.reduce((acc, e) => acc + e.sets.reduce((a, st) => a + ((parseFloat(st.reps)||0)*(parseFloat(st.weight)||0)), 0), 0)).filter(v => v > 0);
  const avgVolStat = priorVols.length >= 3 ? priorVols.reduce((a,b)=>a+b,0)/priorVols.length : null;

  const aboveAvgVol = avgVolStat !== null && vol > avgVolStat;
  const aboveAvgDur = avgDurStat !== null && (parseFloat(s.duration)||0) > avgDurStat;

  // ── Activity stats block (running, taekwondo, etc.) ───────────────────────
  const isActivitySession = s.variationKey === CUSTOM_KEY && s.customName &&
    PREDEFINED_ACTIVITIES.find(a => a.name === s.customName);

  if (isActivitySession && exCount === 0) {
    // Exclude current session from prior bests comparison
    const actSessions = sessions.filter(ps =>
      ps.variationKey === CUSTOM_KEY && ps.customName === s.customName &&
      String(ps.id) !== String(s.id)
    );
    const hasDistance = parseFloat(s.distance) > 0;
    const hasDuration = parseFloat(s.duration) > 0;
    const curDist = parseFloat(s.distance)||0, curDur = parseFloat(s.duration)||0;

    // Best duration/distance from prior sessions
    const bestDur = Math.max(0, ...actSessions.map(ps => parseFloat(ps.duration)||0));
    const bestDist = Math.max(0, ...actSessions.map(ps => parseFloat(ps.distance)||0));

    // Best pace
    let bestPaceStr = null;
    actSessions.forEach(ps => {
      const d = parseFloat(ps.distance)||0, t = parseFloat(ps.duration)||0;
      if (d > 0 && t > 0) {
        const pace = t / d;
        if (!bestPaceStr || pace < (bestPaceStr._val)) {
          const m = Math.floor(pace), sec = Math.round((pace-m)*60);
          bestPaceStr = { str: `${m}:${String(sec).padStart(2,'0')}`, _val: pace };
        }
      }
    });

    // Current session pace
    const curPace = (curDist > 0 && curDur > 0) ? (() => {
      const p = curDur/curDist, m = Math.floor(p), sec = Math.round((p-m)*60);
      return { str: `${m}:${String(sec).padStart(2,'0')}`, _val: p };
    })() : null;

    const isBestDur  = hasDuration && curDur >= bestDur;
    const isBestDist = hasDistance && curDist >= bestDist;
    const isBestPace = curPace && bestPaceStr && curPace._val <= bestPaceStr._val;

    html += `<div class="detail-section-label" style="margin-top:16px">Session stats</div>`;
    html += `<div class="stats-grid" style="padding:0 18px;margin-bottom:0">`;

    if (hasDuration) html += `<div class="stat-tile${isBestDur?' ':' '}">
      <div class="stat-tile-label">Duration${isBestDur?' ⭐':''}</div>
      <div class="stat-tile-value" style="font-size:18px">${fmtDuration(s.duration)}</div>
      <div class="stat-tile-unit">${isBestDur?'personal best':''}</div>
    </div>`;

    if (hasDistance) html += `<div class="stat-tile${isBestDist?' ':' '}">
      <div class="stat-tile-label">Distance${isBestDist?' ⭐':''}</div>
      <div class="stat-tile-value">${curDist.toFixed(2)}</div>
      <div class="stat-tile-unit">mi${isBestDist?' · personal best':''}</div>
      ${(() => { const dc = distanceComparisonPair(curDist, s.id); return `<div style="font-family:'DM Mono',monospace;font-size:8px;color:var(--end);margin-top:3px;opacity:0.9;line-height:1.5">≈ ${dc.local}<br>≈ ${dc.national}</div>`; })()}
    </div>`;

    if (curPace) html += `<div class="stat-tile${isBestPace?' ':' '}">
      <div class="stat-tile-label">Pace${isBestPace?' ⭐':''}</div>
      <div class="stat-tile-value" style="font-size:20px">${curPace.str}</div>
      <div class="stat-tile-unit">min/mi${isBestPace?' · personal best':''}</div>
    </div>`;

    html += `</div>`;

    // View progress link for activities
    const safeActName = s.customName.replace(/'/g,"\\'");
    html += `<div style="padding:8px 18px 0">
      <button onclick="showProgressionScreen('${safeActName}','detail')"
        style="width:100%;padding:8px;background:none;border:1px solid var(--border);
          border-radius:var(--radius);color:var(--text-dim);font-family:'DM Sans',sans-serif;
          font-size:12px;cursor:pointer;text-align:center">
        📈 View ${s.customName} progress
      </button>
    </div>`;
  }

  if (exCount > 0 || vol > 0) {
    html += `<div class="detail-section-label" style="margin-top:16px">Workout stats</div>`;
    html += `<div class="stats-grid" style="padding:0 18px;margin-bottom:0">`;

    if (vol > 0) html += `<div class="stat-tile${aboveAvgVol?' ':' '}">
      <div class="stat-tile-label">Total volume${aboveAvgVol?' 📈':''}</div>
      <div class="stat-tile-value">${fmt(vol)}</div>
      <div class="stat-tile-unit">lbs moved</div>
      <div style="font-family:'DM Mono',monospace;font-size:8px;color:var(--str);margin-top:3px;opacity:0.8;line-height:1.5">≈ ${volumeComparisons(vol, s.id)}<br>≈ ${volumeComparisonScaled(vol, s.id)}</div>
    </div>`;

    if (totalSets > 0) html += `<div class="stat-tile">
      <div class="stat-tile-label">Sets</div>
      <div class="stat-tile-value">${totalSets}</div>
      <div class="stat-tile-unit">across ${exCount} exercise${exCount!==1?'s':''}</div>
    </div>`;

    if (heaviest > 0) html += `<div class="stat-tile">
      <div class="stat-tile-label">Heaviest lift</div>
      <div class="stat-tile-value">${heaviest}</div>
      <div class="stat-tile-unit">lbs · ${heaviestEx}</div>
    </div>`;

    if (mostReps > 0) html += `<div class="stat-tile">
      <div class="stat-tile-label">Most reps (set)</div>
      <div class="stat-tile-value">${mostReps}</div>
      <div class="stat-tile-unit">reps · ${mostRepsEx}</div>
    </div>`;

    if (prCount > 0) {
      const pbId = `pb-tile-${s.id}`;
      const showAll = prCount <= 3;
      const previewNames = prList.slice(0, 3).map(p => p.name).join(', ');
      const allNames = prList.map(p => p.name).join(', ');
      html += `<div class="stat-tile wide" style="background:var(--str-bg);border-color:var(--str);margin-top:0">
        <div class="stat-tile-label" style="color:var(--str-text);opacity:0.7">Personal best${prCount!==1?'s':''} ⭐</div>
        <div id="${pbId}-names" style="font-family:'Syne',sans-serif;font-size:${prCount > 2?'13px':'16px'};font-weight:800;color:var(--str-text);line-height:1.4;margin:4px 0 2px">
          ${showAll ? allNames : previewNames + `<span id="${pbId}-extra"> +${prCount - 3} more</span>`}
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div class="stat-tile-unit">${prCount} new PB${prCount!==1?'s':''}</div>
          ${prCount > 3 ? `<button
            data-pb-id="${pbId}"
            data-all-names="${allNames.replace(/"/g,'&quot;')}"
            data-preview-names="${previewNames.replace(/"/g,'&quot;')}"
            data-total="${prCount}"
            onclick="togglePBTile(this)"
            id="${pbId}-btn"
            style="background:none;border:none;font-family:'DM Mono',monospace;font-size:9px;
              color:var(--str);cursor:pointer;padding:0;text-transform:uppercase;letter-spacing:0.5px">
            Show all
          </button>` : ''}
        </div>
      </div>`;
    }

    if (topEx && exCount > 1) html += `<div class="stat-tile wide">
      <div class="stat-tile-label">Top exercise</div>
      <div class="stat-tile-value" style="font-size:14px;line-height:1.2">${topEx}</div>
      <div class="stat-tile-unit">${fmt(topVol)} lbs</div>
    </div>`;

    if (s.duration && aboveAvgDur) html += `<div class="stat-tile wide" style="background:var(--agi-bg);border-color:var(--agi)">
      <div class="stat-tile-label" style="color:var(--agi-text);opacity:0.7">Duration</div>
      <div class="stat-tile-value" style="color:var(--agi-text);font-size:18px">${fmtDuration(s.duration)}</div>
      <div class="stat-tile-unit">📈 above your average</div>
    </div>`;

    html += `</div>`;
  }
  if (totalXP > 0) {
    html += `<div class="detail-section-label" style="margin-top:16px">
      Experience earned
      <span style="font-family:'Syne',sans-serif;font-size:14px;font-weight:800;
        color:var(--str);margin-left:8px;text-shadow:0 0 10px var(--str-glow)">
        +${totalXP} XP
      </span>
    </div>`;

    html += `<div class="data-section-card" style="margin:0 18px">`;

    // Breakdown rows
    if (breakdown.base > 0) html += `<div class="detail-meta-row">
      <div class="detail-meta-label">Showed up</div>
      <div class="detail-meta-value" style="color:var(--text-muted)">+${breakdown.base}</div>
    </div>`;
    if (breakdown.duration > 0) html += `<div class="detail-meta-row">
      <div class="detail-meta-label">Duration</div>
      <div class="detail-meta-value" style="color:var(--text-muted)">+${breakdown.duration}</div>
    </div>`;
    if (breakdown.reps > 0) html += `<div class="detail-meta-row">
      <div class="detail-meta-label">Reps</div>
      <div class="detail-meta-value" style="color:var(--text-muted)">+${breakdown.reps}</div>
    </div>`;
    if (breakdown.volume > 0) html += `<div class="detail-meta-row">
      <div class="detail-meta-label">Volume</div>
      <div class="detail-meta-value" style="color:var(--text-muted)">+${breakdown.volume}</div>
    </div>`;
    if (breakdown.distance > 0) html += `<div class="detail-meta-row">
      <div class="detail-meta-label">Distance</div>
      <div class="detail-meta-value" style="color:var(--text-muted)">+${breakdown.distance}</div>
    </div>`;
    if (breakdown.pr > 0) html += `<div class="detail-meta-row">
      <div class="detail-meta-label">PB bonus</div>
      <div class="detail-meta-value" style="color:var(--str-text)">+${breakdown.pr} ⭐</div>
    </div>`;
    if (breakdown.aboveAvg > 0) html += `<div class="detail-meta-row">
      <div class="detail-meta-label">Above avg</div>
      <div class="detail-meta-value" style="color:var(--agi-text)">+${breakdown.aboveAvg} 📈</div>
    </div>`;
    if (s.achievementXP > 0) html += `<div class="detail-meta-row">
      <div class="detail-meta-label">Achievement</div>
      <div class="detail-meta-value" style="color:var(--str-text)">+${s.achievementXP} 🏆</div>
    </div>`;

    html += `</div>`;

    // Per-attribute gains
    const attrRows = Object.entries(attrGains).filter(([,xp]) => xp > 0);
    if (attrRows.length) {
      html += `<div style="display:flex;gap:8px;padding:0 18px;margin-top:8px">`;
      attrRows.forEach(([key, xp]) => {
        const a = ATTRS[key];
        const lvl = levelFromXP((computeAllXP(priorSessions).totalAttrXP[key]||0) + xp);
        html += `<div style="flex:1;background:${a.bg};border:1px solid ${a.color}20;
          border-radius:10px;padding:10px 10px 8px;text-align:center">
          <div style="font-size:16px">${a.icon}</div>
          <div style="font-family:'Syne',sans-serif;font-size:13px;font-weight:800;
            color:${a.color};margin-top:2px">+${xp}</div>
          <div style="font-family:'DM Mono',monospace;font-size:8px;
            color:${a.text};opacity:0.6;margin-top:1px;text-transform:uppercase">
            ${a.name.slice(0,3)} Lv${lvl.level}
          </div>
        </div>`;
      });
      html += `</div>`;
    }
  }

  // ── Sets ──────────────────────────────────────────────────────────────────
  const loggedExercises = s.exercises.filter(e => e.sets && e.sets.some(st => parseFloat(st.reps) > 0 || parseFloat(st.duration) > 0));

  if (!loggedExercises.length) {
    html += `<div style="padding:24px 18px;color:var(--text-dim);font-size:13px">No sets were logged for this session.</div>`;
  } else {
    html += `<div class="detail-section-label" style="margin-top:16px">${totalSets} sets logged</div>`;
    loggedExercises.forEach(ex => {
      const validSets = ex.sets.filter(st => parseFloat(st.reps) > 0 || parseFloat(st.duration) > 0);
      html += `<div class="detail-ex-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;padding-right:4px">
          <div class="detail-ex-name">${ex.name}</div>
          <button onclick="showProgressionScreen('${ex.name.replace(/'/g,"\\'")}','detail')"
            style="background:none;border:none;font-size:12px;cursor:pointer;opacity:0.5;padding:0 4px"
            title="View progress">📈</button>
        </div>
        ${validSets.map((st, i) => {
          const isTimed = parseFloat(st.duration) > 0;
          const reps = isTimed ? `${parseFloat(st.duration)}s` : parseFloat(st.reps) || 0;
          const hasWeight = !isTimed && st.weight && parseFloat(st.weight) > 0;
          return `<div class="detail-set-row">
            <div class="detail-set-num">${i + 1}</div>
            <div class="detail-set-reps">${reps}</div>
            <div class="detail-set-x">${hasWeight ? '×' : isTimed ? 'hold' : 'reps'}</div>
            ${hasWeight ? `<div class="detail-set-weight">${parseFloat(st.weight)}</div>
            <div class="detail-set-weight-unit">lbs</div>` : ''}
          </div>`;
        }).join('')}
      </div>`;
    });
  }

  html += `<button class="detail-delete-btn" data-session-id="${s.id}" onclick="deleteSessionFromDetail('${s.id}')">
    Delete this session
  </button>`;

  document.getElementById('detail-body').innerHTML = html;
}

function togglePBTile(btn) {
  const id = btn.dataset.pbId;
  const allNames = btn.dataset.allNames;
  const previewNames = btn.dataset.previewNames;
  const total = parseInt(btn.dataset.total);
  const namesEl = document.getElementById(id + '-names');
  if (!namesEl) return;
  const expanded = btn.textContent.trim() === 'Show less';
  if (expanded) {
    namesEl.innerHTML = previewNames + `<span id="${id}-extra"> +${total - 3} more</span>`;
    btn.textContent = 'Show all';
  } else {
    namesEl.textContent = allNames;
    btn.textContent = 'Show less';
  }
}

function deleteSessionFromDetail(sessionId) {
  if (!confirm('Delete this session? This cannot be undone.')) return;
  const idx = sessions.findIndex(s => String(s.id) === String(sessionId));
  if (idx !== -1) {
    sessions.splice(idx, 1);
    saveSessions();
    showToast('Session deleted');
    showHistory();
  }
}

function renderHistorySessionCard(s) {
  const vm = getVariationMeta(s.variationKey, s.customName, s.category, s.customWorkoutId);
  const totalSets = s.exercises.reduce((acc, e) => acc + e.sets.filter(st => st.reps).length, 0);

  // Calculate XP earned this session
  const sessionIdx = sessions.indexOf(s);
  const priorSessions = sessionIdx > 0 ? sessions.slice(0, sessionIdx) : [];
  const priorPBs = {};
  priorSessions.forEach(ps => ps.exercises.forEach(ex => {
    if (!priorPBs[ex.name]) priorPBs[ex.name] = {weight:0, reps:0};
    ex.sets.forEach(st => {
      const w = parseFloat(st.weight)||0, r = parseFloat(st.reps)||0;
      if (w > priorPBs[ex.name].weight) priorPBs[ex.name].weight = w;
      if (r > priorPBs[ex.name].reps) priorPBs[ex.name].reps = r;
    });
  }));
  const { attrGains } = calcSessionXP(s, priorSessions, priorPBs);
  const totalXP = Object.values(attrGains).reduce((a, b) => a + b, 0);

  const metaParts = [];
  if (totalSets) metaParts.push(`${totalSets} set${totalSets !== 1 ? 's' : ''} logged`);
  if (s.duration && String(s.duration).trim()) metaParts.push(fmtDuration(s.duration));
  if (totalXP > 0) metaParts.push(`+${totalXP} XP`);
  if (s.missed) metaParts.push('retroactive');
  const logNote = loggedLaterNote(s);
  if (logNote) metaParts.push(logNote);
  const meta = metaParts.join(' · ') || 'No sets logged';

  return `<button class="history-item" onclick="showSessionDetail('${s.id}')">
    <div class="history-item-header">
      <div class="history-item-left">
        <div class="history-item-name" style="color:${vm.color}">${vm.label} — ${vm.name}${vm.deleted ? `<span style="font-family:'DM Mono',monospace;font-size:8px;color:var(--text-dim);margin-left:6px;opacity:0.7">deleted</span>` : ''}</div>
        <div class="history-item-meta">${meta}</div>
      </div>
      <div class="history-item-arrow">›</div>
    </div>
  </button>`;
}

function renderHistory() {
  const list = document.getElementById('history-list');
  if (!sessions.length) {
    list.innerHTML = '<div class="history-empty">No sessions logged yet.</div>';
    return;
  }

  // Group sessions by calendar date (most recent first)
  const grouped = {};
  [...sessions].reverse().forEach(s => {
    const d = new Date(s.date);
    const key = d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
    if (!grouped[key]) grouped[key] = { label: key, sessions: [], dateObj: d };
    grouped[key].sessions.push(s);
  });

  list.innerHTML = Object.values(grouped).map(group => {
    const today = new Date();
    const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
    const gd = group.dateObj;
    let label = group.label;
    if (gd.toDateString() === today.toDateString()) label = 'Today';
    else if (gd.toDateString() === yesterday.toDateString()) label = 'Yesterday';

    const cards = group.sessions.map(s => renderHistorySessionCard(s)).join('');
    return `<div class="history-date-group">
      <div class="history-day-header">
        <div class="history-day-label">${label}</div>
        <div class="history-day-line"></div>
      </div>
      ${cards}
    </div>`;
  }).join('');
}

// Compute PBs from all sessions. Returns map: exName -> { weight, reps, weightDate, repsDate, repsWeight }
function computePBs(sessionList) {
  const sl = sessionList || sessions;
  const pbs = {};
  sl.forEach(s => {
    s.exercises.forEach(ex => {
      if (!ex.name) return;
      const timed = isTimedExercise(ex.name);
      // Normalise to library canonical name if it exists (handles capitalisation changes)
      const canonicalName = EXERCISE_LIBRARY.find(e => e.name.toLowerCase() === ex.name.toLowerCase())?.name || ex.name;
      const exType = getExercise(canonicalName)?.type || 'core';
      if (!pbs[canonicalName]) pbs[canonicalName] = {
        weight: 0, reps: 0, duration: 0,
        weightDate: null, repsDate: null, durationDate: null,
        repsWeight: 0, variationKey: s.variationKey, type: exType,
      };
      if (timed) {
        ex.sets.forEach(set => {
          const dur = parseFloat(set.duration) || 0;
          if (dur > pbs[canonicalName].duration) {
            pbs[canonicalName].duration = dur;
            pbs[canonicalName].durationDate = s.date;
          }
        });
      } else {
        ex.sets.forEach(set => {
          const reps = parseFloat(set.reps);
          const weight = parseFloat(set.weight);
          if (!isNaN(weight) && weight > pbs[canonicalName].weight) {
            pbs[canonicalName].weight = weight;
            pbs[canonicalName].weightDate = s.date;
            pbs[canonicalName].weightReps = !isNaN(reps) && reps > 0 ? reps : 0;
          }
          if (!isNaN(reps) && reps > pbs[canonicalName].reps) {
            pbs[canonicalName].reps = reps;
            pbs[canonicalName].repsDate = s.date;
            pbs[canonicalName].repsWeight = !isNaN(weight) && weight > 0 ? weight : 0;
          }
        });
      }
    });
  });
  return pbs;
}

// Check the most recently saved session for new PBs and fire notifications
function checkAndAutoSyncPBs() {
  if (!sessions.length) return;
  const latest = sessions[sessions.length - 1];
  const allPrevious = sessions.slice(0, -1);

  // Build PBs from all sessions EXCEPT the latest
  const prevPBs = {};
  allPrevious.forEach(s => {
    s.exercises.forEach(ex => {
      if (!ex.name) return;
      const timed = isTimedExercise(ex.name);
      if (!prevPBs[ex.name]) prevPBs[ex.name] = { weight: 0, reps: 0, duration: 0 };
      ex.sets.forEach(set => {
        if (timed) {
          const dur = parseFloat(set.duration) || 0;
          if (dur > prevPBs[ex.name].duration) prevPBs[ex.name].duration = dur;
        } else {
          const reps = parseFloat(set.reps);
          const weight = parseFloat(set.weight);
          if (!isNaN(weight) && weight > prevPBs[ex.name].weight) prevPBs[ex.name].weight = weight;
          if (!isNaN(reps) && reps > prevPBs[ex.name].reps) prevPBs[ex.name].reps = reps;
        }
      });
    });
  });

  // Check latest session for beats
  const newPBs = [];
  latest.exercises.forEach(ex => {
    if (!ex.name) return;
    ex.sets.forEach(set => {
      const reps = parseFloat(set.reps);
      const weight = parseFloat(set.weight);
      const prev = prevPBs[ex.name] || { weight: 0, reps: 0 };
      if (!isNaN(weight) && weight > 0 && weight > prev.weight) {
        const shortName = ex.name.split(' ').slice(0, 3).join(' ');
        if (!newPBs.find(p => p.name === shortName && p.type === 'weight')) {
          newPBs.push({ name: shortName, type: 'weight', value: weight });
        }
      }
      if (!isNaN(reps) && reps > 0 && reps > prev.reps) {
        const shortName = ex.name.split(' ').slice(0, 3).join(' ');
        if (!newPBs.find(p => p.name === shortName && p.type === 'reps')) {
          newPBs.push({ name: shortName, type: 'reps', value: reps });
        }
      }
    });
  });

  // Fire PB notifications with staggered timing
  newPBs.slice(0, 3).forEach((pb, i) => {
    setTimeout(() => {
      const unit = pb.type === 'weight' ? 'lbs' : 'reps';
      showPBToast(`New ${pb.type} record — ${pb.name}: ${pb.value} ${unit}`);
    }, i * 2600);
  });
}

  msgEl.textContent = msg;
  el.classList.add('show');
  clearTimeout(pbToastTimeout);
  pbToastTimeout = setTimeout(() => el.classList.remove('show'), 3000);
}

// ── helpers ──────────────────────────────────────────────────────────────────
function totalLbs(sessionList) {
  return sessionList.reduce((acc, s) =>
    acc + s.exercises.reduce((a2, e) =>
      a2 + e.sets.reduce((a3, st) => {
        const r = parseFloat(st.reps) || 0;
        const w = parseFloat(st.weight) || 0;
        return a3 + (r * w);
      }, 0), 0), 0);
}

function totalMiles(sessionList) {
  return sessionList.reduce((acc, s) => acc + (parseFloat(s.distance) || 0), 0);
}

function cardioSessions(sessionList) {
  return sessionList.filter(s => {
    if (ORDER.includes(s.variationKey)) return false;
    const vm = getVariationMeta(s.variationKey, s.customName, s.category, s.customWorkoutId);
    return vm.type === 'cardio';
  });
}

// Returns avg pace as "M:SS /mi" string, or null if no data
function avgPace(sessionList) {
  const withBoth = sessionList.filter(s => parseFloat(s.distance) > 0 && parseFloat(s.duration) > 0);
  if (!withBoth.length) return null;
  const totalMins = withBoth.reduce((a, s) => a + parseFloat(s.duration), 0);
  const totalDist = withBoth.reduce((a, s) => a + parseFloat(s.distance), 0);
  if (!totalDist) return null;
  const paceDecimal = totalMins / totalDist;
  const m = Math.floor(paceDecimal);
  const s = Math.round((paceDecimal - m) * 60);
  return `${m}:${String(s).padStart(2,'0')}`;
}

// Best distance in a single session
function bestDistance(sessionList) {
  let best = { dist: 0, date: null };
  sessionList.forEach(s => {
    const d = parseFloat(s.distance);
    if (d > best.dist) { best = { dist: d, date: s.date }; }
  });
  return best.dist > 0 ? best : null;
}

// Best pace (fastest min/mi) in a single session
function bestPace(sessionList) {
  let best = { pace: Infinity, paceStr: null, date: null };
  sessionList.forEach(s => {
    const d = parseFloat(s.distance);
    const t = parseFloat(s.duration);
    if (d > 0 && t > 0) {
      const pace = t / d;
      if (pace < best.pace) {
        const m = Math.floor(pace);
        const sec = Math.round((pace - m) * 60);
        best = { pace, paceStr: `${m}:${String(sec).padStart(2,'0')}`, date: s.date };
      }
    }
  });
  return best.paceStr ? best : null;
}

function totalSetsCount(sessionList) {
  return sessionList.reduce((acc, s) =>
    acc + s.exercises.reduce((a, e) => a + e.sets.filter(st => st.reps).length, 0), 0);
}

function totalMinutes(sessionList) {
  return sessionList.reduce((acc, s) => acc + (parseFloat(s.duration) || 0), 0);
}

function fmt(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return Math.round(n).toString();
}

function fmtTime(mins) {
  if (!mins) return '—';
  if (mins >= 60) return `${Math.floor(mins/60)}h ${Math.round(mins%60)}m`;
  return `${Math.round(mins)}m`;
}

function avg(val, count) {
  if (!count) return 0;
  return val / count;
}

// ── longest streak (consecutive calendar days with at least one session) ────
function longestStreak(sessionList) {
  const sl = sessionList || sessions;
  if (!sl.length) return { streak: 0, last: null, current: 0 };
  const days = [...new Set(sl.map(s => {
    const d = new Date(s.date);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }))].sort();
  let best = 1, cur = 1;
  for (let i = 1; i < days.length; i++) {
    const prev = new Date(days[i-1]), next = new Date(days[i]);
    const diff = (next - prev) / 86400000;
    if (diff === 1) { cur++; if (cur > best) best = cur; }
    else cur = 1;
  }
  // current streak
  let cur2 = 1;
  for (let i = days.length - 1; i > 0; i--) {
    const prev = new Date(days[i-1]), next = new Date(days[i]);
    if ((next - prev) / 86400000 === 1) cur2++;
    else break;
  }
  return { streak: best, current: cur2 };
}

// Returns { current, best } weekly streaks (weeks with >= 3 sessions)
// A "week" is Mon–Sun ISO week. Current streak counts backwards from the
// most recently completed qualifying week (or the current in-progress week
// if it already has 3+ sessions).
function weeklyStreak() {
  if (!sessions.length) return { current: 0, best: 0 };

  // Get the ISO week key (YYYY-Www) for a date
  function isoWeekKey(date) {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    // Thursday in current week determines the year
    d.setDate(d.getDate() + 4 - (d.getDay() || 7));
    const yearStart = new Date(d.getFullYear(), 0, 1);
    const weekNum = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    return `${d.getFullYear()}-W${String(weekNum).padStart(2, '0')}`;
  }

  // Count sessions per week
  const weekCounts = {};
  sessions.forEach(s => {
    const k = isoWeekKey(new Date(s.date));
    weekCounts[k] = (weekCounts[k] || 0) + 1;
  });

  // Get sorted list of all weeks that qualify (>= 3 sessions)
  const qualifyingWeeks = Object.keys(weekCounts)
    .filter(k => weekCounts[k] >= 3)
    .sort();

  if (!qualifyingWeeks.length) return { current: 0, best: 0 };

  // Helper: get the Monday of an ISO week key
  function mondayOfWeek(key) {
    const [year, w] = key.split('-W');
    const jan4 = new Date(parseInt(year), 0, 4); // Jan 4 is always in week 1
    const jan4Day = jan4.getDay() || 7; // make Sunday = 7
    const monday = new Date(jan4.getTime() - (jan4Day - 1) * 86400000);
    monday.setDate(monday.getDate() + (parseInt(w) - 1) * 7);
    return monday;
  }

  // Calculate longest all-time streak
  let best = 1, cur = 1;
  for (let i = 1; i < qualifyingWeeks.length; i++) {
    const prevMon = mondayOfWeek(qualifyingWeeks[i - 1]);
    const curMon  = mondayOfWeek(qualifyingWeeks[i]);
    const weekDiff = Math.round((curMon - prevMon) / (7 * 86400000));
    if (weekDiff === 1) { cur++; if (cur > best) best = cur; }
    else cur = 1;
  }

  // Calculate current streak — count backwards from most recent qualifying week
  const currentWeekKey = isoWeekKey(new Date());
  const currentWeekQualifies = (weekCounts[currentWeekKey] || 0) >= 3;

  // Find the most recent anchor (last qualifying week that is either this week or last week)
  const lastQualifying = qualifyingWeeks[qualifyingWeeks.length - 1];
  const lastMon = mondayOfWeek(lastQualifying);
  const thisMon = mondayOfWeek(currentWeekKey);
  const weeksAgo = Math.round((thisMon - lastMon) / (7 * 86400000));

  // If most recent qualifying week is more than 1 week ago, streak is broken
  if (weeksAgo > 1) return { current: 0, best };

  // Count backwards from the end of the qualifying list
  let currentStreak = 1;
  for (let i = qualifyingWeeks.length - 1; i > 0; i--) {
    const prevMon = mondayOfWeek(qualifyingWeeks[i - 1]);
    const curMon  = mondayOfWeek(qualifyingWeeks[i]);
    const diff = Math.round((curMon - prevMon) / (7 * 86400000));
    if (diff === 1) currentStreak++;
    else break;
  }

  return { current: currentStreak, best };
}

// ── build period lists ────────────────────────────────────────────────────────
function buildPeriods(mode) {
  // mode: 'monthly' | 'yearly'
  const map = {};
  sessions.forEach(s => {
    const d = new Date(s.date);
    const key = mode === 'monthly'
      ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`
      : `${d.getFullYear()}`;
    if (!map[key]) map[key] = [];
    map[key].push(s);
  });
  return Object.keys(map).sort().reverse().map(k => ({ key: k, sessions: map[k] }));
}

// ── OVERVIEW ──────────────────────────────────────────────────────────────────
function buildOverviewHTML() {
  if (!sessions.length) return `<div class="pb-empty">No sessions logged yet.</div>`;

  const lbs = totalLbs(sessions);
  const mins = totalMinutes(sessions);
  const sets = totalSetsCount(sessions);
  const pushS = sessions.filter(s => s.variationKey !== CUSTOM_KEY && VARIATIONS[s.variationKey] && VARIATIONS[s.variationKey].type === 'push');
  const pullS = sessions.filter(s => s.variationKey !== CUSTOM_KEY && VARIATIONS[s.variationKey] && VARIATIONS[s.variationKey].type === 'pull');
  const legsS = sessions.filter(s => s.variationKey !== CUSTOM_KEY && VARIATIONS[s.variationKey] && VARIATIONS[s.variationKey].type === 'legs');
  const cardioS = cardioSessions(sessions);
  const coreS = sessions.filter(s => s.variationKey !== CUSTOM_KEY && VARIATIONS[s.variationKey] && VARIATIONS[s.variationKey].type === 'core');
  const total = sessions.length;
  const pplTotal = pushS.length + pullS.length + legsS.length;
  const pushPct  = total ? Math.round(pushS.length/total*100) : 0;
  const pullPct  = total ? Math.round(pullS.length/total*100) : 0;
  const legsPct  = total ? Math.round(legsS.length/total*100) : 0;
  const cardioPct = total ? Math.round(cardioS.length/total*100) : 0;
  const corePct  = total ? Math.round(coreS.length/total*100) : 0;
  const otherPct = Math.max(0, 100 - pushPct - pullPct - legsPct - cardioPct - corePct);

  // Months active
  const months = new Set(sessions.map(s => { const d=new Date(s.date); return `${d.getFullYear()}-${d.getMonth()}`; })).size;
  const years  = new Set(sessions.map(s => new Date(s.date).getFullYear())).size;
  const avgPerMonth = months ? (total/months).toFixed(1) : total;
  const avgPerYear  = years  ? (total/years).toFixed(1)  : total;
  const sessionsWithTime = sessions.filter(s => s.duration && parseFloat(s.duration) > 0);
  const avgDur = sessionsWithTime.length ? Math.round(mins / sessionsWithTime.length) : 0;

  // Volume averages
  const avgLbsPerMonth = months ? Math.round(lbs / months) : lbs;
  const avgLbsPerYear  = years  ? Math.round(lbs / years)  : lbs;
  const sessionsWithVol = sessions.filter(s => s.exercises.some(e => e.sets.some(st => parseFloat(st.reps) > 0 && parseFloat(st.weight) > 0)));
  const avgLbsPerSession = sessionsWithVol.length ? Math.round(lbs / sessionsWithVol.length) : 0;

  // Time averages
  const avgMinsPerMonth = months ? Math.round(mins / months) : mins;
  const avgMinsPerYear  = years  ? Math.round(mins / years)  : mins;

  const { streak, current } = longestStreak();
  const { current: weekCurrent, best: weekBest } = weeklyStreak();

  // How many sessions this week so far
  const thisWeekSessions = (() => {
    const now = new Date();
    const day = now.getDay() || 7;
    const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (day - 1));
    return sessions.filter(s => new Date(s.date) >= monday).length;
  })();

  let h = '<div style="height:14px"></div>';

  // Two streak cards side by side
  h += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 18px">
    <div class="streak-card" style="flex-direction:column;align-items:flex-start;gap:6px">
      <div style="display:flex;align-items:baseline;gap:6px">
        <div class="streak-num">${current}</div>
        <div style="font-size:11px;color:var(--text-dim);font-family:'DM Mono',monospace">days</div>
      </div>
      <div>
        <div class="streak-label" style="font-size:12px">Daily streak</div>
        <div class="streak-sub">Best: ${streak} day${streak!==1?'s':''}</div>
      </div>
    </div>
    <div class="streak-card" style="flex-direction:column;align-items:flex-start;gap:6px;${weekCurrent > 0 ? 'border-color:var(--pull);' : ''}">
      <div style="display:flex;align-items:baseline;gap:6px">
        <div class="streak-num" style="${weekCurrent > 0 ? 'color:var(--pull)' : ''}">${weekCurrent}</div>
        <div style="font-size:11px;color:var(--text-dim);font-family:'DM Mono',monospace">wks</div>
      </div>
      <div>
        <div class="streak-label" style="font-size:12px">Weekly streak<br><span style="color:var(--text-dim);font-size:10px">≥3 sessions/week</span></div>
        <div class="streak-sub">Best: ${weekBest} wk${weekBest!==1?'s':''} · This week: ${thisWeekSessions}</div>
      </div>
    </div>
  </div>`;

  h += `<div class="section-label" style="margin-top:18px">All time</div>`;
  h += `<div class="stats-grid">
    <div class="stat-tile wide">
      <div class="stat-tile-label">Total workouts</div>
      <div class="stat-tile-value">${total}</div>
      <div class="stat-tile-unit">avg ${avgPerMonth} / month · ${avgPerYear} / year</div>
    </div>
    <div class="stat-tile wide">
      <div class="stat-tile-label">Total volume</div>
      <div class="stat-tile-value">${fmt(lbs)}</div>
      <div class="stat-tile-unit">lbs moved · avg ${fmt(avgLbsPerSession)} / session · ${fmt(avgLbsPerMonth)} / month · ${fmt(avgLbsPerYear)} / year</div>
      ${lbs > 0 ? `<div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--str);margin-top:4px;opacity:0.9;line-height:1.6">≈ ${volumeComparisons(lbs, sessions.length)}<br>≈ ${volumeComparisonScaled(lbs, sessions.length)}</div>` : ''}
    </div>
    <div class="stat-tile">
      <div class="stat-tile-label">Total sets</div>
      <div class="stat-tile-value">${fmt(sets)}</div>
      <div class="stat-tile-unit">sets logged</div>
    </div>
    <div class="stat-tile">
      <div class="stat-tile-label">Avg session</div>
      <div class="stat-tile-value">${avgDur || '—'}</div>
      <div class="stat-tile-unit">${avgDur ? 'minutes' : 'no time data yet'}</div>
    </div>
    <div class="stat-tile wide">
      <div class="stat-tile-label">Time trained</div>
      <div class="stat-tile-value">${fmtTime(mins)}</div>
      <div class="stat-tile-unit">total · avg ${fmtTime(avgMinsPerMonth)} / month · ${fmtTime(avgMinsPerYear)} / year</div>
    </div>
  </div>`;

  h += `<div class="section-label" style="margin-top:18px">Workout split</div>`;
  h += `<div class="type-bar-wrap">
    <div class="type-bar-track">
      <div class="type-bar-seg" style="width:${pushPct}%;background:var(--push)"></div>
      <div class="type-bar-seg" style="width:${pullPct}%;background:var(--pull)"></div>
      <div class="type-bar-seg" style="width:${legsPct}%;background:var(--legs)"></div>
      <div class="type-bar-seg" style="width:${cardioPct}%;background:var(--cardio)"></div>
      <div class="type-bar-seg" style="width:${corePct}%;background:var(--core)"></div>
      <div class="type-bar-seg" style="width:${otherPct}%;background:var(--general)"></div>
    </div>
    <div class="type-legend">
      <div class="type-legend-item"><div class="type-legend-dot" style="background:var(--push)"></div>Push ${pushS.length} (${pushPct}%)</div>
      <div class="type-legend-item"><div class="type-legend-dot" style="background:var(--pull)"></div>Pull ${pullS.length} (${pullPct}%)</div>
      <div class="type-legend-item"><div class="type-legend-dot" style="background:var(--legs)"></div>Legs ${legsS.length} (${legsPct}%)</div>
      ${cardioS.length ? `<div class="type-legend-item"><div class="type-legend-dot" style="background:var(--cardio)"></div>Cardio ${cardioS.length} (${cardioPct}%)</div>` : ''}
      ${coreS.length ? `<div class="type-legend-item"><div class="type-legend-dot" style="background:var(--core)"></div>Core ${coreS.length} (${corePct}%)</div>` : ''}
      ${otherPct > 0 ? `<div class="type-legend-item"><div class="type-legend-dot" style="background:var(--general)"></div>General ${total - pushS.length - pullS.length - legsS.length - cardioS.length - coreS.length} (${otherPct}%)</div>` : ''}
    </div>
  </div>`;

  // Cardio section — split Running and Biking
  if (cardioS.length) {
    const runningSessions = cardioS.filter(s => isRunningSession(s));
    const bikingSessions  = cardioS.filter(s => isBikingSession(s));
    const otherCardio     = cardioS.filter(s => s.customName !== 'Running' && s.customName !== 'Biking');
    const cardioMins = totalMinutes(cardioS);

    h += `<div class="section-label" style="margin-top:18px;color:var(--cardio)">Cardio</div>`;
    h += `<div class="stats-grid">
      <div class="stat-tile" style="background:var(--cardio-bg);border-color:var(--cardio)">
        <div class="stat-tile-label" style="color:var(--cardio-text);opacity:0.7">Sessions</div>
        <div class="stat-tile-value" style="color:var(--cardio-text)">${cardioS.length}</div>
        <div class="stat-tile-unit">cardio workouts</div>
      </div>
      <div class="stat-tile" style="background:var(--cardio-bg);border-color:var(--cardio)">
        <div class="stat-tile-label" style="color:var(--cardio-text);opacity:0.7">Time</div>
        <div class="stat-tile-value" style="color:var(--cardio-text)">${fmtTime(cardioMins)}</div>
        <div class="stat-tile-unit">total cardio</div>
      </div>
    </div>`;

    // Running subsection
    if (runningSessions.length) {
      const runMiles = totalMiles(runningSessions);
      const runPace = avgPace(runningSessions);
      const runBestDist = bestDistance(runningSessions);
      const runFastPace = bestPace(runningSessions);
      h += `<div class="section-label" style="margin-top:12px;font-size:10px;color:var(--end)">🏃 Running</div>`;
      h += `<div class="stats-grid">
        ${runMiles > 0 ? `<div class="stat-tile" style="background:var(--cardio-bg);border-color:var(--cardio)">
          <div class="stat-tile-label" style="color:var(--cardio-text);opacity:0.7">Distance</div>
          <div class="stat-tile-value" style="color:var(--cardio-text)">${runMiles.toFixed(2)}</div>
          <div class="stat-tile-unit">total miles</div>
          ${(() => { const dc = distanceComparisonPair(runMiles, sessions.length); return `<div style="font-family:'DM Mono',monospace;font-size:8px;color:var(--end);margin-top:4px;opacity:0.9;line-height:1.5">≈ ${dc.local}<br>≈ ${dc.national}</div>`; })()}
        </div>` : ''}
        <div class="stat-tile" style="background:var(--cardio-bg);border-color:var(--cardio)">
          <div class="stat-tile-label" style="color:var(--cardio-text);opacity:0.7">Avg pace</div>
          <div class="stat-tile-value" style="color:var(--cardio-text);font-size:20px">${runPace || '—'}</div>
          <div class="stat-tile-unit">min / mile</div>
        </div>
        <div class="stat-tile" style="background:var(--cardio-bg);border-color:var(--cardio)">
          <div class="stat-tile-label" style="color:var(--cardio-text);opacity:0.7">Best distance</div>
          <div class="stat-tile-value" style="color:var(--cardio-text);font-size:20px">${runBestDist ? runBestDist.dist.toFixed(2) : '—'}</div>
          <div class="stat-tile-unit">${runBestDist ? 'mi · ' + new Date(runBestDist.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'}) : 'miles'}</div>
        </div>
        <div class="stat-tile" style="background:var(--cardio-bg);border-color:var(--cardio)">
          <div class="stat-tile-label" style="color:var(--cardio-text);opacity:0.7">Best pace</div>
          <div class="stat-tile-value" style="color:var(--cardio-text);font-size:20px">${runFastPace ? runFastPace.paceStr : '—'}</div>
          <div class="stat-tile-unit">${runFastPace ? 'min/mi · ' + new Date(runFastPace.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'}) : 'min / mile'}</div>
        </div>
      </div>`;
    }

    // Biking subsection
    if (bikingSessions.length) {
      const bikeMiles = totalMiles(bikingSessions);
      const bikePace = avgPace(bikingSessions);
      const bikeBestDist = bestDistance(bikingSessions);
      const bikeFastPace = bestPace(bikingSessions);
      h += `<div class="section-label" style="margin-top:12px;font-size:10px;color:var(--end)">🚴 Biking</div>`;
      h += `<div class="stats-grid">
        ${bikeMiles > 0 ? `<div class="stat-tile" style="background:var(--cardio-bg);border-color:var(--cardio)">
          <div class="stat-tile-label" style="color:var(--cardio-text);opacity:0.7">Distance</div>
          <div class="stat-tile-value" style="color:var(--cardio-text)">${bikeMiles.toFixed(2)}</div>
          <div class="stat-tile-unit">total miles</div>
          ${(() => { const dc = distanceComparisonPair(bikeMiles, sessions.length + 1); return `<div style="font-family:'DM Mono',monospace;font-size:8px;color:var(--end);margin-top:4px;opacity:0.9;line-height:1.5">≈ ${dc.local}<br>≈ ${dc.national}</div>`; })()}
        </div>` : ''}
        <div class="stat-tile" style="background:var(--cardio-bg);border-color:var(--cardio)">
          <div class="stat-tile-label" style="color:var(--cardio-text);opacity:0.7">Avg pace</div>
          <div class="stat-tile-value" style="color:var(--cardio-text);font-size:20px">${bikePace || '—'}</div>
          <div class="stat-tile-unit">min / mile</div>
        </div>
        <div class="stat-tile" style="background:var(--cardio-bg);border-color:var(--cardio)">
          <div class="stat-tile-label" style="color:var(--cardio-text);opacity:0.7">Best distance</div>
          <div class="stat-tile-value" style="color:var(--cardio-text);font-size:20px">${bikeBestDist ? bikeBestDist.dist.toFixed(2) : '—'}</div>
          <div class="stat-tile-unit">${bikeBestDist ? 'mi · ' + new Date(bikeBestDist.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'}) : 'miles'}</div>
        </div>
        <div class="stat-tile" style="background:var(--cardio-bg);border-color:var(--cardio)">
          <div class="stat-tile-label" style="color:var(--cardio-text);opacity:0.7">Best pace</div>
          <div class="stat-tile-value" style="color:var(--cardio-text);font-size:20px">${bikeFastPace ? bikeFastPace.paceStr : '—'}</div>
          <div class="stat-tile-unit">${bikeFastPace ? 'min/mi · ' + new Date(bikeFastPace.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'}) : 'min / mile'}</div>
        </div>
      </div>`;
    }
  }
  h += `<div class="section-label" style="margin-top:18px">Volume by day type</div>`;
  h += `<div class="stats-grid">
    <div class="stat-tile wide">
      <div class="stat-tile-label">Total volume</div>
      <div class="stat-tile-value">${fmt(lbs)}</div>
      <div class="stat-tile-unit">lbs across all sessions</div>
      ${lbs > 0 ? `<div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--str);margin-top:4px;opacity:0.9;line-height:1.6">≈ ${volumeComparisons(lbs, sessions.length)}<br>≈ ${volumeComparisonScaled(lbs, sessions.length)}</div>` : ''}
    </div>
    <div class="stat-tile push-tint">
      <div class="stat-tile-label">Push volume</div>
      <div class="stat-tile-value">${fmt(totalLbs(pushS))}</div>
      <div class="stat-tile-unit">lbs</div>
    </div>
    <div class="stat-tile pull-tint">
      <div class="stat-tile-label">Pull volume</div>
      <div class="stat-tile-value">${fmt(totalLbs(pullS))}</div>
      <div class="stat-tile-unit">lbs</div>
    </div>
    <div class="stat-tile legs-tint wide">
      <div class="stat-tile-label">Legs volume</div>
      <div class="stat-tile-value">${fmt(totalLbs(legsS))}</div>
      <div class="stat-tile-unit">lbs</div>
    </div>
    ${coreS.length ? `<div class="stat-tile" style="background:var(--core-bg);border-color:var(--core)">
      <div class="stat-tile-label" style="color:var(--core-text);opacity:0.7">Core volume</div>
      <div class="stat-tile-value" style="color:var(--core-text)">${fmt(totalLbs(coreS))}</div>
      <div class="stat-tile-unit">lbs</div>
    </div>` : ''}
  </div>`;

  // Variation breakdown
  h += `<div class="section-label" style="margin-top:18px">By variation</div>`;
  h += `<div class="stats-grid cols3">`;
  ['push_a','push_b','push_c','pull_a','pull_b','pull_c','legs_a','legs_b','legs_c'].forEach(key => {
    const v = VARIATIONS[key];
    const count = sessions.filter(s => s.variationKey === key).length;
    const tint = v.type + '-tint';
    h += `<div class="stat-tile ${tint}">
      <div class="stat-tile-label">${v.label}</div>
      <div class="stat-tile-value" style="font-size:20px">${count}</div>
      <div class="stat-tile-unit">sessions</div>
    </div>`;
  });
  h += `</div><div style="height:20px"></div>`;
  return h;
}

// ── PERIOD (monthly / yearly) ─────────────────────────────────────────────────
function buildPeriodHTML(mode) {
  const periods = buildPeriods(mode);
  if (!periods.length) return `<div class="pb-empty">No sessions logged yet.</div>`;

  const idx = Math.max(0, Math.min(statsPeriodIdx, periods.length - 1));
  const period = periods[idx];
  const ss = period.sessions;

  const lbs = totalLbs(ss);
  const mins = totalMinutes(ss);
  const sets = totalSetsCount(ss);
  const pushS = ss.filter(s => s.variationKey !== CUSTOM_KEY && VARIATIONS[s.variationKey] && VARIATIONS[s.variationKey].type === 'push');
  const pullS = ss.filter(s => s.variationKey !== CUSTOM_KEY && VARIATIONS[s.variationKey] && VARIATIONS[s.variationKey].type === 'pull');
  const legsS = ss.filter(s => s.variationKey !== CUSTOM_KEY && VARIATIONS[s.variationKey] && VARIATIONS[s.variationKey].type === 'legs');
  const cardioS = cardioSessions(ss);
  const coreS = ss.filter(s => s.variationKey !== CUSTOM_KEY && VARIATIONS[s.variationKey] && VARIATIONS[s.variationKey].type === 'core');
  const sessionsWithTime = ss.filter(s => s.duration && parseFloat(s.duration) > 0);
  const avgDur = sessionsWithTime.length ? Math.round(mins / sessionsWithTime.length) : 0;
  const total = ss.length;
  const pushPct   = total ? Math.round(pushS.length/total*100) : 0;
  const pullPct   = total ? Math.round(pullS.length/total*100) : 0;
  const legsPct   = total ? Math.round(legsS.length/total*100) : 0;
  const cardioPct = total ? Math.round(cardioS.length/total*100) : 0;
  const corePct   = total ? Math.round(coreS.length/total*100) : 0;
  const otherPct  = Math.max(0, 100 - pushPct - pullPct - legsPct - cardioPct - corePct);
  const periodMiles = totalMiles(cardioS);
  const periodPace  = avgPace(cardioS);

  const label = mode === 'monthly'
    ? new Date(period.key + '-02').toLocaleDateString('en-US', {month:'long', year:'numeric'})
    : period.key;

  let h = `<div class="period-nav">
    <button class="period-nav-btn" onclick="shiftPeriod(1)" ${idx >= periods.length-1 ? 'disabled' : ''}>‹</button>
    <div class="period-label">${label}</div>
    <button class="period-nav-btn" onclick="shiftPeriod(-1)" ${idx === 0 ? 'disabled' : ''}>›</button>
  </div>`;

  if (!ss.length) {
    h += `<div class="period-empty">No sessions logged in this ${mode === 'monthly' ? 'month' : 'year'}.</div>`;
    return h;
  }

  h += `<div style="height:12px"></div>`;
  h += `<div class="stats-grid">
    <div class="stat-tile wide">
      <div class="stat-tile-label">Sessions</div>
      <div class="stat-tile-value">${total}</div>
      <div class="stat-tile-unit">workouts completed</div>
    </div>
    <div class="stat-tile">
      <div class="stat-tile-label">Volume</div>
      <div class="stat-tile-value">${fmt(lbs)}</div>
      <div class="stat-tile-unit">lbs moved</div>
      ${lbs > 0 ? `<div style="font-family:'DM Mono',monospace;font-size:8px;color:var(--str);margin-top:4px;opacity:0.9;line-height:1.6">≈ ${volumeComparisons(lbs, ss.length)}<br>≈ ${volumeComparisonScaled(lbs, ss.length)}</div>` : ''}
    </div>
    <div class="stat-tile">
      <div class="stat-tile-label">Sets</div>
      <div class="stat-tile-value">${fmt(sets)}</div>
      <div class="stat-tile-unit">logged</div>
    </div>
    <div class="stat-tile">
      <div class="stat-tile-label">Time trained</div>
      <div class="stat-tile-value">${fmtTime(mins)}</div>
      <div class="stat-tile-unit">total</div>
    </div>
    <div class="stat-tile">
      <div class="stat-tile-label">Avg session</div>
      <div class="stat-tile-value">${avgDur || '—'}</div>
      <div class="stat-tile-unit">${avgDur ? 'minutes' : 'no time data'}</div>
    </div>
  </div>`;

  if (total > 0) {
    h += `<div class="section-label" style="margin-top:16px">Split</div>`;
    h += `<div class="type-bar-wrap">
      <div class="type-bar-track">
        <div class="type-bar-seg" style="width:${pushPct}%;background:var(--push)"></div>
        <div class="type-bar-seg" style="width:${pullPct}%;background:var(--pull)"></div>
        <div class="type-bar-seg" style="width:${legsPct}%;background:var(--legs)"></div>
        <div class="type-bar-seg" style="width:${cardioPct}%;background:var(--cardio)"></div>
        <div class="type-bar-seg" style="width:${corePct}%;background:var(--core)"></div>
        <div class="type-bar-seg" style="width:${otherPct}%;background:var(--general)"></div>
      </div>
      <div class="type-legend">
        <div class="type-legend-item"><div class="type-legend-dot" style="background:var(--push)"></div>Push ${pushS.length}</div>
        <div class="type-legend-item"><div class="type-legend-dot" style="background:var(--pull)"></div>Pull ${pullS.length}</div>
        <div class="type-legend-item"><div class="type-legend-dot" style="background:var(--legs)"></div>Legs ${legsS.length}</div>
        ${cardioS.length ? `<div class="type-legend-item"><div class="type-legend-dot" style="background:var(--cardio)"></div>Cardio ${cardioS.length}</div>` : ''}
        ${coreS.length ? `<div class="type-legend-item"><div class="type-legend-dot" style="background:var(--core)"></div>Core ${coreS.length}</div>` : ''}
        ${otherPct > 0 ? `<div class="type-legend-item"><div class="type-legend-dot" style="background:var(--general)"></div>General ${total - pushS.length - pullS.length - legsS.length - cardioS.length - coreS.length}</div>` : ''}
      </div>
    </div>`;

    if (cardioS.length) {
      h += `<div class="section-label" style="margin-top:16px;color:var(--cardio)">Cardio</div>`;
      h += `<div class="stats-grid">
        <div class="stat-tile" style="background:var(--cardio-bg);border-color:var(--cardio)">
          <div class="stat-tile-label" style="color:var(--cardio-text);opacity:0.7">Sessions</div>
          <div class="stat-tile-value" style="color:var(--cardio-text)">${cardioS.length}</div>
          <div class="stat-tile-unit">cardio workouts</div>
        </div>
        <div class="stat-tile" style="background:var(--cardio-bg);border-color:var(--cardio)">
          <div class="stat-tile-label" style="color:var(--cardio-text);opacity:0.7">Time</div>
          <div class="stat-tile-value" style="color:var(--cardio-text)">${fmtTime(totalMinutes(cardioS))}</div>
          <div class="stat-tile-unit">cardio time</div>
        </div>
        ${periodMiles > 0 ? `
        <div class="stat-tile" style="background:var(--cardio-bg);border-color:var(--cardio)">
          <div class="stat-tile-label" style="color:var(--cardio-text);opacity:0.7">Distance</div>
          <div class="stat-tile-value" style="color:var(--cardio-text)">${periodMiles.toFixed(2)}</div>
          <div class="stat-tile-unit">miles</div>
          ${(() => { const dc = distanceComparisonPair(periodMiles, ss.length); return dc ? `<div style="font-family:'DM Mono',monospace;font-size:8px;color:var(--end);margin-top:4px;opacity:0.9;line-height:1.5">≈ ${dc.local}<br>≈ ${dc.national}</div>` : ''; })()}
        </div>
        <div class="stat-tile" style="background:var(--cardio-bg);border-color:var(--cardio)">
          <div class="stat-tile-label" style="color:var(--cardio-text);opacity:0.7">Avg pace</div>
          <div class="stat-tile-value" style="color:var(--cardio-text);font-size:20px">${periodPace || '—'}</div>
          <div class="stat-tile-unit">min / mile</div>
        </div>` : ''}
      </div>`;
    }

    h += `<div class="section-label" style="margin-top:16px">Volume by type</div>`;
    h += `<div class="stats-grid">
      <div class="stat-tile push-tint"><div class="stat-tile-label">Push</div><div class="stat-tile-value">${fmt(totalLbs(pushS))}</div><div class="stat-tile-unit">lbs</div></div>
      <div class="stat-tile pull-tint"><div class="stat-tile-label">Pull</div><div class="stat-tile-value">${fmt(totalLbs(pullS))}</div><div class="stat-tile-unit">lbs</div></div>
      <div class="stat-tile legs-tint wide"><div class="stat-tile-label">Legs</div><div class="stat-tile-value">${fmt(totalLbs(legsS))}</div><div class="stat-tile-unit">lbs</div></div>
      ${coreS.length ? `<div class="stat-tile" style="background:var(--core-bg);border-color:var(--core)"><div class="stat-tile-label" style="color:var(--core-text);opacity:0.7">Core</div><div class="stat-tile-value" style="color:var(--core-text)">${fmt(totalLbs(coreS))}</div><div class="stat-tile-unit">lbs</div></div>` : ''}
    </div>`;
  }

  h += `<div style="height:20px"></div>`;
  return h;
}

function shiftPeriod(dir) {
  const mode = statsTab;
  const periods = buildPeriods(mode);
  statsPeriodIdx = Math.max(0, Math.min(statsPeriodIdx + dir, periods.length - 1));
  renderStatsBody();
}

// ── PERSONAL BESTS ───────────────────────────────────────────────────────────
function buildBestsHTML() {
  const pbs = computePBs();
  const exNames = Object.keys(pbs);

  if (!exNames.length) return `<div class="pb-empty">No personal bests yet.<br>Start logging sets and weights and they'll appear here.</div>`;

  // Group by type from EXERCISE_LIBRARY — more reliable than variationKey
  const byType = { push: [], pull: [], legs: [], core: [] };
  exNames.forEach(name => {
    const pb = pbs[name];
    const exType = pb.type || getExercise(name)?.type || 'core';
    const bucket = byType[exType] || byType.core;
    bucket.push({ name, pb, type: exType });
  });

  let html = '<div style="height:14px"></div>';

  const groups = [
    { key:'push', label:'Push', color: TYPE_COLOR.push, bg: TYPE_BG.push, text:'var(--push-text)' },
    { key:'pull', label:'Pull', color: TYPE_COLOR.pull, bg: TYPE_BG.pull, text:'var(--pull-text)' },
    { key:'legs', label:'Legs', color: TYPE_COLOR.legs, bg: TYPE_BG.legs, text:'var(--legs-text)' },
    { key:'core', label:'Core', color:'var(--core)', bg:'var(--core-bg)', text:'var(--core-text)' },
  ];

  groups.forEach(g => {
    const items = byType[g.key];
    if (!items || !items.length) return;
    html += `<div class="section-label" style="color:${g.color}">${g.label} Exercises</div>`;
    items.forEach(({ name, pb }) => {
      const timed = isTimedExercise(name);
      const hasDuration = timed && pb.duration > 0;
      const hasWeight = !timed && pb.weight > 0;
      const hasReps = !timed && pb.reps > 0;
      if (!hasDuration && !hasWeight && !hasReps) return;
      const fmtSecs = s => s >= 60 ? `${Math.floor(s/60)}m ${s%60 > 0 ? s%60+'s' : ''}`.trim() : `${s}s`;
      html += `<div class="pb-exercise-card">
        <div class="pb-ex-header">
          <div class="pb-ex-name">${name}</div>
          <div style="display:flex;align-items:center;gap:8px">
            <button onclick="showProgressionScreen('${name.replace(/'/g,"\\'")}','bests')"
              style="background:none;border:none;font-size:13px;cursor:pointer;opacity:0.6;padding:0"
              title="View progress">📈</button>
            <div class="pb-ex-tag" style="color:${g.color}">${timed ? 'timed hold' : g.label}</div>
          </div>
        </div>
        <div class="pb-records">`;
      if (hasDuration) {
        const d = pb.durationDate ? new Date(pb.durationDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
        html += `<div class="pb-record"><div class="pb-record-label">Best hold</div><div class="pb-record-value" style="color:${g.color}">${fmtSecs(pb.duration)}</div><div class="pb-record-unit"></div><div class="pb-record-date">${d}</div></div>`;
      }
      if (hasWeight) {
        const d = pb.weightDate ? new Date(pb.weightDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
        const atReps = pb.weightReps > 0 ? ` × ${pb.weightReps} reps` : '';
        html += `<div class="pb-record"><div class="pb-record-label">Max weight</div><div class="pb-record-value" style="color:${g.color}">${pb.weight}</div><div class="pb-record-unit">lbs${atReps}</div><div class="pb-record-date">${d}</div></div>`;
      }
      if (hasReps) {
        const d = pb.repsDate ? new Date(pb.repsDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
        const atW = pb.repsWeight > 0 ? ` × ${pb.repsWeight} lbs` : '';
        html += `<div class="pb-record"><div class="pb-record-label">Max reps</div><div class="pb-record-value" style="color:${g.color}">${pb.reps}</div><div class="pb-record-unit">reps${atW}</div><div class="pb-record-date">${d}</div></div>`;
      }
      if (!timed && !hasWeight && hasReps) html += `<div class="pb-record" style="opacity:0.2"><div class="pb-record-label">Max weight</div><div class="pb-record-value">—</div></div>`;
      if (!timed && hasWeight && !hasReps)  html += `<div class="pb-record" style="opacity:0.2"><div class="pb-record-label">Max reps</div><div class="pb-record-value">—</div></div>`;
      html += `</div></div>`;
    });
  });

  // ── Activity bests — auto-generated from PREDEFINED_ACTIVITIES ──────────
  // Any activity with supportsDuration or supportsDistance appears here
  // automatically. No manual additions needed — just set the flags on the
  // activity in PREDEFINED_ACTIVITIES and it will show up.

  // Group activities by name prefix (e.g. all "Taekwondo (...)" together)
  const activityGroups = {};
  PREDEFINED_ACTIVITIES.forEach(act => {
    if (!act.supportsDuration && !act.supportsDistance) return;
    const records = computeActivityBests(act.name);
    if (!records) return; // no sessions logged yet
    // Derive group label from prefix before first '(' or use the full name
    const groupLabel = act.name.includes('(')
      ? act.name.split('(')[0].trim()
      : act.name;
    if (!activityGroups[groupLabel]) activityGroups[groupLabel] = [];
    activityGroups[groupLabel].push({ act, records });
  });

  Object.entries(activityGroups).forEach(([groupLabel, items]) => {
    // Pick a color for the group header based on the first activity's category
    const firstCat = items[0].act.category;
    const groupColor = firstCat === 'cardio' ? 'var(--end)'
      : firstCat === 'core' ? 'var(--core)'
      : 'var(--agi)';

    html += `<div class="section-label" style="color:${groupColor}">${groupLabel}</div>`;

    items.forEach(({ act, records }) => {
      // Card color based on attribute mapping
      const attrMap = getActivityAttrMap(act.name);
      const primaryAttr = attrMap ? attrMap.primary[0] : 'end';
      const cardColor = ATTRS[primaryAttr] ? ATTRS[primaryAttr].color : groupColor;
      const cardBg    = ATTRS[primaryAttr] ? ATTRS[primaryAttr].bg    : 'var(--surface)';
      const cardText  = ATTRS[primaryAttr] ? ATTRS[primaryAttr].text  : 'var(--text)';

      // Display name — strip the group prefix for cleaner sub-cards
      const displayName = items.length > 1 && act.name.includes('(')
        ? act.name.match(/\(([^)]+)\)/)?.[1] || act.name
        : act.name;

      html += buildActivityPBCard(act.name, displayName, cardColor, cardBg, cardText, records);
    });
  });

  // ── PB History — chronological timeline of all PB events ──────────────────
  const pbHistory = [];
  let runningBests = {};
  sessions.forEach(s => {
    s.exercises.forEach(ex => {
      if (!ex.name) return;
      if (!runningBests[ex.name]) runningBests[ex.name] = { weight: 0, reps: 0 };
      ex.sets.forEach(st => {
        const w = parseFloat(st.weight)||0, r = parseFloat(st.reps)||0;
        if (w > runningBests[ex.name].weight) {
          pbHistory.push({ date: s.date, exercise: ex.name, type: 'weight', value: w, unit: 'lbs' });
          runningBests[ex.name].weight = w;
        }
        if (r > runningBests[ex.name].reps) {
          pbHistory.push({ date: s.date, exercise: ex.name, type: 'reps', value: r, unit: 'reps' });
          runningBests[ex.name].reps = r;
        }
      });
    });
  });

  if (pbHistory.length) {
    html += `<div class="section-label" style="margin-top:18px">PB History</div>`;
    html += `<div style="padding:0 18px">`;
    const byDate = {};
    pbHistory.forEach(pb => {
      const dk = pb.date.split('T')[0];
      if (!byDate[dk]) byDate[dk] = [];
      byDate[dk].push(pb);
    });
    Object.keys(byDate).sort((a,b) => b.localeCompare(a)).forEach(dk => {
      const dateLabel = new Date(dk+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
      html += `<div style="margin-bottom:10px">
        <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);
          text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px;padding-bottom:4px;
          border-bottom:1px solid var(--border)">${dateLabel}</div>`;
      byDate[dk].forEach(pb => {
        html += `<div style="display:flex;align-items:center;justify-content:space-between;
          padding:5px 0;border-bottom:1px solid #1A1814">
          <div>
            <div style="font-size:12px;color:var(--text);font-weight:500">${pb.exercise}</div>
            <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);margin-top:1px">
              ${pb.type === 'weight' ? 'max weight' : 'max reps'}
            </div>
          </div>
          <div style="text-align:right">
            <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:var(--str)">
              ${pb.value}
            </div>
            <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim)">${pb.unit}</div>
          </div>
        </div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  }

  html += `<div style="height:20px"></div>`;
  return html;
}

// ── Helpers for activity PB records ───────────────────────────────────────
function computeActivityBests(activityName) {
  const actSessions = sessions.filter(s =>
    s.variationKey === CUSTOM_KEY && s.customName === activityName
  );
  if (!actSessions.length) return null;

  let bestDuration = 0, bestDurationDate = null;
  let bestDist = 0, bestDistDate = null;
  let bestPaceVal = Infinity, bestPaceStr = null, bestPaceDate = null;

  actSessions.forEach(s => {
    const dur = parseFloat(s.duration) || 0;
    const dist = parseFloat(s.distance) || 0;
    if (dur > bestDuration) { bestDuration = dur; bestDurationDate = s.date; }
    if (dist > bestDist) { bestDist = dist; bestDistDate = s.date; }
    if (dist > 0 && dur > 0) {
      const pace = dur / dist;
      if (pace < bestPaceVal) {
        bestPaceVal = pace;
        const m = Math.floor(pace), sec = Math.round((pace - m) * 60);
        bestPaceStr = `${m}:${String(sec).padStart(2,'0')}`;
        bestPaceDate = s.date;
      }
    }
  });

  return {
    totalSessions: actSessions.length,
    lastSession: actSessions[actSessions.length - 1],
    bestDuration: bestDuration > 0 ? { value: bestDuration, date: bestDurationDate } : null,
    bestDistance: bestDist > 0 ? { value: bestDist, date: bestDistDate } : null,
    bestPace: bestPaceStr ? { str: bestPaceStr, date: bestPaceDate } : null,
  };
}

function buildActivityPBCard(fullName, displayName, color, bg, text, records) {
  const fmtDate = d => d ? new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
  const safeName = fullName.replace(/'/g,"\\'");
  let html = `<div class="pb-exercise-card">
    <div class="pb-ex-header">
      <div class="pb-ex-name">${displayName}</div>
      <div style="display:flex;align-items:center;gap:8px">
        <button onclick="showProgressionScreen('${safeName}','bests')"
          style="background:none;border:none;font-size:13px;cursor:pointer;opacity:0.6;padding:0"
          title="View progress">📈</button>
        <div class="pb-ex-tag" style="color:${color}">${records.totalSessions} session${records.totalSessions!==1?'s':''}</div>
      </div>
    </div>
    <div class="pb-records">`;

  if (records.bestDuration) {
    html += `<div class="pb-record">
      <div class="pb-record-label">Best duration</div>
      <div class="pb-record-value" style="color:${color}">${fmtDuration(records.bestDuration.value)}</div>
      <div class="pb-record-unit"></div>
      <div class="pb-record-date">${fmtDate(records.bestDuration.date)}</div>
    </div>`;
  }
  if (records.bestDistance) {
    html += `<div class="pb-record">
      <div class="pb-record-label">Best distance</div>
      <div class="pb-record-value" style="color:${color}">${records.bestDistance.value.toFixed(2)}</div>
      <div class="pb-record-unit">miles</div>
      <div class="pb-record-date">${fmtDate(records.bestDistance.date)}</div>
    </div>`;
  }
  if (records.bestPace) {
    html += `<div class="pb-record">
      <div class="pb-record-label">Best pace</div>
      <div class="pb-record-value" style="color:${color};font-size:16px">${records.bestPace.str}</div>
      <div class="pb-record-unit">min / mile</div>
      <div class="pb-record-date">${fmtDate(records.bestPace.date)}</div>
    </div>`;
  }

  html += `</div></div>`;
  return html;
}

function exportData() {
  const payload = {
    version: 3,
    exportDate: new Date().toISOString(),
    sessions,
    pbs: computePBs(),
    profile: loadProfile(),
    customWorkouts: getCustomWorkouts(),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `ppl_workout_backup_${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup saved to Downloads ✓');
  renderDataScreen();
}

function triggerImport() {
  document.getElementById('import-file-input').click();
}

function handleImportFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      const imported = data.sessions || (Array.isArray(data) ? data : []);
      if (!imported.length) { showToast('No sessions found in file'); return; }

      // Merge sessions by ID — keep both, deduplicate
      const existingIds = new Set(sessions.map(s => String(s.id)));
      let added = 0;
      imported.forEach(s => {
        if (!existingIds.has(String(s.id))) {
          sessions.push(s);
          added++;
        }
      });
      sessions.sort((a, b) => new Date(a.date) - new Date(b.date));
      localStorage.setItem('ppl_sessions', JSON.stringify(sessions));

      // Restore profile if present in backup (only if current profile is default/empty)
      if (data.profile && typeof data.profile === 'object') {
        const current = loadProfile();
        const isDefault = !current.name || current.name === 'Athlete';
        if (isDefault) {
          saveProfile(data.profile);
          showToast(`Imported ${added} session${added !== 1 ? 's' : ''} + profile ✓`);
        } else {
          showToast(`Imported ${added} new session${added !== 1 ? 's' : ''} ✓ (profile kept)`);
        }
      } else {
        showToast(`Imported ${added} new session${added !== 1 ? 's' : ''} ✓`);
      }

      // Merge custom workouts by ID
      if (data.customWorkouts && Array.isArray(data.customWorkouts)) {
        const existing = getCustomWorkouts();
        const existingIds = new Set(existing.map(w => String(w.id)));
        const merged = [...existing];
        data.customWorkouts.forEach(w => {
          if (!existingIds.has(String(w.id))) merged.push(w);
        });
        saveCustomWorkouts(merged);
      }

      renderDataScreen();
      renderHome();
    } catch(err) {
      showToast('Could not read file — is it a valid backup?');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function confirmClearData() {
  if (confirm('Delete ALL workout data? This cannot be undone.\n\nTap OK to confirm.')) {
    sessions = [];
    localStorage.removeItem('ppl_sessions');
    showToast('All data cleared');
    renderDataScreen();
    renderHome();
  }
}
