function editSetField(exIdx, setIdx, field, value) {
  if (!editingSession) return;
  editingSession.exercises[exIdx].sets[setIdx][field] = value;
}

function editAddSet(exIdx) {
  if (!editingSession) return;
  editingSession.exercises[exIdx].sets.push({ reps: '', weight: '' });
  renderEditSession();
}

function editDeleteSet(exIdx, setIdx) {
  if (!editingSession) return;
  const ex = editingSession.exercises[exIdx];
  if (ex.sets.length <= 1) {
    // Remove whole exercise if last set deleted
    editingSession.exercises.splice(exIdx, 1);
  } else {
    ex.sets.splice(setIdx, 1);
  }
  renderEditSession();
}

function editRemoveExercise(exIdx) {
  if (!editingSession) return;
  editingSession.exercises.splice(exIdx, 1);
  renderEditSession();
}

let exPickerOpen = false;
let editWorkoutPickerOpen = false;

function toggleExPicker() {
  exPickerOpen = !exPickerOpen;
  editWorkoutPickerOpen = false; // close the other picker if open
  const panel = document.getElementById('ex-picker-panel');
  const btn = document.getElementById('edit-add-ex-btn');
  const wPanel = document.getElementById('edit-workout-picker-panel');
  const wBtn = document.getElementById('edit-add-workout-btn');
  if (!panel || !btn) return;
  panel.style.display = exPickerOpen ? 'block' : 'none';
  btn.classList.toggle('open', exPickerOpen);
  if (wPanel) wPanel.style.display = 'none';
  if (wBtn) wBtn.classList.remove('open');
  if (exPickerOpen) {
    renderExPickerList('');
    setTimeout(() => {
      const search = document.getElementById('ex-picker-search');
      if (search) search.focus();
    }, 50);
  }
}

function toggleEditWorkoutPicker() {
  editWorkoutPickerOpen = !editWorkoutPickerOpen;
  exPickerOpen = false; // close the other picker if open
  const panel = document.getElementById('edit-workout-picker-panel');
  const btn = document.getElementById('edit-add-workout-btn');
  const ePanel = document.getElementById('ex-picker-panel');
  const eBtn = document.getElementById('edit-add-ex-btn');
  if (panel) panel.style.display = editWorkoutPickerOpen ? 'block' : 'none';
  if (btn) btn.classList.toggle('open', editWorkoutPickerOpen);
  if (ePanel) ePanel.style.display = 'none';
  if (eBtn) eBtn.classList.remove('open');
}

function editImportWorkout(key) {
  if (!editingSession) return;
  const v = VARIATIONS[key];
  const allEx = [...v.exercises, ...v.core];
  const existingNames = new Set(editingSession.exercises.map(e => e.name));
  let added = 0;
  allEx.forEach((ex, i) => {
    if (!existingNames.has(ex.name)) {
      editingSession.exercises.push({
        key: key + '_' + i,
        name: ex.name,
        sets: [{ reps: '', weight: '' }]
      });
      added++;
    }
  });
  editWorkoutPickerOpen = false;
  renderEditSession();
  showToast(`Added ${added} exercise${added !== 1 ? 's' : ''} from ${v.label}`);
}

function editImportCore(key) {
  if (!editingSession) return;
  const v = VARIATIONS[key];
  const existingNames = new Set(editingSession.exercises.map(e => e.name));
  let added = 0;
  v.core.map(n => typeof n==="string"?getExercise(n):n).forEach((ex, i) => {
    if (!existingNames.has(ex.name)) {
      editingSession.exercises.push({
        key: key + '_core_' + i,
        name: ex.name,
        sets: [{ reps: '', weight: '' }]
      });
      added++;
    }
  });
  editWorkoutPickerOpen = false;
  renderEditSession();
  const typeLabel = v.type.charAt(0).toUpperCase() + v.type.slice(1);
  showToast(`Added ${added} core exercise${added !== 1 ? 's' : ''} (${typeLabel})`);
}

function filterExPicker(q) {
  renderExPickerList(q || '');
}

function renderExPickerList(q) {
  const list = document.getElementById('ex-picker-list');
  if (!list) return;

  // Build sorted grouped list from all variations
  const seen = new Set();
  const groups = { push: [], pull: [], legs: [], core: [] };
  const groupLabels = { push: 'Push', pull: 'Pull', legs: 'Legs', core: 'Core' };
  const groupColors = {
    push: TYPE_COLOR.push, pull: TYPE_COLOR.pull,
    legs: TYPE_COLOR.legs, core: 'var(--core)'
  };

  ORDER.forEach(key => {
    const v = VARIATIONS[key];
    [...v.exercises, ...v.core].map(n => typeof n==='string'?getExercise(n):n).forEach((ex, i) => {
      if (seen.has(ex.name)) return;
      seen.add(ex.name);
      const type = i < v.exercises.length ? v.type : 'core';
      groups[type].push(ex.name);
    });
  });

  // Sort each group alphabetically
  Object.keys(groups).forEach(k => groups[k].sort());

  const lq = q.toLowerCase().trim();
  let html = '';
  let totalVisible = 0;

  ['push', 'pull', 'legs', 'core'].forEach(type => {
    const items = lq
      ? groups[type].filter(n => n.toLowerCase().includes(lq))
      : groups[type];
    if (!items.length) return;
    html += `<div class="ex-picker-group" style="color:${groupColors[type]}">${groupLabels[type]}</div>`;
    items.forEach(name => {
      html += `<button class="ex-picker-item" onclick="editAddExercise('${name.replace(/'/g,"\\'")}')">
        ${name}
      </button>`;
    });
    totalVisible += items.length;
  });

  if (!totalVisible) {
    html = `<div class="ex-picker-empty">No exercises match "${q}"</div>`;
  }

  list.innerHTML = html;
}

function editAddExercise(name) {
  if (!name || !editingSession) return;
  editingSession.exercises.push({
    key: 'edit_' + Date.now(),
    name: name.trim(),
    sets: [{ reps: '', weight: '' }]
  });
  exPickerOpen = false;
  renderEditSession();
}

function saveEditSession() {
  if (!editingSession) return;
  const idx = sessions.findIndex(s => String(s.id) === String(editingSession.id));
  if (idx === -1) { showToast('Session not found'); return; }
  sessions[idx] = editingSession;
  saveSessions();
  showToast('Session updated ✓');
  const saved = editingSession;
  editingSession = null;
  exPickerOpen = false;
  editWorkoutPickerOpen = false;
  const editBtn = document.getElementById('detail-edit-btn');
  if (editBtn) editBtn.style.display = '';
  renderSessionDetail(sessions[idx]);
}

function cancelEditSession() {
  if (!editingSession) return;
  const id = editingSession.id;
  editingSession = null;
  exPickerOpen = false;
  editWorkoutPickerOpen = false;
  const editBtn = document.getElementById('detail-edit-btn');
  if (editBtn) editBtn.style.display = '';
  const s = sessions.find(s => String(s.id) === String(id));
  if (s) renderSessionDetail(s);
}

// Build a flat array of every unique exercise across all variations
function buildGlossary() {
  const typeColors = {
    push: { color: TYPE_COLOR.push, textColor: 'var(--push-text)', label: 'Push' },
    pull: { color: TYPE_COLOR.pull, textColor: 'var(--pull-text)', label: 'Pull' },
    legs: { color: TYPE_COLOR.legs, textColor: 'var(--legs-text)', label: 'Legs' },
    core: { color: 'var(--core)',   textColor: 'var(--core-text)',  label: 'Core' },
    cardio:  { color: 'var(--cardio)',  textColor: 'var(--cardio-text)',  label: 'Cardio' },
    general: { color: 'var(--general)', textColor: 'var(--general-text)', label: 'General' },
  };

  const items = EXERCISE_LIBRARY.map(ex => {
    const tc = typeColors[ex.type] || typeColors.general;
    return {
      name: ex.name,
      desc: ex.desc,
      type: ex.isActivity ? (ex.type === 'cardio' ? 'cardio' : 'general') : ex.type,
      typeLabel: tc.label,
      color: tc.color,
      textColor: tc.textColor,
      appearsIn: ex.appearsIn
        ? ex.appearsIn.map(k => VARIATIONS[k]?.label || k).filter(Boolean)
        : [],
      isActivity: !!ex.isActivity,
      supportsDistance: !!ex.supportsDistance,
      muscleGroup: ex.muscleGroup || null,
    };
  });

  return items.sort((a, b) => a.name.localeCompare(b.name));
}

function showGlossary() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-glossary').classList.add('active');
  setActiveNav('bnav-glossary');
  window.scrollTo(0, 0);
  document.getElementById('glossary-body').scrollTop = 0;
  const searchEl = document.getElementById('glossary-search');
  if (searchEl) searchEl.value = '';
  renderGlossary('');
}

function toggleGlossaryCard(id) {
  const card = document.getElementById('gcard-' + id);
  if (card) card.classList.toggle('open');
}

function renderGlossary(query) {
  const body = document.getElementById('glossary-body');
  const pbs = computePBs();
  const mastery = computeMastery(sessions);
  const allItems = buildGlossary();
  const q = (query || '').trim().toLowerCase();

  const filtered = q
    ? allItems.filter(item => item.name.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q))
    : allItems;

  if (!filtered.length) {
    body.innerHTML = `<div class="glossary-empty">No exercises match "${query}".</div>`;
    return;
  }

  // Group by type when not searching; flat list when searching
  const renderCard = (item, idx) => {
    const pb = pbs[item.name] || null;
    const { lastSession } = getExerciseHistory(item.name);
    const cardId = item.name.replace(/[^a-z0-9]/gi, '_');

    let statsHtml = '';
    const hasHistory = pb || lastSession;

    if (item.isActivity && item.supportsDistance) {
      // Running-specific stats based on custom sessions with this activity name
      const runningSessions = sessions.filter(s =>
        s.variationKey === CUSTOM_KEY && s.customName === item.name
      );
      if (!runningSessions.length) {
        statsHtml = `<div class="glossary-first-pill">★ Never logged yet — lace up!</div>`;
      } else {
        const lastRun = runningSessions[runningSessions.length - 1];
        const bDist = bestDistance(runningSessions);
        const bPace = bestPace(runningSessions);
        let rows = '';
        const lastDate = new Date(lastRun.date).toLocaleDateString('en-US', {month:'short', day:'numeric'});
        const d = lastRun.distance ? `${parseFloat(lastRun.distance).toFixed(2)} mi` : '';
        const t = lastRun.duration ? fmtDuration(lastRun.duration) : '';
        rows += `<div class="glossary-stat-row">
          <div class="glossary-stat-label">Last (${lastDate})</div>
          <div class="glossary-stat-value">${[d,t].filter(Boolean).join(' · ') || '—'}</div>
        </div>`;
        if (bDist) {
          rows += `<div class="glossary-stat-row">
            <div class="glossary-stat-label">Best dist</div>
            <div class="glossary-stat-value"><strong>${bDist.dist.toFixed(2)} mi</strong> · ${new Date(bDist.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'})}</div>
          </div>`;
        }
        if (bPace) {
          rows += `<div class="glossary-stat-row">
            <div class="glossary-stat-label">Best pace</div>
            <div class="glossary-stat-value"><strong>${bPace.paceStr} /mi</strong> · ${new Date(bPace.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'})}</div>
          </div>`;
        }
        if (rows) statsHtml = `<div class="glossary-stats">${rows}</div>`;
      }
    } else if (!hasHistory) {
      statsHtml = `<div class="glossary-first-pill">★ Never logged — start light, focus on form</div>`;
    } else {
      let rows = '';
      if (lastSession) {
        const lastDate = new Date(lastSession.date).toLocaleDateString('en-US', {month:'short', day:'numeric'});
        let setPreview;
        if (lastSession.isActivity) {
          const parts = [];
          if (lastSession.duration) parts.push(fmtDuration(lastSession.duration));
          if (lastSession.distance) parts.push(`${parseFloat(lastSession.distance).toFixed(2)} mi`);
          setPreview = parts.join(', ') || 'logged';
        } else {
          setPreview = lastSession.sets.slice(0, 3).map(st => {
            const reps = parseFloat(st.reps) || 0;
            const weight = parseFloat(st.weight) || 0;
            return weight > 0 ? `${reps} × ${weight} lbs` : `${reps} reps`;
          }).join(', ');
        }
        rows += `<div class="glossary-stat-row">
          <div class="glossary-stat-label">Last (${lastDate})</div>
          <div class="glossary-stat-value">${setPreview}${!lastSession.isActivity && lastSession.sets.length > 3 ? '…' : ''}</div>
        </div>`;
      }
      if (pb && pb.weight > 0) {
        const d = pb.weightDate ? new Date(pb.weightDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'}) : '';
        const atReps = pb.weightReps > 0 ? ` × ${pb.weightReps} reps` : '';
        rows += `<div class="glossary-stat-row">
          <div class="glossary-stat-label">Best weight</div>
          <div class="glossary-stat-value"><strong>${pb.weight} lbs${atReps}</strong>${d ? ` · ${d}` : ''}</div>
        </div>`;
      }
      if (pb && pb.reps > 0) {
        const d = pb.repsDate ? new Date(pb.repsDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'}) : '';
        const atW = pb.repsWeight > 0 ? ` × ${pb.repsWeight} lbs` : '';
        rows += `<div class="glossary-stat-row">
          <div class="glossary-stat-label">Best reps</div>
          <div class="glossary-stat-value"><strong>${pb.reps} reps${atW}</strong>${d ? ` · ${d}` : ''}</div>
        </div>`;
      }
      if (rows) statsHtml = `<div class="glossary-stats">${rows}</div>`;
    }

    // Mastery bar — timed (seconds), reps-based, or activity (minutes)
    let masteryHtml = '';
    if (!item.isActivity) {
      const m = mastery[item.name];
      if (isTimedExercise(item.name)) {
        const totalSecs = m ? Math.round(m.totalSecs) : 0;
        const fills = m ? m.fills : 0;
        const threshold = getTimedMasteryThreshold(item.name);
        const withinCycle = totalSecs % threshold;
        const pct = Math.round((withinCycle / threshold) * 100);
        const fillLabel = fills > 0 ? `×${fills} filled` : 'not yet filled';
        const fmtSecs = s => s >= 60 ? `${Math.floor(s/60)}m ${s%60>0?s%60+'s':''}`.trim() : `${s}s`;
        masteryHtml = `<div style="margin:10px 12px 4px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
            <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px">Mastery <span style="opacity:0.5">· timed hold</span></div>
            <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--dex);${fills>0?'':'opacity:0.5'}">${fillLabel}</div>
          </div>
          <div style="height:4px;background:#2A2820;border-radius:2px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:var(--dex);border-radius:2px;transition:width 0.4s ease"></div>
          </div>
          <div style="font-family:'DM Mono',monospace;font-size:8px;color:var(--text-dim);margin-top:3px">
            ${fmtSecs(withinCycle)} / ${fmtSecs(threshold)} to next fill
          </div>
        </div>`;
      } else {
        const totalReps = m ? m.totalReps : 0;
        const fills = m ? m.fills : 0;
        const threshold = m ? m.threshold : getMasteryThreshold(item.name);
        const withinCycle = totalReps % threshold;
        const pct = Math.round((withinCycle / threshold) * 100);
        const fillLabel = fills > 0 ? `×${fills} filled` : 'not yet filled';
        const tierLabel = getMasteryTier(item.name);
        masteryHtml = `<div style="margin:10px 12px 4px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
            <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px">Mastery <span style="opacity:0.5">· ${tierLabel}</span></div>
            <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--dex);${fills>0?'':'opacity:0.5'}">${fillLabel}</div>
          </div>
          <div style="height:4px;background:#2A2820;border-radius:2px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:var(--dex);border-radius:2px;transition:width 0.4s ease"></div>
          </div>
          <div style="font-family:'DM Mono',monospace;font-size:8px;color:var(--text-dim);margin-top:3px">
            ${withinCycle} / ${threshold} reps to next fill
          </div>
        </div>`;
      }
    } else if (getActivityMasteryThreshold(item.name) && item.isActivity) {
      const m = mastery[item.name];
      const totalMins = m ? Math.round(m.totalMinutes) : 0;
      const fills = m ? m.fills : 0;
      const threshold = getActivityMasteryThreshold(item.name);
      const withinCycle = Math.round(totalMins % threshold);
      const pct = Math.round((withinCycle / threshold) * 100);
      const fillLabel = fills > 0 ? `×${fills} filled` : 'not yet filled';
      const barColor = (item.name === 'Running' || item.name === 'Biking') ? 'var(--end)' : 'var(--agi)';
      masteryHtml = `<div style="margin:10px 12px 4px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
          <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px">Mastery <span style="opacity:0.5">· duration</span></div>
          <div style="font-family:'DM Mono',monospace;font-size:9px;color:${barColor};${fills>0?'':'opacity:0.5'}">${fillLabel}</div>
        </div>
        <div style="height:4px;background:#2A2820;border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${barColor};border-radius:2px;transition:width 0.4s ease"></div>
        </div>
        <div style="font-family:'DM Mono',monospace;font-size:8px;color:var(--text-dim);margin-top:3px">
          ${fmtDuration(withinCycle)} / ${fmtDuration(threshold)} to next fill
        </div>
      </div>`;
    }

    const tagLine = item.appearsIn.length
      ? item.appearsIn.slice(0, 4).join(', ') + (item.appearsIn.length > 4 ? '…' : '')
      : item.typeLabel;

    const muscleLabel = item.muscleGroup
      ? item.muscleGroup.charAt(0).toUpperCase() + item.muscleGroup.slice(1).replace(' body', ' body')
      : null;

    return `<div class="glossary-card" id="gcard-${cardId}" style="position:relative">
      <button class="glossary-card-header" onclick="toggleGlossaryCard('${cardId}')">
        <div class="glossary-card-left">
          <div class="glossary-ex-name">${item.name}</div>
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px">
            ${item.muscleGroup ? muscleGroupPill(item.muscleGroup) : ''}
            <div class="glossary-ex-tag" style="color:${item.color}">${tagLine}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:24px;padding-right:4px">
          <span class="glossary-chevron">⌄</span>
        </div>
      </button>
      <button onclick="showProgressionScreen('${item.name.replace(/'/g,"\\'")}','glossary')"
        style="position:absolute;top:0;right:36px;height:52px;background:none;border:none;
          font-size:14px;cursor:pointer;padding:0 8px;opacity:0.5;z-index:1"
        title="View progress">📈</button>
      <div class="glossary-detail">
        <div class="glossary-desc">${item.desc}</div>
        ${statsHtml}
        ${masteryHtml}
      </div>
    </div>`;
  };

  let html = '';

  if (q) {
    // Flat list when searching
    html += `<div style="padding:6px 18px 2px;font-size:11px;color:var(--text-dim)">${filtered.length} result${filtered.length !== 1 ? 's' : ''}</div>`;
    html += filtered.map((item, i) => renderCard(item, i)).join('');
  } else {
    // Grouped by type
    const typeOrder = ['push', 'pull', 'legs', 'core'];
    const typeLabels = { push: 'Push', pull: 'Pull', legs: 'Legs', core: 'Core' };
    const typeColors = { push: TYPE_COLOR.push, pull: TYPE_COLOR.pull, legs: TYPE_COLOR.legs, core: 'var(--core)' };
    typeOrder.forEach(type => {
      const group = filtered.filter(item => item.type === type && !item.isActivity);
      if (!group.length) return;
      html += `<div class="glossary-group-label" style="color:${typeColors[type]}">${typeLabels[type]} exercises</div>`;
      html += group.map((item, i) => renderCard(item, i)).join('');
    });
    const actItems = filtered.filter(item => item.isActivity);
    if (actItems.length) {
      html += `<div class="glossary-group-label" style="color:var(--cardio)">Activities</div>`;
      html += actItems.map((item, i) => renderCard(item, i)).join('');
    }
  }

  html += '<div style="height:16px"></div>';
  body.innerHTML = html;
}

// RPG / PROFILE SYSTEM

// ── Profile persistence ────────────────────────────────────────────────────
const PROFILE_KEY = 'ppl_profile';
function loadProfile() {
  try { return JSON.parse(localStorage.getItem(PROFILE_KEY) || '{}'); } catch { return {}; }
}
function saveProfile(p) { localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); }
function getProfile() {
  const p = loadProfile();
  return {
    name: p.name || 'Athlete',
    photo: p.photo || null,
    equippedTitle: p.equippedTitle || 'Newcomer',
    ...p
  };
}

// ── Leveling curve: XP needed to reach level N from level N-1 ─────────────
function xpForLevel(level) { return Math.round(1000 * Math.pow(level, 1.4)); }
function totalXpForLevel(level) {
  let t = 0; for (let i = 1; i < level; i++) t += xpForLevel(i); return t;
}
function levelFromXP(xp) {
  let lvl = 1;
  while (xp >= xpForLevel(lvl)) { xp -= xpForLevel(lvl); lvl++; }
  return { level: lvl, xpIntoLevel: xp, xpNeeded: xpForLevel(lvl) };
}

// ── Attribute definitions ──────────────────────────────────────────────────
const ATTRS = {
  str: { name:'Strength',  icon:'⚔️',  color:'var(--str)', bg:'var(--str-bg)', text:'var(--str-text)', glow:'var(--str-glow)' },
  end: { name:'Endurance', icon:'🏃',  color:'var(--end)', bg:'var(--end-bg)', text:'var(--end-text)', glow:'var(--end-glow)' },
  agi: { name:'Agility',   icon:'⚡',  color:'var(--agi)', bg:'var(--agi-bg)', text:'var(--agi-text)', glow:'var(--agi-glow)' },
  dex: { name:'Dexterity', icon:'🎯',  color:'var(--dex)', bg:'var(--dex-bg)', text:'var(--dex-text)', glow:'var(--dex-glow)' },
};

// ── XP awards per session type ─────────────────────────────────────────────
// Each entry: { primary: [...attrs], minor: [...attrs] }
const ACHIEVEMENT_XP_FIRST = 200;  // first-time unlock
// Tiered repeat XP: 50 = frequent, 75 = medium, 100 = hard
const ACHIEVEMENT_REPEAT_XP = {
  week_warrior:   75,   // medium — every 5 qualifying weeks
  iron_habit:    100,
  century:       100,
  ton_moved:      50,
  freight:       100,
  million:       200,   // full bonus — unlikely to trigger more than once a year
  five_k:         50,
  marathon:       75,
  ten_mile_ride:  50,
  century_ride:   75,
  breakthrough:   75,
  untouchable:   100,
  warrior:        50,
  sparring:       50,
  striker:        50,
  dedicated:      75,
  master:        100,
  rising_tide:    50,
};
const SESSION_ATTR_MAP = {
  push:    { primary:['str'], minor:['dex'] },
  pull:    { primary:['str'], minor:['dex'] },
  legs:    { primary:['str'], minor:['end'] },
  cardio:  { primary:['end'], minor:['agi'] },
  core:    { primary:['str'], minor:['end'] },
  general: { primary:['end'], minor:['agi'] },
};
// Activity-specific overrides (by customName)
function getSessionAttrMap(s) {
  if (s.variationKey === CUSTOM_KEY && s.customName) {
    const actMap = getActivityAttrMap(s.customName);
    if (actMap) return actMap;
  }
  const vm = getVariationMeta(s.variationKey, s.customName, s.category, s.customWorkoutId);
  return SESSION_ATTR_MAP[vm.type] || SESSION_ATTR_MAP.general;
}

// ── XP calculation for a single session ───────────────────────────────────
// ── XP rate constants — session-level, not per-exercise ──────────────────────
// Per-exercise rates (reps, timed) are read from xpRateType + these values.
// Per-exercise overrides (xpPerRep, xpPerSec) can be added to EXERCISE_LIBRARY
// entries in the future (roadmap item #19) without changing calcSessionXP.
const XP_RATES = {
  perRep:     1,    // XP per rep for reps-based exercises
  perSecDiv:  10,   // 1 XP per N seconds held for timed exercises
  perMile:    5,    // XP per mile distance
  per100Lbs:  1,    // XP per 100 lbs volume
  prBonus:    150,  // XP per new personal best
  aboveAvg:   50,   // XP per above-average metric
  baseDaily:  100,  // XP for showing up (once per calendar day)
};

function calcSessionXP(s, priorSessions, priorPBs) {
  const map = getSessionAttrMap(s);
  const breakdown = { base: 0, duration: 0, volume: 0, distance: 0, reps: 0, timed: 0, pr: 0, aboveAvg: 0, total: 0 };
  const attrGains = { str: 0, end: 0, agi: 0, dex: 0 };

  const distribute = (xp, primary, minor) => {
    primary.forEach(a => { attrGains[a] = (attrGains[a]||0) + xp; });
    minor.forEach(a => { attrGains[a] = (attrGains[a]||0) + Math.round(xp * 0.5); });
  };

  // ── Build aggregated session attrMap from exercises actually logged ────────
  // Weighted by reps/seconds contributed per exercise.
  // Used for session-level bonuses (base, PR, above-average, volume, distance).
  // Activities keep their own attrMap from the library.
  const isActivity = s.variationKey === CUSTOM_KEY && s.customName && getActivity(s.customName);
  let sessionAttrMap = map; // fallback to session type map

  if (!isActivity && s.exercises && s.exercises.length > 0) {
    // Count total work units per attribute across all logged exercises
    const attrWeight = {};
    let totalWork = 0;
    s.exercises.forEach(e => {
      const ex = getExercise(e.name);
      if (!ex || !ex.attrMap) return;
      let work = 0;
      if (ex.xpRateType === 'timed') {
        work = e.sets.reduce((a, st) => a + (parseFloat(st.duration)||0), 0);
      } else {
        work = e.sets.reduce((a, st) => a + (parseFloat(st.reps)||0), 0);
      }
      if (work <= 0) return;
      totalWork += work;
      ex.attrMap.primary.forEach(a => { attrWeight[a] = (attrWeight[a]||0) + work; });
      ex.attrMap.minor.forEach(a => { attrWeight[a] = (attrWeight[a]||0) + work * 0.5; });
    });

    if (totalWork > 0) {
      // Build a weighted attrMap — primary = highest weighted attrs, minor = rest
      const sorted = Object.entries(attrWeight).sort((a, b) => b[1] - a[1]);
      const maxWeight = sorted[0]?.[1] || 1;
      const primary = sorted.filter(([, w]) => w >= maxWeight * 0.75).map(([a]) => a);
      const minor = sorted.filter(([, w]) => w < maxWeight * 0.75 && w > 0).map(([a]) => a);
      if (primary.length > 0) sessionAttrMap = { primary, minor };
    }
  }

  // ── Daily base XP cap — showing up only earns XP_RATES.baseDaily once per day
  const sessionDay = new Date(s.date).toDateString();
  const alreadyEarnedBase = priorSessions.some(ps =>
    new Date(ps.date).toDateString() === sessionDay
  );
  if (!alreadyEarnedBase) {
    breakdown.base = XP_RATES.baseDaily;
    distribute(XP_RATES.baseDaily, sessionAttrMap.primary, sessionAttrMap.minor || []);
  }

  // ── Duration bonus — reads xpPerMin from library for activities ───────────
  const dur = parseFloat(s.duration) || 0;
  if (dur > 0) {
    const name = s.customName || '';
    const vm2 = getVariationMeta(s.variationKey, s.customName, s.category, s.customWorkoutId);
    const isLiftingSession = ['push','pull','legs'].includes(vm2.type) && s.variationKey !== CUSTOM_KEY;
    if (!isLiftingSession) {
      let rate = 0;
      const actDef = getActivity(name);
      if (actDef) {
        rate = actDef.xpPerMin || 6;   // per-activity rate from library
      } else if (vm2.type === 'core') {
        rate = 5;                        // standalone Core A/B/C
      } else if (s.variationKey === CUSTOM_KEY) {
        rate = 6;                        // other custom activities
      }
      if (rate > 0) {
        const dBonus = Math.round(dur * rate);
        breakdown.duration = dBonus;
        distribute(dBonus, sessionAttrMap.primary, sessionAttrMap.minor || []);
      }
    }
  }

  // ── Reps bonus — per-exercise attrMap distribution ────────────────────────
  let totalRepsXP = 0;
  s.exercises.forEach(e => {
    const ex = getExercise(e.name);
    if (!ex || ex.xpRateType !== 'reps') return;
    const rate = ex.xpPerRep || XP_RATES.perRep;
    const reps = e.sets.reduce((a, st) => a + (parseFloat(st.reps)||0), 0);
    const xp = reps * rate;
    if (xp > 0) {
      totalRepsXP += xp;
      const exMap = ex.attrMap || sessionAttrMap;
      distribute(xp, exMap.primary, exMap.minor || []);
    }
  });
  if (totalRepsXP > 0) {
    breakdown.reps = Math.round(totalRepsXP);
  }

  // ── Timed hold bonus — per-exercise attrMap distribution ─────────────────
  let totalTimedXP = 0;
  s.exercises.forEach(e => {
    const ex = getExercise(e.name);
    if (!ex || ex.xpRateType !== 'timed') return;
    const div = ex.xpPerSecDiv || XP_RATES.perSecDiv;
    const secs = e.sets.reduce((a, st) => a + (parseFloat(st.duration)||0), 0);
    const xp = Math.floor(secs / div);
    if (xp > 0) {
      totalTimedXP += xp;
      const exMap = ex.attrMap || sessionAttrMap;
      distribute(xp, exMap.primary, exMap.minor || []);
    }
  });
  if (totalTimedXP > 0) {
    breakdown.timed = totalTimedXP;
  }

  // ── Volume bonus: XP_RATES.per100Lbs per 100 lbs ─────────────────────────
  const vol = s.exercises.reduce((acc, e) =>
    acc + e.sets.reduce((a, st) => a + ((parseFloat(st.reps)||0) * (parseFloat(st.weight)||0)), 0), 0);
  if (vol > 0) {
    const vBonus = Math.round(vol / 100) * XP_RATES.per100Lbs;
    breakdown.volume = vBonus;
    distribute(vBonus, sessionAttrMap.primary, sessionAttrMap.minor || []);
  }

  // ── Distance bonus: XP_RATES.perMile per mile ────────────────────────────
  const dist = parseFloat(s.distance) || 0;
  if (dist > 0) {
    const distBonus = Math.round(dist * XP_RATES.perMile);
    breakdown.distance = distBonus;
    distribute(distBonus, sessionAttrMap.primary, sessionAttrMap.minor || []);
  }

  // ── Above-average bonuses (require ≥3 prior sessions) ────────────────────
  const ABOVE_AVG_MIN = 3;

  const priorWithDur = priorSessions.filter(ps => parseFloat(ps.duration) > 0);
  const avgDur = priorWithDur.length >= ABOVE_AVG_MIN
    ? priorWithDur.reduce((a, ps) => a + parseFloat(ps.duration), 0) / priorWithDur.length : null;

  const vm = getVariationMeta(s.variationKey, s.customName, s.category, s.customWorkoutId);
  const priorSameType = priorSessions.filter(ps =>
    getVariationMeta(ps.variationKey, ps.customName, ps.category).type === vm.type);
  const priorVols = priorSameType.map(ps =>
    ps.exercises.reduce((acc, e) =>
      acc + e.sets.reduce((a, st) => a + ((parseFloat(st.reps)||0)*(parseFloat(st.weight)||0)), 0), 0)
  ).filter(v => v > 0);
  const avgVol = priorVols.length >= ABOVE_AVG_MIN
    ? priorVols.reduce((a,b)=>a+b,0)/priorVols.length : null;

  const priorWithDist = priorSessions.filter(ps => parseFloat(ps.distance) > 0);
  const avgDist = priorWithDist.length >= ABOVE_AVG_MIN
    ? priorWithDist.reduce((a, ps) => a + parseFloat(ps.distance), 0) / priorWithDist.length : null;

  const priorWPRs = priorSameType.map(ps => sessionWeightPerRep(ps)).filter(v => v > 0);
  const avgWPR = priorWPRs.length >= ABOVE_AVG_MIN
    ? priorWPRs.reduce((a,b)=>a+b,0)/priorWPRs.length : null;
  const thisWPR = sessionWeightPerRep(s);

  if (avgDur !== null && dur > avgDur)     breakdown.aboveAvg += XP_RATES.aboveAvg;
  if (avgVol !== null && vol > avgVol)     breakdown.aboveAvg += XP_RATES.aboveAvg;
  if (avgDist !== null && dist > avgDist)  breakdown.aboveAvg += XP_RATES.aboveAvg;
  if (avgWPR !== null && thisWPR > avgWPR) breakdown.aboveAvg += XP_RATES.aboveAvg;

  if (breakdown.aboveAvg > 0) {
    distribute(breakdown.aboveAvg, sessionAttrMap.primary, sessionAttrMap.minor || []);
  }

  // ── PR bonus: XP_RATES.prBonus per new lifting PB ────────────────────────
  const currentPBs = priorPBs || {};
  let prCount = 0;
  s.exercises.forEach(ex => {
    const prev = currentPBs[ex.name] || { weight: 0, reps: 0 };
    ex.sets.forEach(st => {
      const w = parseFloat(st.weight)||0, r = parseFloat(st.reps)||0;
      if (w > prev.weight || r > prev.reps) prCount++;
    });
  });
  if (prCount > 0) {
    const prBonus = prCount * XP_RATES.prBonus;
    breakdown.pr = prBonus;
    distribute(prBonus, sessionAttrMap.primary, sessionAttrMap.minor || []);
  }

  // ── Activity PB bonus: +150 XP per new duration/distance/pace best ────────
  const isActivitySess = s.variationKey === CUSTOM_KEY && s.customName &&
    PREDEFINED_ACTIVITIES.find(a => a.name === s.customName) && s.exercises.length === 0;
  if (isActivitySess) {
    const priorActSess = priorSessions.filter(ps =>
      ps.variationKey === CUSTOM_KEY && ps.customName === s.customName
    );
    const curDurA = parseFloat(s.duration)||0;
    const curDistA = parseFloat(s.distance)||0;
    const priorBestDurA = Math.max(0, ...priorActSess.map(ps => parseFloat(ps.duration)||0));
    const priorBestDistA = Math.max(0, ...priorActSess.map(ps => parseFloat(ps.distance)||0));
    let priorBestPaceA = Infinity;
    priorActSess.forEach(ps => {
      const d = parseFloat(ps.distance)||0, t = parseFloat(ps.duration)||0;
      if (d > 0 && t > 0) priorBestPaceA = Math.min(priorBestPaceA, t/d);
    });
    const curPaceA = (curDistA > 0 && curDurA > 0) ? curDurA/curDistA : null;
    let actPRCount = 0;
    if (curDurA > 0 && curDurA > priorBestDurA) actPRCount++;
    if (curDistA > 0 && curDistA > priorBestDistA) actPRCount++;
    if (curPaceA && priorBestPaceA !== Infinity && curPaceA < priorBestPaceA) actPRCount++;
    if (actPRCount > 0) {
      const actPRBonus = actPRCount * 150;
      breakdown.pr += actPRBonus;
      distribute(actPRBonus, map.primary, map.minor || []);
    }
  }

  breakdown.total = Object.values(attrGains).reduce((a,b)=>a+b,0);
  return { breakdown, attrGains };
}

// ── Exercise mastery ───────────────────────────────────────────────────────
// ── Mastery system — reps-based with tiered thresholds ────────────────────
// Tier 1: Heavy compounds — 1,000 reps per fill
// Tier 2: Moderate compounds — 750 reps per fill
// Tier 3: Isolation / everything else — 500 reps per fill

// ── Timed exercise helpers — now derived from EXERCISE_LIBRARY ───────────────
// ── Mastery thresholds — now read directly from EXERCISE_LIBRARY ─────────────
function getMasteryThreshold(exerciseName) {
  return getExercise(exerciseName)?.masteryThreshold || 500;
}
function getTimedMasteryThreshold(name) {
  return getExercise(name)?.masteryThreshold || 3000;
}
function getMasteryTier(exerciseName) {
  return getExercise(exerciseName)?.masteryTier || 'isolation';
}


function computeMastery(sessionList) {
  const mastery = {};
  sessionList.forEach(s => {
    // Exercise-based mastery (reps or timed seconds)
    s.exercises.forEach(ex => {
      if (!ex.name) return;
      if (!mastery[ex.name]) mastery[ex.name] = { totalReps: 0, totalSecs: 0, fills: 0, barProgress: 0, isTimed: isTimedExercise(ex.name) };
      if (isTimedExercise(ex.name)) {
        mastery[ex.name].totalSecs += ex.sets.reduce((acc, st) => acc + (parseFloat(st.duration)||0), 0);
      } else {
        mastery[ex.name].totalReps += ex.sets.reduce((acc, st) => acc + (parseFloat(st.reps)||0), 0);
      }
    });
    // Activity-based mastery (duration in minutes)
    if (s.variationKey === CUSTOM_KEY && s.customName && getActivityMasteryThreshold(s.customName) && isActivityByName(s.customName)) {
      const name = s.customName;
      if (!mastery[name]) mastery[name] = { totalMinutes: 0, fills: 0, barProgress: 0, isActivity: true };
      mastery[name].totalMinutes += parseFloat(s.duration) || 0;
    }
  });
  Object.keys(mastery).forEach(name => {
    const m = mastery[name];
    if (m.isActivity) {
      const threshold = getActivityMasteryThreshold(name);
      m.threshold = threshold; m.fills = Math.floor(m.totalMinutes / threshold);
      m.barProgress = (m.totalMinutes % threshold) / threshold;
    } else if (m.isTimed) {
      const threshold = getTimedMasteryThreshold(name);
      m.threshold = threshold; m.fills = Math.floor(m.totalSecs / threshold);
      m.barProgress = (m.totalSecs % threshold) / threshold;
    } else {
      const threshold = getMasteryThreshold(name);
      m.threshold = threshold; m.fills = Math.floor(m.totalReps / threshold);
      m.barProgress = (m.totalReps % threshold) / threshold;
    }
  });
  return mastery;
}

// ── Aggregate XP across all sessions ──────────────────────────────────────
function computeAllXP(sessionList) {
  const totalAttrXP = { str: 0, end: 0, agi: 0, dex: 0 };
  let runningPBs = {};
  sessionList.forEach((s, idx) => {
    const priorSessions = sessionList.slice(0, idx);
    const { attrGains } = calcSessionXP(s, priorSessions, runningPBs);
    Object.keys(attrGains).forEach(a => { totalAttrXP[a] = (totalAttrXP[a]||0) + attrGains[a]; });
    // Update running PBs
    s.exercises.forEach(ex => {
      if (!runningPBs[ex.name]) runningPBs[ex.name] = { weight:0, reps:0 };
      ex.sets.forEach(st => {
        const w = parseFloat(st.weight)||0, r = parseFloat(st.reps)||0;
        if (w > runningPBs[ex.name].weight) runningPBs[ex.name].weight = w;
        if (r > runningPBs[ex.name].reps) runningPBs[ex.name].reps = r;
      });
    });
  });
  // Mastery XP bonus: +50 per fill per exercise
  const mastery = computeMastery(sessionList);
  Object.values(mastery).forEach(m => { totalAttrXP.str = (totalAttrXP.str||0) + m.fills * 50; });
  return { totalAttrXP, mastery };
}

// ── Character level from sum of all attr XP ────────────────────────────────
function computeCharLevel(totalAttrXP) {
  const total = Object.values(totalAttrXP).reduce((a,b)=>a+b, 0);
  return { charXP: total, ...levelFromXP(total) };
}

// ── New achievement helpers ────────────────────────────────────────────────

// Mon-Sun week key for a date string
function getWeekKey(dateStr) {
  const d = new Date(dateStr);
  const day = d.getDay() || 7; // Mon=1 ... Sun=7
  const mon = new Date(d);
  mon.setDate(d.getDate() - (day - 1));
  return mon.toISOString().slice(0, 10);
}

// Sessions of a given variation type
function sessionsOfType(sessionList, type) {
  return sessionList.filter(s => {
    const vm = getVariationMeta(s.variationKey, s.customName, s.category, s.customWorkoutId);
    return vm.type === type;
  });
}

// Session max volume (lbs) in a single session
function maxSessionLbs(sessionList) {
  return Math.max(0, ...sessionList.map(s =>
    s.exercises.reduce((acc, e) =>
      acc + e.sets.reduce((a, st) =>
        a + (parseFloat(st.reps)||0) * (parseFloat(st.weight)||0), 0), 0)
  ));
}

// Count sessions where single-session volume >= threshold
function sessionsOverLbs(sessionList, threshold) {
  return sessionList.filter(s => {
    const vol = s.exercises.reduce((acc, e) =>
      acc + e.sets.reduce((a, st) =>
        a + (parseFloat(st.reps)||0) * (parseFloat(st.weight)||0), 0), 0);
    return vol >= threshold;
  }).length;
}

// Has the user logged at least one session of each PPL type
function hasFullSplit(sessionList) {
  const types = new Set(sessionList.map(s => getVariationMeta(s.variationKey, s.customName, s.category, s.customWorkoutId).type));
  return ['push','pull','legs'].every(t => types.has(t));
}

// Has the user logged all 12 variations at least once
function hasAllVariations(sessionList) {
  const logged = new Set(sessionList.map(s => s.variationKey));
  return [...ORDER, ...CORE_ORDER].every(k => logged.has(k));
}

// Weeks (Mon-Sun) that contain at least one session of each of the given types
function weeksWithTypes(sessionList, types) {
  const byWeek = {};
  sessionList.forEach(s => {
    const k = getWeekKey(s.date);
    if (!byWeek[k]) byWeek[k] = new Set();
    byWeek[k].add(getVariationMeta(s.variationKey, s.customName, s.category, s.customWorkoutId).type);
  });
  return Object.values(byWeek).filter(typeSet =>
    types.every(t => typeSet.has(t))
  ).length;
}

// Weeks with Push + Pull + Legs + any cardio
function weeksWithFullCross(sessionList) {
  const byWeek = {};
  sessionList.forEach(s => {
    const k = getWeekKey(s.date);
    if (!byWeek[k]) byWeek[k] = new Set();
    const vm = getVariationMeta(s.variationKey, s.customName, s.category, s.customWorkoutId);

// Rolling count of instances where a Legs session was logged within 7 days of a Push session
function neverSkipLegDayCount(sessionList) {
  const pushDates = sessionList
    .filter(s => getVariationMeta(s.variationKey, s.customName, s.category, s.customWorkoutId).type === 'push')
    .map(s => new Date(s.date).getTime());

    .filter(s => getVariationMeta(s.variationKey, s.customName, s.category, s.customWorkoutId).type === 'legs')
    .map(s => new Date(s.date).getTime());
  let count = 0;

// Consecutive sessions beating personal avg weight-per-rep
function maxStreakOfStrength(sessionList) {
  if (sessionList.length < 2) return 0;
  const wprs = sessionList.map(s => sessionWeightPerRep(s));
  let maxStreak = 0, streak = 0;
  for (let i = 1; i < wprs.length; i++) {
    const avg = wprs.slice(0, i).reduce((a, b) => a + b, 0) / i;
    if (wprs[i] > avg && wprs[i] > 0) { streak++; maxStreak = Math.max(maxStreak, streak); }
    else streak = 0;
  }
  return maxStreak;
}

// Count of qualifying weeks where every session had a PB (min 3 sessions)
function pbJamWeeks(sessionList) {
  const pbs = {};
  const byWeek = {};
  sessionList.forEach(s => {
    const k = getWeekKey(s.date);
    if (!byWeek[k]) byWeek[k] = { allPB: true, count: 0 };
    let sessionHasPB = false;
    s.exercises.forEach(ex => {
      const prev = pbs[ex.name] || { weight: 0, reps: 0 };
      ex.sets.forEach(st => {
        const w = parseFloat(st.weight)||0, r = parseFloat(st.reps)||0;
        if (w > prev.weight || r > prev.reps) sessionHasPB = true;
        if (!pbs[ex.name]) pbs[ex.name] = { weight: 0, reps: 0 };
        if (w > pbs[ex.name].weight) pbs[ex.name].weight = w;
        if (r > pbs[ex.name].reps) pbs[ex.name].reps = r;
      });
    });
    byWeek[k].count++;
    if (!sessionHasPB) byWeek[k].allPB = false;
  });
  return Object.values(byWeek).filter(w => w.count >= 3 && w.allPB).length;
}

// Consecutive qualifying weeks (3+ sessions)
function maxConsecutiveQualifyingWeeks(sessionList) {
  const byWeek = {};
  sessionList.forEach(s => {
    const k = getWeekKey(s.date);
    byWeek[k] = (byWeek[k]||0) + 1;
  });
  const sorted = Object.keys(byWeek).sort();
  let max = 0, streak = 0;
  for (let i = 0; i < sorted.length; i++) {
    if (byWeek[sorted[i]] >= 1) {
      // Check if consecutive to previous week
      if (i > 0) {
        const prev = new Date(sorted[i-1]);
        const curr = new Date(sorted[i]);
        const diff = (curr - prev) / (7 * 24 * 60 * 60 * 1000);
        if (Math.round(diff) === 1) { streak++; }
        else streak = 1;
      } else streak = 1;
      max = Math.max(max, streak);
    } else streak = 0;
  }
  return max;
}

// Used by Triple Threat and A Full Plate — checks a Set of types per week
function consecutiveQualifyingWeekGroups(sessionList, n, typeCheck) {
  const byWeek = {};
  sessionList.forEach(s => {
    const k = getWeekKey(s.date);
    if (!byWeek[k]) byWeek[k] = new Set();
    const vm = getVariationMeta(s.variationKey, s.customName, s.category, s.customWorkoutId);
    byWeek[k].add(vm.type);
    if (isRunningSession(s) || isBikingSession(s)) byWeek[k].add('_cardio');
  });
  const sortedWeeks = Object.keys(byWeek).sort();
  let groups = 0, streak = 0;
  for (let i = 0; i < sortedWeeks.length; i++) {
    const qualifies = typeCheck(byWeek[sortedWeeks[i]]);
    if (qualifies) {
      if (streak > 0 && i > 0) {
        const prev = new Date(sortedWeeks[i - 1]);
        const curr = new Date(sortedWeeks[i]);
        const diff = Math.round((curr - prev) / (7 * 24 * 60 * 60 * 1000));
        if (diff !== 1) streak = 0;
      }
      streak++;
      if (streak === n) { groups++; streak = 0; }
    } else {
      streak = 0;
    }
  }
  return { groups, streak };
}

// ── Achievement helper functions ───────────────────────────────────────────
function weeksWith3Plus(sessionList) {
  const wc = {};
  sessionList.forEach(s => {
    const d = new Date(s.date); const day = d.getDay()||7;
    const mon = new Date(d); mon.setDate(d.getDate()-(day-1));
    const k = mon.toISOString().slice(0,10);
    wc[k] = (wc[k]||0) + 1;
  });
  return Object.values(wc).filter(v => v >= 3).length;
}
function maxRunDist(sessionList) {
  return Math.max(0, ...sessionList.filter(s => isRunningSession(s)).map(s => parseFloat(s.distance)||0));
}
function runSessionsOver(sessionList, dist) {
  return sessionList.filter(s => isRunningSession(s) && (parseFloat(s.distance)||0) >= dist).length;
}
function totalRunMiles(sessionList) {
  return sessionList.filter(s => isRunningSession(s)).reduce((acc, s) => acc + (parseFloat(s.distance)||0), 0);
}
function maxBikeDist(sessionList) {
  return Math.max(0, ...sessionList.filter(s => isBikingSession(s)).map(s => parseFloat(s.distance)||0));
}
function bikeSessionsOver(sessionList, dist) {
  return sessionList.filter(s => isBikingSession(s) && (parseFloat(s.distance)||0) >= dist).length;
}
function totalBikeMiles(sessionList) {
  return sessionList.filter(s => isBikingSession(s)).reduce((acc, s) => acc + (parseFloat(s.distance)||0), 0);
}
function tkdCount(sessionList) {
  return sessionList.filter(s => s.customName && s.customName.startsWith('Taekwondo')).length;
}
function tkdTypeCount(sessionList, type) {
  return sessionList.filter(s => s.customName && s.customName.includes(type)).length;
}
function hasManyPBsInOneSession(sessionList, n) {
  const pbs = {}; let found = false;
  sessionList.forEach(s => {
    if (found) return;
    let count = 0;
    s.exercises.forEach(ex => {
      const prev = pbs[ex.name] || {weight:0, reps:0};
      ex.sets.forEach(st => {
        if ((parseFloat(st.weight)||0) > prev.weight || (parseFloat(st.reps)||0) > prev.reps) count++;
      });
    });
    if (count >= n) found = true;
    s.exercises.forEach(ex => {
      if (!pbs[ex.name]) pbs[ex.name] = {weight:0, reps:0};
      ex.sets.forEach(st => {
        const w = parseFloat(st.weight)||0, r = parseFloat(st.reps)||0;
        if (w > pbs[ex.name].weight) pbs[ex.name].weight = w;
        if (r > pbs[ex.name].reps) pbs[ex.name].reps = r;
      });
    });
  });
  return found;
}
// Returns average weight per rep across all weighted sets in a session
function sessionWeightPerRep(s) {
  let totalWeight = 0, totalReps = 0;
  s.exercises.forEach(ex => {
    ex.sets.forEach(st => {
      const w = parseFloat(st.weight) || 0;
      const r = parseFloat(st.reps) || 0;
      if (w > 0 && r > 0) { totalWeight += w * r; totalReps += r; }
    });
  });
  return totalReps > 0 ? totalWeight / totalReps : 0;
}

function countAboveAvgSessions(sessionList) {
  // Count sessions where the above-average bonus fired (duration, volume, distance, or weight/rep)
  const MIN = 3;
  let count = 0;
  sessionList.forEach((s, idx) => {
    const prior = sessionList.slice(0, idx);

    // Duration above average
    const priorWithDur = prior.filter(ps => parseFloat(ps.duration) > 0);
    if (priorWithDur.length >= MIN) {
      const avg = priorWithDur.reduce((a, ps) => a + parseFloat(ps.duration), 0) / priorWithDur.length;
      if ((parseFloat(s.duration) || 0) > avg) { count++; return; }
    }

    // Volume above average (same type)
    const vm = getVariationMeta(s.variationKey, s.customName, s.category, s.customWorkoutId);
    const priorSameType = prior.filter(ps => getVariationMeta(ps.variationKey, ps.customName, ps.category).type === vm.type);
    const priorVols = priorSameType.map(ps =>
      ps.exercises.reduce((acc, e) => acc + e.sets.reduce((a, st) => a + ((parseFloat(st.reps)||0)*(parseFloat(st.weight)||0)), 0), 0)
    ).filter(v => v > 0);
    if (priorVols.length >= MIN) {
      const avgVol = priorVols.reduce((a, b) => a + b, 0) / priorVols.length;
      const vol = s.exercises.reduce((acc, e) => acc + e.sets.reduce((a, st) => a + ((parseFloat(st.reps)||0)*(parseFloat(st.weight)||0)), 0), 0);
      if (vol > avgVol) { count++; return; }
    }

    // Distance above average
    const priorWithDist = prior.filter(ps => parseFloat(ps.distance) > 0);
    if (priorWithDist.length >= MIN) {
      const avgDist = priorWithDist.reduce((a, ps) => a + parseFloat(ps.distance), 0) / priorWithDist.length;
      if ((parseFloat(s.distance) || 0) > avgDist) { count++; return; }
    }

    // Weight-per-rep above average (same type)
    const priorWPRs = priorSameType.map(ps => sessionWeightPerRep(ps)).filter(v => v > 0);
    if (priorWPRs.length >= MIN) {
      const avgWPR = priorWPRs.reduce((a, b) => a + b, 0) / priorWPRs.length;
      if (sessionWeightPerRep(s) > avgWPR) { count++; return; }
    }
  });
  return count;
}

function countBreakthroughSessions(sessionList, n) {
  const pbs = {}; let count = 0;
  sessionList.forEach(s => {
    let pbsThisSession = 0;
    s.exercises.forEach(ex => {
      const prev = pbs[ex.name] || {weight:0, reps:0};
      ex.sets.forEach(st => {
        if ((parseFloat(st.weight)||0) > prev.weight || (parseFloat(st.reps)||0) > prev.reps) pbsThisSession++;
      });
    });
    if (pbsThisSession >= n) count++;
    s.exercises.forEach(ex => {
      if (!pbs[ex.name]) pbs[ex.name] = {weight:0, reps:0};
      ex.sets.forEach(st => {
        const w = parseFloat(st.weight)||0, r = parseFloat(st.reps)||0;
        if (w > pbs[ex.name].weight) pbs[ex.name].weight = w;
        if (r > pbs[ex.name].reps) pbs[ex.name].reps = r;
      });
    });
  });
  return count;
}
function countAllTimePBEvents(sessionList) {
  const pbs = {}; let total = 0;
  sessionList.forEach(s => {
    s.exercises.forEach(ex => {
      if (!pbs[ex.name]) pbs[ex.name] = {weight:0, reps:0};
      ex.sets.forEach(st => {
        const w = parseFloat(st.weight)||0, r = parseFloat(st.reps)||0;
        if (w > pbs[ex.name].weight) { pbs[ex.name].weight = w; total++; }
        if (r > pbs[ex.name].reps)   { pbs[ex.name].reps = r; total++; }
      });
    });
  });
  return total;
}

// Compute which achievements are earned, including repeat count for repeatable ones
// Find the date of the earliest session at which a one-time achievement became earned.
// For non-mastery achievements, we can scan sessions chronologically.
// For mastery achievements, fall back to checking the full mastery object.
function getAchievementEarnedDate(a, sessionList) {
  if (!a.check || !sessionList.length) return null;
  const mastery = computeMastery(sessionList);
  // Quick check — if not earned at all, skip
  if (!a.check(sessionList, null, mastery)) return null;
  // Binary search for the earliest session that tips it over
  let lo = 0, hi = sessionList.length - 1, result = hi;
  while (lo <= hi) {
    const mid = Math.floor((lo + hi) / 2);
    const slice = sessionList.slice(0, mid + 1);
    const sliceMastery = computeMastery(slice);
    if (a.check(slice, null, sliceMastery)) {
      result = mid;
      hi = mid - 1;
    } else {
      lo = mid + 1;
    }
  }
  return sessionList[result]?.date || null;
}

function computeAchievements(sessionList, mastery) {
  return ACHIEVEMENTS.map(a => {
    const earned = a.check(sessionList, null, mastery);
    const count = (a.repeatable && a.countFn) ? a.countFn(sessionList, null, mastery) : (earned ? 1 : 0);
    // Progress toward next threshold (0–1). Earned non-repeatables show 1.
    const progress = a.progressFn ? Math.min(1, Math.max(0, a.progressFn(sessionList, null, mastery))) : (earned ? 1 : 0);
    return { ...a, earned, count, progress };
  });
}

// All unlocked titles (from achievements + default)
const ALL_TITLES = ['Newcomer', ...ACHIEVEMENTS.filter(a => a.title).map(a => a.title)];
function getEarnedTitles(achievements) {
  const earned = new Set(['Newcomer']);
  achievements.filter(a => a.earned && a.title).forEach(a => earned.add(a.title));
  return [...earned];
}

// ── Auto-generated tagline ─────────────────────────────────────────────────
function generateTagline(sessionList) {
  const pushC  = sessionList.filter(s => VARIATIONS[s.variationKey] && VARIATIONS[s.variationKey].type === 'push').length;
  const pullC  = sessionList.filter(s => VARIATIONS[s.variationKey] && VARIATIONS[s.variationKey].type === 'pull').length;
  const legsC  = sessionList.filter(s => VARIATIONS[s.variationKey] && VARIATIONS[s.variationKey].type === 'legs').length;
  const cardioC= cardioSessions(sessionList).length;
  const tkdC   = tkdCount(sessionList);
  const runDist= totalRunMiles(sessionList);
  const lbs    = totalLbs(sessionList);

  if (!sessionList.length) return 'Just getting started.';
  if (tkdC > 20 && lbs > 10000) return `Warrior of iron and spirit — ${tkdC} mat sessions, ${fmt(lbs)} lbs moved.`;
  if (tkdC > 10) return `Martial artist in training — ${tkdC} sessions on the mat and counting.`;
  if (runDist > 50) return `${runDist.toFixed(2)} miles logged and still going.`;
  if (lbs > 100000) return `${fmt(lbs)} lbs moved. The iron doesn't lie.`;
  if (sessionList.length >= 50) return `${sessionList.length} sessions in. Consistency is the craft.`;
  if (legsC > pushC && legsC > pullC) return 'Legs day enthusiast. The gains are real.';
  if (cardioC > sessionList.length * 0.4) return 'Built on sweat and miles.';
  return `${sessionList.length} sessions logged. The work continues.`;
}

// ── Hook into saveSessions ─────────────────────────────────────────────────
function saveSessions(savedSessionId) {
  localStorage.setItem('ppl_sessions', JSON.stringify(sessions));
  if (savedSessionId != null) {
    computeAndShowXP(savedSessionId);
  } else {
    checkAndAutoSyncPBs();
  }
}

function computeAndShowXP(savedSessionId) {
  if (!sessions.length) return;

  // Find the session that was just saved by its ID — it may not be last if retroactively logged
  const latestIdx = sessions.findIndex(s => String(s.id) === String(savedSessionId));
  if (latestIdx < 0) return; // session not found — bail out safely
  const latest = sessions[latestIdx];

  // XP state before this session — all sessions that precede it chronologically
  const priorSessions = sessions.slice(0, latestIdx);
  const { totalAttrXP: priorAttrXP, mastery: priorMastery } = computeAllXP(priorSessions);
  const priorAchievements_unused = computeAchievements(priorSessions, priorMastery).filter(a => a.earned).map(a => a.id);

  // Build prior PBs for PR detection
  const priorPBs = {};
  priorSessions.forEach(s => s.exercises.forEach(ex => {
    if (!priorPBs[ex.name]) priorPBs[ex.name] = {weight:0, reps:0};
    ex.sets.forEach(st => {
      const w = parseFloat(st.weight)||0, r = parseFloat(st.reps)||0;
      if (w > priorPBs[ex.name].weight) priorPBs[ex.name].weight = w;
      if (r > priorPBs[ex.name].reps) priorPBs[ex.name].reps = r;
    });
  }));

  const { breakdown, attrGains } = calcSessionXP(latest, priorSessions, priorPBs);

  // Sessions up to and including this one — used for achievement/mastery comparison
  const sessionsUpToNow = sessions.slice(0, latestIdx + 1);

  // Mastery fills this session — distribute through session attr map not all 4
  const nowMastery = computeMastery(sessionsUpToNow);
  const aMap = getSessionAttrMap(latest);
  let masteryFills = 0;
  const masteryFillNames = [];
  Object.keys(nowMastery).forEach(name => {
    const before = priorMastery[name] ? priorMastery[name].fills : 0;
    const newFills = Math.max(0, nowMastery[name].fills - before);
    if (newFills > 0) {
      masteryFills += newFills;
      for (let i = 0; i < newFills; i++) masteryFillNames.push(name);
    }
  });
  if (masteryFills > 0) {
    const masteryXP = masteryFills * 50;
    const allAttrs = [...(aMap.primary||[]), ...(aMap.minor||[])];
    const perAttr = Math.round(masteryXP / Math.max(1, allAttrs.length));
    allAttrs.forEach(k => { attrGains[k] = (attrGains[k]||0) + perAttr; });
  }

  // New achievements — compare prior vs up-to-and-including this session only
  const priorAchievementCounts = {};
  computeAchievements(priorSessions, priorMastery).forEach(a => {
    priorAchievementCounts[a.id] = a.count;
  });
  const nowAchievements = computeAchievements(sessionsUpToNow, nowMastery);
  const newAchievements = nowAchievements.filter(a => {
    const prev = priorAchievementCounts[a.id] || 0;
    return a.count > prev;
  });

  // New titles — any title that wasn't earnable before but is now
  const priorEarnedTitles = new Set(['Newcomer']);
  ACHIEVEMENTS.forEach(a => {
    if (a.title && (priorAchievementCounts[a.id] || 0) > 0) priorEarnedTitles.add(a.title);
  });
  const nowEarnedTitles = new Set(['Newcomer']);
  computeAchievements(sessionsUpToNow, nowMastery).forEach(a => {
    if (a.title && a.count > 0) nowEarnedTitles.add(a.title);
  });
  const newTitles = [...nowEarnedTitles].filter(t => !priorEarnedTitles.has(t));

  // Achievement XP bonus — 200 XP first unlock, tiered repeat XP for repeatables
  let achievementXP = 0;
  newAchievements.forEach(a => {
    const priorCount = priorAchievementCounts[a.id] || 0;
    const isFirstUnlock = priorCount === 0;
    achievementXP += isFirstUnlock ? ACHIEVEMENT_XP_FIRST : (ACHIEVEMENT_REPEAT_XP[a.id] || 50);
  });
  if (achievementXP > 0) {
    const allAttrs = [...(aMap.primary||[]), ...(aMap.minor||[])];
    const perAttr = Math.round(achievementXP / Math.max(1, allAttrs.length));
    allAttrs.forEach(k => { attrGains[k] = (attrGains[k]||0) + perAttr; });
    latest.achievementXP = achievementXP;
    localStorage.setItem('ppl_sessions', JSON.stringify(sessions));
  }

  checkAndAutoSyncPBs();

  // Activity PBs — detect new duration/distance/pace bests for this session
  const activityPBs = [];
  const isActivitySess = latest.variationKey === CUSTOM_KEY && latest.customName &&
    PREDEFINED_ACTIVITIES.find(a => a.name === latest.customName);
  if (isActivitySess && latest.exercises.length === 0) {
    const priorActSessions = priorSessions.filter(ps =>
      ps.variationKey === CUSTOM_KEY && ps.customName === latest.customName
    );
    const curDur = parseFloat(latest.duration)||0;
    const curDist = parseFloat(latest.distance)||0;
    const priorBestDur = Math.max(0, ...priorActSessions.map(ps => parseFloat(ps.duration)||0));
    const priorBestDist = Math.max(0, ...priorActSessions.map(ps => parseFloat(ps.distance)||0));
    let priorBestPace = Infinity;
    priorActSessions.forEach(ps => {
      const d = parseFloat(ps.distance)||0, t = parseFloat(ps.duration)||0;
      if (d > 0 && t > 0) priorBestPace = Math.min(priorBestPace, t/d);
    });
    const curPaceVal = (curDist > 0 && curDur > 0) ? curDur/curDist : null;
    if (curDur > 0 && curDur > priorBestDur) activityPBs.push('Duration');
    if (curDist > 0 && curDist > priorBestDist) activityPBs.push('Distance');
    if (curPaceVal && priorBestPace !== Infinity && curPaceVal < priorBestPace) activityPBs.push('Pace');
  }

  // Composite character level — computed from total XP across all attrs
  const charLevelBefore = computeCharLevel(priorAttrXP);
  const newAttrXP = {};
  Object.keys(priorAttrXP).forEach(k => { newAttrXP[k] = (priorAttrXP[k]||0) + (attrGains[k]||0); });
  const charLevelAfter = computeCharLevel(newAttrXP);

  setTimeout(() => {
    showXPOverlay({
      session: latest,
      breakdown,
      attrGains,
      attrXPBefore: priorAttrXP,
      masteryFills,
      masteryFillNames,
      newAchievements,
      achievementXP,
      newTitles,
      activityPBs,
      charLevelBefore: charLevelBefore.level,
      charLevelAfter: charLevelAfter.level,
    });
  }, 1400); // show after the "Session saved" toast fades
}

// ── PROFILE SCREEN (tab on Stats) ─────────────────────────────────────────
function buildProfileHTML() {
  const profile = getProfile();
  const { totalAttrXP, mastery } = computeAllXP(sessions);
  const char = computeCharLevel(totalAttrXP);
  const achievements = computeAchievements(sessions, mastery);
  const earnedTitles = getEarnedTitles(achievements);
  const tagline = generateTagline(sessions);

  // Favourite exercises and activities (top 3 by logged count)
  const favMap = {};
  sessions.forEach(s => {
    // Count individual exercises within sessions
    s.exercises.forEach(ex => {
      if (!ex.name) return;
      if (!ex.sets.some(st => st.reps)) return;
      favMap[ex.name] = (favMap[ex.name]||0) + 1;
    });
    // Count activity sessions by name (Running, Biking, Taekwondo etc.)
    if (s.variationKey === CUSTOM_KEY && s.customName &&
        PREDEFINED_ACTIVITIES.find(a => a.name === s.customName) &&
        s.exercises.length === 0) {
      favMap[s.customName] = (favMap[s.customName]||0) + 1;
    }
  });
  const favs = Object.entries(favMap).sort((a,b)=>b[1]-a[1]).slice(0,3);

  // Most recent PB
  const pbs = computePBs();
  const recentPB = Object.entries(pbs)
    .filter(([,pb]) => pb.weightDate || pb.repsDate)
    .sort(([,a],[,b]) => {
      const da = new Date(Math.max(new Date(a.weightDate||0), new Date(a.repsDate||0)));
      const db = new Date(Math.max(new Date(b.weightDate||0), new Date(b.repsDate||0)));
      return db - da;
    })[0];

  let html = '<div style="height:12px"></div>';

  // ── Trading card ──
  const customTagline = profile.customTagline || null;
  const displayTagline = customTagline !== null ? customTagline : tagline;

  const avatarHtml = profile.photo
    ? `<img class="profile-avatar" src="${profile.photo}" alt="profile">`
    : `<div class="profile-avatar-placeholder">${(profile.name||'A')[0].toUpperCase()}</div>`;
  const charPct = Math.round((char.xpIntoLevel / char.xpNeeded) * 100);

  html += `<div class="profile-card">
    <div class="profile-card-inner">
      <div class="profile-top">
        <div class="profile-avatar-wrap" onclick="document.getElementById('profile-photo-input').click()">
          ${avatarHtml}
          <div class="profile-avatar-edit">📷</div>
        </div>
        <div class="profile-info">
          <div class="profile-name" onclick="editProfileName()" style="cursor:pointer" title="Tap to edit">${profile.name || 'Athlete'} ✎</div>
          <div class="profile-title">${profile.equippedTitle || 'Newcomer'}</div>
          <div class="profile-tagline" onclick="editTagline()" style="cursor:pointer" title="Tap to edit">
            ${displayTagline}
            <span style="font-size:10px;opacity:0.5;margin-left:4px">✎</span>
          </div>
          ${customTagline !== null ? `<button onclick="resetTagline()"
            style="background:none;border:none;font-family:'DM Mono',monospace;
              font-size:9px;color:var(--text-dim);cursor:pointer;padding:2px 0;
              text-transform:uppercase;letter-spacing:0.5px;margin-top:3px">
            ↺ Reset to auto
          </button>` : ''}
        </div>
      </div>

      <div class="profile-char-level">
        <div class="profile-char-num">${char.level}</div>
        <div class="profile-char-bar-wrap">
          <div class="profile-char-label" style="color:var(--text-muted);font-size:11px">Character Level</div>
          <div class="profile-char-bar-track">
            <div class="profile-char-bar-fill" style="width:${charPct}%"></div>
          </div>
          <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);margin-top:3px">
            ${char.xpIntoLevel.toLocaleString()} / ${char.xpNeeded.toLocaleString()} XP
          </div>
        </div>
      </div>

      ${Object.entries(ATTRS).map(([key, a]) => {
        const xp = totalAttrXP[key] || 0;
        const lvl = levelFromXP(xp);
        const pct = Math.round((lvl.xpIntoLevel / lvl.xpNeeded) * 100);
        return `<div class="attr-row">
          <div class="attr-icon" style="background:${a.bg};border:1px solid ${a.color}20">
            <span>${a.icon}</span>
          </div>
          <div class="attr-info">
            <div class="attr-name" style="color:${a.color}">${a.name}</div>
            <div class="attr-bar-track">
              <div class="attr-bar-fill" style="width:${pct}%;background:${a.color};box-shadow:0 0 6px ${a.glow}"></div>
            </div>
          </div>
          <div>
            <div class="attr-level" style="color:${a.text};text-shadow:0 0 10px ${a.glow}">Lv ${lvl.level}</div>
            <div class="attr-xp-label">${lvl.xpIntoLevel.toLocaleString()}/${lvl.xpNeeded.toLocaleString()}</div>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;

  // ── Title selector — always visible ──
  html += `<div class="section-label" style="margin-top:18px">Your Titles</div>
  <div style="padding:0 18px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px">
    ${earnedTitles.map(t => `<button
      style="padding:6px 12px;border-radius:20px;font-family:'DM Mono',monospace;font-size:10px;
        font-weight:500;text-transform:uppercase;letter-spacing:0.5px;cursor:pointer;
        border:1.5px solid ${t===profile.equippedTitle?'var(--str)':'var(--border)'};
        background:${t===profile.equippedTitle?'var(--str-bg)':'none'};
        color:${t===profile.equippedTitle?'var(--str-text)':'var(--text-muted)'}"
      onclick="equipTitle('${t.replace(/'/g,"\\'")}')">
      ${t}
    </button>`).join('')}
  </div>`;

  // ── Highlights ──
  if (favs.length || recentPB) {
    html += `<div class="section-label" style="margin-top:18px">Highlights</div>`;
    html += `<div class="data-section-card" style="margin:0 18px">`;
    if (recentPB) {
      const [exName, pb] = recentPB;
      const pbDate = pb.weightDate || pb.repsDate;
      html += `<div class="data-section-row">
        <div><div class="data-row-label">Most Recent PB</div>
          <div class="data-row-value">${exName} — ${pb.weight>0?pb.weight+' lbs'+(pb.weightReps>0?' × '+pb.weightReps+' reps':''):''}${pb.reps>0?' / '+pb.reps+' reps'+(pb.repsWeight>0?' × '+pb.repsWeight+' lbs':''):''}</div>
          <div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--text-dim);margin-top:2px">
            ${pbDate ? new Date(pbDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : ''}
          </div>
        </div>
      </div>`;
    }
    favs.forEach(([name, count], i) => {
      html += `<div class="data-section-row">
        <div><div class="data-row-label">${i===0?'Top Activity / Exercise':'#'+(i+1)+' Activity / Exercise'}</div>
          <div class="data-row-value">${name}</div>
          <div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--text-dim);margin-top:2px">${count} sessions</div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  // ── Achievements ──
  const earned = achievements.filter(a => a.earned);
  const inProgress = achievements.filter(a => !a.earned);

  // One-time achievements — no meaningful progress bar
  const ONE_TIME_IDS = new Set([
    'first_rep','first_pb','first_mile','ex_initiate','first_ride',
    'first_push','first_pull','first_legs','first_core','full_split',
    'double_digits','half_century','variety_pack','first_thousand',
    'chest_day','overhead_ambition','pushup_artist','the_machine',
    'pulling_power','hold_it','time_under_tension','iron_hold',
    'stiff_as_board','year_of_gains','iron_body','complete_mastery',
    'well_rounded_diet','varsity','crunch_time','captain_crunch','not_just_body_building','raw_strength',
  ]);
  // Count-only achievements — show count not a bar
  const COUNT_ONLY_IDS = new Set(['five_k','breakthrough','ten_mile_ride']);

  // Returns a { label, showBar } for the progress footer of each achievement
  function achievementProgressLabel(a, earned) {
    const s = sessions; const m = mastery;
    if (ONE_TIME_IDS.has(a.id)) {
      return { label: earned ? '✓ Earned' : 'Not yet unlocked', showBar: false };
    }
    if (COUNT_ONLY_IDS.has(a.id)) {
      return { label: earned ? `×${a.count} completed` : 'Not yet unlocked', showBar: false };
    }
    // Build a meaningful current/total label per achievement
    const lbs = Math.round(totalLbs(s));
    switch (a.id) {
      case 'week_warrior':   return { label: `${weeksWith3Plus(s) % 5} / 5 qualifying weeks`, showBar: true };
      case 'iron_habit':     return { label: `${longestStreak(s).streak % 30 || longestStreak(s).streak} / 30 days`, showBar: true };
      case 'century':        return { label: `${s.length % 100} / 100 sessions`, showBar: true };
      case 'ton_moved':      return { label: `${fmt(lbs % 2000)} / ${fmt(2000)} lbs`, showBar: true };
      case 'freight':        return { label: `${fmt(lbs % 100000)} / ${fmt(100000)} lbs`, showBar: true };
      case 'million':        return { label: `${fmt(lbs % 1000000)} / ${fmt(1000000)} lbs`, showBar: true };
      case 'marathon':       return { label: `${totalRunMiles(s).toFixed(2)} / 26.2 mi cumulative`, showBar: true };
      case 'first_ride':     return { label: maxBikeDist(s) > 0 ? '✓ Earned' : 'Not yet unlocked', showBar: false };
      case 'ten_mile_ride':  return { label: maxBikeDist(s) >= 10 ? `×${bikeSessionsOver(s,10)} completed` : 'Not yet unlocked', showBar: false };
      case 'century_ride':   return { label: `${totalBikeMiles(s).toFixed(2)} / 100 mi cumulative`, showBar: true };
      case 'untouchable':    return { label: `${countAllTimePBEvents(s) % 50} / 50 PBs`, showBar: true };
      case 'warrior':        return { label: `${tkdCount(s) % 10} / 10 sessions`, showBar: true };
      case 'sparring':       return { label: `${tkdTypeCount(s,'Sparring') % 10} / 10 sessions`, showBar: true };
      case 'striker':        return { label: `${tkdTypeCount(s,'Small Target') % 10} / 10 sessions`, showBar: true };
      case 'dedicated':      return { label: `${Math.max(0,...Object.values(m).map(x=>x.fills)) % 10} / 10 fills`, showBar: true };
      case 'master':         return { label: `${Math.max(0,...Object.values(m).map(x=>x.fills)) % 25} / 25 fills`, showBar: true };
      case 'rising_tide':    return { label: `${countAboveAvgSessions(s) % 10} / 10 sessions`, showBar: true };
      default:               return { label: earned ? '✓ Earned' : 'Not yet unlocked', showBar: false };
    }
  }

  const barColor = a => a.cat === 'volume' ? 'var(--str)' : a.cat === 'running' ? 'var(--end)' : a.cat === 'martial' ? 'var(--agi)' : a.cat === 'mastery' ? 'var(--dex)' : 'var(--str)';

  if (earned.length) {
    html += `<div class="section-label" style="margin-top:18px">Achievements (${earned.length}/${achievements.length})</div>`;
    earned.forEach(a => {
      const pct = a.repeatable ? Math.round(a.progress * 100) : 100;
      const { label, showBar } = achievementProgressLabel(a, true);
      const earnedDate = getAchievementEarnedDate(a, sessions);
      const earnedDateStr = earnedDate
        ? new Date(earnedDate).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})
        : null;
      html += `<div class="achievement-card">
        <div class="achievement-icon">${a.icon}</div>
        <div class="achievement-info">
          <div class="achievement-name">${a.name}</div>
          <div class="achievement-desc">${a.desc}</div>
          ${a.title ? `<div class="achievement-progress" style="color:var(--str)">Title: "${a.title}"</div>` : ''}
          ${earnedDateStr ? `<div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);margin-top:3px">${a.repeatable ? 'First unlocked' : 'Unlocked'} ${earnedDateStr}</div>` : ''}
          <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
            ${showBar ? `<div style="flex:1;height:3px;background:#2A2820;border-radius:2px;overflow:hidden">
              <div style="height:100%;width:${pct}%;background:${barColor(a)};border-radius:2px;transition:width 0.4s ease"></div>
            </div>` : ''}
            <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);white-space:nowrap">${label}</div>
          </div>
        </div>
        <div class="achievement-badge">${a.repeatable && a.count > 1 ? '×'+a.count : 'Earned'}</div>
      </div>`;
    });
  }

  if (inProgress.length) {
    html += `<div class="section-label" style="margin-top:12px;color:var(--text-dim)">In Progress</div>`;
    inProgress.forEach(a => {
      const pct = Math.round(a.progress * 100);
      const { label, showBar } = achievementProgressLabel(a, false);
      html += `<div class="achievement-card locked">
        <div class="achievement-icon">${a.icon}</div>
        <div class="achievement-info">
          <div class="achievement-name">${a.name}</div>
          <div class="achievement-desc">${a.desc}</div>
          ${a.title ? `<div class="achievement-progress" style="color:var(--text-muted);font-weight:500">🏷 Unlocks title: "${a.title}"</div>` : ''}
          <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
            ${showBar ? `<div style="flex:1;height:3px;background:#2A2820;border-radius:2px;overflow:hidden">
              <div style="height:100%;width:${pct}%;background:${barColor(a)};border-radius:2px;opacity:0.6;transition:width 0.4s ease"></div>
            </div>` : ''}
            <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);white-space:nowrap">${label}</div>
          </div>
        </div>
        <div class="achievement-badge locked">Locked</div>
      </div>`;
    });
  }

  html += `<div style="height:20px"></div>`;
  return html;
}

// ── Profile actions ────────────────────────────────────────────────────────
function editProfileName() {
  const p = getProfile();
  const name = prompt('Your name or nickname:', p.name || '');
  if (name === null) return;
  p.name = name.trim() || 'Athlete';
  saveProfile(p);
  renderStatsScreen();
  renderHomeRPGWidget();
}

function editTagline() {
  const p = getProfile();
  const auto = generateTagline(sessions);
  const current = p.customTagline !== undefined && p.customTagline !== null ? p.customTagline : auto;
  const val = prompt('Edit your bio (leave blank to use the auto-generated one):', current);
  if (val === null) return; // cancelled
  p.customTagline = val.trim() === '' || val.trim() === auto ? null : val.trim();
  saveProfile(p);
  renderStatsScreen();
}

function resetTagline() {
  const p = getProfile();
  p.customTagline = null;
  saveProfile(p);
  renderStatsScreen();
}

function equipTitle(title) {
  const p = getProfile();
  p.equippedTitle = title;
  saveProfile(p);
  showProfile();
}

function handleProfilePhoto(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    // Compress to max 200px wide
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const size = Math.min(200, img.width, img.height);
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = size / Math.min(img.width, img.height);
      const sx = (img.width - size/scale)/2, sy = (img.height - size/scale)/2;
      ctx.drawImage(img, sx, sy, size/scale, size/scale, 0, 0, size, size);
      const p = getProfile();
      p.photo = canvas.toDataURL('image/jpeg', 0.8);
      saveProfile(p);
      renderStatsScreen();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

// ── Home RPG widget ────────────────────────────────────────────────────────
function renderHomeRPGWidget() {
  const el = document.getElementById('home-rpg-widget');
  if (!el) return;
  const profile = getProfile();
  const { totalAttrXP } = computeAllXP(sessions);
  const char = computeCharLevel(totalAttrXP);

  let html = `<div class="home-rpg-top">
    <div>
      <div class="home-rpg-name">${profile.name || 'Athlete'}</div>
      <div class="home-rpg-level" style="margin-top:1px">${profile.equippedTitle || 'Newcomer'}</div>
    </div>
    <div style="font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--str)">Lv ${char.level}</div>
  </div>
  <div class="home-rpg-attrs">`;

  Object.entries(ATTRS).forEach(([key, a]) => {
    const xp = totalAttrXP[key] || 0;
    const lvl = levelFromXP(xp);
    const pct = Math.round((lvl.xpIntoLevel / lvl.xpNeeded) * 100);
    html += `<div class="home-attr-mini">
      <div class="home-attr-mini-label" style="color:${a.color}">${a.name.slice(0,3)}</div>
      <div class="home-attr-mini-level" style="color:${a.text}">${lvl.level}</div>
      <div class="home-attr-mini-bar">
        <div class="home-attr-mini-fill" style="width:${pct}%;background:${a.color}"></div>
      </div>
    </div>`;
  });

  html += `</div>`;
  el.innerHTML = html;
}

                style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;
                  padding:10px 8px;font-size:22px;font-weight:800;color:var(--text);

              <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);text-transform:uppercase;margin-bottom:6px;${qlIsBW?'opacity:0.6':''}">${qlIsBW ? 'Added wt. (opt.)' : 'Weight (lbs)'}</div>

                oninput="qlSets[${si}].weight=this.value"
                style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;
                  padding:10px 8px;font-size:22px;font-weight:800;color:var(--text);

            </div>
          </div>`}
        </div>`;
      });
      html += `<button onclick="qlAddSet()"
        style="width:100%;padding:10px;background:none;border:1px dashed var(--border);
          border-radius:var(--radius);color:var(--text-dim);font-family:'DM Sans',sans-serif;
          font-size:13px;cursor:pointer;margin-bottom:10px">
        + Add another set
